\n“我都知道。”老板说，“你们两个，那时候就很好。”\n\n离开时，你们站在店门口，看着老板把招牌取下来。\n\n“结束了。”{ta}说。\n\n“嗯。”\n\n“可是，”{ta}转头看你，“我们不会结束吧？”\n\n你没听懂。{ta}却已经转身走了，留下一句：“下周，我请你吃别家的炸鸡。”","yul":"那天老板做了最后一锅炸鸡。三个人坐在空荡荡的店里，吃着、喝着、聊着。\n\n老板问{ta}现在过得怎么样。{ta}说很好。\n\n“骗人。”老板说，“你从小说谎就会摸耳朵。”\n\n{ta}的手停在耳朵旁边。\n\n后来老板去厨房收拾，只剩你们两个。{ta}看着窗外，很久才说：“其实不太好。前团解散后，我一直在想，我到底是为了什么在做这些。”\n\n“现在想到了吗？”\n\n“还没。”{ta}说，“但今天回到这里，好像想起了一点。”\n\n{ta}看着你：“想起那时候，有人每天留一份炸鸡给我。”","yunhee":"那天你们在店里待到半夜。老板放了很老的歌，{ta}拉着你在空荡荡的店里跳舞，跳得乱七八糟。\n\n“我们以前打烊后都这样！”{ta}说，“你忘了吗！”\n\n你没忘。那时候你们打烊后，会把椅子推到墙边，在油腻的地板上跳舞，跳到老板来赶人。\n\n后来{ta}累了，坐在地上，靠着墙。\n\n“我好舍不得。”{ta}说，“这里是我最开心的地方。”\n\n你在{ta}旁边坐下。\n\n{ta}把头靠在你肩上：“可是还好，你还在。”","harin":"那天晚上，老板说想听{ta}唱歌，就像以前一样。\n\n{ta}犹豫了很久，最后站在油锅旁边，清唱了一首。是{ta}以前常常在这里练的那首歌。\n\n整间店很安静。老板闭着眼睛听，听到一半就哭了。\n\n唱完后，{ta}看着你：“我那时候每次唱，都是唱给你听的。你知道吗？”\n\n你不知道。\n\n“你那时候总是背对着我炸鸡。”{ta}说，“可是我知道你在听。因为你炸鸡的节奏，会跟着我的歌。”\n\n你看着{ta}，突然说不出话来。"}},{"id":"kno5","t":"家庭聚会","tm":"中午 12:30","p":"你们两家是世交。小时候过年过节都在一起，你和{name}从小一起长大，打打闹闹到中学。\n\n后来{ta}当了练习生，你们见面的次数越来越少。\n\n今年中秋，两家又聚在一起。长辈们在客厅聊天，不知道谁开了个头：“你们两个小时候说要结婚的，还记得吗？”\n\n满屋子的人都笑了。你和{name}被赶到厨房，说是要一起准备水果。","c":{"yunhee":"{name}笑到停不下来：“天啊！那是我们五岁的时候吧！”","dohyun":"{name}靠着冰箱：“喂，你当真了？”","harin":"{name}低着头洗葡萄：“我那时候……是认真的喔。五岁的那种认真。”","yul":"{name}把刀递给你：“你削皮，我切。分工。”完全不接那个话题。"},"o":[{"t":"跟{ta}一起吐槽长辈们的玩笑","a":3,"h":0,"r":{"yunhee":"{ta}跟着你一起吐槽，吐槽着吐槽着，笑容慢慢淡了。","dohyun":"{ta}笑了两声，又安静下来：“他们也没那么烦啦。”好像你说得太过分了。","harin":"{ta}没有笑。“我……”{ta}说，“我那时候是认真的。”","yul":"“他们无聊。”{ta}说，“我们不用理。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"开玩笑说：「那时候是你先求婚的」","a":3,"h":2,"r":{"yunhee":"“才不是！你先的！”{ta}拿葡萄丢你。","dohyun":"“你记错了。”{ta}说，“是你哭着要嫁给我。”","harin":"{ta}看了你一眼：“是你。我记得很清楚。”","yul":"“我没有证据。”{ta}突然说，“你记错了。”语气冷了下来。"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"认真问{ta}这几年过得好不好","a":4,"h":0,"r":{"yunhee":"{ta}说着说着有点哽咽，又笑着说没事。","dohyun":"“好得很。”{ta}说，过了一会儿，“偶尔会累。”","harin":"“有你问，就好一点了。”","yul":"“好。”{ta}说，“现在问这个，很像你。”"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"专心切水果，回避这个话题","a":-3,"h":-1,"r":{"yunhee":"{ta}一直偷看你，等你说点什么。你没有。{ta}的眼神慢慢暗下去。","dohyun":"{ta}站在你旁边削苹果，一直等你说话。你没说。{ta}削完就走了。","harin":"{ta}似乎松了一口气，可是那口气里，有一点难过。","yul":"“效率很好。”{ta}说，可是那盘水果切完后，{ta}就离开了厨房。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你们两家的交情，从你们出生前就开始了。爸爸们是大学同学，妈妈们是同一个教会的朋友。你和{name}只差一岁，从小被放在一起养，一起洗澡、一起上幼儿园、一起被罚站。\n\n后来{ta}去当练习生，你们见面的次数一年比一年少。到了最近几年，只有过年和中秋才见得到，见了面也只是点点头，像是陌生的亲戚。\n\n可是长辈们好像完全没察觉这种生疏，依然像以前一样，喜欢把你们凑在一起。","after":{"dohyun":"切完水果，你们被派去院子里帮忙烤肉。{name}抢过夹子，说你烤的肉一定会焦。\n\n“你才会烤焦。”\n\n“我？我烤肉天下第一。”\n\n结果{ta}烤焦了三块。你笑到蹲在地上，{ta}气得用夹子夹你的袖子。\n\n那天晚上，长辈们喝多了，又开始讲你们小时候的事。讲到你们五岁那年说要结婚，{ta}突然站起来：\n\n“我去买饮料。”\n\n{ta}拉着你一起出门。走到巷口，{ta}停下来，背对着你：\n\n“喂，那件事……我不是开玩笑的。五岁的时候不是，现在也……”\n\n{ta}没说完，就转身走了。","yul":"切完水果，你们端着盘子回到客厅，长辈们又开始起哄。\n\n{name}面不改色地放下盘子：“我们两个都还有工作，没时间想这些。”\n\n长辈们笑得更大声了。\n\n后来，你在阳台上透气，{ta}走过来，递给你一罐啤酒。\n\n“抱歉。”{ta}说，“他们每年都这样。”\n\n“你刚刚处理得很好。”\n\n“我很擅长处理这种场面。”{ta}说，停了一下，“可是不擅长处理你。”\n\n你转头看{ta}。{ta}看着远处，没有看你。\n\n“纸条的事，”{ta}说，“我说有证据，是真的。我一直留着。”","yunhee":"切完水果，你们被长辈们赶去附近的超市买饮料。{name}一路上都在笑，笑你们小时候的糗事，笑长辈们的玩笑。\n\n“你记得吗！”{ta}说，“我们五岁的时候，还在院子里办过婚礼！你穿我妈的高跟鞋，摔了好几次！”\n\n“是你穿的。”\n\n“不是！是你！”\n\n你们在超市里吵了一路，吵到收银员都在偷笑。\n\n回去的路上，{ta}突然安静下来。\n\n“其实，”{ta}说，“我那时候是认真的。”\n\n“什么？”\n\n“没什么！”{ta}说，跑到前面去了。","harin":"切完水果，你们一起把盘子端出去。长辈们还在聊，没人注意到你们。\n\n{name}拉着你的袖子，小声说：“我们出去走走？”\n\n你们沿着小时候常走的那条河堤散步。中秋的月亮很圆，河面上全是月光。\n\n“你还记得这里吗？”{ta}问，“我们小时候在这里放过河灯。”\n\n你记得。你们各写了一个愿望，放进河灯里，看着它们漂走。\n\n“你那时候写了什么？”你问。\n\n{ta}停下脚步，看着河面：“我写的是：希望长大以后，还可以跟你一起看月亮。”\n\n{ta}转头看你，笑了：“实现了呢。”"}}]},"friend":[{"id":"f1","t":"练习后的辣炒年糕","d":3,"tm":"深夜 23:10","p":"那天之后，你们交换了联系方式。讯息不多，偶尔几句，都是很普通的问候。\n\n今晚十一点，手机亮了。","c":{"yunhee":"@msg 배고파 죽겠어용 ㅠㅠ || 饿死了呜呜\n@msg 떡볶이 먹으러 갈래?? || 要不要去吃辣炒年糕？？","dohyun":"@msg 나와 || 出来。\n@msg 떡볶이. 내가 쏨 || 辣炒年糕，我请。","harin":"@msg 오늘 비 와서, 따뜻한 거 먹고 싶어요 || 今天下雨，想吃热的东西。\n@msg 같이 갈래요? || 要一起去吗？","yul":"@msg 30분 뒤 회사 앞 포장마차 || 三十分钟后，公司前面的路边摊。\n@msg 올 거죠? || 会来吧？"},"o":[{"t":"马上答应，换衣服出门","a":4,"h":0,"r":{"yunhee":"{ta}一看到你就挥手，嘴里已经塞满年糕：“我先吃了！对不起！”","dohyun":"“慢死了。”{ta}说，却把最大块的年糕推到你那边。","harin":"{ta}坐在最里面，帽子压得很低，看见你才露出一点笑。","yul":"“准时。”{ta}说，已经帮你倒好了一杯水。"},"m":{"yul":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"说你已经吃过了，但可以陪{ta}聊天","a":3,"h":0,"r":{"yunhee":"“那你看我吃！”{ta}吃得超级开心。","dohyun":"“吃过了也给我吃。”{ta}硬塞一块到你嘴里。","harin":"“那我们慢慢吃，慢慢聊。”","yul":"“陪我？好。”{ta}说，“那你说说你今天的工作。”"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"提议找一家更隐密的店，怕{ta}被认出来","a":3,"h":0,"r":{"yunhee":"@msg 아… 그렇네… || 啊……也是……\n{ta}来了，可是一直东张西望，吃得很不开心。","dohyun":"@msg 왜 이렇게 겁이 많아 || 你怎么这么胆小。\n{ta}最后还是来了那家路边摊，可是一整晚都在滑手机。","harin":"@msg 네… 제가 생각이 짧았네요 || 嗯……是我想得太简单了。\n{ta}那天没有来。","yul":"@msg 내가 고른 데가 안전하다고 했잖아요 || 我说过我选的店很安全。\n@msg 날 못 믿어요? || 你不相信我？"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"说今天太累了，改天","a":-3,"h":-1,"r":{"yunhee":"@msg 힝 ㅠㅠ || 哼呜呜\n{ta}隔天又约了一次，你又拒绝了。之后{ta}就不太约你了。","dohyun":"@msg ㅇㅋ || OK。\n那之后一个星期，{ta}都没有再约你。","harin":"@msg 네 || 好。\n{ta}没有再传讯息。下雨的晚上，你的手机很安静。","yul":"@msg 알겠어요 || 知道了。\n那之后，{ta}的讯息变得很公事公办。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你看着那则讯息，犹豫了几秒。\n\n已经十一点了。你刚洗完澡，头发还是湿的，明天还要上班。理智告诉你应该回一句「改天吧」，然后睡觉。\n\n可是你想起那天的{ta}，想起{ta}说话时的样子。那是你第一次觉得，屏幕里那个人，也是一个会饿、会累、会想找人吃宵夜的普通人。\n\n你的手指停在键盘上。","after":{"dohyun":"那天之后，凌晨的宵夜变成了你们的固定行程。\n\n{ta}练习结束，就会传一句「出来」。有时候是辣炒年糕，有时候是猪脚，有时候只是便利商店的三角饭团。\n\n{ta}吃东西很快，像在跟谁比赛。吃完了就靠在椅子上，跟你抱怨今天被队长骂了几次、被编舞老师罚跳了几遍。\n\n“你为什么不跟队友去吃？”你有一次问。\n\n“他们吵死了。”{ta}说，然后又补了一句，“跟你吃比较安静。”\n\n你说你明明也很吵。\n\n{ta}看了你一眼：“你是安静的吵。不一样。”\n\n你不懂那是什么意思。但你记住了那句话。","yul":"那天之后，{ta}偶尔会在深夜约你。不是每天，一个星期一两次，时间地点都写得很精确。\n\n你们会在路边摊坐半个小时，聊一些很普通的事。{ta}的工作、你的工作、最近看的书、最近吃到的好东西。\n\n{ta}很少说自己的事。可是有一次，{ta}喝了两杯烧酒，突然说：\n\n“我以前很讨厌一个人吃饭。前团解散后，有一整年都是一个人。”\n\n“现在呢？”\n\n“现在，”{ta}说，“一个星期有两天不用一个人。”\n\n{ta}说完就低头喝汤，好像什么都没说过。\n\n你也低头，假装没听见。","yunhee":"那天之后，{ta}几乎每天都会传讯息给你。早上是「早安！」配一张练习室的自拍，中午是「你吃什么！」配{ta}的午餐，晚上是「好累喔」配一个瘫倒的贴图。\n\n你有时候回，有时候忙到忘记回。{ta}也不在意，隔天照样传。\n\n有一次，你一整天都没回。晚上十点，{ta}传来一则：\n\n@msg 혹시 무슨 일 있어?? || 你是不是出什么事了？？\n\n你解释说只是工作太忙。{ta}马上回了一个大大的笑脸：\n\n@msg 다행이다!! 걱정했잖아 || 太好了！！害我担心死了。\n\n你看着那句「担心」，看了很久。","harin":"那天之后，{ta}偶尔会在下雨的晚上传讯息。\n\n不是每次都约你出去。有时候只是一张窗外的照片，配一句：「下雨了。」有时候是一段几秒钟的录音，是{ta}随手哼的旋律。\n\n你学会了在下雨的晚上，把手机放在枕头旁边。\n\n有一次，你问{ta}：「为什么都是下雨天？」\n\n{ta}隔了很久才回：\n\n@msg 비 오는 날엔 혼자 있는 게 조금 더 외로워서요 || 因为下雨天，一个人会更寂寞一点。\n@msg 그리고… 당신 고양이가 비를 좋아한다고 해서 || 还有……因为你说你的猫喜欢雨。"}},{"id":"f2","t":"{mate}的生日","d":4,"tm":"晚上 20:00","p":"{name}说，{mate}生日，要在常去的一间烤肉店包厢办一场小派对，问你要不要来。\n\n“人不多，都是自己人。”{ta}说，“{mate}说想见见你。”\n\n你到的时候，包厢里已经很热闹。{mate}一看到你就大喊：“就是你啊！{name}最近手机都不离手，原来是在跟你聊天！”\n\n全场起哄。","c":{"yunhee":"{name}跳起来去捂{mate}的嘴：“不要乱讲啦！”笑得耳朵都红了。","dohyun":"{name}踹了{mate}一脚：“闭嘴。”然后若无其事地坐到你旁边。","harin":"{name}低下头，小声说：“对不起，他们……我没有那样说过。”","yul":"{name}淡淡地说：“我是在谈工作。”{mate}笑得更大声了。"},"o":[{"t":"大方地跟{mate}打招呼，送上你准备的礼物","a":4,"h":0,"r":{"yunhee":"“你准备了礼物！”{ta}比{mate}还开心。","dohyun":"“你还准备礼物？”{ta}有点吃味，“我生日你也要送。”","harin":"{ta}看着你跟大家相处得很好，松了一口气。","yul":"“礼物选得不错。”{ta}说，“你很会做功课。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"开玩笑反击：「是{ta}一直在烦我」","a":3,"h":1,"r":{"yunhee":"“喂！你怎么出卖我！”{ta}笑着打你。","dohyun":"“你说什么？”{ta}瞪你，大家笑得更凶了。","harin":"{ta}瞪大眼睛，然后笑出声来。","yul":"“我只是效率高。”{ta}说，大家又起哄了一轮。"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"帮{name}解围，说你们只是朋友","a":2,"h":0,"r":{"yunhee":"“对……好朋友。”{ta}的笑容僵了一下，后来就一直跟成员们待在一起。","dohyun":"“对啊，朋友。”{ta}说，语气很冲。整晚都没再跟你坐在一起。","harin":"{ta}点点头，可是那一晚，{ta}都坐在离你最远的地方。","yul":"“对。”{ta}说，“只是朋友。”说完就不再看你了。"},"m":{"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"被起哄太尴尬，找借口先去洗手间","a":-3,"h":-1,"r":{"yunhee":"{ta}追出来找你，你说你要先走。{ta}站在走廊上，很久都没回包厢。","dohyun":"你回来时，{ta}已经坐到了包厢的另一头，一眼都没看你。","harin":"{ta}传讯息问你还好吗，你没回。{ta}后来也提早离开了。","yul":"你回来时，{ta}已经在跟别人说话。你们一整晚都没有再交谈。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你在派对开始前一个小时就到了附近，在一家小店挑礼物。挑了很久，最后选了一个{mate}在综艺里提过很想要的东西。\n\n结帐时，你突然有点紧张。那是{name}的朋友，是{ta}生活里很重要的人。你不知道他们会怎么看你，会不会觉得你是那种想借机接近偶像的人。\n\n你在包厢门口站了一会儿，深呼吸，才推开门。","after":{"dohyun":"派对后半，大家都喝开了。{mate}拉着你，非要你说你跟{name}到底是怎么认识的。\n\n你说了。{mate}听完，拍着桌子大笑：“我就说嘛！他最近手机都不离手！”\n\n{name}在旁边，脸红到脖子：“闭嘴！”\n\n后来{ta}被灌了好几杯，靠在沙发上，眯着眼睛看你。\n\n“他们很喜欢你。”{ta}说，口齿有点不清，“我看得出来。”\n\n“那你呢？”你半开玩笑。\n\n{ta}看着你，过了很久，才说：“我比他们更早喜欢你。……当朋友。”\n\n{ta}说完就闭上眼睛装睡。你看见{ta}的耳朵红了。","yul":"派对快结束时，{mate}把你拉到一边。\n\n“我认识他很多年了。”{mate}说，“前团解散后，他有一年几乎不跟任何人说话。”\n\n你看向{name}。{ta}正在跟另一个朋友说话，表情很放松。\n\n“这阵子，”{mate}说，“他变了很多。会笑了，会主动约人了。我们都在猜是谁。”\n\n你没有说话。\n\n“我不知道你们是什么关系，”{mate}说，“但谢谢你。”\n\n那天晚上回家后，你收到{ta}的讯息：\n\n@msg 민준이가 이상한 말 했죠? || 敏俊是不是说了什么奇怪的话？\n@msg …다 사실이에요 || ……都是真的。","yunhee":"那天派对，{name}的成员们轮流来跟你聊天。{mate}问你的工作，娜妍问你的星座，书雅害羞地问你可不可以加好友。\n\n{name}一直在旁边紧张地盯着，好像怕她们说错什么。\n\n后来大家玩游戏，你和{name}被分在同一组。你们配合得很好，赢了三局。\n\n“你们好有默契喔～”{mate}故意拉长声音。\n\n{name}瞪了她一眼，可是嘴角一直在笑。\n\n散场时，{mate}偷偷跟你说：“允熙很少带朋友来见我们。你是第一个。”\n\n你回头看{name}。{ta}正在跟你挥手，笑得很灿烂。","harin":"派对的人比{ta}说的多。{name}一直坐在角落，偶尔跟人说两句话，大部分时间都在安静地听。\n\n你坐到{ta}旁边。{ta}看了你一眼，轻轻松了一口气。\n\n“人好多。”{ta}小声说。\n\n“要出去透透气吗？”\n\n{ta}摇头：“我答应了 Jay 哥要待到切蛋糕。”\n\n于是你们一起坐在角落，看着大家闹。偶尔有人来起哄，你就帮{ta}挡掉。\n\n切完蛋糕后，{ta}拉着你的袖子，从后门溜了出去。\n\n外面的空气很凉。{ta}深吸了一口气：“谢谢你。今天如果没有你，我撑不下来。”"}},{"id":"f3","t":"感冒的那一天","d":3,"tm":"下午 14:30","p":"换季，你感冒了，请了病假，在家裹着棉被发烧。\n\n你在社群发了一张退烧药的照片，没写什么。\n\n一个小时后，门铃响了。你拖着身体去开门，门外没有人，只有一个塑胶袋挂在门把上：退烧贴、运动饮料、一盒粥，还有一张便利贴。\n\n然后，手机震了一下。","c":{"yunhee":"@msg 아프지 마용 ㅠㅠ 죽 꼭 먹어!! || 不要生病呜呜，粥一定要吃！！\n@msg 스케줄 끝나고 전화할게 || 行程结束后打给你。","dohyun":"@msg 바보냐 감기 걸리고 || 笨蛋吗？还感冒。\n@msg 약 먹고 자 || 吃药，睡觉。","harin":"@msg 따뜻한 물 많이 마셔요 || 多喝温水。\n@msg 노래 하나 보냈어요. 자기 전에 들어요 || 传了一首歌给你，睡前听。","yul":"@msg 매니저 시켜서 보냈어요 || 叫助理送过去的。\n@msg 열 몇 도예요? 정확하게 || 烧到几度？说准确一点。"},"o":[{"t":"拍照传给{ta}，认真道谢","a":3,"h":0,"r":{"yunhee":"{ta}回了一大串爱心贴图：「快点好起来！」","dohyun":"「谢什么，快好起来，下次请我吃饭。」","harin":"「不用谢。你好起来就好。」","yul":"「不用谢。告诉我温度。」"},"m":{},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"撒娇说好难受，希望有人陪","a":2,"h":1,"r":{"yunhee":"「呜呜我也想去！可是在拍摄……」{ta}打了视讯过来，陪你十分钟。","dohyun":"“我又不是你男朋友。”{ta}说，“你找别人陪。”","harin":"「我不能去……对不起。」{ta}说，「我唱歌给你听好不好。」","yul":"「我知道你可以。」{ta}说，「那以后我不费心了。」"},"m":{"yul":[-3,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-10,-3,"worst"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"说{ta}不用这么费心，你自己可以的","a":2,"h":0,"r":{"yunhee":"「喔……好。」{ta}说，「那我不打扰你了。」然后就没再传讯息。","dohyun":"「谁费心了，顺路而已。」","harin":"「嗯。」{ta}说，「对不起，是我多事了。」","yul":"「我知道你可以。」{ta}说，「但这样比较快。」"},"m":{"dohyun":[1,0],"yunhee":[-2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吃完药就睡，忘了回{ta}讯息","a":-3,"h":-1,"r":{"yunhee":"你醒来时，有二十几则未读讯息。最后一则是：「我是不是很烦……」","dohyun":"你醒来时，看见{ta}的讯息：「死了吗？」以及一则：「算了，随便你。」","harin":"你醒来时，{ta}只传了一首歌。没有再说别的话。","yul":"「我很忙。」{ta}回，「下次生病，叫外卖就好。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-4,-1,"bad"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你昏昏沉沉地睡了一整个上午。醒来时，头还是很痛，喉咙像吞了砂纸。\n\n冰箱里只剩一罐过期的牛奶。你想叫外卖，可是连拿手机的力气都没有。\n\n你躺在床上，看着天花板，突然觉得很孤单。一个人住的坏处，就是生病的时候，连一杯水都要自己倒。\n\n你随手拍了一张退烧药的照片发到社群上，没写什么。也不知道想给谁看。","after":{"dohyun":"那天晚上，你的烧退了一点。你坐起来，吃了那碗粥，是你最喜欢的那家店的南瓜粥。\n\n你不记得自己跟{ta}说过喜欢这家。\n\n十点多，{ta}打了视讯过来。画面里的{ta}刚洗完澡，头发湿湿的。\n\n“还活着？”{ta}问。\n\n“还活着。”\n\n“粥吃了？”\n\n“吃了。你怎么知道我喜欢那家？”\n\n{ta}别开视线：“你上次在社群发过。三个月前。”\n\n你愣住了。三个月前，你们根本还不认识。\n\n{ta}好像也意识到说漏了嘴，马上转移话题：“快睡觉。我要挂了。”\n\n视讯断了。你看着黑掉的屏幕，心跳快得不像在发烧。","yul":"那天下午，你的门铃又响了。是{ta}的助理，提着一个保温壶。\n\n“律哥煮的。”助理说，“他说一定要趁热喝。”\n\n保温壶里是一碗鸡汤，炖得很浓，上面浮着几片姜。\n\n你喝完了一整碗。\n\n晚上，你传讯息道谢。{ta}很快回了：\n\n@msg 열은요? || 烧呢？\n@msg 37.8도요 || 37.8度。\n@msg 내일 아침에 다시 알려줘요 || 明天早上再告诉我。\n@msg 38도 넘으면 병원 데려갈 거예요 || 超过38度的话，我会带你去医院。\n\n你看着最后那句，笑了。明明是命令的语气，却让你觉得很安心。","yunhee":"那天晚上，{ta}真的在行程结束后打电话来了。\n\n“你有没有吃药？有没有喝水？有没有盖好被子？”{ta}一口气问了十几个问题。\n\n你一一回答。{ta}才放心地叹了一口气。\n\n“我好想去看你喔……”{ta}说，“可是经纪人说不行。”\n\n“我没事。”\n\n“你有事！你声音都哑了！”{ta}说，“我唱歌给你听，你快点睡。”\n\n{ta}真的唱了。是一首很温柔的摇篮曲，{ta}唱得很轻，像怕吵醒你。\n\n你听着听着就睡着了。醒来时，通话已经结束了。手机里有一则讯息：\n\n@msg 잘 자. 내일은 꼭 나아 있어야 해 || 晚安。明天一定要好起来。","harin":"那天晚上，你戴着耳机听{ta}传来的那首歌。\n\n是一首你没听过的歌，只有钢琴和{ta}的声音。歌词很简单，说的是一个人在下雨天生病，窗外有一只猫在等雨停。\n\n你听了三遍，才发现那首歌只有你一个人听过。\n\n你传讯息问{ta}：「这首歌叫什么名字？」\n\n{ta}隔了很久才回：\n\n@msg 아직 제목이 없어요 || 还没有名字。\n@msg 오늘 당신 생각하면서 쓴 거라서 || 因为是今天想着你写的。\n@msg 빨리 나아요. 그래야 제목을 붙일 수 있을 것 같아요 || 快点好起来。好像那样，我才能为它取名字。"}},{"id":"f4","t":"打歌录影的真实意见","d":4,"tm":"晚上 21:30","p":"{name}的新歌打歌期开始了。\n\n今晚，{ta}传来一段还没公开的彩排影片，附上一句话：「说实话。不要用粉丝的角度。」\n\n你看了三次。舞台很好，但你注意到一个地方：副歌之前，{ta}的表情好像有一瞬间出神了。","c":{"yunhee":"@msg 어때어때?? 솔직하게!! || 怎么样怎么样？？老实说！！","dohyun":"@msg 별로면 별로라고 해 || 不好就说不好。\n@msg 근데 별로일 리 없음 ㅋ || 不过不可能不好ㅋ","harin":"@msg 저는 제 무대를 잘 못 봐요 || 我不太敢看自己的舞台。\n@msg 대신 봐줄래요? || 你可以帮我看吗？","yul":"@msg 피드백 3개 || 给我三个回馈。\n@msg 칭찬 빼고 || 不要称赞。"},"o":[{"t":"直接指出副歌前那一瞬间的出神","a":4,"h":0,"r":{"yunhee":"「真的吗？！」{ta}重看了一次，「天啊真的！你好厉害！」","dohyun":"「……你眼睛很利嘛。」{ta}隔了一会儿，「下次不会了。」","harin":"「你看见了。」{ta}说，「那一秒，我在想别的事。」","yul":"「很好。」{ta}说，「这才是我要的回馈。」"},"m":{"yul":[3,0],"dohyun":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"先夸整体，再委婉提一点小建议","a":3,"h":0,"r":{"yunhee":"「谢谢你！我会再练的！」","dohyun":"「绕那么大一圈，你是怕我玻璃心？」{ta}回，「我又不是小孩。」","harin":"「你说话很温柔。」{ta}说，「我很喜欢。」","yul":"「太委婉。」{ta}说，「我要的不是安慰。」"},"m":{"harin":[2,0],"yunhee":[1,0],"yul":[-4,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"老实说你是外行，只能说好看","a":-3,"h":-1,"r":{"yunhee":"「……好喔。」{ta}说，可是之后再也没有传影片给你。","dohyun":"「无聊的答案。」{ta}说，「那以后不给你看了。」","harin":"{ta}很久才回：「……谢谢。」之后，{ta}再也没有问过你的意见。","yul":"「我不需要这个。」{ta}说，「我以为你不一样。」"},"m":{"yul":[-5,0],"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"约{ta}出来当面讨论，顺便吃饭","a":3,"h":1,"r":{"yunhee":"「当面？」{ta}犹豫了一下，「我这周好忙……下次吧。」好像你太急了。","dohyun":"「行。你请。」","harin":"「当面……」{ta}犹豫了很久，最后说：「我还没准备好。」","yul":"「明天中午，我工作室。」{ta}说，「我煮。」"},"m":{"yul":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[2,1,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那段影片是彩排时用手机拍的，画质不太好，声音也有点杂。可是你看得出，那是一个很用心的舞台：灯光、走位、表情，每一个细节都排得很仔细。\n\n你看第一遍时，只是单纯地觉得好看。第二遍，你开始注意到一些小地方。第三遍，你看见了那一瞬间。\n\n你犹豫了很久要不要说。你不是专业的，说错了怎么办？说了会不会让{ta}不开心？\n\n可是{ta}说了，「说实话」。","after":{"dohyun":"打歌期的第一个舞台，你在家里守着电视看。\n\n副歌之前那一瞬间，{ta}的表情没有出神了。{ta}看着镜头，眼神凶得像要把屏幕看穿，然后在副歌落下时，嘴角勾起一个很坏的笑。\n\n那一段被剪成短影片，在网上转了几十万次。\n\n舞台结束后，你收到一则讯息：\n\n@msg 봤냐 || 看到了吗？\n@msg 니 덕분임 || 托你的福。\n@msg …다음 무대도 봐줘 || ……下一个舞台也帮我看。\n\n你回：「好。」\n\n{ta}又补了一句：\n\n@msg 너만 보면 돼 || 只要你看就好了。\n@msg 아 무대를. 무대만 || 啊，我是说舞台。只看舞台。","yul":"那天之后，{ta}每次有新的舞台或新的戏，都会先传给你看。\n\n你学会了怎么看。看灯光，看节奏，看{ta}的眼神什么时候是在演，什么时候是真的。\n\n你的意见不一定都对。有时候{ta}会反驳，反驳得很尖锐，然后你们吵起来，吵到凌晨。\n\n可是第二天，{ta}总会传来一则讯息：「你说的那个地方，我改了。」\n\n有一次，你问{ta}：“你身边那么多专业的人，为什么要听我的？”\n\n{ta}想了想：“因为他们看的是作品。你看的是我。”\n\n你不知道该怎么回答。\n\n{ta}也没有等你回答。","yunhee":"那天你们约在{ta}公司附近的一家小餐馆，一边吃饭一边看影片。你指着那一瞬间，{ta}凑过来看，看了好几遍。\n\n“真的耶……”{ta}喃喃地说，“我自己都没发现。”\n\n“耳返坏了？”\n\n“对！你怎么知道！”{ta}惊讶地看着你。\n\n“猜的。”\n\n{ta}看着你，看了很久，突然说：“你好像很了解我。”\n\n那天之后，{ta}每次有新的舞台，都会先问你的意见。\n\n有一次，你说某个动作有点僵硬。{ta}就在练习室里练了一整晚，第二天传来一段影片：「这样呢？」","harin":"那天之后，你开始用不一样的方式看{ta}的舞台。\n\n你注意到{ta}唱高音之前会轻轻吸一口气，注意到{ta}紧张的时候会摸耳环，注意到{ta}在唱某几首歌的时候，眼神会变得很远。\n\n有一次，你问{ta}：“唱那首歌的时候，你在想什么？”\n\n{ta}沉默了很久才回答：\n\n@msg 그 노래는 원래 슬픈 노래였어요 || 那首歌原本是一首很悲伤的歌。\n@msg 근데 요즘은 부를 때마다 다른 생각이 나요 || 可是最近每次唱，都会想到别的事。\n@msg …누군가 제 무대를 진짜로 보고 있다는 생각 || ……想到有一个人，是真的在看我的舞台。"}},{"id":"f5","t":"汉江的脚踏车","d":5,"tm":"下午 16:40","p":"难得的休假日，{name}约你去汉江骑脚踏车。\n\n“戴了帽子跟口罩，应该没人认得出来。”{ta}说。\n\n傍晚的江边风很大，夕阳把江面染成橘红色。你们并排骑着，偶尔比赛，偶尔停下来买冰。\n\n然后，你听见身后有人小声说：“那个人……是不是{name}？”\n\n你回头，看见两个女孩正举起手机。","c":{"yunhee":"{name}抓住你的手腕：“快快快！跑！”","dohyun":"{name}笑了一声：“比赛开始。”然后用力一踩，冲了出去。","harin":"{name}整个人僵住，脸色发白。","yul":"{name}冷静地说：“你先骑到前面那个出口。我绕另一边，十分钟后会合。”"},"o":[{"t":"冷静带{ta}从小路离开","a":4,"h":0,"r":{"yunhee":"“欸，我们不能一起跑吗……”{ta}说，有点失望。","dohyun":"“你骑得挺快的嘛。”{ta}说，额头上全是汗。","harin":"{ta}停下来后，手还在抖。你递给{ta}一瓶水，{ta}慢慢平静下来。","yul":"你们在出口会合，{ta}看着你：“很好。你很可靠。”"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[6,0,"best"]}},{"t":"挡在{ta}前面，假装是你被认错","a":3,"h":0,"r":{"yunhee":"“你好帅！”{ta}在你身后小声尖叫。","dohyun":"“你挡什么。”{ta}说，“我又不怕。”{ta}推开你，自己骑走了。","harin":"{ta}在你身后，轻轻抓住了你的衣角，又马上放开。","yul":"“冒险。”{ta}说，“万一你被拍到，麻烦的是我。”"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"跟着{ta}一起狂飙，比谁先到出口","a":3,"h":1,"r":{"yunhee":"你们一路尖叫一路骑，像两个疯子。","dohyun":"“我赢了！”{ta}大喊，脸上是你从没见过的笑容。","harin":"{ta}点点头，可是你看得出来，{ta}很难过。原本那么开心的一天。","yul":"{ta}被迫跟着你飙，最后说：“……偶尔这样也不错。”"},"m":{"dohyun":[3,0],"yunhee":[1,0],"harin":[-4,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[-10,-3,"worst"]}},{"t":"慌张地建议今天就先解散","a":-3,"h":-1,"r":{"yunhee":"“咦……好吧。”{ta}有点失落，可是你已经叫了车。","dohyun":"“这么怂？”{ta}说，“没意思。”{ta}自己骑走了。","harin":"{ta}骑得很慢，你一直催{ta}，{ta}越骑越慌，最后差点摔倒。","yul":"“明智。”{ta}说，可是表情很冷。之后{ta}再也没约你出来。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那天下午的阳光很好。你们租了两台脚踏车，沿着汉江慢慢骑。江面上有游船，岸边有人在野餐、放风筝、遛狗。\n\n{name}戴着帽子和口罩，穿着很普通的运动服，看起来跟其他来运动的人没什么两样。可是你知道，只要有人仔细看，就一定认得出来。\n\n{ta}好像一点都不担心，骑得很开心，偶尔回头催你快一点。\n\n你们在一家便利商店前停下来，买了两支冰淇淋，坐在江边的台阶上吃。夕阳正好落下来。","after":{"dohyun":"后来你们在一座桥下停下来。两个人都喘得厉害，相视一眼，同时笑出声。\n\n“刺激吧？”{ta}说，汗水从下巴滴下来。\n\n“你是故意的吧？”\n\n“什么故意？”\n\n“故意被认出来。”\n\n{ta}愣了一下，然后笑了：“被发现了？”\n\n{ta}靠在桥墩上，看着江面：“我只是想知道，被认出来的时候，你会不会丢下我跑掉。”\n\n“结果呢？”\n\n“结果你跑得比我还快。”{ta}说，“但你一直回头看我有没有跟上。”\n\n{ta}转头看你，夕阳把{ta}的脸染成橘红色：“我很高兴。”","yul":"你们在出口会合时，天已经黑了。{ta}比你早到，靠在一棵树下，看起来一点都不慌张。\n\n“她们没有追来。”{ta}说，“照片应该也拍不清楚。”\n\n“你好像很习惯。”\n\n“习惯了。”{ta}说，“以前在前团的时候，常常这样跑。”\n\n你们推着脚踏车，慢慢走回租车的地方。\n\n“今天，”{ta}突然说，“是我这几年第一次在外面骑脚踏车。”\n\n“为什么？”\n\n“因为一个人来，被认出来很麻烦。”{ta}说，“两个人来，被认出来……好像也没那么糟。”","yunhee":"你们躲进一条小巷子，蹲在一个废弃的摊位后面，屏住呼吸，等那两个女孩走过去。\n\n等脚步声远了，{ta}才敢喘气，然后笑到停不下来。\n\n“好像在拍间谍片喔！”{ta}说，“我心跳好快！”\n\n你也在笑。笑着笑着，你发现你们靠得很近，近到你能闻到{ta}头发上的洗发精味道。\n\n{ta}好像也发现了，笑声停了一下。\n\n然后{ta}站起来，拍拍裤子上的灰：“走吧！我饿了！”\n\n你们去吃了一家很小的炸酱面店。{ta}吃得满嘴都是酱，你递给{ta}一张纸巾。\n\n{ta}接过纸巾时，指尖碰到你的手指，又很快缩回去。","harin":"你们在一条安静的小路停下来。{ta}靠在脚踏车上，脸色还有点白。\n\n“对不起。”{ta}说，“我很怕被认出来。”\n\n“没关系。”\n\n“以前有一次，”{ta}说，“在街上被认出来，被围住了。很多人拉我的衣服、拍我的脸。那之后，我就很少出门了。”\n\n你不知道该说什么。\n\n{ta}看着你，勉强笑了笑：“可是今天，我很开心。在被认出来之前，我一直很开心。”\n\n“那我们下次去别的地方。”你说，“人少一点的地方。”\n\n{ta}看着你，眼睛慢慢弯起来：“你会想到下次。”\n\n“当然。”\n\n“那，”{ta}说，“我也开始想下次了。”"}}],"amb":[{"id":"a1","t":"停电的练习室","d":4,"tm":"晚上 22:15","p":"{name}说今晚要加练，问你要不要来看。练习室在公司地下二楼，镜子占满了整面墙。\n\n你坐在角落看{ta}练了一个多小时。音乐停下来时，{ta}一身是汗，拿着毛巾走过来，坐在你旁边。\n\n就在那时，灯全灭了。\n\n整栋楼停电。黑暗里，你只听见{ta}的呼吸声，还有两个人的手臂，在地板上不小心碰到一起。","c":{"yunhee":"“哇！好黑！”{ta}下意识抓住你的手臂，又松开，“对、对不起……”","dohyun":"{ta}在黑暗里笑了一声：“怕的话，可以靠过来。”","harin":"{ta}的呼吸停了一下。过了很久，{ta}小声说：“这样……好安静。”","yul":"“别动。”{ta}说，“我开手机灯。”却没有马上去拿。"},"o":[{"t":"不动，就这样在黑暗里跟{ta}聊天","a":4,"h":4,"r":{"yunhee":"{ta}的话变少了。你们安静地坐着，直到灯亮，{ta}的脸红得像要烧起来。","dohyun":"{ta}靠得越来越近，最后说：“你心跳好快。”然后灯亮了，{ta}若无其事地站起来。","harin":"{ta}说起一首还没发表的歌。黑暗里，{ta}轻声唱了两句，只给你听。","yul":"{ta}说起前团解散的那一晚。说完，{ta}沉默了很久：“我很少跟人说这个。”"},"m":{"harin":[2,1],"yul":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,5,"best"],"yunhee":[6,4,"best"],"harin":[6,5,"best"]}},{"t":"开手机手电筒，打破这个气氛","a":2,"h":0,"r":{"yunhee":"光亮起来，{ta}眨了眨眼，好像有点失落。","dohyun":"“扫兴。”{ta}说，站起来离你远了一点。","harin":"{ta}眨了眨眼，好像刚从梦里醒来。","yul":"光亮起来，{ta}的表情恢复了平常的冷淡。好像刚才什么都没发生过。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"故意说你有点怕，看{ta}的反应","a":3,"h":5,"r":{"yunhee":"“我也怕！”{ta}挤到你旁边，肩膀贴着你。","dohyun":"“骗人。”{ta}说，却往你这边靠了一点。","harin":"“你不怕。”{ta}说，“你在试探我。”{ta}往旁边挪了一点。","yul":"“你不怕。”{ta}说，“你在试探我。”黑暗里，你听见{ta}笑了。"},"m":{"dohyun":[2,1],"yul":[1,1],"harin":[-2,0]},"sc":{"dohyun":[6,6,"best"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[-4,-1,"bad"]}},{"t":"起身说要去找工作人员","a":-3,"h":-1,"r":{"yunhee":"“等我！不要丢下我！”{ta}在黑暗里喊，你已经走远了。","dohyun":"“你要去哪？”{ta}拉住你的袖子，又放开了。“随便你。”","harin":"{ta}没有说话。你走后，{ta}一个人在黑暗里坐了很久。","yul":"“不用。”{ta}说，“三分钟后就有备用电。”可是你还是走了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"练习室在地下二楼，没有窗户，只有一整面墙的镜子和天花板上的日光灯。空调开得很强，你坐在角落，裹着{ta}丢给你的外套。\n\n你看着{ta}一遍又一遍地练同一段舞。音乐停下来，{ta}就看着镜子里的自己，皱眉，然后重新开始。\n\n那是你第一次看到{ta}这样的一面。不是舞台上那个光鲜的人，也不是宵夜时那个随意的朋友。是一个对自己很严格、累了也不停下来的人。\n\n一个多小时后，{ta}终于关掉音乐。","after":{"dohyun":"灯亮的时候，{ta}已经站起来了，背对着你，拿毛巾擦汗。\n\n“走吧。”{ta}说，“我送你出去。”\n\n你们一前一后走出练习室。走廊上的灯一盏一盏亮起来，{ta}走得很快，好像在逃。\n\n到了公司门口，{ta}停下来，没有回头。\n\n“刚才，”{ta}说，“我说的话，你别当真。”\n\n“哪一句？”\n\n{ta}转过来，看着你，表情很复杂。\n\n“……全部。”{ta}说，然后又改口，“不，不是全部。”\n\n{ta}没有说是哪一句。你站在门口，看着{ta}走回公司，背影在玻璃门后面消失。\n\n那天晚上，你失眠了。","yul":"灯亮的那一刻，{ta}眨了眨眼，好像刚从很远的地方回来。\n\n你们都没有说话。\n\n{ta}站起来，把毛巾挂在脖子上，走到镜子前，看着镜子里的自己，看了很久。\n\n“我很少跟人说那些。”{ta}说，没有回头。\n\n“我知道。”\n\n“你知道为什么我跟你说吗？”\n\n你看着镜子里的{ta}。{ta}也在看着镜子里的你。\n\n“因为黑暗里，”{ta}说，“我看不见你的表情。所以我不用担心你会用什么眼神看我。”\n\n{ta}终于转过来，看着真正的你：“可是现在灯亮了，你的眼神……没有变。”","yunhee":"灯亮的时候，你们都愣了一下，然后同时转开视线。\n\n{ta}的脸红得厉害。{ta}站起来，假装很忙地收拾东西，把同一件外套折了三次。\n\n“那、那个，”{ta}说，“我们去吃宵夜吧！我饿死了！”\n\n你们去了公司附近的一家便利商店。{ta}买了一堆零食，一路上说个不停，说的都是一些不重要的事。\n\n你知道{ta}在掩饰什么。\n\n到了地铁站，{ta}终于安静下来。\n\n“刚才……”{ta}开口，又停住。\n\n“刚才怎么了？”\n\n“没事！”{ta}说，“晚安！”\n\n{ta}跑走了。跑了几步，又回头：“明天也来看我练习好不好！”","harin":"灯亮的时候，{ta}还在哼那首歌，哼到一半才停下来，好像刚意识到灯亮了。\n\n{ta}看着你，有点慌张：“我、我刚才……”\n\n“很好听。”你说。\n\n{ta}低下头，脸慢慢红了。\n\n那天晚上，你们一起走出公司。夜风很凉，{ta}裹着那件外套，走得很慢。\n\n“那首歌，”{ta}说，“还没有完成。少了最后一段。”\n\n“为什么少了？”\n\n{ta}停下脚步，看着你：“因为我还不知道，故事的结局是什么。”\n\n你们站在路灯下，谁都没有再说话。"}},{"id":"a2","t":"讲到睡着的电话","d":3,"tm":"凌晨 01:30","p":"{name}的海外行程，时差八小时。\n\n你本来已经准备睡了，手机突然响起视讯通话。你接起来，画面里是饭店的天花板，然后才是{ta}的脸。\n\n“还没睡吧？”{ta}说，“我刚结束，睡不着。”\n\n你们聊了很久。从{ta}今天吃的东西、到你的工作、到你们都喜欢的电影。不知道什么时候，两个人都躺下了，声音越来越轻。","c":{"yunhee":"{ta}抱着枕头：“如果你在这里就好了……”说完马上捂住嘴，“我是说，一起玩！”","dohyun":"“你先睡。”{ta}说，“我看着你睡。”","harin":"{ta}的声音变得很轻：“这样，好像你就在旁边。”","yul":"“不要挂。”{ta}说，“我想听着声音睡。”"},"o":[{"t":"不挂电话，就这样一起睡着","a":4,"h":3,"r":{"yunhee":"你醒来时，看见{ta}传来的一张截图：你睡着的样子。「好可爱喔～」","dohyun":"你醒来时，{ta}传来一则：「你打呼。」","harin":"你醒来时，{ta}传了一首歌，写着：「昨晚想到的旋律。」","yul":"你醒来时，通话已经结束，只有一则讯息：「谢谢。我睡得很好。」"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"轻声说：「你也该睡了，明天还有行程」","a":3,"h":0,"r":{"yunhee":"“你好像我经纪人喔……”{ta}说，声音有点委屈。","dohyun":"“唠叨。”{ta}说，挂电话前没有说晚安。","harin":"“晚安。”{ta}说，“做个好梦。”","yul":"“你说得对。”{ta}说，“那以后我不打了。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"半开玩笑问：「那如果我在旁边呢？」","a":3,"h":5,"r":{"yunhee":"“那……”{ta}的脸一下子红了，“那我们就可以一起看电影了！”","dohyun":"“那你就别想睡了。”{ta}笑得很坏。","harin":"“嗯，晚安。”{ta}说，之后好几天，都没有再打来。","yul":"“你确定想知道答案？”{ta}的声音低了下来。"},"m":{"dohyun":[2,2],"yul":[2,1],"harin":[-3,0]},"sc":{"dohyun":[6,7,"best"],"yul":[6,6,"best"],"yunhee":[2,3,"good"],"harin":[-10,-3,"worst"]}},{"t":"说你明天要早起，先挂了","a":-3,"h":-1,"r":{"yunhee":"“好吧……晚安。”{ta}的声音很失落。","dohyun":"“喔。”{ta}说完就挂了。之后两天，{ta}都没打来。","harin":"{ta}很久没说话。最后说：“……我不喜欢这种问题。”就挂了。","yul":"“好。”{ta}说，挂得比你还快。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那段时间，{name}在海外巡演，时差八小时。你们的对话变得很零碎：你早上起床时，{ta}刚结束演出；你吃午饭时，{ta}正在睡觉；你下班时，{ta}刚醒来，准备去彩排。\n\n你发现自己开始习惯在奇怪的时间看手机。早上六点、下午三点、半夜一点。\n\n有时候{ta}会传一张演唱会的照片，台下是一片陌生的手灯海。有时候只是一句「好累」，或「这里的食物好难吃」。\n\n你每一则都回。即使隔了好几个小时，你也会回。","after":{"dohyun":"那天之后，你们每天晚上都会视讯。\n\n有时候聊很久，有时候只是开着视讯，各做各的事。{ta}在饭店房间里练舞、打游戏、吃泡面，你在家里加班、看剧、发呆。\n\n偶尔抬头，会发现{ta}在看你。\n\n“看什么？”\n\n“看你工作。”{ta}说，“你认真的时候会咬嘴唇。”\n\n“你一直在看？”\n\n“没有。”{ta}说，“偶尔。”\n\n巡演最后一天，{ta}说：“我明天回去。”\n\n“几点的飞机？”\n\n“为什么问？”\n\n“……没什么。”\n\n隔天，你在机场的人群外面，远远看着{ta}走出来。{ta}没看见你。可是那天晚上，{ta}传来讯息：「我看到你了。」","yul":"那天之后，{ta}每天晚上都会打来。时间很固定，你那边的十二点半，{ta}那边的下午四点半，演出前的空档。\n\n你们每次只聊二十分钟。{ta}会问你今天过得怎么样，你会问{ta}今天的城市是哪里。\n\n有一次，{ta}说：“我开始讨厌巡演了。”\n\n“为什么？”\n\n“因为时差。”{ta}说，“我想在你醒着的时候醒着。”\n\n你握着手机，没有说话。\n\n{ta}也沉默了很久，然后说：“我说太多了。忘了吧。”\n\n“我不想忘。”\n\n电话那头安静了很久。最后，{ta}说：“……那就记着吧。”","yunhee":"那天之后，{ta}每天都会在睡前打视讯给你。不管多晚，不管多累。\n\n{ta}会跟你讲今天发生的事：哪个城市的粉丝很热情、哪道菜很难吃、哪个成员又在饭店迷路了。\n\n讲着讲着，{ta}就会睡着。你会看着{ta}睡着的样子，过一会儿才挂掉。\n\n有一次，{ta}在睡着前，迷迷糊糊地说：\n\n“你知道吗……我每天最期待的，就是这个时间……”\n\n你屏住呼吸。\n\n可是{ta}已经睡着了，什么都没说完。\n\n隔天，{ta}完全不记得自己说过这句话。可是你记得。","harin":"那天之后，{ta}开始在睡前传录音给你。\n\n有时候是一段旋律，有时候是{ta}读的一首诗，有时候只是{ta}饭店窗外的声音：雨声、车声、远处的教堂钟声。\n\n你会在早上醒来时听。{ta}那边的深夜，是你这边的清晨。\n\n有一次，录音里只有{ta}的呼吸声，很轻很慢，像是睡着了。\n\n录音的最后，{ta}很小声地说了一句：\n\n“……想你了。”\n\n然后录音就断了。\n\n你听了很多遍。不确定{ta}是不是故意录进去的。\n\n你没有问。{ta}也没有提。"}},{"id":"a3","t":"你去相亲的那天","d":5,"tm":"晚上 21:00","p":"家里安排了一场相亲。你不太想去，但推不掉。\n\n对方人很好，你们吃了一顿还算愉快的饭。回家的路上，你在社群发了一张餐厅的照片，没有写什么。\n\n晚上九点，手机响了。","c":{"yunhee":"@msg 오늘 누구랑 밥 먹었어?? || 今天跟谁吃饭了？？\n@msg 아 그냥!! 맛있어 보여서!! || 啊就是！！看起来很好吃！！","dohyun":"@msg 그 사진 뭐야 || 那张照片是什么？\n@msg 누구랑 갔는데 || 跟谁去的？","harin":"@msg 좋은 시간 보냈어요? || 你度过了愉快的时光吗？","yul":"@msg 소개팅이죠? || 是相亲吧？\n@msg 그래서? 어땠어요? || 所以呢？怎么样？"},"o":[{"t":"老实说是家里安排的相亲，你没兴趣","a":4,"h":2,"r":{"yunhee":"「喔～这样喔！」{ta}回得超快，「那、那我们周末去吃更好吃的！」","dohyun":"「没兴趣还去？」{ta}说，「下次推掉。」又补：「……我是说，浪费时间。」","harin":"「嗯。」{ta}说，过了很久：「我刚刚，有点在意。」","yul":"「我知道了。」{ta}说，「下次不想去，可以说你有约。跟我。」"},"m":{"yul":[2,1],"harin":[2,1]},"sc":{"dohyun":[6,2,"best"],"yul":[6,3,"best"],"yunhee":[2,1,"good"],"harin":[6,3,"best"]}},{"t":"故意说对方人很好，看{ta}怎么回","a":2,"h":4,"r":{"yunhee":"「喔……」{ta}只回了一个字，然后一整天都没有再找你。","dohyun":"「是喔。」{ta}说，「那他会炸鸡吗？」然后就下线了。","harin":"「那很好。」{ta}说完就下线了。之后一个星期，你们都没联络。","yul":"「你在试探我。」{ta}说，「我讨厌这种方式。」"},"m":{"dohyun":[1,2],"harin":[-5,0],"yul":[-4,1],"yunhee":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"反问{ta}：「你在意吗？」","a":3,"h":3,"r":{"yunhee":"「我、我才没有！」{ta}马上回，然后又：「好啦一点点。」","dohyun":"「在意啊。」{ta}说，「你不能比我先有对象。」","harin":"{ta}很久没回，最后说：「我不知道。」","yul":"「你希望我在意吗？」{ta}把问题丢回来。"},"m":{"yunhee":[2,1],"dohyun":[1,1]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,4,"best"],"harin":[2,2,"good"]}},{"t":"只说是跟朋友吃饭，转移话题","a":-3,"h":-1,"r":{"yunhee":"「好喔！」{ta}说，可是之后的讯息越来越慢。","dohyun":"「骗人。」{ta}说，「你连说谎都懒得说好。」","harin":"「好。」{ta}说，然后就下线了。","yul":"「你不会说谎。」{ta}说，「算了，我不问了。」"},"m":{"yul":[-3,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那场相亲是妈妈安排的。对方是妈妈朋友的儿女，听说人很好，工作稳定，长得也不错。\n\n你本来想推掉，可是妈妈在电话里说了半个小时，最后你只好答应。\n\n餐厅很高级，对方很有礼貌，你们聊了工作、兴趣、家庭。一切都很正常，很顺利，很……没有感觉。\n\n你坐在那里，一边微笑一边点头，脑子里却一直在想：如果对面坐的是另一个人，会怎么样。\n\n回家的路上，你在社群发了一张餐厅的照片。你也不知道为什么要发。","after":{"dohyun":"那天晚上，{ta}一直在找你聊天。聊的都是一些很无聊的事，像是故意不让你去睡觉。\n\n聊到凌晨一点，{ta}突然说：\n\n@msg 근데 그 사람이랑 또 만나? || 不过你还会跟那个人见面吗？\n\n你说不会。\n\n@msg 왜? || 为什么？\n\n你想了很久，回：「因为没感觉。」\n\n{ta}隔了很久才回：\n\n@msg 그럼 누구한테는 느낌이 있는데? || 那你对谁有感觉？\n\n你看着那句话，手指停在屏幕上，很久都没动。\n\n最后，{ta}自己先传了：\n\n@msg 아 됐어. 자라 || 啊算了，睡吧。","yul":"那天之后，{ta}变得有点奇怪。\n\n讯息还是照常传，可是语气比平常更短、更冷。约你吃饭时，会故意挑一些很贵的餐厅，好像在跟什么人比较。\n\n有一次，你终于忍不住问：“你在不高兴什么？”\n\n{ta}放下刀叉，看着你：“我没有不高兴。”\n\n“你有。”\n\n{ta}沉默了很久，才说：“我不喜欢自己这样。”\n\n“这样是怎样？”\n\n“在意一件不该在意的事。”{ta}说，“我们是朋友。你去相亲，跟我没有关系。”\n\n{ta}说完，又低头切牛排，切得很用力。","yunhee":"那天之后，{ta}还是每天传讯息给你。可是你发现，{ta}开始在一些奇怪的地方停顿。\n\n你提到同事，{ta}会问「男的女的？」；你说周末要出门，{ta}会问「跟谁？」；你说今天很开心，{ta}会问「为什么开心？」\n\n问完了，{ta}又会马上补一句：「我只是好奇喔！」\n\n有一次，你开玩笑说：「你好像在查勤。」\n\n{ta}隔了很久才回：\n\n@msg 미안… 나 좀 이상하지 || 对不起……我是不是有点奇怪。\n@msg 나도 내가 왜 이러는지 모르겠어 || 我也不知道自己为什么会这样。","harin":"那天之后，{ta}的讯息变少了。\n\n不是不回，只是回得很慢，很短。你约{ta}吃饭，{ta}会说「最近有点忙」。你传照片给{ta}，{ta}只回一个笑脸。\n\n一个星期后，你终于忍不住打电话给{ta}。\n\n{ta}接起来，声音很轻：“……喂。”\n\n“你在躲我？”\n\n电话那头安静了很久。\n\n“我在想一些事情。”{ta}说，“想我们……是什么。”\n\n“想出来了吗？”\n\n“还没有。”{ta}说，“可是我发现，你去相亲那天，我写了一首很难过的歌。”"}},{"id":"a4","t":"被花絮镜头拍到的衣领","d":4,"tm":"下午 15:00","p":"你因为工作的关系，被邀请到{name}的广告拍摄现场。\n\n休息时，{ta}走过来跟你说话。你注意到{ta}的衣领翻了一边，下意识伸手帮{ta}整理。\n\n你的指尖碰到{ta}的脖子，{ta}整个人停住了。\n\n两个人就这样站着，近得能闻到对方身上的味道。\n\n“咔嚓。”\n\n你转头，看见花絮摄影师正举着相机，若无其事地走开。","c":{"yunhee":"{ta}捂着脸笑：“好丢脸喔！可是……”{ta}小声说，“那张一定很好看。”","dohyun":"{ta}没有退开，反而低头看你：“你手好冰。”","harin":"{ta}的呼吸乱了一拍，眼睛看向别处：“……谢谢。”","yul":"{ta}抓住你的手腕，轻轻拿开：“这里人多。”声音比平常低。"},"o":[{"t":"假装若无其事，继续聊刚才的话题","a":3,"h":2,"r":{"yunhee":"{ta}努力假装，可是一直不敢看你，后来就躲到化妆室去了。","dohyun":"“装什么。”{ta}低声说，“你脸红了。”可是{ta}没再靠近你。","harin":"{ta}也装作没事，可是说话一直卡住。","yul":"“好。”{ta}说，“你很冷静。”可是接下来的拍摄，{ta}再也没看你。"},"m":{"yul":[1,1]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,1,"good"]}},{"t":"小声道歉，说你只是习惯性动作","a":-3,"h":-1,"r":{"yunhee":"“喔……这样喔。”{ta}的笑容慢慢淡了，“我还以为……没事！”","dohyun":"“习惯？”{ta}挑眉，“你对谁都这样？”{ta}转身就走了。","harin":"“不用道歉。”{ta}说，可是{ta}往后退了一步。","yul":"“我知道。”{ta}说，“所以下次，别对我这样。”"},"m":{"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}},{"t":"担心照片会给{ta}惹麻烦，去找摄影师","a":4,"h":0,"r":{"yunhee":"“你好认真！”{ta}说，“不过……我其实想要那张。”","dohyun":"“删什么。”{ta}说，“又没怎样。”却跟你去了。","harin":"{ta}很感激地看着你：“谢谢你。”","yul":"“我已经处理了。”{ta}说，“不过你这样想，很好。”"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"看着{ta}的眼睛，低声说：「我是故意的」","a":3,"h":6,"r":{"yunhee":"{ta}瞪大眼睛，脸红得像番茄，转身跑掉了。","dohyun":"{ta}愣了一秒，然后笑了，弯下腰在你耳边说：“那我也故意一次。”却什么都没做就走开了。","harin":"{ta}看着你，眼神里有一种被冒犯的东西。“……现在不行。”{ta}说完就走开了。","yul":"“我知道。”{ta}说，“所以我刚才没躲。”"},"m":{"dohyun":[2,2],"yul":[2,2],"harin":[-3,0]},"sc":{"dohyun":[6,8,"best"],"yul":[2,4,"good"],"yunhee":[2,3,"good"],"harin":[-10,-3,"worst"]}}],"x":"拍摄现场在一个很大的摄影棚里，到处都是灯光、反光板和来来去去的工作人员。你因为工作的关系被邀请来，本来只是站在旁边看。\n\n{name}拍了一整个上午，换了四套衣服，每一套都要重新化妆、重新打光。你看着{ta}在镜头前的样子，跟平常完全不一样：眼神、姿势、表情，每一个细节都精准得可怕。\n\n可是只要导演喊「休息」，{ta}就会立刻垮下来，找一个角落坐着发呆。\n\n中午休息时，{ta}在人群中找到你，朝你走过来。","after":{"dohyun":"那天下午的拍摄，你一直站在角落。{ta}拍着拍着，眼神就会往你这边飘。\n\n导演喊了好几次：“道贤！看镜头！”\n\n收工时，{ta}走过来，把一瓶水塞进你手里。\n\n“你害我被骂了五次。”{ta}说。\n\n“我什么都没做。”\n\n“你站在那里。”{ta}说，“就够了。”\n\n你们一起走出摄影棚。外面已经天黑了。\n\n“刚才那个，”{ta}突然说，“你说是故意的，是真的吗？”\n\n你没有回答。\n\n{ta}看着你，等了很久，最后笑了：“好。我知道了。”\n\n{ta}没说知道了什么。","yul":"那天下午，那张照片还是流出去了。只是一张模糊的侧影，看不清楚你的脸，可是粉丝们在底下吵翻了。\n\n你很担心，传讯息给{ta}。{ta}很快回了：\n\n@msg 처리했어요. 걱정 마요 || 处理好了，别担心。\n\n过了一会儿，又传来一则：\n\n@msg 근데 그 사진, 원본 받아놨어요 || 不过那张照片，我拿到原图了。\n@msg 지우라고 했는데, 나는 안 지웠어요 || 我叫他们删了，但我自己没删。\n\n你看着那两行字，心跳得很快。\n\n@msg 왜요? || 为什么？\n\n{ta}隔了很久才回：\n\n@msg 그래서? 왜일 것 같아요? || 所以呢？你觉得是为什么？","yunhee":"那天下午，{ta}拍摄时一直在笑。导演说今天的状态特别好，眼睛里有光。\n\n{ta}的经纪人在旁边小声问你：“你们……是什么关系？”\n\n“朋友。”你说。\n\n经纪人看了你一眼，没说什么。\n\n收工后，{ta}跑过来，偷偷塞给你一张拍立得。是刚才花絮摄影师拍的那一张：你帮{ta}整理衣领，两个人靠得很近，{ta}的脸红红的。\n\n“我跟他要来的。”{ta}说，“原本要删掉的。”\n\n“那你为什么要？”\n\n{ta}看着你，咬着嘴唇：“因为……我想留着。”","harin":"那天下午，{ta}一直很安静。拍摄时很专业，休息时就坐在角落，不太跟人说话。\n\n你以为{ta}在生气。\n\n收工后，{ta}在停车场等你。\n\n“刚才，”{ta}说，“对不起。我不是故意躲开你。”\n\n“我知道。”\n\n“我只是……”{ta}低下头，“很久没有人碰我的时候，我会想要更多。所以我害怕。”\n\n你看着{ta}，不知道该说什么。\n\n{ta}抬起头，眼睛有点红：“我们现在这样，可以吗？再慢一点，可以吗？”"}},{"id":"a5","t":"演唱会的最后一首歌","d":6,"tm":"晚上 21:45","p":"{name}送了你一张演唱会的票，是关系者席。\n\n整场演唱会，你看着{ta}在台上发光。那是你不认识的{name}，耀眼、遥远，属于几万个人。\n\n最后一首歌，全场灯光暗下来，只剩手灯的海。{ta}站在舞台中央，唱到最后一句时，转头看向关系者席的方向。\n\n那一秒，你很确定{ta}在看你。\n\n散场后，{ta}传讯息，叫你去后台。人都走光了，{ta}还穿着舞台服，坐在空荡荡的走廊。","c":{"yunhee":"{ta}一看到你就站起来，又停住：“你有看到吗？最后那一句，是……”说到一半就卡住了。","dohyun":"{ta}靠着墙，汗还没干：“看到了吧？我在看你。”没有笑，难得地认真。","harin":"{ta}的眼睛有点红：“那首歌，是我写的。写的时候……想到的是一个人。”","yul":"{ta}说：“我平常不会在台上看任何人。”停了停，“今天例外。”"},"o":[{"t":"等{ta}把话说完","a":4,"h":4,"r":{"yunhee":"{ta}深吸一口气，又泄了气：“算了！下次再说！”可是{ta}一直看着你，看到经纪人来叫。","dohyun":"“你知道我想说什么。”{ta}说，“我不想说出来。说出来就回不去了。”","harin":"{ta}没有说那个人是谁，但{ta}的眼神说了。","yul":"“我不擅长这个。”{ta}说，“但我不想再只是朋友。”说完，{ta}自己也沉默了。"},"m":{"yul":[2,2],"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,6,"best"],"yunhee":[2,2,"good"],"harin":[6,5,"best"]}},{"t":"先开口说今晚的{ta}很耀眼","a":3,"h":2,"r":{"yunhee":"“真的吗！”{ta}跳起来，又停住，“那……你喜欢吗？”","dohyun":"“我知道。”{ta}说，“我想听的不是这个。”{ta}别开了脸。","harin":"“谢谢。”{ta}说，“可是我更想你看见台下的我。”","yul":"“我知道。”{ta}说，“你在逃避。”"},"m":{"yunhee":[2,0],"dohyun":[1,0],"yul":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,2,"best"],"harin":[-4,-1,"bad"]}},{"t":"轻轻碰了碰{ta}的手指","a":3,"h":6,"r":{"yunhee":"{ta}的手指在你的手指上停了一下，然后迅速缩回去：“走、走廊好冷喔！”气氛一下子尴尬了。","dohyun":"{ta}反手勾住你的小指，一秒，就放开了：“我们这样，算什么？”","harin":"{ta}的手在抖。{ta}没有缩回，也没有握住，只是让你碰着。","yul":"{ta}低头看着你的手：“你知道你在做什么吗？”"},"m":{"dohyun":[2,2]},"sc":{"dohyun":[6,8,"best"],"yul":[2,3,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,3,"good"]}},{"t":"说你只是来道恭喜，要先回去了","a":-3,"h":-1,"r":{"yunhee":"“你要走了？”{ta}的笑容僵住，“好……路上小心。”","dohyun":"“行。”{ta}说，转身踢了一下墙。","harin":"{ta}点点头，什么都没说。可是你看见{ta}的眼眶红了。","yul":"“好。”{ta}说，“我知道了。”那三个字，比任何时候都冷。"},"m":{"harin":[-4,0],"dohyun":[-4,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那是{name}的个人演唱会，场馆坐满了一万多人。你坐在关系者席，旁边是几个{ta}的朋友和工作人员，大家都很安静。\n\n灯光暗下来，第一首歌的前奏响起，全场尖叫。\n\n你看着{ta}从升降台上缓缓出现，穿着一身白色的舞台服，在灯光下像在发光。那一瞬间，你突然觉得{ta}离你很远。远得像在另一个世界。\n\n整场演唱会两个多小时。{ta}唱了、跳了、哭了、笑了，跟台下的每一个人说谢谢。\n\n最后一首歌开始前，{ta}停下来，看着台下，说了一句：“这首歌，送给一个很重要的人。”","after":{"dohyun":"那天晚上，你很晚才离开场馆。走到地铁站时，你收到一则讯息：\n\n@msg 아까 그 말, 진심이야 || 刚才那些话，是认真的。\n@msg 근데 지금은 안 돼 || 可是现在不行。\n@msg 컴백 끝나면 다시 말할게 || 回归结束后，我再说一次。\n\n你看着那三行字，站在地铁站的入口，很久都没动。\n\n人群从你身边经过，有人拿着{ta}的手幅，有人在讨论刚才的演唱会。\n\n你想起{ta}在台上看着你的那个眼神。\n\n回归结束还有两个月。\n\n你突然觉得，两个月好长。","yul":"那天晚上，{ta}送你到停车场。一路上都没有说话。\n\n到了你的车旁边，{ta}才开口：“我刚才在台上说的那句话，你知道是在说谁吧？”\n\n“我知道。”\n\n“我需要时间。”{ta}说，“不是因为不确定你。是因为不确定我自己。”\n\n“什么意思？”\n\n“前团解散的时候，”{ta}说，“我答应过自己，不再把重要的东西放在会失去的地方。”\n\n{ta}看着你：“可是你已经在那里了。我还没想好，要怎么保护你。”","yunhee":"那天晚上，{ta}一直在后台陪你，陪到所有人都走了，陪到保全来赶人。\n\n你们一起从后门离开。夜风很凉，{ta}裹着一件大外套，跟在你后面。\n\n“刚才那首歌，”{ta}突然说，“你喜欢吗？”\n\n“喜欢。”\n\n“那是我写的第一首歌。”{ta}说，“写给一个人的。”\n\n“谁？”\n\n{ta}没回答，只是快步走到你前面，然后转身，倒着走，看着你：\n\n“你猜！”\n\n你看着{ta}在路灯下倒着走、笑着、等你回答的样子，突然很想抓住{ta}。\n\n可是你没有。现在还不行。","harin":"那天之后，{ta}把那首歌发表了。\n\n歌名叫〈关系者席〉。\n\n歌词写的是一个歌手，每一次站在舞台上，都会看向同一个位置。那个位置上的人不知道，歌手所有的歌，都是为了被那个人听见。\n\n那首歌拿了一位。{ta}在得奖感言里说：“谢谢那个位置上的人。”\n\n所有人都在猜那个人是谁。\n\n那天晚上，你收到一则讯息：\n\n@msg 이 노래, 끝까지 들었어요? || 这首歌，你听到最后了吗？\n@msg 마지막 가사는 아직 안 불렀어요 || 最后一句歌词，我还没唱。\n@msg 직접 불러주고 싶어서 || 因为想亲自唱给你听。"}}],"fwb":[{"id":"w1","t":"庆功宴之后","d":5,"tm":"深夜 01:20","p":"新歌拿下了第一个一位。庆功宴结束时已经过了午夜，{name}说喝多了，不想坐保姆车，要你陪{ta}走一段。\n\n你们走进{ta}在公司附近租的小公寓。门在身后关上，屋里只开了一盏玄关的小灯。\n\n{ta}没有马上开灯。你们站在很近的地方，近到你能闻到{ta}身上残留的香水和酒气。\n\n“我想清楚了。”{ta}的声音很低，“我们之间……我给不了你更多。公司、粉丝、行程，我什么都承诺不了。”\n\n{ta}看着你：“可是我不想再假装只是朋友。如果你不愿意，现在就走，我不会怪你。”","c":{"yunhee":"{ta}咬着嘴唇，难得地没有笑：“我知道这样很自私……可是我好想你。只是……不能是恋人。”","dohyun":"{ta}靠着门，喉结滚动了一下：“别让我说第二次。不谈恋爱，不吃醋，不过问。你要，就留下。”","harin":"{ta}的手指攥着衣角：“我很害怕。害怕被发现，也害怕自己会想要更多。所以……我们只能这样。”","yul":"{ta}说得很直接：“规则很简单。不过夜，不公开，不问对方的私事。你同意，我们就开始。”"},"o":[{"t":"点头同意，主动靠近{ta}","a":3,"h":10,"r":{"yunhee":"{ta}踮起脚吻你，又急又生涩，牙齿还磕到了你的嘴唇。“对、对不起！”{ta}捂住嘴，脸红得快要冒烟。\n\n你笑出声，{ta}瞪你，然后自己也笑了。笑着笑着，{ta}安静下来，伸手环住你的脖子：“……这次我会好好来。”\n\n第二个吻很慢。{ta}的唇很软，带着一点庆功宴上的果酒味。你扶住{ta}的腰，{ta}在你怀里轻轻颤了一下，像只受惊的小动物，却没有退开，反而贴得更近。\n\n你们跌跌撞撞地进了卧室，撞倒了一盏台灯。{ta}笑得倒在床上，长卷发散了一枕头。可是当你俯身靠近，{ta}的笑声就停了。{ta}看着你，眼睛湿漉漉的，小声说：“……我好紧张喔。”\n\n你吻{ta}的眼角，吻{ta}的鼻尖，吻那颗笑起来会露出来的虎牙。{ta}慢慢放松下来，手指从你的后颈滑进头发里，抓得很紧。\n\n平常那么吵的人，此刻只剩下急促的呼吸，和断断续续、黏糊糊的呢喃。你的指尖每经过一个地方，{ta}就轻轻缩一下，然后又追着你的温度贴上来。{ta}的皮肤一点一点泛起粉色，从脸颊一路蔓延到锁骨。\n\n“{me}……”{ta}一直叫你的名字，叫到后来带了哭腔，指甲在你的手背上留下一排浅浅的月牙。\n\n结束后，{ta}把脸埋在枕头里，耳朵红透：“不准看我！好丢脸！”\n\n你笑着去拉{ta}，{ta}就滚进你怀里，闷闷地说：“……可是好幸福。”\n\n过了很久，{ta}才慢慢坐起来，背对着你，一件一件穿回衣服。\n\n“我该走了。”{ta}说，声音小小的，“规则嘛。”\n\n走到门口，{ta}又跑回来，在你额头上亲了一下，然后才真的离开。","dohyun":"{ta}没等你说完，就把你抵在门上。\n\n吻带着酒味，凶得像在赌气，好像要把这几个月忍下来的所有东西一次讨回来。可{ta}的手却意外地小心，一只手垫在你的后脑和门板之间，怕你撞疼。\n\n“现在喊停，还来得及。”{ta}在你唇边说，喘着气。\n\n你没有回答，只是咬了一下{ta}的下唇。{ta}低低地骂了一声，笑了。\n\n衣服一件一件落在走廊上，从玄关一路到卧室。{ta}把你放倒在床上，撑在你上方，银灰色的头发垂下来，挡住了一半的灯光。{ta}的耳骨钉在暗处闪了一下。\n\n“你知道我想这样多久了吗？”{ta}问，然后不等你回答，就低头吻你的颈侧，吻得很重，像要留下记号，又在最后一刻收住力道，只用唇轻轻碾过。\n\n{ta}嘴上不饶人，一句接一句地说着坏话，说你脸红了、说你在发抖、说你明明也想要。可是{ta}的动作却一次又一次停下来，盯着你的表情，确认你的每一个反应。只要你皱一下眉，{ta}就会立刻放慢。\n\n{ta}的掌心又热又烫，沿着你的背脊一寸一寸地往下，所过之处都像被点燃。房间里只剩下两个人交错的呼吸，和床单摩擦的声音。\n\n最后那一刻，{ta}把脸埋进你的肩窝，所有的嚣张都碎了，只剩下一声压抑的、几乎像是叹息的喘息。\n\n很久，{ta}都没有动。\n\n快天亮的时候，{ta}坐起来，套上卫衣，背影的线条绷得很紧。{ta}没有看你，弯腰捡起地上的手机。\n\n“我走了。”{ta}说。在门口，{ta}停了一下，没有回头。\n\n“……锁好门。”","harin":"{ta}的吻很轻，轻得像在问一个问题。\n\n你回应了。{ta}这才慢慢放松，手指穿过你的头发，一下一下地，像在确认这是真的，不是{ta}哪一首歌里的想象。\n\n“可以……关灯吗？”{ta}小声说。\n\n你关了灯。黑暗里，{ta}反而变得大胆了一点。{ta}牵着你的手，一步一步退向卧室，像在跳一支很慢的舞。\n\n{ta}坐在床沿，仰头看你。窗外的月光照在{ta}脸上，你看见{ta}素颜时的雀斑，看见{ta}眼睛里有一点害怕，和更多的渴望。\n\n你吻{ta}的额头。{ta}闭上眼睛，长长地吐出一口气。\n\n那一夜，每一次触碰都很慢、很认真。{ta}的手指冰凉，落在你的肩膀上时，你忍不住轻轻一颤，{ta}就停下来，用掌心捂热了，才再继续。{ta}的唇沿着你的手腕内侧往上，那里的皮肤很薄，你能感觉到自己的脉搏一下一下撞在{ta}唇上。\n\n{ta}像在读一首诗，一个字一个字，不肯漏掉任何一句。\n\n你听见{ta}在你耳边小声地吸气，听见{ta}的心跳，乱成一团。在最深的时候，{ta}紧紧抱着你，把脸埋在你的颈窝，轻轻地、几乎听不见地，哼出一小段旋律。\n\n那是一首你从来没听过的歌。\n\n结束后，{ta}安静地躺了很久，手一直放在你的心口，像在数你的心跳。\n\n然后，{ta}起身穿衣服。月光下，{ta}的背影很单薄。\n\n“这样就好。”{ta}背对着你说，声音很轻，“不要对我太好。我会……写不出别的歌。”","yul":"{ta}伸手关掉了玄关的灯。\n\n全然的黑暗里，你只感觉得到{ta}的气息靠近。{ta}没有马上吻你，只是用鼻尖碰了碰你的，停在那里，像在给你最后一次反悔的机会。\n\n“三秒。”{ta}低声说，“你不推开我，我就当你同意了。”\n\n一。二。\n\n你在数到三之前吻了上去。\n\n{ta}低笑了一声，那笑声震在你唇上。然后{ta}接管了一切。吻很稳，带着不容拒绝的力道，舌尖慢慢描过你的唇线，扶在你腰上的手收紧，把你整个人压进{ta}怀里。可是当你轻轻推了一下，{ta}立刻就停了，退开一点点，等你自己再靠过来。\n\n{ta}把你带进卧室，没开灯，只有窗外城市的光。{ta}解开自己的衬衫袖扣，动作不紧不慢，眼睛却一直盯着你。你看见{ta}手腕上那道细细的刺青。\n\n“看什么？”{ta}问。\n\n“看你。”\n\n{ta}顿了一下，然后把你推倒在床上。\n\n{ta}习惯掌握节奏，连呼吸都控制得很好。每一个吻、每一次触碰，都像是精心计算过的，让你一次比一次更难呼吸。{ta}在你耳边低声说话，声音又低又哑，问你喜欢什么、想要什么，逼你一个字一个字说出来。\n\n可是在某个瞬间，那份从容碎了。\n\n{ta}突然把脸埋进你的肩窝，低低地骂了一句，手臂收得很紧，紧到你几乎喘不过气，像抓着唯一的浮木。你感觉到{ta}在抖。\n\n很久之后，{ta}才松开。\n\n凌晨四点，{ta}已经穿戴整齐，站在门口，袖扣也扣好了，又是那个无懈可击的{ta}。\n\n“规则第一条。”{ta}说，“我不过夜。”\n\n门关上之前，{ta}停了半秒。\n\n“……睡吧。”"},"m":{},"sc":{"dohyun":[2,5,"good"],"yul":[2,5,"good"],"yunhee":[2,5,"good"],"harin":[2,5,"good"]}},{"t":"同意，但说出你自己的规则","a":4,"h":8,"r":{"yunhee":"“你好认真喔……”{ta}笑了，然后用力点头，“好！我都答应！”{ta}抱住你，像抱住一个秘密。\n\n{ta}的手很暖，从你的背脊慢慢往下，每一下都带着小心翼翼的珍惜。黑暗里只剩彼此纠缠的呼吸。结束后，{ta}靠在你肩上很久，才依依不舍地起身。“遵守规则！”{ta}说，像在提醒自己。","dohyun":"“规矩真多。”{ta}说，嘴角却翘起来，“行，听你的。”\n\n{ta}的吻落在你锁骨上，声音含糊：“还有什么规则？现在说。”你说不出来了，{ta}就笑，笑得很得意。那一夜，{ta}嘴上不饶人，手上却温柔得不像话。天亮时{ta}走了，留下一条讯息：「规则我记住了。」","harin":"{ta}听着，眼眶慢慢红了：“谢谢你……还愿意定规则。”那代表你认真想过。\n\n{ta}牵着你的手走进卧室，像牵着一个约定。那一夜很安静，只有窗外的风，和{ta}贴在你耳边、轻得几乎听不见的呼吸声。{ta}一直握着你的手，到最后一刻才松开。","yul":"“很好。”{ta}说，像在谈合约，“我同意。”然后{ta}笑了，“谈判结束。”\n\n{ta}把你压进柔软的沙发里，吻从唇角一路往下。{ta}的动作很有掌控感，却一直看着你的眼睛，像在读你的每一个反应。那一夜你才知道，这个人连温柔都那么有效率。凌晨，{ta}准时离开。"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,8,"best"],"yul":[6,8,"best"],"yunhee":[6,8,"best"],"harin":[6,8,"best"]}},{"t":"犹豫地说你需要时间想一想","a":-3,"h":-1,"r":{"yunhee":"{ta}愣了一下，然后笑了，笑得很勉强：“嗯！我等你！”","dohyun":"“……行。”{ta}别开脸，“别让我等太久。”可是{ta}的语气很冷。","harin":"{ta}点点头，可是{ta}的手一直在发抖。","yul":"“合理。”{ta}说，“但我不喜欢等。”"},"m":{"harin":[2,0],"dohyun":[-2,0],"yunhee":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"拒绝：「我不想要这种关系」","a":-5,"h":-10,"e":"fail","r":{"yunhee":"{ta}的眼泪一下子掉下来，又马上擦掉：“对不起……是我太贪心了。”","dohyun":"“……行。”{ta}说，声音沙哑，“当我没说。”","harin":"{ta}低着头：“我知道。我本来就不该说的。”","yul":"“我尊重你。”{ta}说，“你是对的。”"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"庆功宴在一间包下来的餐厅。所有人都很开心，{ta}被敬了一杯又一杯，脸上一直挂着笑。\n\n可是你注意到，{ta}每隔一会儿就会往你这边看。不是那种朋友之间随意的一瞥，而是停留，然后移开，然后又看回来。\n\n你在角落坐了三个小时，喝了两杯酒，跟几个工作人员聊了天。快结束时，{ta}终于穿过人群走到你面前。\n\n“陪我走一段。”{ta}说，“我不想坐车。”\n\n你们从后门离开，走在凌晨的街道上。{ta}一路上都没说话，直到走到一栋小公寓门口，才停下来。\n\n“我在这里租了一间房。”{ta}说，“公司不知道。……要上来吗？”","after":{"dohyun":"那之后，你们的关系变成了一种很奇怪的样子。\n\n白天，{ta}还是会传讯息给你，问你吃了什么、今天累不累，跟以前一样。偶尔一起吃宵夜，{ta}还是会跟你抢最后一块肉。\n\n只是晚上，偶尔，{ta}会传来一句：「在家吗？」\n\n你从来没有拒绝过。\n\n有一次，你们在宵夜摊遇到{ta}的队友。队友们起哄，问你们是不是在交往。{ta}笑着说：“朋友啦。”\n\n那天晚上，{ta}来你家时，比平常更沉默。\n\n天亮前离开时，{ta}在门口站了很久，最后说：“刚才那样说，你没有不舒服吧？”\n\n“我们本来就是朋友。”\n\n{ta}看了你一眼：“……嗯。”","yul":"那之后，你们之间多了一份没有写下来的合约。\n\n{ta}很遵守规则。从不过夜，从不在外面跟你有任何亲密的举动，从不问你的私事。白天传讯息时，语气跟以前一模一样，好像那些夜晚从来没有发生过。\n\n你有时候会怀疑，是不是只有你一个人记得。\n\n直到有一天，你在{ta}的工作室等{ta}开会。你无意间看到{ta}桌上的行程表，每一周都有一两个晚上，被{ta}用笔画了一个小小的圈。\n\n那些晚上，都是{ta}来找你的日子。\n\n你什么都没说。可是那天晚上，{ta}来的时候，你多看了{ta}一会儿。\n\n“看什么？”\n\n“没什么。”","yunhee":"那之后，{ta}变得很小心。\n\n白天的讯息还是很多，还是一样的贴图、一样的「早安」、一样的「你吃什么！」。可是{ta}再也不会在讯息里说「想你」，连开玩笑都不说。\n\n只有在那些夜晚，{ta}会很黏人，会抱着你不放，会在你耳边说很多白天不敢说的话。\n\n然后天亮前，{ta}会自己起身，自己穿好衣服，自己离开。\n\n有一次，你醒来时{ta}还没走，坐在床边看着你。\n\n“你在看什么？”\n\n“看你睡觉。”{ta}说，“我好喜欢……”\n\n{ta}停住了。\n\n“喜欢什么？”\n\n“喜欢你家的床。”{ta}说，“很软！”","harin":"那之后，你们的见面变得很安静。\n\n{ta}总是在深夜来，敲两下门，你开门，{ta}进来。很少说话，好像所有的话都留给了那些触碰。\n\n天亮前，{ta}会离开。有时候会留下一张纸条，上面写着几句歌词，没有署名。\n\n你把那些纸条收在一个盒子里。一个月后，盒子里已经有十几张了。\n\n有一天，你把那些纸条按照日期排好，从头读到尾。\n\n你发现，那是一首完整的歌。\n\n一首关于一个人在深夜敲门、在天亮前离开、却一直想留下来的歌。"}},{"id":"w2","t":"只有房号的讯息","d":6,"tm":"晚上 23:40","p":"{name}在国外巡演。你刚好因为工作，也在同一个城市。\n\n你们没有约。规则说了，不在外面见面。\n\n可是晚上十一点四十分，你的手机亮了。只有一行字，和一个数字。","c":{"yunhee":"@msg 1207호… || 1207号房……\n@msg 보고 싶어서 ㅠ || 因为想见你呜","dohyun":"@msg 1207 || 1207。\n@msg 문 열어둠 || 门没锁。","harin":"@msg 1207 || 1207。\n@msg 오늘 무대, 당신 생각하면서 불렀어요 || 今天的舞台，我是想着你唱的。","yul":"@msg 1207. 10분 || 1207，十分钟。\n@msg 그래서? 올 거예요? || 所以呢？你会来吗？"},"o":[{"t":"什么都不回，直接去敲门","a":3,"h":10,"r":{"yunhee":"{ta}一开门就扑进你怀里，舞台妆还没卸干净，眼角的亮片蹭到你的脸上。\n\n“你真的来了……你真的来了！”{ta}把脸埋在你胸口，声音闷闷的，“我还以为你会已读不回！”\n\n你抱着{ta}，感觉到{ta}的心跳快得像刚跳完一整场。\n\n{ta}拉着你走进房间。行李箱摊在地上，舞台服挂在椅背上，到处都是{ta}的东西。{ta}把你推坐在床边，自己跪坐在你面前，仰头看你。\n\n“我好紧张喔。”{ta}说，手指一颗一颗解开你的扣子，指尖在抖，“明明不是第一次了……”\n\n解到最后一颗，{ta}停下来，抬头吻你。\n\n吻落下来的时候，{ta}一点都不紧张了。{ta}的手从你的肩膀滑到后背，把你拉向{ta}，两个人一起倒进柔软的被子里。\n\n{ta}很敏感。你的指尖沿着{ta}的腰线往上，{ta}就轻轻缩一下，笑出声，又贴得更近。你吻{ta}的颈侧，{ta}就仰起头，长发散开，呼吸一下子乱了。\n\n“不要……不要停……”{ta}小声说，然后又因为自己说了这句话而害羞得用手遮住脸。\n\n你拉开{ta}的手，看着{ta}的眼睛。{ta}的眼睛湿湿的，亮得像台上的灯。\n\n后来，{ta}咬着你的肩膀，闷闷地叫你的名字，一声比一声软。\n\n{ta}累得睡着了，一只手还抓着你的衣角。你轻轻起身，{ta}迷迷糊糊地睁开眼睛，又松开手。\n\n“……规则。”{ta}嘟囔着，“我知道。”\n\n你帮{ta}盖好被子，{ta}在半梦半醒间说：“明天……也想见你。”","dohyun":"门真的没锁。\n\n你推门进去，{ta}正坐在床边，只穿着一件松垮的T恤，头发乱糟糟的，手里转着手机。{ta}抬头看你，笑了。\n\n“我就知道你会来。”\n\n{ta}没有起身，只是朝你伸出手。你走过去，{ta}一把握住你的手腕，把你拉到腿上，额头抵着你的锁骨，深深吸了一口气，像在充电。\n\n“今天累死了。”{ta}闷闷地说，“跳了三场，膝盖快废了。”\n\n难得听{ta}喊累。你摸了摸{ta}的头发，{ta}就抬起头，眼神一下子变了。\n\n然后{ta}的吻就不客气了。\n\n舞台上那股张扬的劲儿全部倒进这个夜晚。{ta}翻身把你压进床里，膝盖抵在你身侧，T恤从头上扯掉，随手一扔。{ta}的手掌沿着你的背脊慢慢往下，所过之处都在发烫。\n\n“说你想我。”{ta}在你耳边说。\n\n你不说。{ta}就咬你的耳垂，一下，又一下。\n\n“说啊。”\n\n你终于说了。{ta}低低地笑，笑声又坏又得意，可是动作却突然温柔下来，温柔得让你措手不及。\n\n{ta}在你耳边说着坏话，声音哑得厉害，却在你每一次屏住呼吸时，放慢、再放慢，盯着你的脸，像要把你的每一个表情都记下来。\n\n最后，{ta}把你抱得很紧，紧到你听得见{ta}的心跳，又快又重。\n\n凌晨，{ta}靠在床头滑手机，你在穿衣服。\n\n“走了？”{ta}没抬头。\n\n你嗯了一声。\n\n{ta}的手指停在屏幕上，很久没动。\n\n“……到了传讯息。”","harin":"{ta}开门时，穿着宽大的浴袍，素着一张脸，雀斑在灯下很清楚。\n\n“你来了。”{ta}轻声说，像在确认一个梦。\n\n{ta}牵着你走到落地窗前。城市的灯火铺在脚下，远处有一条河，桥上的车灯像流动的星星。\n\n“我今天站在台上，”{ta}说，“唱到最后一首的时候，突然很想知道，你在哪一盏灯底下。”\n\n{ta}从背后抱住你，下巴搁在你肩上，很久都没说话，只是呼吸。你感觉到{ta}的心跳贴着你的背，一下，一下。\n\n然后{ta}的唇落在你的后颈，很轻，很烫。\n\n你转过身。{ta}看着你，眼睛里映着窗外的光。{ta}抬手，一颗一颗地解开你的扣子，动作慢得像在弹一首很难的曲子。\n\n“我写了一首歌，”{ta}说，“写你的手。”\n\n{ta}握起你的手，吻你的指尖，吻你的掌心，吻你的手腕。\n\n那一夜，{ta}好像变了一个人。不再害羞，不再犹豫，只是很专注、很缓慢地，用整个身体记住你。{ta}的手指像在琴键上一样，在你的皮肤上轻轻按下，停留，再移开。每一次触碰都像一个音符。\n\n你听见{ta}在你耳边哼着今天唱过的那首歌，断断续续，混在呼吸里，越来越乱，最后只剩下一声很轻很轻的、你的名字。\n\n后来，{ta}靠在你怀里，看着窗外的城市慢慢暗下去。\n\n“谢谢你来。”{ta}说。\n\n天亮前，{ta}帮你整理好衣领，像那天在拍摄现场你帮{ta}一样。{ta}的手指在你领口停了一下。\n\n“下次……”{ta}开口，又停住，笑了笑，“路上小心。”","yul":"你在第九分钟敲门。\n\n门开了。{ta}倚在门框上，衬衫扣子解了两颗，袖子卷到手肘，看了眼手表。\n\n“提前一分钟。”{ta}说，“你很急？”\n\n你还没回答，{ta}就把你拉进去，反手关门，把你困在门和{ta}之间。\n\n{ta}没有马上吻你，只是低头看着你，看得你全身发烫。\n\n“说。”{ta}说，“你为什么来。”\n\n“因为你叫我来。”\n\n“不对。”{ta}的拇指擦过你的下唇，“再说一次。”\n\n“……因为我想你。”\n\n{ta}的眼神暗了下来。然后，{ta}从你的眉心开始，一路慢慢地吻下来：眉心，鼻梁，嘴角，下巴，喉结。每一个吻都停留得刚刚好，让你想要更多。\n\n{ta}的手指很有耐心，一颗一颗解开你的扣子，像在拆一份等了很久的礼物。解完了，{ta}退后一步，就这样看着你，看得你忍不住想遮，{ta}却握住你的手腕，按在门上。\n\n“别遮。”{ta}说，“我想看。”\n\n整个夜晚都在{ta}的节奏里，忽快忽慢，时而强势得让你喘不过气，时而又温柔得让你想哭。{ta}一直在你耳边说话，低沉的声音钻进你的骨头里，问你、逼你、哄你。\n\n直到最后，{ta}的从容终于崩塌。{ta}额头抵着你，闭着眼睛，低低地喘，喘得像刚跑完一场很长的路。\n\n“……该死。”{ta}说，声音哑得不像{ta}。\n\n清晨，{ta}已经穿好西装，打好领带，帮你叫了早餐送到房间。\n\n“我先走。”{ta}说，“房间续到中午。”\n\n{ta}走到门口，又折回来，弯腰在你的额头上，落下一个很轻的吻。\n\n“这不在规则里。”{ta}说，“当作没发生。”"},"m":{"dohyun":[1,0],"yul":[1,0]},"sc":{"dohyun":[6,10,"best"],"yul":[6,10,"best"],"yunhee":[2,5,"good"],"harin":[2,5,"good"]}},{"t":"回讯息问{ta}今天的舞台累不累","a":4,"h":6,"r":{"yunhee":"「好累喔……」{ta}传来一张瘫在床上的照片，「所以你快来充电！」你去了，{ta}抱着你撒娇了好久，才在你怀里慢慢变得滚烫。","dohyun":"「不累。」{ta}回，「来了就知道。」你去了，{ta}确实一点都不累。","harin":"「有点。」{ta}说，「可是想到你在同一个城市，就睡不着。」你去了。{ta}一整夜都牵着你的手，连亲吻的时候都没放开。","yul":"「问这个？」{ta}回，「累。所以你来。」你到的时候，{ta}已经泡好了茶，等你喝完，才把你拉进怀里。"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,3,"good"],"yul":[2,3,"good"],"yunhee":[6,6,"best"],"harin":[6,7,"best"]}},{"t":"回：「规则说不在外面见」","a":2,"h":0,"r":{"yunhee":"「呜……你好坏。」{ta}说，然后就安静了。","dohyun":"「规则是你定的？」{ta}回，「……行，你赢了。」之后一整个巡演都没再传讯息。","harin":"「对。」{ta}说，「你是对的。我不该传的。」","yul":"「对。」{ta}说，「我测试一下你。」然后就没有下文了。"},"m":{"dohyun":[-3,0],"yunhee":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"已读不回","a":-3,"h":-2,"r":{"yunhee":"凌晨两点，{ta}传来一则：「我是不是很烦……」之后就没再传了。","dohyun":"隔天{ta}传：「昨天手滑。」语气冷得像陌生人。","harin":"{ta}没有再传讯息。三天后才说：「那天，是我不好。」语气很疏远。","yul":"{ta}没有再提这件事。回国后，{ta}有一个月没来找你。"},"m":{"harin":[-2,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你出差的城市跟{name}巡演的城市刚好是同一个，这是你订机票后才发现的。你没有告诉{ta}。规则说了，不在外面见面。\n\n可是你还是去看了{ta}的演唱会。买的是最后一排的票，戴着帽子，坐在一万多个陌生人中间。\n\n{ta}在台上发着光，唱着你听过无数次的歌。你看着{ta}，突然觉得那个在你床上睡着、在天亮前离开的人，好像是另一个人。\n\n演唱会结束后，你回到饭店。洗完澡，准备睡觉。\n\n然后手机亮了。","after":{"dohyun":"回到首尔后，你们谁都没有提那个晚上。\n\n可是你发现，{ta}开始在一些小地方变了。\n\n{ta}会在你说要出差时，问你去哪个城市。会在你生病时，传来一大堆药的照片，问你要哪一种。会在你跟同事聚餐时，传一句「几点回家」，然后又马上收回。\n\n有一次，你说：“你最近好像管很多。”\n\n{ta}愣了一下，然后笑了：“有吗？”\n\n“有。”\n\n{ta}看着你，过了很久才说：“那你讨厌吗？”\n\n你没有回答。\n\n{ta}也没有追问。可是那天晚上，{ta}离开时，在门口多停了一分钟。","yul":"回到首尔后，{ta}送了你一样东西。一个很精致的小盒子，里面是一张那个城市的明信片，背面写着日期和房号。\n\n“纪念品。”{ta}说。\n\n“规则说，不在外面见面。”你说。\n\n“我知道。”{ta}说，“所以那天不算。那天是在国外。”\n\n你笑出声：“你这是在钻漏洞。”\n\n“我很擅长钻漏洞。”{ta}说，然后停了一下，“可是我开始觉得，我们的规则……漏洞越来越多了。”\n\n{ta}说完就转移了话题。可是那张明信片，你一直放在床头。","yunhee":"回到首尔后，{ta}传了一张照片给你。是那个饭店房间的窗外，城市的夜景。\n\n@msg 이 사진 배경화면으로 했어 || 我把这张照片设成桌布了。\n@msg 아무도 모르는 우리 비밀 || 没有人知道的，我们的秘密。\n\n你看着那张照片，想起那天晚上{ta}睡着时抓着你衣角的样子。\n\n后来，{ta}的巡演又去了好几个城市。每到一个城市，{ta}都会传一张饭店窗外的照片给你，什么话都不说。\n\n你把那些照片存在一个相簿里。\n\n相簿的名字，你想了很久，最后什么都没写。","harin":"回到首尔后，{ta}发表了一首新歌，歌名是那个城市的名字。\n\n歌词写的是一个陌生的饭店房间、一扇落地窗、一个从背后拥抱的人。没有人知道那是什么意思，粉丝们以为是{ta}去旅行的回忆。\n\n只有你知道。\n\n那天晚上，{ta}来你家。进门时，{ta}没有像平常那样马上抱住你，而是站在门口，看着你。\n\n“那首歌，”{ta}说，“你听了吗？”\n\n“听了。”\n\n“会不会……太明显了？”\n\n你看着{ta}紧张的样子，突然很想笑，也很想哭。\n\n“不会。”你说，“只有我听得懂。”"}},{"id":"w3","t":"雨夜，不想一个人","d":5,"tm":"深夜 00:30","p":"那天新闻出了一则关于{name}所属公司的负面报导。\n\n深夜十二点半，你听见敲门声。你从猫眼看出去，{name}站在门外，没撑伞，全身湿透。\n\n“我……”{ta}开口，声音沙哑，“我不想一个人。”\n\n你让{ta}进来，拿毛巾给{ta}。{ta}站在你的客厅里，水滴落在地板上。","c":{"yunhee":"{ta}一直在笑，笑得很勉强：“我没事喔！只是……想看看你。”然后眼泪就掉下来了。","dohyun":"{ta}靠着门，低着头：“别问。今天别问我任何事。”","harin":"{ta}什么都没说，只是走过来，把额头靠在你的肩上，很久很久。","yul":"{ta}的语气很平静：“新闻你看了吧。”停了停，“我今晚……不想思考。”"},"o":[{"t":"什么都不问，只是抱住{ta}","a":5,"h":8,"r":{"yunhee":"你抱住{ta}的那一刻，{ta}再也撑不住了。\n\n{ta}在你怀里哭得像个孩子，哭得全身发抖，哭得说不出话。你只是抱着{ta}，一下一下地拍着{ta}湿透的背，什么都没问。\n\n哭了很久，{ta}终于安静下来，抬起头。{ta}的眼睛肿了，睫毛上还挂着泪，鼻尖红红的。\n\n“我是不是很丑……”{ta}问。\n\n你吻掉{ta}眼角的泪。\n\n{ta}愣住了。然后，{ta}踮起脚，红着眼睛吻你，吻得很用力，像要把所有的委屈都交给你。那个吻是咸的，带着眼泪的味道。\n\n你帮{ta}脱掉湿透的卫衣，用毛巾包住{ta}。{ta}缩在毛巾里发抖，你就抱着{ta}，用自己的体温暖{ta}。\n\n“好暖……”{ta}小声说，往你怀里钻。\n\n那一夜{ta}一直很黏人，手指缠着你的手指不肯放。每一次亲吻都带着一点泪水的咸味，每一次触碰都像在说「不要放开我」。\n\n你吻{ta}的额头，吻{ta}哭红的眼睛，吻{ta}颤抖的嘴唇。{ta}就小声地说谢谢，说了好多次，说到后来变成了你的名字。\n\n{ta}的手抓着你的背，越抓越紧。在某个瞬间，{ta}把脸埋在你的肩上，又哭了，可是这次，{ta}在笑。\n\n天快亮的时候，{ta}坐起来，看着窗外。\n\n“雨停了。”{ta}说。\n\n{ta}穿好衣服，在门口回头看你，努力笑得跟平常一样灿烂。\n\n“下次……我不会这样了。”{ta}说，“我会变回开心的车允熙。”\n\n门关上后，你听见{ta}在走廊上，很小声地吸了吸鼻子。","dohyun":"{ta}没有推开你。\n\n你感觉到{ta}的肩膀在抖。很轻，很压抑，像在拼命忍着什么。\n\n过了很久，{ta}低声说：“……谢了。”\n\n声音哑得不像{ta}。\n\n你想看{ta}的脸，{ta}却把你按在怀里，不让你看。\n\n“别看。”{ta}说，“现在别看我。”\n\n你们就这样站在玄关，雨水从{ta}的头发滴下来，滴进你的衣领。\n\n然后{ta}吻你。吻得很凶，像在发泄什么，像要把今天所有的愤怒和委屈都撞进这个吻里。{ta}把你推到墙上，手掌撑在你耳侧，呼吸又重又乱。\n\n你没有躲。你只是伸手，轻轻抚过{ta}湿透的后颈。\n\n{ta}突然安静下来了。\n\n{ta}停下动作，额头抵着你的额头，闭着眼睛，喘着气。\n\n“……对不起。”{ta}说，“我不是……”\n\n“我知道。”\n\n那一夜{ta}什么话都没说。没有坏话，没有挑衅，什么都没有。所有的情绪都落在{ta}的指尖和呼吸里，时而急切，时而又温柔得让你心疼。{ta}一直看着你，好像怕一闭眼你就会消失。\n\n结束后，{ta}背对着你躺着。你从后面抱住{ta}，{ta}僵了一下，然后握住了你环在{ta}腰上的手。\n\n你感觉到有温热的东西，滴在你的手背上。\n\n天亮前，{ta}穿好衣服，站在门口很久很久。\n\n“我走了。”{ta}说，“……别对我太好。”\n\n{ta}顿了一下，没有回头。\n\n“我会习惯的。”","harin":"你抱住{ta}的那一刻，{ta}终于哭出声来。\n\n很小声，像怕吵醒谁。{ta}的手指紧紧抓着你的衣服，抓得指节都发白了。\n\n你什么都没说，只是抱着{ta}，让{ta}哭。\n\n不知道过了多久，{ta}的哭声慢慢停了。{ta}抬起头，看着你，眼睛里全是水光。\n\n“我好累。”{ta}说，“当{name}，好累。”\n\n你捧住{ta}的脸，用拇指擦掉{ta}的眼泪。\n\n{ta}看着你，然后很轻、很轻地吻了你。那个吻带着眼泪，咸咸的，轻得像羽毛落下来。\n\n你帮{ta}脱掉湿透的针织开衫。{ta}的皮肤冰凉，你就用掌心一点一点地捂热，从肩膀，到手臂，到指尖。{ta}看着你做这些，眼泪又掉了下来。\n\n“你对我太好了。”{ta}说。\n\n那一夜{ta}像一个溺水的人，紧紧抓着你。每一次触碰都很慢，很小心，像怕弄碎什么。{ta}的手在你的背上轻轻地划，像在写字，你猜不出{ta}写的是什么。\n\n每一次触碰都像在说「不要走」，可是{ta}一句都没有说出口。\n\n在最深的时候，{ta}把脸埋在你的颈窝，很小声地说了一句什么。雨声太大，你没听清。\n\n后来你问{ta}说了什么，{ta}只是摇头。\n\n天还没亮，{ta}就醒了，坐在床边，看着你睡觉的样子，看了很久很久。\n\n你醒来时，{ta}已经穿好衣服了。\n\n“对不起。”{ta}说，“我违反了规则。”\n\n{ta}走到门口，又停下来。\n\n“刚才那句话，”{ta}背对着你说，“……是一句歌词。还没写完。”","yul":"{ta}在你怀里沉默了很久。\n\n你感觉到{ta}的身体很僵硬，像一张拉得太紧的弓。\n\n然后，你听见{ta}很轻地说：“……就一下。”\n\n{ta}把头靠在你的肩上，第一次，把全身的重量交给你。\n\n你们就这样站着，很久很久。窗外的雨下得很大。\n\n“新闻是假的。”{ta}突然说，“但没有人会在乎真假。”\n\n你没有说话，只是收紧了手臂。\n\n{ta}抬起头，看着你。那双永远冷静、永远算计好一切的眼睛，此刻看起来很疲惫，很茫然。\n\n“今晚，”{ta}说，“你来决定。”\n\n那一夜，{ta}第一次没有掌控节奏。\n\n{ta}让你主导，让你决定，只是闭着眼睛，任由自己沉下去。你解开{ta}湿透的衬衫，{ta}没有动；你吻{ta}的眼睛，{ta}的睫毛在你唇下轻轻颤抖。\n\n你第一次看见{ta}那么脆弱的样子。眉头紧皱，抓着床单的手指泛白，咬着牙，却还是有破碎的声音从喉咙里漏出来。\n\n“{me}……”{ta}叫你的名字，像在抓一根救命的绳子。\n\n你握住{ta}的手，十指相扣。\n\n{ta}突然睁开眼睛，看着你，眼眶红了。\n\n后来，{ta}一直没有放开你的手，直到睡着。\n\n凌晨，{ta}起身穿衣服，背对着你，一颗一颗扣好扣子。\n\n“今晚的事，”{ta}说，“不要放在心上。”\n\n你知道{ta}在说谎。\n\n因为{ta}扣完最后一颗扣子后，站在那里很久，才说出下一句：\n\n“……谢谢你没问。”"},"m":{"harin":[2,1],"yul":[2,1]},"sc":{"dohyun":[6,8,"best"],"yul":[6,9,"best"],"yunhee":[6,8,"best"],"harin":[6,9,"best"]}},{"t":"让{ta}先去洗个热水澡，煮杯热茶","a":4,"h":4,"r":{"yunhee":"{ta}捧着热茶，眼泪掉进杯子里。“你好好喔……”{ta}说，然后抱住你。那一夜你们只是相拥着，{ta}在你怀里慢慢睡着，天亮前才离开。","dohyun":"“你当我是小孩喔？”{ta}说，还是乖乖去洗了。出来时，{ta}靠在厨房门口看你煮茶，看了很久，然后从背后抱住你，下巴搁在你肩上。","harin":"{ta}洗完澡，坐在你的地毯上，捧着茶杯，终于不再发抖。“谢谢你。”{ta}说，“你让我觉得，我还是一个人，不只是偶像。”","yul":"“你很冷静。”{ta}说，接过毛巾，“这是我需要的。”{ta}洗完澡出来，坐在你旁边，讲了整整一个小时公司的事。说完，{ta}才真的放松下来。"},"m":{"yul":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[2,2,"good"],"harin":[2,2,"good"]}},{"t":"提醒{ta}：「我们说好的，只是炮友」","a":-3,"h":-1,"r":{"yunhee":"{ta}愣住，然后笑了，笑得比哭还难看：“对喔。我忘了。”{ta}湿着头发离开，没有带伞。","dohyun":"“我知道。”{ta}冷笑一声，“我是来做的，不是来谈心的。”{ta}什么都没做就走了，门摔得很响。","harin":"{ta}低下头：“对不起。我不该来。”{ta}走的时候，雨下得更大了。","yul":"“我知道。”{ta}说，“所以我没说别的。”{ta}转身离开，再也没在下雨天来过。"},"m":{"harin":[-5,0],"yunhee":[-4,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"劝{ta}回去休息，说今天不适合","a":1,"h":0,"r":{"yunhee":"“嗯……”{ta}点头，眼眶红红的，“那我回去了。”","dohyun":"“行。”{ta}说，转身就走，背影有点落寞。之后一个星期，{ta}都没来。","harin":"{ta}点点头，好像早就知道会这样。","yul":"“理智。”{ta}说，“你比我清醒。”说完就走进雨里。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那天的新闻你也看到了。标题写得很难听，说{name}所属的公司涉嫌不正当竞争，还暗示{ta}的一位一是买来的。\n\n评论区一片骂声。你看了几条就关掉了，心里很不舒服。\n\n你想传讯息给{ta}，打了又删，删了又打。最后什么都没传。规则说了，不问私事。\n\n你以为{ta}今晚不会来。\n\n窗外下起了大雨。你关了灯，躺在床上，听着雨声，怎么都睡不着。\n\n凌晨十二点半，有人敲门。","after":{"dohyun":"那件事过了一个星期才平息。公司发了声明，证据很充分，舆论慢慢转向。\n\n那一个星期里，{ta}每天都来。不是为了那件事。只是坐在你的沙发上，打游戏、吃东西、发呆。\n\n有一天，{ta}在你的沙发上睡着了。你给{ta}盖了一条毯子。\n\n{ta}醒来时，已经是早上了。\n\n“我……”{ta}看着窗外的阳光，愣住了，“我睡着了？”\n\n“嗯。”\n\n“违反规则了。”\n\n“我知道。”\n\n{ta}看着你，很久都没说话。最后，{ta}只说了一句：\n\n“你家的沙发，比我的床好睡。”","yul":"那件事后来被{ta}处理得很漂亮。律师函、证据、澄清声明，一步一步，冷静得可怕。\n\n可是你知道，{ta}并不像外表那么冷静。\n\n因为那一个星期里，{ta}每天晚上都来。不是为了做什么，只是坐在你身边，看着你做自己的事。\n\n有一天，你问{ta}：“你还好吗？”\n\n{ta}想了很久：“不太好。但在这里，好一点。”\n\n“为什么？”\n\n“因为在这里，”{ta}说，“没有人需要我当姜律。”\n\n{ta}说完，把头靠在你肩上，闭上眼睛。\n\n那是你第一次看见{ta}在你面前睡着。","yunhee":"那件事之后，{ta}变得有点不一样。\n\n白天在镜头前，{ta}还是一样地笑、一样地活泼。可是晚上来你家时，{ta}会安静很多。\n\n有时候{ta}会窝在你的沙发上，抱着膝盖，什么都不说。你就坐在旁边，陪着{ta}。\n\n有一次，{ta}突然开口：“你知道吗，我好怕。”\n\n“怕什么？”\n\n“怕大家发现，我其实没有那么开心。”{ta}说，“大家喜欢的是那个永远在笑的车允熙。”\n\n你握住{ta}的手：“我喜欢的，是会哭的车允熙。”\n\n{ta}愣住了。然后{ta}笑了，笑着笑着，又哭了。\n\n你们都知道，那句话越过了某条线。可是谁都没有提。","harin":"那件事后来平息了。可是{ta}变了。\n\n{ta}开始在你家留下一些东西：一支牙刷、一件针织开衫、一本写到一半的歌词本。每一样都很小，小到可以假装不存在。\n\n你没有说什么。你只是在{ta}的牙刷旁边，多放了一个杯子。\n\n有一天，{ta}来的时候，看到那个杯子，愣住了。\n\n“这是……”\n\n“给你的。”\n\n{ta}看着那个杯子，看了很久，眼眶慢慢红了。\n\n“我们说好的，”{ta}小声说，“不能这样的。”\n\n“我知道。”\n\n{ta}没有再说话。可是那天晚上离开时，{ta}没有带走那支牙刷。"}},{"id":"w4","t":"别人的香水味","d":6,"tm":"晚上 22:00","p":"那天你跟同事去聚餐，回家前被一个喝醉的同事抱了一下，衣服上沾了陌生的香水味。\n\n晚上十点，{name}来了。规则之内的那种来。\n\n{ta}一进门，就停住了。{ta}站在你面前，闻到了那股不属于你的味道。","c":{"yunhee":"{ta}的笑容僵了一秒，然后又笑了：“喔～今天很开心喔？”可是{ta}没有像平常那样扑过来。","dohyun":"{ta}的眼神一下子冷了下来：“这是谁的味道？”说完，{ta}又别开脸，“……算了，不关我的事。”","harin":"{ta}站在原地，手指慢慢握紧。“没关系。”{ta}说，“我们说好不问的。”","yul":"{ta}挑了挑眉：“新香水？不适合你。”语气平淡，可是{ta}站得离你远了一步。"},"o":[{"t":"主动解释是同事喝醉抱了一下","a":4,"h":3,"r":{"yunhee":"“喔！这样喔！”{ta}一下子又亮起来，然后又低下头，“我、我才没有在意喔。”","dohyun":"“我又没问。”{ta}说，却一把把你拉过来，把脸埋在你颈边，像要把那股味道盖掉。","harin":"{ta}点点头：“嗯。”过了一会儿，{ta}小声说：“我刚刚，有一点难过。我不该难过的。”","yul":"“我没问。”{ta}说，“但……谢谢你说。”{ta}的语气软了下来。"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,3,"best"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"反问：「你是在吃醋吗？」","a":3,"h":5,"r":{"yunhee":"“才没有！”{ta}大声否认，然后又小声说，“……一点点而已啦。”","dohyun":"“吃醋？”{ta}冷笑，然后把你压在墙上，“我是在确认，你记不记得谁才是今晚的人。”","harin":"{ta}看着你，眼睛里有东西在挣扎：“如果我说是……我们是不是就完了？”","yul":"“你希望我吃醋？”{ta}低头看你，“小心你问的问题。”"},"m":{"dohyun":[2,2],"yul":[1,2]},"sc":{"dohyun":[6,7,"best"],"yul":[2,4,"good"],"yunhee":[2,3,"good"],"harin":[2,3,"good"]}},{"t":"不解释：「规则说不问私事」","a":-3,"h":-1,"r":{"yunhee":"“对喔……”{ta}的声音低了下来。那一夜，{ta}好安静，安静得让你害怕。","dohyun":"“行。”{ta}说，“规则。”那一夜，{ta}的动作很凶，眼神却很难过。天还没亮就走了。","harin":"{ta}点点头，那天晚上什么都没做，只是坐了一下就走了。之后两个星期没有来。","yul":"“好。”{ta}说，“你很遵守规则。”之后{ta}来的次数，明显少了。"},"m":{"harin":[-5,0],"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"先去洗澡，把味道洗掉","a":2,"h":4,"r":{"yunhee":"你洗完出来，{ta}已经在沙发上睡着了。可是你知道{ta}是装的。","dohyun":"你洗完出来，{ta}已经走了。桌上留着一张纸条：「下次别让我闻到。」","harin":"你洗完出来，{ta}坐在沙发上，一动不动。“我还是闻得到。”{ta}说。","yul":"你洗完出来，{ta}正在看手表：“我还有事。”{ta}走了。"},"m":{"dohyun":[1,2]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那天的聚餐是部门的年末聚会，大家都喝了不少。散场时，一个平常很照顾你的同事喝醉了，抱着你哭，说工作压力太大。你拍着{ta}的背安慰了很久，等{ta}的家人来接。\n\n回家的路上，你闻到自己衣服上的香水味，有点浓，不是你的。\n\n你没有多想。洗个澡就好了。\n\n可是你还没来得及洗，门铃就响了。\n\n规则之内的那种来。你看了眼时间，晚上十点。比平常早。","after":{"dohyun":"那天之后，{ta}开始在你身上留下一些东西。\n\n一件{ta}的卫衣，「借你穿」；一瓶{ta}常用的香水，「这个味道比较适合你」；一条项链，「刚好多一条」。\n\n你知道{ta}在做什么。{ta}在你身上留下{ta}的味道。\n\n你没有拒绝。\n\n有一天，你穿着{ta}的卫衣去上班，同事问你：“男朋友的？”\n\n你说：“朋友的。”\n\n那天晚上，你把这件事告诉{ta}。{ta}听完，沉默了很久。\n\n“朋友的。”{ta}重复了一次，然后笑了，笑得有点难看，“对，朋友的。”","yul":"那天之后，{ta}什么都没说。可是你发现，{ta}开始在一些地方「不小心」出现。\n\n你部门的聚餐，{ta}「刚好」在隔壁包厢跟人谈事情。你跟朋友去酒吧，{ta}「刚好」也在那里。\n\n每一次，{ta}都只是远远地点个头，不跟你说话，也不靠近。\n\n第三次的时候，你终于忍不住，走到{ta}面前：“你在跟踪我？”\n\n“没有。”{ta}说，“我只是刚好在这里。”\n\n“第三次刚好？”\n\n{ta}看着你，沉默了很久。\n\n“我知道这不对。”{ta}说，“我只是……想确认你是安全的。”","yunhee":"那天之后，{ta}变得有点奇怪。\n\n讯息还是一样多，可是{ta}开始问一些以前不会问的问题。今天跟谁吃饭、几点回家、那个同事是什么样的人。\n\n每一次问完，{ta}都会马上补一句：「我只是好奇！」\n\n有一次，你开玩笑说：「你在吃醋吗？」\n\n{ta}隔了很久才回：\n\n@msg 아니거든!! || 才没有！！\n@msg …조금 || ……一点点。\n@msg 근데 이러면 안 되는 거 알아 || 可是我知道不能这样。\n@msg 우리 규칙… 내가 먼저 어기고 있는 것 같아 || 我们的规则……好像是我先打破的。","harin":"那天之后，{ta}来的次数变少了。\n\n不是不来，只是间隔变长了。以前一个星期一两次，现在两个星期一次。\n\n你传讯息问{ta}是不是很忙，{ta}只回了一句：「有点。」\n\n一个月后，{ta}终于来了。进门后，{ta}没有像平常那样马上靠近你，而是坐在沙发上，看着你。\n\n“我这一个月，”{ta}说，“一直在想那天的事。”\n\n“那天的事？”\n\n“那个香水味。”{ta}说，“我发现我很在意。在意到写不出歌。”\n\n{ta}看着你，眼睛里有一种你没见过的东西：“这样的我，还可以继续当你的……炮友吗？”"}},{"id":"w5","t":"意外的早晨","d":7,"tm":"早上 08:20","p":"你醒来的时候，阳光已经照进房间了。\n\n身边有人。\n\n{name}还在睡。昨晚太累，{ta}说只闭眼五分钟，结果就这样睡到了天亮。这是你们第一次，一起迎来早晨。\n\n你看着{ta}的睡脸。没有舞台妆，没有偶像的光环，只是一个睡得很沉的人。\n\n然后，{ta}醒了。{ta}看着你，愣了好几秒。","c":{"yunhee":"{ta}眨了眨眼，然后整个人钻进被子里：“啊啊啊！我睡着了！对不起！”声音闷闷的，却没有要起来的意思。","dohyun":"{ta}眯着眼看你，声音还带着刚醒的沙哑：“……几点了？”然后，{ta}伸手把你捞回怀里，“再睡一下。”","harin":"{ta}看着你，眼睛慢慢湿了：“我好久……没有醒来时身边有人了。”","yul":"{ta}睁开眼，很冷静地看着天花板：“我破例了。”然后转头看你，“这不在计划里。”"},"o":[{"t":"说没关系，留{ta}一起吃早餐","a":5,"h":3,"r":{"yunhee":"{ta}穿着你的衣服坐在餐桌前，晃着脚吃吐司，一直傻笑。吃完了，{ta}突然安静下来：“我好想每天都这样喔。”说完，{ta}自己愣住了。","dohyun":"{ta}靠在厨房门口看你做早餐，难得地没有说坏话。吃完后，{ta}洗了碗。“别习惯。”{ta}说，“我只是今天心情好。”可是{ta}的耳朵是红的。","harin":"你们一起吃了早餐，{ta}一直看着你，好像要把这个画面记下来。“谢谢你。”{ta}说，“这是我这几年，最好的一个早晨。”","yul":"{ta}没有拒绝，甚至亲自下厨，做了一桌你没见过的菜。吃饭时，{ta}一直没说话。最后，{ta}放下筷子：“我们的规则，是不是该重新谈了？”"},"m":{"yul":[2,1],"harin":[2,1]},"sc":{"dohyun":[6,3,"best"],"yul":[6,4,"best"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"趁{ta}还在，懒懒地再赖一下床","a":3,"h":6,"r":{"yunhee":"{ta}钻进你怀里，蹭了蹭：“再五分钟就好……”结果又是一个小时。","dohyun":"{ta}没让你多说，翻身把你压在床上。晨光里，{ta}的吻带着慵懒的温度，慢得像要把整个早晨都耗尽。","harin":"{ta}靠在你肩上，可是你一直在看手机。{ta}慢慢坐起来，安静地穿好衣服。","yul":"“五分钟。”{ta}说，然后真的五分钟就起来了。那天之后，{ta}再也没睡着过。"},"m":{"dohyun":[2,2],"yunhee":[2,1]},"sc":{"dohyun":[2,4,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,4,"good"],"harin":[-4,-1,"bad"]}},{"t":"提醒{ta}该走了，免得被看到","a":-3,"h":-1,"r":{"yunhee":"“嗯……”{ta}有点失落地起身，“那我走了。”{ta}连早餐都没吃。","dohyun":"“行。”{ta}起身，背对着你穿衣服，一句话都没说就走了。","harin":"{ta}点点头，安静地离开了。之后，{ta}再也没有在你家睡着过。","yul":"“对。”{ta}说，“你比我清醒。”{ta}走的时候，没有回头。"},"m":{"harin":[-3,0],"yunhee":[-3,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"开玩笑说：「看来规则要改了」","a":4,"h":4,"r":{"yunhee":"“真的可以改吗？”{ta}问，你却笑着说开玩笑的。{ta}的眼神暗了下去。","dohyun":"“改什么？”{ta}说，“想太多。”{ta}起身穿衣服，动作很快。","harin":"{ta}安静了很久：“如果改了，我们会变成什么？”","yul":"“我正想说。”{ta}说，“你先说出来了。”"},"m":{"yul":[2,1]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,3,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,2,"good"]}}],"x":"昨天{ta}来得很晚，快一点才到。你们都累了，{ta}说只闭眼五分钟就走。\n\n你也说只闭眼五分钟。\n\n然后，就天亮了。\n\n阳光从窗帘的缝隙照进来，落在你的脸上。你睁开眼睛，第一个看见的，是{ta}的睡脸。\n\n你从来没有在早上看过{ta}。{ta}总是在天亮前离开，你醒来时，床的另一边总是空的，只剩下一点点余温。\n\n现在{ta}就在那里。睡得很沉，呼吸很慢，睫毛在阳光下几乎是透明的。","after":{"dohyun":"那天早上，{ta}最后还是走了。走之前，{ta}站在门口，看着你，看了很久。\n\n“今天，”{ta}说，“是我出道以来最好的一个早上。”\n\n“为什么？”\n\n“因为醒来的时候，不用马上想今天的行程。”{ta}说，“只想着……你还在。”\n\n{ta}说完，好像觉得自己说太多了，转身就走。\n\n那天晚上，{ta}传来一则讯息：\n\n@msg 아침밥 맛있었어 || 早餐很好吃。\n@msg 또 먹고 싶다 || 还想再吃。\n@msg 매일 || 每天。\n\n你看着最后那两个字，很久都没回。","yul":"那天早上之后，{ta}约你出去吃饭。\n\n不是深夜，不是路边摊，是一家需要提前一个月订位的餐厅。{ta}穿着西装，你穿着你最好的衣服。\n\n吃饭时，{ta}一直很安静。直到甜点上来，{ta}才放下叉子，看着你：\n\n“我们重新谈规则吧。”\n\n“谈什么？”\n\n“第一条，不过夜。”{ta}说，“我想删掉。”\n\n你看着{ta}。\n\n“第二条，不在外面见面。”{ta}说，“今天已经违反了。”\n\n“第三条呢？”\n\n{ta}沉默了很久：“第三条，不问私事。我想问你一件事。”\n\n“什么事？”\n\n“你……”{ta}停住了，“算了。等我想清楚，再问你。”","yunhee":"那天早上，{ta}在你家待到中午。\n\n你们一起吃了早餐，一起洗了碗，一起窝在沙发上看了一部老电影。{ta}靠在你肩上，看到一半就睡着了。\n\n醒来时，{ta}看着窗外的阳光，突然很安静。\n\n“这样好好喔。”{ta}说，“好像……真的在交往一样。”\n\n你没有说话。\n\n{ta}也没有再说下去，只是把脸埋在你肩上，很久很久。\n\n离开前，{ta}在门口转身，看着你：\n\n“如果，”{ta}说，“如果有一天，我说我不想只是这样了，你会怎么办？”\n\n你还没回答，{ta}就跑走了。","harin":"那天早上之后，{ta}开始在你家过夜。\n\n不是每一次，偶尔。{ta}会在离开前犹豫，然后问你：「今天……可以留下来吗？」\n\n你从来没有说过不。\n\n有一天早上，你醒来时，{ta}已经起床了，坐在你的书桌前写东西。阳光照在{ta}的背上，{ta}写得很专注。\n\n你走过去，从背后看。{ta}在写一首歌，歌名是：〈早安〉。\n\n{ta}发现你在看，没有遮，反而把歌词本推给你。\n\n最后一句写着：「我们是不是，已经不只是那样了。」\n\n{ta}看着你：“这句，我不知道要怎么唱。”"}}],"love":[{"id":"l1","t":"后台的坦白","d":6,"tm":"晚上 22:30","p":"年末颁奖典礼的后台。{name}拿了奖，下台后在走廊找到你。\n\n所有人都在庆祝，只有你们站在安全出口的楼梯间，绿色的灯光照在{ta}脸上。\n\n“我不想再这样了。”{ta}说。\n\n你的心沉了一下。\n\n“我不想只是……那样。”{ta}看着你，“我想要更多。我想在得奖的时候，第一个告诉你。我想在早上醒来的时候，你还在。我想……我们不要再有那些规则了。”","c":{"yunhee":"{ta}的眼泪掉下来，却在笑：“我喜欢你！好喜欢好喜欢！我受不了了！”","dohyun":"{ta}别开脸，又转回来，看着你的眼睛：“我输了。我喜欢你。……你满意了吧？”","harin":"{ta}的声音在抖：“我写了好多首歌，都是给你的。这一次，我想亲口说。……我喜欢你。”","yul":"{ta}说得很直接，却比平常慢：“我从来没对任何人说过这句话。我喜欢你。你要不要跟我在一起？”"},"o":[{"t":"说「我也是」，抱住{ta}","a":8,"h":4,"r":{"yunhee":"{ta}哭得更凶了，在你怀里跳了好几下：“真的吗！真的吗！你不能反悔喔！”","dohyun":"{ta}愣住，然后笑了，笑得像个孩子：“……你早说啊。”然后{ta}吻了你，在那个绿色灯光的楼梯间。","harin":"{ta}在你怀里哭了很久，然后抬起头，轻轻吻了你：“这是我们第一次，不是秘密地亲吻。”","yul":"{ta}闭上眼睛，长长地吐了一口气：“好。”{ta}说，声音哑了，“我们在一起。”"},"m":{},"sc":{"dohyun":[2,2,"good"],"yul":[6,4,"best"],"yunhee":[6,4,"best"],"harin":[6,4,"best"]}},{"t":"问{ta}：「那公司和粉丝呢？」","a":5,"h":0,"r":{"yunhee":"“我不知道……”{ta}的眼泪又掉下来，“你为什么第一个想到的是这个？”","dohyun":"“管他的。”{ta}说，可是{ta}的眼神有点受伤，“你第一个想到的，是这个？”","harin":"“我很害怕。”{ta}老实说，“你问这个，我更害怕了。”","yul":"“我已经准备好了。”{ta}说，“我以为你也是。”"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吻{ta}，当作回答","a":7,"h":6,"r":{"yunhee":"{ta}的眼泪滑进你们的吻里，咸咸的。{ta}抱着你，笑得喘不过气。","dohyun":"{ta}低笑一声，把你按在墙上，吻得又凶又温柔：“这是你说的。不准反悔。”","harin":"{ta}的手在抖，却紧紧抓住你的衣服，像终于抓住了什么。","yul":"{ta}的从容第一次彻底崩塌。{ta}把你抱得很紧，在你唇边低声说：“我等这一刻，等了很久。”"},"m":{"dohyun":[2,1]},"sc":{"dohyun":[6,7,"best"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[2,3,"good"]}},{"t":"说你需要时间，你害怕会受伤","a":-3,"h":-1,"r":{"yunhee":"{ta}的眼泪还在掉，却点头：“好……我会努力的。”可是{ta}站在那里，很久都没有动。","dohyun":"“……行。”{ta}说，“我等。”可是{ta}说完，就转身走下了楼梯。","harin":"“我也害怕。”{ta}说，“所以……也许我们不该开始。”","yul":"“合理。”{ta}说，声音却在发抖，“我会让你不害怕。”说完，{ta}先离开了。"},"m":{"harin":[2,0],"dohyun":[-2,0],"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"年末的颁奖典礼，你是作为工作人员的朋友被带进来的。你坐在后台的休息区，看着屏幕上的直播。\n\n{name}的名字被念出来的时候，你听见整个场馆都在尖叫。{ta}走上台，拿着奖杯，说了很长的感言：谢谢公司、谢谢成员、谢谢粉丝。\n\n最后，{ta}停了一下，看着镜头，说：“还有，谢谢一个一直在我身边的人。”\n\n你坐在后台，手心全是汗。\n\n十分钟后，你收到一则讯息：「安全出口。现在。」","after":{"dohyun":"那天晚上，你们在楼梯间待了很久，直到{ta}的经纪人打电话来催。\n\n{ta}挂掉电话，看着你，突然笑了：“我们现在，是恋人了吧？”\n\n“是。”\n\n“那，”{ta}说，“我可以叫你……”\n\n{ta}想了半天，最后说了一个很肉麻的称呼。你笑到不行，{ta}恼羞成怒地捂住你的嘴。\n\n那天之后，{ta}换了你在手机里的备注。\n\n你偷看到的时候，是一个心形的符号，后面跟着你的名字。\n\n“幼稚。”你说。\n\n“你管我。”{ta}说，然后把你拉进怀里，“我等这一天，等了好久。”","yul":"那天晚上，{ta}没有让你一个人回家。\n\n{ta}开着车，送你回到你的公寓。停好车后，{ta}没有马上下车，只是坐在驾驶座上，看着前方。\n\n“我刚才说的话，”{ta}说，“都是认真的。”\n\n“我知道。”\n\n“我以前不相信承诺。”{ta}说，“因为承诺会被打破。”\n\n“现在呢？”\n\n{ta}转过头，看着你：“现在我想试试看。”\n\n{ta}从口袋里拿出一把钥匙，放在你手里：“我公寓的。规则第一条删掉了。以后，你想来就来。”","yunhee":"那天晚上，{ta}一直不肯放开你的手。从楼梯间到停车场，从停车场到你家门口。\n\n“明天还要见面！”{ta}说，“后天也要！大后天也要！”\n\n“你有行程吧？”\n\n“那我挤时间！”{ta}说，“我现在是你的恋人了，我有这个权利！”\n\n你笑着拍拍{ta}的头。\n\n{ta}在你家门口站了很久，依依不舍。最后，{ta}踮起脚，在你脸颊上亲了一下。\n\n“晚安！”{ta}说，“我爱你！”\n\n{ta}说完就跑了，跑到一半又回头：“我真的爱你喔！”","harin":"那天晚上，你们在楼梯间坐了很久。{ta}靠在你肩上，一直在哭，又一直在笑。\n\n“我写了好多首歌，”{ta}说，“每一首都是给你的。可是我一直不敢说。”\n\n“为什么？”\n\n“因为我怕说出来，你就会离开。”{ta}说，“就像所有的好东西一样。”\n\n你握住{ta}的手：“我不会离开。”\n\n{ta}看着你，很久很久。\n\n“那，”{ta}说，“我可以把那些歌，一首一首唱给你听吗？”\n\n“可以。”\n\n“那可能要唱很多年。”{ta}说，“因为很多首。”"}},{"id":"l2","t":"狗仔的照片","d":8,"tm":"上午 10:00","p":"交往的第三周，你们被拍了。\n\n照片很模糊，是你们在你家楼下的便利商店前，{name}帮你拎着购物袋。标题写得很难听。\n\n上午十点，{name}的经纪人{mgr}打电话给你，语气很冷：“公司下午要开会。{ta}说，想先听听你的意见。”\n\n然后，{name}打来了。","c":{"yunhee":"{ta}的声音在抖：“你还好吗？对不起对不起……我好怕你会讨厌我……”","dohyun":"“别看新闻。”{ta}说，“评论区那些人，我会处理。你待在家，不要出门。”","harin":"{ta}很久没说话。最后，{ta}说：“……我好怕。可是我更怕你因为我受伤。”","yul":"“我已经叫律师了。”{ta}说，冷静得可怕，“现在，告诉我你想怎么做。”"},"o":[{"t":"说你没事，问{ta}想怎么面对","a":5,"h":0,"r":{"yunhee":"“我想跟大家说实话……”{ta}说，“可是我不想你被骂。”","dohyun":"“我想直接承认。”{ta}说，“但你说不，我就不说。”","harin":"“我不知道。”{ta}说，“但我想跟你一起决定。”","yul":"“我的建议是承认。”{ta}说，“但这是我们两个人的事。你的意见一样重要。”"},"m":{"yul":[2,0],"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"提议先否认，保护{ta}的事业","a":3,"h":0,"f":"secret","r":{"yunhee":"“可是……”{ta}哭了，“你是不是不想让大家知道？”","dohyun":"“我不想否认。”{ta}说，“你是觉得我们见不得人？”","harin":"“谢谢你。”{ta}说，“可是我会难过。因为我想让全世界知道。”","yul":"“理性的选择。”{ta}说，“但我不喜欢。你在保护我，还是在保护你自己？”"},"m":{},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"说你愿意一起承认","a":4,"h":2,"f":"public","r":{"yunhee":"“真的吗？”{ta}哭着笑，“那我们一起！”","dohyun":"“我就知道你会这么说。”{ta}笑了，“好，一起。”","harin":"{ta}在电话那头哭了：“谢谢你……谢谢你不让我一个人。”","yul":"“好。”{ta}说，“我会把一切都安排好。”"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[2,1,"good"],"yunhee":[6,2,"best"],"harin":[2,1,"good"]}},{"t":"情绪崩溃，说你不知道该怎么办","a":-3,"h":-1,"r":{"yunhee":"{ta}在电话那头跟你一起哭，哭完了说：“我们都冷静一下吧……”","dohyun":"“别哭。”{ta}说，可是你一直哭，{ta}最后叹了一口气，“我很累。我先挂了。”","harin":"“对不起。”{ta}一直重复，“对不起，让你这么辛苦。也许……没有我，你会比较好。”","yul":"“深呼吸。”{ta}说，可是你停不下来。{ta}沉默了很久：“我需要一个能一起面对的人。”"},"m":{"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"照片是凌晨三点被放出来的。到了早上，已经上了热搜第一。\n\n你醒来时，手机里有一百多则未读讯息。朋友、同事、甚至很久没联络的同学，都在问你那张照片上的人是不是你。\n\n你打开那篇报导。照片很模糊，可是如果认识你的人，一眼就能认出来。\n\n标题写着「人气偶像深夜密会神秘人士」，下面的评论有祝福，有好奇，更多的是谩骂。\n\n你看着那些评论，手在发抖。","after":{"dohyun":"那件事最后，{ta}做了一个决定。\n\n{ta}在自己的个人帐号上发了一段很短的话：「照片里的人，是我很重要的人。请不要打扰。所有的问题，都冲着我来。」\n\n公司气疯了。粉丝吵翻了。新闻又上了好几天热搜。\n\n可是{ta}一点都不在意。那天晚上，{ta}来你家时，笑得很轻松。\n\n“我被骂惨了。”{ta}说。\n\n“你后悔吗？”\n\n“后悔？”{ta}把你拉进怀里，“我只后悔，没有早一点这样做。”","yul":"那件事被{ta}处理得滴水不漏。律师函、声明、跟媒体的协商，一步一步，冷静得可怕。\n\n三天后，热搜就下了。\n\n那天晚上，{ta}来你家，看起来很累。\n\n“结束了。”{ta}说，“不会再有人打扰你了。”\n\n“你呢？”\n\n“我？”{ta}坐在沙发上，闭上眼睛，“我没事。”\n\n你坐到{ta}旁边，握住{ta}的手。{ta}的手很冰。\n\n“你说谎的时候，”你说，“会摸耳朵。”\n\n{ta}的手停在耳朵旁边。然后，{ta}笑了，笑得很累，也很放松。\n\n“被你发现了。”{ta}说，把头靠在你肩上，“我很怕。怕失去你。”","yunhee":"那件事后来，{ta}在一个直播里，对着镜头哭了。\n\n{ta}说：“对不起，让大家担心了。可是我想说，我很幸福。请让我继续幸福下去，好吗？”\n\n那段直播被剪成很多版本，有人骂，有人哭，有人说这是{ta}最勇敢的一次。\n\n那天晚上，{ta}来你家，眼睛还是肿的。\n\n“我是不是很丢脸？”{ta}问。\n\n“不会。”你说，“你很勇敢。”\n\n{ta}扑进你怀里，又哭了：“我好怕你会讨厌我……害你被骂……”\n\n“我不讨厌你。”你说，“我爱你。”\n\n{ta}哭得更凶了。","harin":"那件事过了很久才平息。那段时间，{ta}几乎每天都待在你家，不敢出门。\n\n{ta}写了很多歌，都是关于害怕、关于勇气、关于一个人愿意为另一个人站在光里。\n\n有一天，{ta}突然说：“我想开一场小型演唱会。只唱这段时间写的歌。”\n\n“为什么？”\n\n“因为我想让大家知道，”{ta}说，“我不是在躲。我只是在保护一个人。”\n\n那场演唱会只有三百个座位。最后一首歌之前，{ta}看着台下，说：\n\n“这首歌，是写给那张照片里的人。你们不需要知道是谁。我知道就好。”"}},{"id":"l3","t":"队友们知道了","d":5,"tm":"晚上 19:30","p":"{name}说，{ta}身边的人想正式见你一面。\n\n“{mate}说要请你吃饭。”{ta}说，“他们……其实早就猜到了。”\n\n那是一家包厢烤肉店。你推门进去，所有人都站起来了。\n\n{mate}第一个开口：“终于！我们等这一天等好久了！”\n\n所有人都在笑，可是你感觉得到，他们也在观察你。","c":{"yunhee":"{name}抱着你的手臂，骄傲地宣布：“这是我的人！你们不准欺负！”","dohyun":"{name}跷着脚：“别看了，就是我的。”然后在桌下勾住你的小指。","harin":"{name}很紧张，一直帮你夹菜，夹到你的盘子堆成小山。","yul":"{name}淡淡地说：“介绍一下。我的伴侣。”所有人都安静了一秒，然后爆出尖叫。"},"o":[{"t":"大方地跟大家打招呼，讲你们的故事","a":4,"h":0,"r":{"yunhee":"大家笑成一团，{name}一直在旁边补充细节，补到你不得不捂住{ta}的嘴。","dohyun":"“哇，原来是你先——”{mate}还没说完，就被{name}捂住嘴。","harin":"{name}安静地听着你说，眼睛一直亮亮的。","yul":"“讲重点。”{name}说，却在你讲到某个地方时，嘴角翘了起来。"},"m":{"yunhee":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"私下问{mate}：「{ta}平常是什么样子？」","a":4,"h":0,"r":{"yunhee":"{mate}说：“{ta}每天都在讲你，讲到我们都会背了。”","dohyun":"{mate}跟你说了很多{ta}的事。{ta}在旁边越听脸越黑：“你问他干嘛？问我啊。”","harin":"{mate}说：“{ta}的新歌，每一首都是你。我们都知道。”","yul":"{mate}说：“他以前说，这辈子不会再相信任何人了。”他看着你，“谢谢你。”"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"跟{mate}拼酒，展现你的诚意","a":3,"h":1,"r":{"yunhee":"你喝醉了，说了很多不该说的话。{ta}一直在旁边帮你道歉。","dohyun":"“你疯了吗？”{name}说，却笑着跟你一起喝。","harin":"{ta}担心得一直帮你倒水，可是你越喝越多。{ta}的脸色越来越难看。","yul":"“你疯了吗？”{ta}抢过你的杯子，“我不需要你这样证明什么。”"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"太紧张，几乎都没说话","a":-3,"h":-1,"r":{"yunhee":"{ta}一直帮你说话，可是你一直不开口。{ta}后来有点尴尬地低下头。","dohyun":"你一整晚都没说话。散场时，{ta}说：“你是不是不想来？”","harin":"{ta}看着你，好像在说：我懂。可是回家的路上，{ta}说：“你是不是后悔了？”","yul":"{ta}替你回答了所有问题，可是回家的路上，{ta}一句话都没说。"},"m":{"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那间烤肉店的包厢很大，坐了七八个人。桌上已经摆满了肉和酒，大家都在等你们。\n\n你在门口深呼吸了三次。{name}握着你的手，捏了捏：“别紧张。他们会喜欢你的。”\n\n“你怎么知道？”\n\n“因为我喜欢你。”{ta}说，“他们跟我的眼光一样。”\n\n你被这句话逗笑了，紧张感少了一点。\n\n{ta}推开门。","after":{"dohyun":"那顿饭吃到很晚。大家喝了很多，聊了很多，讲了很多{ta}以前的糗事。\n\n{ta}一直在旁边抗议，可是没有人理{ta}。\n\n散场时，{mate}拉着你，很认真地说：“他以前，什么都不在乎。你是他第一个在乎的人。好好对他。”\n\n你点点头。\n\n回去的路上，{ta}喝醉了，靠在你肩上，一直在笑。\n\n“他们喜欢你。”{ta}说，“我就说吧。”\n\n“你怎么知道？”\n\n“因为{mate}刚刚偷偷跟我说，”{ta}说，“说我这辈子做过最聪明的事，就是喜欢你。”","yul":"那天之后，{ta}身边的人都知道了你。\n\n{mate}会在{ta}加班时，偷偷传讯息给你，说「他今天心情不好，你打个电话吧」。工作室的崔姐会在你来的时候，多泡一杯茶。助理小吴会在{ta}忘记吃饭时，偷偷跟你告状。\n\n你慢慢地，走进了{ta}的世界。\n\n有一天，{ta}说：“你知道吗，以前我觉得，我的世界里只需要我自己。”\n\n“现在呢？”\n\n“现在，”{ta}说，“我的世界里，到处都是你。”","yunhee":"那顿饭之后，你和{ta}的成员们变成了好朋友。\n\n{mate}会约你去逛街，娜妍会传搞笑影片给你，书雅会偷偷问你恋爱的问题。\n\n{ta}一开始很开心，后来开始吃醋：“你们怎么都在跟我的人聊天！”\n\n“你的人？”{mate}笑着说，“也是我们的人了。”\n\n{ta}气得鼓起脸，可是你知道{ta}其实很开心。\n\n有一天晚上，{ta}靠在你怀里，小声说：“谢谢你喜欢我的成员们。”\n\n“她们很好。”\n\n“我知道。”{ta}说，“可是你最好。”","harin":"那天之后，Jay 哥会在录音的时候，叫你进去听；恩智会帮你挑衣服，说你穿这个颜色好看；连 Tofu 都会在你来的时候，跑到门口迎接你。\n\n{ta}说，Tofu 以前只会迎接{ta}一个人。\n\n有一天，你在录音室里听{ta}录新歌。Jay 哥坐在你旁边，小声说：\n\n“她以前录音，从来不让人进来。她说，被人听着，会唱不出来。”\n\n“那现在呢？”\n\n“现在，”Jay 哥看着录音间里的{ta}，“她说，你不在的话，她唱不出来。”"}},{"id":"l4","t":"包场的天文台","d":9,"tm":"晚上 21:00","p":"交往一百天。\n\n{name}说要带你去一个地方，要你闭上眼睛。\n\n车开了很久，开上了山。你睁开眼睛的时候，眼前是一座小小的天文台，整座都被包下来了。圆顶缓缓打开，满天星星。\n\n“我不能带你去游乐园，不能带你去海边，不能在大街上牵你的手。”{ta}说，“所以，我想给你一片只有我们两个人的天空。”","c":{"yunhee":"{ta}拿出底片相机：“我要把今天的你拍下来！每一年都来拍一次！”","dohyun":"{ta}别扭地递给你一个盒子：“……一百天礼物。别笑。”里面是一条项链，坠子是一颗小星星。","harin":"{ta}按下播放键，天文台里响起一首歌，是你没听过的：“这首歌，叫做你的名字。”","yul":"{ta}拿出一份文件：“这颗星，我买下来了。用你的名字命名。”停了停，“很俗，我知道。”"},"o":[{"t":"感动地抱住{ta}，说这是最好的礼物","a":5,"h":3,"r":{"yunhee":"“嗯……”{ta}笑了，可是{ta}一直在等你的礼物。你没有准备。","dohyun":"“就这样？”{ta}说，“我准备了一个月。”{ta}的眼神有点失望。","harin":"{ta}在你耳边轻轻唱着那首歌，一句一句，都是你。","yul":"“我知道。”{ta}说，“我以为你会说点别的。”"},"m":{"harin":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[6,3,"best"]}},{"t":"拿出你准备的礼物","a":6,"h":2,"r":{"yunhee":"“哇啊啊啊！”{ta}尖叫着抱住你，“你怎么知道我想要这个！”","dohyun":"“你……”{ta}说不出话，最后只是用力抱住你。","harin":"{ta}捧着你的礼物，好像捧着什么易碎的东西：“我会一直珍惜。”","yul":"“我以为你会忘记。”{ta}说，声音有点哑，“谢谢你。”"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[6,2,"best"],"yunhee":[6,2,"best"],"harin":[2,1,"good"]}},{"t":"在星空下，跟{ta}聊你们的未来","a":-3,"h":-1,"r":{"yunhee":"“结婚？”你笑出声，“想太多了吧。”{ta}的笑容一下子僵住了。","dohyun":"“未来？”{ta}说，“你现在一定要谈这个？”气氛一下子冷掉了。","harin":"“我不知道未来会怎样。”{ta}说，“你这样问，我好害怕。”","yul":"你说的未来里，有工作、有城市、有梦想，就是没有{ta}。{ta}听完，沉默了很久。"},"m":{"yul":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"在圆顶下，主动吻{ta}","a":5,"h":6,"r":{"yunhee":"{ta}的吻甜得像草莓，带着止不住的笑意，笑得你们的牙齿都撞在一起。\n\n“对不起！”{ta}笑着说，然后又吻你，“再一次！”\n\n满天的星星在你们头顶旋转。{ta}拉着你倒在观测台的地毯上，仰面看着星空，又转过头看你。\n\n“我以前都不敢想，”{ta}说，“可以跟你一起看星星，然后不用回家。”\n\n{ta}翻身，撑在你上方，长发垂下来，像一道帘子，把你们和整个世界隔开。\n\n“今天不准害羞喔。”{ta}说，脸却先红了。\n\n你笑，{ta}就捂住你的嘴，然后在自己的手背上吻了一下，又拿开手，真正地吻你。\n\n星光下，{ta}的皮肤像在发光。{ta}一边吻你，一边小声地说着话，说{ta}有多喜欢你，说{ta}第一次见你就觉得你很好看，说{ta}偷偷存了多少张你的照片。说着说着，声音就乱了，只剩下呼吸。\n\n{ta}一直牵着你的手，十指相扣，一刻也不肯放开。\n\n在最后，{ta}把脸埋在你的颈窝，笑着，又好像在哭。\n\n“사랑해!”{ta}大声说，声音在圆顶里回荡，“사랑해 사랑해 사랑해!”\n\n（我爱你！我爱你我爱你我爱你！）\n\n你们笑成一团。\n\n天快亮了，{ta}还不肯放开你，赖在你怀里，用底片相机拍下天窗外渐渐变亮的天空。\n\n“这张，”{ta}说，“要放在我们以后的家里。”","dohyun":"{ta}低笑着加深了这个吻。\n\n“你越来越会了。”{ta}在你唇边说，“谁教的？”\n\n“你。”\n\n{ta}愣了一下，然后笑得更坏了。\n\n{ta}一把把你抱起来，你吓了一跳，抓住{ta}的肩膀。{ta}就这样抱着你走进观测台旁边的休息室，用脚踢上门。\n\n“今晚，”{ta}把你放在床上，撑在你上方，“没有规则，没有天亮前要走，没有任何东西。”\n\n{ta}的眼睛在暗处亮亮的。\n\n“只有我。”\n\n{ta}吻你，吻得又凶又温柔，这两种矛盾的东西在{ta}身上一点都不奇怪。{ta}一边吻你，一边扯开自己的卫衣，{ta}的银链和你颈间那颗星星坠子撞在一起，叮的一声。\n\n{ta}的手掌贴着你的腰，热得发烫。{ta}在你耳边说话，还是那样坏，说你的脸好红、说你在发抖。可是今晚的坏话里，多了一些以前没有的东西。\n\n“你是我的。”{ta}说，“说一次。”\n\n你说了。\n\n{ta}突然安静下来，看着你，看了很久。\n\n“……再说一次。”\n\n那一夜很长。{ta}一次又一次地确认你在，一次又一次地叫你的名字，从嚣张到温柔，从温柔到几乎是在求你。\n\n天亮的时候，你醒来，{ta}还抱着你，睡得很沉，像一只终于找到窝的大狗。\n\n你动了一下，{ta}就收紧手臂，闭着眼睛说：“别走。”\n\n“我没有要走。”\n\n“嗯。”{ta}说，把脸埋进你的头发里，“……以后也别走。”","harin":"{ta}僵了一下，轻轻推开你：“……我们说好今天只看星星的。”","yul":"{ta}的手扶住你的后颈，吻得又深又慢。\n\n“今晚，”{ta}在你耳边说，“我们不回去了。”\n\n不是问句。\n\n{ta}早就准备好了。观测台后面的休息室，被布置成了一个小小的房间。床单是新的，桌上有一瓶红酒和两个杯子，还有一台老旧的黑胶唱机。\n\n{ta}放上一张唱片，是一首很老的情歌。然后{ta}转过身，看着你，慢慢地松开领带。\n\n“过来。”{ta}说。\n\n你走过去。{ta}没有马上吻你，只是牵起你的手，放在{ta}的心口。\n\n“感觉到了吗？”{ta}问，“跳得很快。”\n\n你感觉到了。很快，很重，一点都不像那个永远冷静的{ta}。\n\n“只有你，”{ta}说，“能让它这样。”\n\n然后{ta}吻你。\n\n那一夜，{ta}依然掌握着节奏，依然在你耳边低声说话，依然让你一次又一次喘不过气。可是有些东西不一样了。{ta}的每一个动作都带着一种你从来没感受过的东西，像是终于不必再防备，终于可以把一切都交出来。\n\n“{me}。”{ta}叫你的名字，叫了一次又一次，“{me}。”\n\n在最后，{ta}紧紧抱着你，把脸埋在你的颈窝，很久很久都没有说话。\n\n然后你感觉到，{ta}在发抖。\n\n“我从来没想过，”{ta}说，声音哑得厉害，“我可以拥有这个。”\n\n唱片转完了，房间里只剩下沙沙的杂音。\n\n天亮的时候，{ta}还在。{ta}靠在床头，看着你醒来，手里拿着一杯咖啡，是你喜欢的口味。\n\n“早。”{ta}说，“我改了计划。”\n\n“什么计划？”\n\n“五年计划。”{ta}说，“改成一辈子。”"},"m":{"dohyun":[1,1]},"sc":{"dohyun":[2,4,"good"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[-4,-1,"bad"]}}],"x":"那天{ta}一大早就传讯息给你：「今天晚上空出来。不准问为什么。」\n\n你问了。{ta}没有回。\n\n晚上七点，一辆黑色的车停在你家楼下。{ta}坐在驾驶座上，戴着帽子，朝你招手。\n\n“上车。”{ta}说，“闭上眼睛。”\n\n车开了很久。你闭着眼睛，感觉到车在爬坡，转了很多个弯。{ta}一路上都在哼歌，心情好像很好。\n\n终于，车停了下来。{ta}帮你打开车门，牵着你的手，带你走了一段路。\n\n“可以睁开了。”","after":{"dohyun":"那一百天，就这样过去了。\n\n后来你们又在一起度过了很多个纪念日：两百天、一年、两年。每一次，{ta}都会准备惊喜，每一次都很幼稚，每一次你都很感动。\n\n可是你最记得的，还是那个天文台。\n\n有一天，你问{ta}：“为什么是天文台？”\n\n{ta}想了想：“因为我想让你知道，就算我们不能在白天出去，也还有星星。”\n\n“什么意思？”\n\n“意思是，”{ta}说，“就算全世界都不知道我们的事，星星也知道。”\n\n你看着{ta}，突然觉得，这是你听过最浪漫的一句话。","yul":"那天之后，那颗星星的证书一直挂在你家的墙上。\n\n{ta}说很俗，每次看到都会皱眉。可是你发现，{ta}每次来你家，都会在那张证书前面站一下。\n\n有一天，你问{ta}：“你为什么要买那颗星星？”\n\n{ta}沉默了很久：“因为我想给你一个，永远不会被拿走的东西。”\n\n“什么意思？”\n\n“我的名声、我的工作、我的一切，”{ta}说，“随时都可能被拿走。前团解散的时候，我就学会了。”\n\n{ta}看着那张证书：“可是那颗星星，会一直在那里。就算我不在了，它也会一直在。”","yunhee":"那天拍的照片，{ta}后来洗出来了。\n\n满满一本相簿，全是你。你在看星星、你在笑、你在哭、你睡着的样子。\n\n最后一页，是你们两个人的合照。{ta}在旁边写了一行字：\n\n「第一百天。还有好多好多个一百天。」\n\n你看着那行字，看了很久。\n\n{ta}从背后抱住你：“你喜欢吗？”\n\n“喜欢。”\n\n“那，”{ta}说，“我们每一百天，都来拍一次好不好？拍到我们都变成老爷爷老奶奶。”","harin":"那首歌后来被收录在{ta}的新专辑里，是最后一首。\n\n歌名叫做你的名字，可是专辑上写的是另一个名字：〈一百天〉。\n\n那张专辑拿了很多奖。{ta}在每一次的得奖感言里，都会说同一句话：\n\n“谢谢那个让我写出这些歌的人。”\n\n所有人都在猜那个人是谁。\n\n只有你知道。\n\n有一天晚上，{ta}在你耳边，轻轻唱着那首歌。唱到最后一句时，{ta}停下来，看着你：\n\n“这一句，”{ta}说，“我只唱给你听。”"}},{"id":"l5","t":"关于未来的对话","d":10,"tm":"深夜 23:00","p":"{name}的合约快到期了。\n\n公司给了一份续约方案，条件很好，但附带一条：私生活必须「保持低调」。\n\n那天深夜，{ta}坐在你家的沙发上，看着那份合约，看了很久。\n\n“我想问你。”{ta}说，“如果我续约，我们就要一直藏下去。如果我不续……我可能会失去很多。”\n\n{ta}抬头看你：“你希望我怎么选？”","c":{"yunhee":"{ta}的眼眶红了：“我好爱我的工作……可是我也好爱你。我好贪心对不对？”","dohyun":"{ta}把合约扔在桌上：“我其实已经决定了。但我想听你说。”","harin":"{ta}抱着膝盖：“音乐是我的命。可是你……你也是。”","yul":"{ta}把合约推到你面前：“这是我们两个人的事。我不想一个人决定。”"},"o":[{"t":"说你希望{ta}选择自己的梦想，你会等","a":-3,"h":-1,"f":"secret","r":{"yunhee":"{ta}哭着抱住你：“你怎么可以这么好……”","dohyun":"“你这个笨蛋。”{ta}说，“你就这样把我推开？”","harin":"{ta}在你怀里哭了很久：“我会写一首最好的歌给你。”","yul":"“好。”{ta}说，“但你确定，你不是在等我离开？”"},"m":{"harin":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"说你想跟{ta}光明正大地在一起","a":5,"h":2,"f":"public","r":{"yunhee":"“我也想！”{ta}说，可是马上又哭了，“可是我好怕……你为什么要逼我选？”","dohyun":"“我就在等你这句话。”{ta}笑了，把合约撕成两半。","harin":"{ta}眼眶湿了：“你要我放弃音乐吗？”","yul":"“好。”{ta}说，“我会成立自己的工作室。我们的事，我们自己决定。”"},"m":{"dohyun":[2,0],"yul":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[6,2,"best"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"说不管{ta}选什么，你都在","a":6,"h":3,"r":{"yunhee":"{ta}哭着笑了：“那我就放心了！”","dohyun":"“这个答案不算。”{ta}说，却把你抱得更紧了。","harin":"“谢谢你。”{ta}说，“你让我觉得，不管怎么选，都不会错。”","yul":"“这是最好的答案。”{ta}说，“也是最难的答案。”"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,3,"best"],"harin":[6,3,"best"]}},{"t":"说你累了，也许你们该分开","a":-10,"h":-5,"e":"fail","r":{"yunhee":"{ta}的眼泪一下子掉下来：“不要……拜托……”","dohyun":"{ta}没有说话，只是看着你，眼神一点一点暗下去。","harin":"{ta}点点头，好像早就预料到：“我明白。谢谢你，陪我走了这么远。”","yul":"“我尊重你。”{ta}说，声音却在抖，“……但我不会忘记你。”"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那份合约，{ta}已经看了一个星期了。\n\n你知道{ta}很挣扎。{ta}的梦想、{ta}的事业、{ta}的粉丝，都在那份合约的另一端。而你，在这一端。\n\n那天晚上，{ta}来你家，把合约放在茶几上，坐在沙发上，盯着它看了很久。\n\n你泡了两杯茶，坐在{ta}旁边。\n\n窗外很安静，只有远处偶尔传来的车声。\n\n{ta}终于开口了。","after":{"dohyun":"那天晚上，{ta}做了决定。\n\n不管是什么决定，{ta}说，都是你们一起做的。\n\n{ta}把合约收起来，看着你：“不管以后怎么样，我都不会后悔。”\n\n“为什么？”\n\n“因为，”{ta}说，“我这辈子做过最对的事，就是遇见你。”\n\n{ta}笑了，笑得像个孩子。\n\n那天之后，又过了很久很久。\n\n有一天，你问{ta}：“如果重来一次，你还会选我吗？”\n\n“废话。”{ta}说，“重来一百次，都是你。”","yul":"那天晚上，{ta}把合约收进抽屉里。\n\n“我需要时间想。”{ta}说，“但有一件事，我已经想好了。”\n\n“什么事？”\n\n{ta}从口袋里拿出一个小盒子，打开，是一枚很简单的戒指。\n\n“不是求婚。”{ta}说，“现在还不是。但我想让你知道，不管我选哪一条路，那条路上都有你。”\n\n你看着那枚戒指，很久都说不出话。\n\n“这不在计划里。”{ta}说，“我第一次，做了一件不在计划里的事。”","yunhee":"那天晚上，你们聊到很晚。聊梦想，聊未来，聊你们想要的生活。\n\n{ta}说{ta}想要一间有大窗户的房子，养一只狗，每天早上一起吃早餐。\n\n“你呢？”{ta}问。\n\n“我想要的，”你说，“只要有你就好。”\n\n{ta}看着你，眼眶红了：“你好狡猾。这样我怎么选？”\n\n“不用选。”你说，“不管你选什么，我都在。”\n\n{ta}扑进你怀里，哭得像个孩子。\n\n“我爱你。”{ta}说，“好爱好爱。”","harin":"那天晚上，{ta}弹了一首歌给你听。\n\n是一首你没听过的歌，很短，只有一段。歌词说的是一个人站在十字路口，左边是光，右边是你。\n\n“我一直以为，”{ta}说，“我只能选一边。”\n\n“现在呢？”\n\n{ta}看着你：“现在我发现，你一直站在光里。”\n\n{ta}把合约放在钢琴上，盖上琴盖。\n\n“不管我选什么，”{ta}说，“我都会写歌。而我的每一首歌，都会有你。”"}}],"endings":{"pub":{"t":"恋爱 HE・公开","tag":"恋爱关系","p":"那天早上九点，{name}的官方帐号发了一则公告。\n\n不是公司写的那种冷冰冰的声明。是{ta}自己写的，很长，一个字一个字敲出来的。\n\n{ta}说，有一个人，在{ta}最累的时候陪着{ta}，在{ta}不敢当自己的时候，让{ta}记得自己是谁。{ta}说，{ta}不想再让那个人站在阴影里。\n\n评论区炸了。有人哭，有人骂，有人说祝福。\n\n你坐在{ta}身边，看着{ta}按下发送键。{ta}的手在抖，你握住了。\n\n那天晚上，你们第一次一起走在大街上。没有口罩，没有帽子。路边有人认出来，举起手机。{name}没有躲，只是把你的手握得更紧。","c":{"yunhee":"“대박!”{ta}在路灯下转了一个圈，拉着你的手大笑，“我们好像在拍电影喔！”\n（太棒了！）","dohyun":"“뭐 어때.”{ta}说，对着镜头比了一个中指，又被你拉下来，笑得肩膀都在抖。\n（有什么关系。）","harin":"“음… 그렇구나.”{ta}看着满街的灯，轻声说，“原来光明正大地爱一个人，是这种感觉。”\n（嗯……原来如此。）","yul":"“그래서?”{ta}对着那些镜头挑了挑眉，然后低头吻了你，“这就是我的答案。”\n（所以呢？）"}},"secret":{"t":"恋爱 HE・秘密交往","tag":"恋爱关系","p":"你们没有公开。\n\n{name}续约了。舞台上的{ta}依然耀眼，依然属于几万个人。\n\n可是每一场演唱会的最后一首歌，{ta}都会看向关系者席的同一个位置。每一次颁奖典礼，{ta}的得奖感言里，都会有一句只有你听得懂的话。\n\n你们的约会都在深夜，在包场的电影院，在山上的天文台，在你那间小小的公寓。{ta}会在凌晨两点出现在你家门口，带着你爱吃的宵夜，然后留下来，一起迎接早晨。\n\n这一次，没有人需要先走。\n\n有一天，你问{ta}，这样委屈吗？\n\n{ta}想了很久。","c":{"yunhee":"“委屈啊！超委屈！”{ta}扑进你怀里，“可是只要你在，我就可以忍耐一百年！”","dohyun":"“委屈什么。”{ta}说，“全世界最好的东西，当然要藏起来。”说完，耳朵红了。","harin":"“不会。”{ta}轻声说，“我的每一首歌，都已经告诉全世界了。只是他们听不懂而已。”","yul":"“委屈的是你。”{ta}说，“所以我在计划。给我三年。三年后，我会亲自告诉所有人。”"}},"fwb":{"t":"停在炮友","tag":"炮友期","p":"后来，你们还是那样。\n\n{name}会在深夜传来一个房号，或一句「在家吗」。你们会在只有彼此的房间里，交换体温，交换呼吸，交换那些白天说不出口的东西。\n\n然后天亮前，{ta}会离开。\n\n你们都没有再提「规则」这两个字。好像只要不提，就不会有人越界。\n\n有时候你会想，如果那天早上，你说了另一句话，会不会不一样。\n\n有时候，你在{ta}离开后，会在枕头上闻到{ta}留下的味道，然后很久都睡不着。\n\n你知道{ta}也是。\n\n因为某天凌晨，{ta}已经穿好鞋，手放在门把上，却停了很久很久。","c":{"yunhee":"“我……”{ta}开口，又闭上，最后只是笑了笑，“晚安！”可是你听见门外，{ta}哭了。","dohyun":"“喂。”{ta}说，“如果我说，我不想走了呢？”然后{ta}自己笑了，“开玩笑的。”门关上了。","harin":"{ta}回过头，看着你，眼睛里有千言万语。最后，{ta}只说：“下次见。”","yul":"“我在想，”{ta}说，“规则是不是我们定错了。”说完，{ta}没有等你回答，就离开了。"}},"friend_relief":{"t":"纯友谊・释然","tag":"纯友谊","p":"你们没有变成别的什么。\n\n你们还是朋友。会在深夜一起吃辣炒年糕，会在{name}的新歌发表时，第一个传讯息给你：「说实话。」\n\n有一次，{mate}问{ta}：“你们真的只是朋友？”\n\n{ta}想了想，笑了。\n\n后来{ta}在一次访谈里说，{ta}有一个很重要的朋友，在{ta}最忙最乱的那几年，一直都在。不需要{ta}是谁，只需要{ta}是{ta}自己。\n\n你看着那段访谈，笑着传了一则讯息给{ta}。\n\n{ta}很快就回了。","c":{"yunhee":"@msg 우리 평생 친구야!! 알지?? || 我们是一辈子的朋友！！知道吧？？","dohyun":"@msg 오글거려 ㅋㅋㅋ || 好肉麻ㅋㅋㅋ\n@msg 근데 맞는 말임 || 不过是真的。","harin":"@msg 당신 같은 친구가 있어서 다행이에요 || 有你这样的朋友，真好。","yul":"@msg 그래서? 이번 주 밥 || 所以呢？这周吃饭。\n@msg 내가 살게요 || 我请。"}},"friend_regret":{"t":"纯友谊・遗憾","tag":"纯友谊","p":"你们最后，还是只是朋友。\n\n不是因为不喜欢。只是时机不对，身分不对，勇气也不够。\n\n{name}的演唱会，你还是会去。坐在关系者席，看着{ta}在台上发光。最后一首歌的时候，{ta}还是会看向你的方向。\n\n只是你们都没有再往前一步。\n\n有一年冬天，你们在路边摊喝了一点酒。{ta}突然说：“如果那时候……”\n\n然后{ta}停住了，没有说完。\n\n你也没有问。\n\n你们都知道那句话的后面是什么。只是有些话，说出来，就回不去了。不说出来，至少还能这样坐在一起。","c":{"yunhee":"{ta}笑着，眼泪却掉下来：“没事！是酒太辣了！”","dohyun":"“算了。”{ta}说，仰头喝完那杯酒，“当我没说。”","harin":"{ta}后来写了一首歌，叫做〈来不及〉。你听了一遍，就再也不敢听第二遍。","yul":"“我很少后悔。”{ta}说，“这是其中一次。”"}},"fail":{"t":"失败","tag":"失败","p":"后来，你们就没有再联络了。\n\n不是吵架，也不是谁对不起谁。只是有一天，你发现你们的对话框，停在了很久以前的那一则讯息。\n\n{name}还是很红。你在地铁的广告牌上看见{ta}，在便利商店的音乐里听见{ta}，在朋友的手机里看见{ta}的新舞台。\n\n{ta}看起来很好。\n\n有时候你会想起那些夜晚，那些讯息，那些差一点就说出口的话。然后你会关掉手机，继续过你的生活。\n\n你是{job}。你有你的工作，你的朋友，你的日子。\n\n只是偶尔，在某个下雨的傍晚，你会想起一个人。","c":{"yunhee":"你不知道的是，{ta}的底片相机里，还有一卷没洗出来的底片。全部都是你。","dohyun":"你不知道的是，{ta}后来在一个综艺里被问到「最后悔的事」，沉默了很久，最后笑着说：“输了一次。”","harin":"你不知道的是，{ta}的下一张专辑里，有一首歌的歌词，写的是那家路边摊。","yul":"你不知道的是，{ta}在某一年的年末颁奖典礼上，得奖感言的最后一句是：“谢谢那个教会我，有些事情不能计划的人。”"}},"hate":{"t":"完全厌恶","tag":"失败","p":"后来发生的事，你不太愿意回想。\n\n那些被你敷衍过去的讯息、被你推开的好意、被你说出口又收不回来的话，一点一点堆积起来，终于在某一天，压垮了什么。\n\n{name}没有吵，也没有闹。{ta}只是突然不再找你了。\n\n你传过去的讯息，显示已读，没有回覆。后来，连已读都没有了。\n\n有一次，你在一个活动现场远远看见{ta}。你们的视线对上了一秒。\n\n那一秒里，你看见的不是生气，不是难过，而是一种更冷的东西。\n\n{ta}移开视线，像看着一个从来不认识的人。","c":{"dohyun":"后来你听说，{ta}在一次直播里被问到「最讨厌哪种人」。{ta}想都没想就说：“把别人的认真当玩笑的人。”\n\n说完，{ta}笑了，笑得一点温度都没有。“这种人，我这辈子都不想再见到。”","yul":"后来你收到一封很短的讯息，是{ta}的助理传来的：\n\n「律哥请你不要再联络他。他说，他已经把你从他的计划里删掉了。」\n\n最后一行，是{ta}亲手补上的：「所以呢？没有所以了。」","yunhee":"后来你在{ta}的新歌里，听到一句歌词：「我曾经把整颗心捧给你看，你却连低头都嫌麻烦。」\n\n那首歌的最后，{ta}笑着唱：「谢谢你，让我学会不再对谁那么好。」\n\n那是你第一次听到，那个永远在笑的人，用那么冷的声音唱歌。","harin":"后来{ta}换了号码，删掉了所有能联络到你的方式。\n\n你只在一篇访谈里，看到{ta}说了一句话：\n\n“我曾经很怕被当成偶像，而不是一个人。后来我发现，更可怕的是，有人知道你是一个人，却还是那样对你。”\n\n{ta}没有说那个人是谁。可是你知道。"}},"arrest":{"t":"被捕","tag":"游戏结束","p":"你因违反接近禁止令、跟踪骚扰等罪名被判刑。\n\n审判那天，{name}没有出庭。律师代为宣读了一份陈述书。上面写着，这段时间{ta}如何不敢出门、如何在半夜惊醒、如何在每一个人群里寻找你的脸。\n\n法官宣判时，你一直在想，事情是从哪里开始变成这样的。\n\n也许是从某一次，你选了那个最伤人的选项。也许是从你被拒绝之后，没有选择放手。\n\n喜欢一个人，从来不是可以不顾对方意愿的理由。","c":{"dohyun":"后来你在新闻上看到，{ta}重新开始了签售会。签售台前多了一道玻璃隔板，{ta}隔着玻璃，对每一个粉丝笑。","yul":"后来你听说，{ta}的工作室把这个案子的判决书公开了，作为警告。附注只有一句：「界线，不容越过。」","yunhee":"后来你听说，{ta}花了很长一段时间，才敢再一个人走在街上。{ta}的成员们，一直轮流陪着{ta}。","harin":"后来{ta}发表了一首新歌，歌名叫〈门锁〉。那是{ta}休养一年后，第一次站上舞台。"}}},"traits":[{"id":"sunny","name":"阳光","speech":"语气明亮上扬，笑声多，常用感叹句","mbti":{"E":2,"F":1,"P":1},"f":{"best":["{ta}笑得眼睛都弯成了月牙。","{ta}整个人都亮了起来，像被太阳晒过。","{ta}开心地笑出声，一点都不掩饰。"],"good":["{ta}笑着点点头，心情看起来不错。","{ta}的语气轻快了一点。","{ta}对你笑了笑。"],"bad":["{ta}的笑容淡了一点，但还在努力撑着。","{ta}笑了一下，那个笑没有到眼睛里。","{ta}安静了几秒，才又挤出一个笑。"],"worst":["就连一向爱笑的{ta}，此刻也笑不出来了。","{ta}脸上的光一下子熄灭了。","{ta}别开脸，第一次没有对你笑。"]}},{"id":"scheming","name":"腹黑","speech":"笑着说狠话，话里有话，喜欢反问","mbti":{"I":1,"N":2,"T":2,"J":1},"f 不代转任何私人信件。」"},{"t":"在粉丝群里说你和{ta}交往过，{ta}抛弃了你","v":45,"r":"你的贴文被截图转发了几千次。大部分人在骂你造谣，也有人信了。{name}的公司发了声明：「对于恶意散布不实言论者，将追究法律责任。」"}]},{"id":"s2","tm":"深夜 23:10","p":"公司寄来了一封警告函，上面列出了你这段时间做过的事，日期、时间、截图，一条不漏。\n\n最后一段写着：「若再有任何接触行为，本公司将依法采取行动。」\n\n你把信揉成一团。你觉得他们在阻止你们。如果{name}亲眼看见你有多认真，{ta}一定会明白的。","c":{"dohyun":"同一天，{ta}取消了一场签售会，理由是「艺人人身安全考量」。{ta}在直播里勉强笑着说：“我没事。”","yul":"同一天，{ta}的工作室发了一则声明，措辞冷静而严厉。最后一句是：「所有证据都已交给律师。」","yunhee":"同一天，{ta}的成员发文：「请保护我们{name}。{ta}最近都睡不好。」","harin":"同一天，{ta}宣布暂停所有活动，公告上写着：「因个人健康因素需要休养。」"},"o":[{"t":"跟着{ta}的保姆车，到{ta}下一个行程的现场","v":40,"r":"你在拍摄现场外被工作人员认了出来。{name}在车里没有下车，整个拍摄延后了两个小时。经纪人报了警，你在警察来之前离开了。"},{"t":"打听到{ta}住的公寓，在楼下等{ta}回家","v":45,"r":"你在楼下等到凌晨。{name}没有回来。第二天，你听说{ta}搬去了朋友家，连行李都没收拾。"},{"t":"假装成工作人员，想混进{ta}的后台","v":40,"r":"你在后台入口就被拦下了。安保人员拿着你的照片比对，确认之后，直接打了电话给警察。"},{"t":"在{ta}的每一篇贴文底下留言：「不见我，你会后悔」","v":35,"r":"你的留言被截图存证，交给了警察。那句「你会后悔」，成了你的恐吓证据。"}]},{"id":"s3","tm":"凌晨 01:30","p":"你收到了法院的接近禁止令。你不准出现在{name}周围一百公尺内，不准以任何方式联络{ta}。\n\n你看着那张纸，手在发抖。你觉得全世界都在把你们分开。\n\n可是你没有停。","c":{"dohyun":"那天是{ta}复出后的第一个舞台。你在新闻上看到{ta}站在台上，笑得很用力，好像在证明自己没事。","yul":"你听说{ta}最近出门都带着两个保镖。{ta}从来不是需要保镖的人。","yunhee":"你听说{ta}已经很久不敢一个人回家了，成员们轮流陪{ta}睡。","harin":"你听说{ta}去看了心理医生。{ta}的猫 Tofu，被送去了朋友家暂住。"},"o":[{"t":"在{ta}家门口留下礼物和一张纸条","v":40,"r":"隔天早上，{name}打开门，看见那个礼物。邻居说，那天早上听见很长很长的尖叫声。"},{"t":"半夜去按{ta}家的门铃","v":45,"r":"门没有开。你按了很久。屋里的灯全亮了，然后你听见远处的警笛声越来越近。"},{"t":"拍下{ta}出门的照片，传给{ta}看","v":45,"r":"那些照片成了你跟踪骚扰的直接证据。{name}看到照片的那一刻，手机从手里滑了下去。"},{"t":"违反禁止令，去{ta}的舞台后门等{ta}","v":40,"r":"你混在人群里，绕到后门。门开了，可是先出来的，不是{name}。"}]}],"arrest":{"tm":"凌晨 02:00","p":"警察找到你的时候，你一点都不意外。\n\n他们拿出一叠资料：你在公司楼下徘徊的监视器画面、几百则私讯的截图、那些留言、那封警告函、那张接近禁止令。\n\n“你因涉嫌跟踪骚扰、违反接近禁止令，现在依法逮捕你。”\n\n手铐扣上的声音很响。你回头，想再看一眼——","c":{"dohyun":"{name}站在远处，被经纪人挡在身后。{ta}看着你，没有害怕，只有厌恶。“这次，”{ta}说，“我不会再心软了。”","yul":"{name}站在律师旁边，一点都不惊讶。{ta}只说了一句：“所以呢？结束了。”然后转身离开。","yunhee":"{name}被成员们护在中间，脸色苍白，一直在发抖。{ta}没有看你，只是把脸埋进了成员的肩膀。","harin":"{name}没有出现。你后来才知道，{ta}在听到你被捕的消息时，蹲在地上哭了很久。不是难过，是终于松了一口气。"}},"end":{"t":"被捕","tag":"游戏结束","p":"你因违反接近禁止令、跟踪骚扰等罪名被
