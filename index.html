<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>KPOP 偶像恋爱模拟器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one "script" column like a fan-sign diary; sticky progress header (day, stage track, meters) and a docked action bar. */
:root{
  --bg:#f5f0ee;--paper:#fffaf8;--ink:#2a2127;--muted:#7b6a72;--line:#e6d9da;
  --accent:#b8325a;--accent-soft:#f6dde4;--phone:#e3eef0;--phone-ink:#1f3a40;--heat:#d9603b;
  --font-display:"ZCOOL XiaoWei","Gowun Batang","Songti SC","Noto Serif CJK SC",serif;
  --font-ko:"Gowun Batang","Apple SD Gothic Neo","Noto Serif KR",serif;
  --font-body:-apple-system,"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1619;--paper:#241d21;--ink:#f1e8ea;--muted:#a8979e;--line:#3a2f35;
  --accent:#ef7a9b;--accent-soft:#3d2430;--phone:#203236;--phone-ink:#d6eaee;--heat:#f0916d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1619;--paper:#241d21;--ink:#f1e8ea;--muted:#a8979e;--line:#3a2f35;
  --accent:#ef7a9b;--accent-soft:#3d2430;--phone:#203236;--phone-ink:#d6eaee;--heat:#f0916d;color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.mast{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-block:28px 20px}
.mast .orn{font-family:var(--font-ko);color:var(--accent);letter-spacing:.12em;font-size:14px}
.mast h1{font-size:clamp(28px,7vw,40px);line-height:1.15}
.mast .adult{font-size:13px;color:var(--muted);letter-spacing:.04em}

.stack{display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0}
.hint{font-size:14px;color:var(--muted);margin:0;line-height:1.6}
.notice{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 22px;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.lang{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lang button{padding:22px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-family:var(--font-display);font-size:22px}
.lang button:hover{border-color:var(--accent);color:var(--accent)}

.panel{border:1.5px solid var(--ink);border-radius:4px;padding:18px 18px 20px;background:var(--paper)}
.panel h2{font-size:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:none;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;border-radius:0;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--accent)}
.field textarea{resize:vertical;min-height:2.4em;line-height:1.6}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:transparent}
@media (max-width:460px){.fields{grid-template-columns:1fr}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pc .nm{font-size:21px}
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 10px;cursor:pointer;min-width:0}
.pc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pc .ko{font-family:var(--font-ko);font-size:12px;color:var(--muted)}
.pc .nm{font-family:var(--font-display);font-size:19px;line-height:1.2}
.pc .tag{font-size:12.5px;line-height:1.45;color:var(--muted)}
.pc .meta{font-size:11px;letter-spacing:.04em;color:var(--accent);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.mono{font-family:var(--font-ko);letter-spacing:.08em;font-size:16px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content}
.seg button{border:none;background:transparent;padding:4px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.rel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rel button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px}
.rel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rel .n{font-family:var(--font-display);color:var(--accent)}
@media (max-width:460px){.rel{grid-template-columns:1fr}}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:baseline;gap:10px}
.hud .who{font-family:var(--font-display);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .day{font-family:var(--font-ko);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud .day b{color:var(--accent)}
.hud .time{font-size:12px;color:var(--muted);white-space:nowrap}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;margin:0;padding:0}
.track li{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.track li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.track li.done::before{background:var(--ink)}
.track li.now::before{background:var(--accent)}
.track li.now{color:var(--accent);font-weight:600}
.track li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .6s ease}
.bar.heat i{background:var(--heat)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.feed{display:flex;flex-direction:column;gap:18px;padding-block:22px}
.scene p{margin:0 0 .9em}
.scene p.ko{font-family:var(--font-ko);margin-bottom:0}
.scene p.tr{color:var(--muted);font-size:14px;margin-top:0}
.scene .stamp{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 .2em;font-variant-numeric:tabular-nums}
.scene h3{font-size:21px;margin:0 0 .7em}
.react{border-left:2px solid var(--line);padding-left:14px}
.react p{margin:0 0 .8em}
.choice{align-self:flex-end;max-width:85%;font-size:14px;color:var(--muted);border-right:2px solid var(--accent);padding-right:10px;text-align:right}
.trait{color:var(--accent)}
.delta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.gate{text-align:center;font-family:var(--font-display);font-size:18px;color:var(--accent);margin:8px 0;letter-spacing:.08em}
.ending{border:1.5px solid var(--ink);border-radius:4px;padding:20px;background:var(--paper)}
.ending .stamp{color:var(--accent)}

.msg{display:flex;align-items:flex-start;gap:8px;margin:0 0 .6em}
.msg .av{font-family:var(--font-ko);font-size:15px;color:var(--phone-ink);white-space:nowrap;padding-top:6px}
.msg .bub{display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .k{background:var(--phone);color:var(--phone-ink);border-radius:18px;padding:6px 14px;font-family:var(--font-ko);font-size:15px;width:fit-content;max-width:100%}
.msg .t{font-size:12.5px;font-style:italic;color:var(--muted);padding-left:6px}

.bar-actions{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow-y:auto}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt .n{font-family:var(--font-display);color:var(--accent);min-width:1em}
.toggle{align-self:flex-start;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;cursor:pointer}
.toggle:hover{background:var(--accent-soft)}
.foot{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
</style>

<script>

:"下午 15:20","p":"签售会场的冷气开得很足，你手里那张便利贴被捏得有点皱。上面写着你想了三天的问题：「如果今天不当偶像，你最想去哪里发呆？」\n\n轮到你时，{name}低头读完，笔停在半空。\n\n下一秒，{ta}笑场了。不是营业的那种笑，是肩膀一抖、整个人往后靠的那种。旁边的工作人员都愣住了。\n\n签名很快就结束，你被引导离场，脑袋一片空白。\n\n散场后你绕到场馆后门等朋友，却看见一台保姆车旁，{name}戴着口罩，正低头找什么。{ta}抬眼，正好对上你的视线。","c":{"yunhee":"{ta}眼睛一亮，小跑两步：“啊！便利贴！대박，你害我在镜头前破功了啦！”","dohyun":"{ta}挑眉，双手插口袋晃过来：“喂，你是故意的吧？害我差点被室长骂。”","harin":"{ta}轻轻拉下口罩一角：“음… 그렇구나。是你啊。那个问题，我会认真想的。”","yul":"{ta}瞥了你一眼，语气平平：“是你写的？问题不错。比问我吃了没有强多了。”"},"o":[{"t":"老实说出你自己的答案：你最想去海边发呆","a":4,"h":0,"r":{"yunhee":"“我也是我也是！”{ta}差点跳起来，被{mgr}一把拉住袖子。","dohyun":"“海边？好无聊。”{ta}嘴上嫌弃，却又问：“哪一个海边？”","harin":"{ta}眼神柔了下来：“海浪的声音，像有人一直在替你说话。”","yul":"“具体一点。”{ta}追问哪片海、几点去，像在开会。"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"慌张道歉，说不是故意让{ta}笑场","a":2,"h":0,"r":{"yunhee":"{ta}的笑容僵了一下：“啊……嗯，没关系啦。”可是{ta}没有再往前走。","dohyun":"“道歉？”{ta}的笑一下子收了，“我还以为你挺有趣的。原来只是普通粉丝。”","harin":"{ta}的眼神暗了一下：“……你觉得那是一件需要道歉的事吗。”","yul":"“又是道歉。”{ta}的语气冷下来，“我最讨厌没做错事还道歉的人。”"},"m":{"yul":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"开玩笑说：那下次签售我再出一题更难的","a":3,"h":1,"r":{"yunhee":"“好啊！我会先做功课的！”{ta}认真地握拳。","dohyun":"“来啊，我会赢。”{ta}的胜负欲一下子就上来了。","harin":"{ta}轻笑：“那我得先想好答案才敢去了。”","yul":"“行。我等着看你能出多难。”"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"只是礼貌点头，说朋友在等，先离开","a":-3,"h":-1,"r":{"yunhee":"“喔……好。”{ta}挥手的动作停在半空，像被泼了一盆冷水。","dohyun":"你转身的时候，听见{ta}“啧”了一声。再回头，{ta}已经上车了，车门关得很响。","harin":"{ta}没有挽留。你走远后回头，{ta}已经低头走进车里，连一眼都没看。","yul":"{ta}点了一下头，什么都没说，转身就走。那个背影比签售台上冷了好几度。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你排了两个小时的队。前面的人一个个上去，有人哭、有人尖叫、有人紧张到说不出话。你一直在心里默念那个问题，怕自己到时候会忘记怎么开口。\n\n签售台很长，成员们坐成一排。轮到{name}之前，你偷偷看了{ta}很久：{ta}签名的时候会微微歪头，听粉丝说话时会把笔放下，眼睛看着对方。那种认真，不太像营业。\n\n然后就轮到你了。","after":{"dohyun":"那天晚上，你在社群上看到一段饭拍：{name}在签售台上笑到弯腰的样子，被转发了几千次。标题写着「到底是谁让道贤笑场」。\n\n你把手机扣在桌上，脸烫得不像话。\n\n十一点多，一个陌生帐号传来私讯。头像是一块滑板。\n\n@msg 야 그 포스트잇 아직 있다 || 喂，那张便利贴我还留着。\n@msg 답은 다음에 알려줌 ㅋ || 答案下次告诉你ㅋ\n\n你盯着那两行字看了很久，才发现自己一直在笑。","yul":"回家的地铁上，你还在想{ta}那句「比问我吃了没有强多了」。\n\n那天晚上，经纪公司的官方帐号发了签售会的照片。其中一张，{name}低头看着一张便利贴，嘴角有一点很淡的弧度。粉丝们在底下猜了一整晚，那张便利贴上写了什么。\n\n凌晨一点，你的私讯跳出一则讯息。帐号没有头像，只有一个名字的缩写。\n\n@msg 바다. 동해. 새벽 5시 || 海。东海。清晨五点。\n@msg 그게 내 답이에요 || 那是我的答案。\n\n你还没回，{ta}又补了一句：「不用回。只是不喜欢欠着问题。」","yunhee":"那天晚上，VELVET HOUR 的官方帐号上传了一支签售会的花絮。影片里，{name}笑到趴在桌上，旁边的成员一脸莫名其妙。\n\n留言区全在问：「是哪个粉丝！」「允熙笑到打嗝了哈哈哈」\n\n你缩在被子里，把那支影片看了五遍。\n\n快十二点时，你的私讯跳出一个粉红色头像。\n\n@msg 혹시… 포스트잇 주인?? || 请问……是便利贴的主人吗？？\n@msg 답 생각해봤어용!! 제주도!! || 我想好答案了！！济州岛！！\n@msg 아 근데 이거 회사에 들키면 혼나 ㅠㅠ || 啊不过被公司发现会被骂呜呜\n\n后面接着一排慌张的表情符号。","harin":"回家后，你翻开专辑，发现{ta}在签名旁边写了一行很小的字，你刚才没注意到：\n\n「谢谢你问了一个不需要标准答案的问题。」\n\n那天深夜，{name}在个人帐号上传了一张照片：一片模糊的夜景，配文只有一句——「如果不是现在的我，大概会在某个安静的地方发呆吧。」\n\n粉丝们以为是新歌预告。只有你知道，那是一个回答。\n\n凌晨两点，你收到一封很短的私讯，帐号头像是一只白猫。\n\n@msg 혹시 불편하셨으면 미안해요 || 如果让你不舒服了，对不起。\n@msg 그냥… 고맙다고 말하고 싶었어요 || 只是……想说声谢谢。"}},{"id":"fan2","t":"台上的游戏与遗失的手机","tm":"晚上 19:40","p":"见面会进行到互动环节，主持人抽出的号码，是你的座位。\n\n你几乎是被推上台的。游戏是「默契考验」：你和{name}背对背，同时比出答案。灯光很热，台下的尖叫声像潮水。\n\n三题里你们对中了两题。下台时你的腿还在抖，回到座位才发现——手机不见了。\n\n隔天中午，一个陌生号码打来。是{name}的经纪人{mgr}，说工作人员在舞台侧边捡到一支手机，锁屏是你的猫。约好在公司附近的咖啡厅归还。\n\n你到的时候，{mgr}身边还坐着一个戴帽子的人。","c":{"yunhee":"{name}从帽檐下探出头：“是我坚持要跟来的！想跟游戏搭档说声谢谢～”","dohyun":"{name}晃着你的手机：“锁屏是猫？跟你一点都不像。”","harin":"{name}把手机放在桌上，指尖推过来：“你的猫，很像我家的 Tofu。”","yul":"{name}看了眼手表：“我刚好在附近。顺便。”说得像早就排好的行程。"},"o":[{"t":"真诚道谢，请{ta}和{mgr}喝咖啡","a":3,"h":0,"r":{"yunhee":"“耶！那我要最贵的！”{ta}笑着点了草莓拿铁。","dohyun":"“喝咖啡多没意思，请我吃甜点。”","harin":"{ta}有些不自在地推开咖啡：“不用了……我不太习惯被请。”气氛一下子变尴尬。","yul":"“我请。”{ta}已经付完了钱，“你是来拿东西的。”"},"m":{},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[-4,-1,"bad"]}},{"t":"聊起台上的默契游戏，问{ta}第三题为什么比那个","a":4,"h":1,"r":{"yunhee":"“因为我以为你会比那个嘛！下次一定对中！”","dohyun":"“是你比错了，不是我。”{ta}坚决不认输。","harin":"{ta}想了想：“因为那一题，我想到的是安静的东西。”","yul":"“直觉。”{ta}停了一下，“你的直觉跟我不一样，有意思。”"},"m":{"dohyun":[1,0],"harin":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[6,1,"best"]}},{"t":"给{ta}看手机里更多猫的照片","a":2,"h":0,"r":{"yunhee":"{ta}看着看着，开始低头滑自己的手机。你说了半天，{ta}只回了「嗯嗯」。","dohyun":"{ta}看了两张就打哈欠：“好了好了，我知道你很爱你的猫。”","harin":"{ta}也拿出手机：“这是 Tofu。它们应该会合得来。”","yul":"“我不是来看猫的。”{ta}看了眼手表，“还有别的事吗？”"},"m":{"harin":[3,0],"yunhee":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"拿回手机就礼貌告辞，不想打扰{ta}休息","a":-3,"h":-1,"r":{"yunhee":"{ta}张了张嘴，最后只是笑笑：“好吧，那你路上小心。”笑得很勉强。","dohyun":"{ta}的脸一下子沉下来：“我特地跟来，你就这样？”{ta}起身就走了。","harin":"{ta}的手指在桌面上停了很久。“……好。”{ta}说完，就没有再抬头。","yul":"“很好。”{ta}说，“我也很忙。”{ta}比你先站起来，没有再看你。"},"m":{"dohyun":[-2,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那天的咖啡厅在一条很安静的巷子里，门口挂着手写的菜单板。你提早十分钟到，推开门时，风铃响了一声。\n\n{mgr}坐在靠窗的位置，看起来是个很干练的人，桌上摆着两部手机和一本行程表。看到你，{mgr}礼貌地点头，说：“我先确认一下，锁屏的猫叫什么名字？”\n\n你说了。{mgr}笑了一下，才把你的手机从包里拿出来。\n\n就在这时，坐在旁边那个戴帽子的人抬起头。","after":{"dohyun":"{mgr}一直在看表，十五分钟后就起身说下一个行程要迟到了。\n\n{name}被拖走前，回头看了你一眼，用口型说了两个字。你没看清楚。\n\n那天晚上，你的手机多了一个联络人。你不记得自己有存过，名字是「도현（猫的恩人）」。\n\n你这才想起来，刚才手机在{ta}手上的那几分钟。\n\n@msg 내 번호 저장해놨다 || 我把我的号码存进去了。\n@msg 고양이 사진 더 보내 || 再传猫的照片给我。\n@msg …명령 아님. 부탁임 || ……不是命令。是拜托。","yul":"{mgr}接了一通电话，表情变得很严肃，说要先回公司处理。{name}点点头，没有跟着走。\n\n“你可以走了。”{ta}对你说，“东西已经还了。”\n\n可是{ta}自己也没动。你们就这样各自喝着咖啡，安静地坐了十分钟。窗外有人在遛狗，{ta}看着那只狗，看了很久。\n\n离开时，{ta}在柜台多买了一个可颂，塞进你手里：“刚才那杯，算我的。这个算你的。”\n\n那天晚上，你收到一则讯息。\n\n@msg 강율입니다. 매니저한테 번호 받았어요 || 我是姜律。跟经纪人要了号码。\n@msg 그래서? 그 고양이 이름이 뭐라고요? || 所以呢？那只猫叫什么名字来着？","yunhee":"那天下午，{name}和你聊了快一个小时。从猫聊到{ta}最近迷上的底片相机，从底片相机聊到{ta}练习生时期偷偷养在宿舍的仓鼠。\n\n{mgr}在旁边看了好几次手表，最后终于忍不住：“允熙，录音。”\n\n“再五分钟！”\n\n“已经说了三次五分钟了。”\n\n{name}只好站起来，临走前塞给你一张拍立得——是刚才趁你不注意偷拍的，你正低头看着手机里的猫。\n\n“送你！”{ta}说，“作为让我笑场的回礼。”\n\n那天晚上，你在拍立得背面发现一行字和一串数字：「下次带猫的照片来！」","harin":"你们聊了很久猫的事。{ta}说 Tofu 很胆小，打雷的时候会躲进衣柜；你说你的猫正好相反，最喜欢趴在窗台看下雨。\n\n“那它们，”{ta}想了想，“一个怕雨，一个喜欢雨。”\n\n说完，{ta}自己先笑了，好像这句话让{ta}想到了什么。\n\n{mgr}在旁边轻轻咳了一声，{ta}才回过神来，站起身向你鞠躬。\n\n那天深夜，{ta}的个人帐号更新了一张照片：一只白猫缩在衣柜里，配文写着：「今天认识了一只喜欢雨的猫。」\n\n你还在看那张照片，手机就震了一下。\n\n@msg 고양이 사진, 하나만 더 보내줄 수 있어요? || 猫的照片，可以再传一张给我吗？"}},{"id":"fan3","t":"视讯签售的定格表情","tm":"晚上 21:05","p":"视讯签售的一分钟，你准备了好久。\n\n结果网络在第二十秒断了。画面卡住时，你正好张着嘴、眼睛半闭，表情惨不忍睹。重新连上时，屏幕那头的{name}已经笑到说不出话。\n\n一个月后，线下签售。你本来以为那件事早被忘了。\n\n你把专辑推过去，{name}抬头看你，停了两秒。","c":{"yunhee":"“啊！是定格的那个！我截图了耶！”{ta}说完才发现自己说漏嘴。","dohyun":"“你是那个——”{ta}模仿了一下你的表情，模仿得一模一样。","harin":"“你那天，后来有好好睡觉吗？那个时间已经很晚了。”","yul":"“你的网络换了吗？”{ta}一本正经，“那天浪费了我四十秒。”"},"o":[{"t":"自嘲：「那是我最上镜的角度」","a":4,"h":0,"r":{"yunhee":"“对！超上镜！我要拿来当壁纸！”","dohyun":"“哈，你挺会的嘛。”{ta}终于正眼看你。","harin":"{ta}笑出声：“你很会把尴尬变成可爱。”","yul":"“自嘲是高级技能。”{ta}难得地点头。"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"捂脸求{ta}忘掉那个画面","a":2,"h":0,"r":{"yunhee":"“为什么要忘掉？”{ta}嘟起嘴，“那是我最喜欢的画面耶……算了。”","dohyun":"“忘掉？”{ta}笑得很坏，“不要。我要拿来笑你一辈子。”说完却没再理你。","harin":"{ta}愣了一下，轻声说：“……好，我忘掉。”语气里有一点受伤。","yul":"“你太在意别人怎么看你了。”{ta}冷淡地说，“这样很累。”"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"问{ta}：那天你是不是也很累了？","a":3,"h":0,"r":{"yunhee":"“嗯……其实那天有点不舒服，你是第一个问的人。”","dohyun":"“我？我从来不累。”{ta}说完，打了个哈欠。","harin":"{ta}看了你很久：“你很细心。”","yul":"“累是工作的一部分。”{ta}顿了顿，“不过谢谢。”"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"安静让{ta}签完，只说一句加油","a":-3,"h":-1,"r":{"yunhee":"{ta}原本准备了好多话，看你这么冷淡，全部吞了回去。","dohyun":"{ta}签名签得很快，连头都没抬。签完就喊：“下一位。”","harin":"{ta}抬头看了你一眼，眼神里有一种「果然」的失望。","yul":"{ta}签完就把专辑推回来，一个字都没多写。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那一个月里，你偶尔会在社群上看到那张截图——你的定格表情，被粉丝做成了表情包，配文是「当偶像突然看向你」。\n\n你本来想当作没这回事。可是今天线下签售，排队的时候，前面的女孩一直在看手机，手机上正好就是那张图。\n\n你把帽子压得更低一点，心里默念：{ta}每天见那么多人，不可能记得的。\n\n轮到你了。","after":{"dohyun":"那天晚上，那张表情包突然又被转发了一波。因为{name}在直播里被问到「最近印象最深刻的粉丝」，{ta}想都没想，就模仿了一个表情。\n\n一模一样。\n\n留言区炸了。你的朋友传了十几张截图给你，后面跟着一长串「ㅋㅋㅋㅋ」。\n\n快一点的时候，你收到一则私讯。\n\n@msg 미안 ㅋㅋㅋ 참을 수가 없었음 || 抱歉ㅋㅋㅋ 忍不住。\n@msg 대신 다음에 밥 사줄게 || 作为补偿，下次请你吃饭。\n@msg 진짜임 || 是真的。","yul":"你离开签售会时，工作人员追出来，递给你一个信封。\n\n“{ta}说，这是那四十秒的补偿。”\n\n信封里是一张签名照，背面用很工整的字写着：「下次网络断线时，记得先闭上嘴巴。」\n\n你站在路边笑出声。\n\n那天晚上，你在信封的角落发现一串小小的数字，像是随手写上去的。你犹豫了很久，才传了一则讯息过去。\n\n很快就有回覆。\n\n@msg 네. 강율 맞아요 || 对，是姜律。\n@msg 그 표정 짤, 내가 제일 먼저 저장했어요 || 那个表情包，我是第一个存的。","yunhee":"签售结束后，VELVET HOUR 的官方帐号发了一则限时动态。照片里，{name}拿着手机，屏幕上正是你那张定格的截图，旁边画了一个大大的爱心。\n\n配文：「谢谢你一直来见我们！」\n\n你不知道该哭还是该笑。\n\n当天深夜，一个粉红色头像的帐号传来讯息。\n\n@msg 혹시 화났어?? ㅠㅠ || 你是不是生气了？？呜呜\n@msg 너무 귀여워서 그랬어용… || 因为太可爱了才这样的……\n@msg 사과의 의미로 다음 주 연습실 구경 올래?! || 为了道歉，下周要不要来参观练习室？！","harin":"那天回家的路上，你一直在想{ta}那句话：「那个时间已经很晚了。」\n\n视讯签售是在晚上十一点。你那天确实很累，加班到十点，赶回家连衣服都没换就上线了。\n\n{ta}看出来了。隔着一个卡住的画面，{ta}看出来了。\n\n深夜，你收到一封私讯，是一段很短的录音。点开来，是{ta}的声音，很轻，像是怕吵醒谁：\n\n“那天之后，我一直有点担心。……今天看到你，气色好多了。那就好。晚安。”\n\n录音只有十二秒。你听了很多遍。"}},{"id":"fan4","t":"后台的临时工作人员","tm":"中午 12:30","p":"朋友临时找你帮忙：签售会缺一个现场引导，只要半天。你想着身为{job}的你，平常也算很会应付人，就答应了。\n\n结果你被分到后台，负责递水和提醒时间。\n\n午休十五分钟，其他人都去吃便当，休息室里只剩你和{name}。{ta}坐在镜子前，盯着手里那份没动过的饭。","c":{"yunhee":"{ta}趴在桌上哀嚎：“好饿但吃不下……你在这里工作多久了？”","dohyun":"{ta}跷着脚滑手机：“新来的？别紧张，我不会咬人。”","harin":"{ta}揉着手腕，声音很轻：“签了四百多张，手有点不像自己的了。”","yul":"{ta}正在看下午的流程表，用笔圈出两个地方：“这里的时间有问题。你帮我跟主办确认。”"},"o":[{"t":"把自己带的润喉糖分给{ta}","a":3,"h":0,"r":{"yunhee":"“哇！是柚子口味！你是天使吧！”","dohyun":"“就一颗？”{ta}嘴上嫌少，还是马上吃了。","harin":"“谢谢。”{ta}把糖纸折成小小的星星。","yul":"{ta}看了包装成分才吃：“这牌子不错。”"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"专业地帮{ta}处理眼前的问题","a":4,"h":0,"r":{"yunhee":"“你好厉害！比我们经纪人还快！”","dohyun":"“啧，挺能干的嘛。”{ta}收起轻佻的表情。","harin":"{ta}安静看着你做事，像在观察什么。","yul":"“效率很高。”{ta}第一次正眼看你，“你叫什么名字？”"},"m":{"yul":[3,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"随口聊起自己的工作，转移{ta}的注意力","a":3,"h":0,"r":{"yunhee":"{ta}一开始很认真听，后来眼神慢慢飘走了。你讲得太久了。","dohyun":"{ta}听了两句就开始滑手机：“喔，是喔。”明显没在听。","harin":"{ta}礼貌地点头，可是你看得出来，{ta}只是想安静一下。","yul":"“我在看流程表。”{ta}头也不抬，“你的工作，晚点再说。”"},"m":{"yunhee":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"保持距离，专心做自己的工作","a":-3,"h":-1,"r":{"yunhee":"{ta}好几次想搭话，最后都闭上嘴，自己默默吃饭。","dohyun":"“好冷淡。”{ta}说，之后整个下午都没再跟你说话。","harin":"{ta}放下筷子，转过身去，背对着你吃完了那份饭。","yul":"{ta}看了你一眼，在流程表上划掉了什么，再也没叫过你。"},"m":{"yunhee":[-2,0],"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"后台比你想象中乱很多。走廊上堆满纸箱和衣架，造型师抱着一大叠衣服跑来跑去，有人在对讲机里喊着时间。\n\n你的工作很简单：每隔四十分钟，提醒成员们喝水、补妆、去洗手间。可是第一个小时你就发现，{name}几乎没动过桌上的水。\n\n你注意到了，{ta}也注意到你注意到了。","after":{"dohyun":"下午的签售比上午更累。你在后台看着{name}签到第三百多张时，手腕开始轻轻抖。{ta}趁着换场的空档，在桌子底下甩了甩手，又若无其事地继续。\n\n收工后，你在后台收拾垃圾，{ta}突然冒出来，往你手里塞了一罐热咖啡。\n\n“工资。”{ta}说，“你今天比我们经纪人还会照顾人。”\n\n那天晚上，你接到朋友的电话，说主办方很满意，问你下次还能不能来。\n\n挂掉电话后，你看见一则陌生号码的讯息。\n\n@msg 다음에도 와 || 下次也来。\n@msg 너 있으니까 물 마시게 됨 || 有你在，我才会记得喝水。","yul":"那天下午，你帮{ta}确认了流程表上的两个问题。主办方原本还想敷衍，但你把时间一条条摊开来对，最后他们不得不改。\n\n{name}从头到尾都在旁边看着，一句话都没说。\n\n收工时，{ta}的助理找到你，递给你一张名片。“律哥说，如果你之后有兴趣，工作室缺一个像你这样的人。”\n\n你看着那张名片，上面是工作室的地址和一个手写的电话号码。\n\n晚上十点，你收到一则讯息。\n\n@msg 명함은 진심이에요 || 名片是认真的。\n@msg 근데 일 말고도, 연락해도 돼요 || 不过除了工作，也可以联络。","yunhee":"那天收工后，{name}缠着你要你的联络方式。\n\n“我们成员都说你超可靠！”{ta}说，“下次签售我要指定你！”\n\n你说你只是临时帮忙的，{ta}就鼓起脸：“那就不是工作，是朋友！”\n\n晚上，你收到一大串讯息，全部都是{ta}传的：\n\n@msg 오늘 진짜 고마웠어용!! || 今天真的谢谢你！！\n@msg 목캔디 브랜드 뭐야?? 나도 살래!! || 润喉糖是什么牌子？？我也要买！！\n@msg 아 그리고 너 일하는 거 멋있었어 || 啊还有，你工作的样子很帅。\n\n最后一则隔了五分钟才传来，像是犹豫了很久。","harin":"下午的签售结束后，{name}在休息室里一个人坐了很久。你进去收拾东西时，看见{ta}在一张纸巾上写字，写了又划掉。\n\n{ta}注意到你，把纸巾揉成一团，又慢慢摊开，递给你。\n\n上面写着几行字，像是歌词：「今天有人看见了我手腕的酸。」\n\n“送你。”{ta}说，有点不好意思，“我不太会说谢谢，只好写下来。”\n\n那天晚上，你把那张纸巾夹进了笔记本里。\n\n深夜，你收到一封私讯：\n\n@msg 그 냅킨… 버려도 돼요 || 那张纸巾……丢掉也没关系。\n@msg 근데 안 버렸으면 좋겠어요 || 不过，希望你没丢。"}},{"id":"fan5","t":"排队时的中暑粉丝","tm":"下午 14:10","p":"户外场地的队伍排到马路边，七月的太阳毒得像要把人晒化。\n\n你前面的女孩突然晃了一下，整个人往旁边倒。你一把扶住她，让她坐到阴影里，拿出水和冰袋，又叫了现场医护。\n\n等你回到队伍时，已经错过了你的号码。工作人员让你排到最后。\n\n签售结束前，一位工作人员找到你：“{name}说，刚才在台上看到了。想当面谢谢你。”你被带到帐篷后面。","c":{"yunhee":"{name}一看到你就冲过来：“你超帅的！我在台上看得一清二楚！”","dohyun":"{name}抱着手臂：“你反应挺快啊。我都还没看清楚。”","harin":"{name}把一瓶冰水递给你：“你自己也晒了很久吧。先喝。”","yul":"{name}直接问：“那位粉丝现在怎么样？”确认没事后，才转向你。"},"o":[{"t":"说只是做了该做的事，先问那个女孩好不好","a":4,"h":0,"r":{"yunhee":"“你怎么这么好！”{ta}眼眶有点红。","dohyun":"{ta}别开脸：“……啧，好人。”","harin":"“已经送去休息了。”{ta}轻声说，“你也该休息。”","yul":"“她没事。”{ta}点头，“你这样的人不多。”"},"m":{"yul":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"半开玩笑地问：那我错过的签名可以补吗？","a":3,"h":1,"r":{"yunhee":"“可以！而且是特别版！”{ta}画了满满一页。","dohyun":"“想得美。”{ta}嘴上这么说，还是签了，还多画了一个爱心又涂掉。","harin":"{ta}笑了：“我还以为你会客气。”认真签了名。","yul":"“交换条件。下次别把自己晒成这样。”"},"m":{"dohyun":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"说你学过急救，平常就会注意","a":2,"h":0,"r":{"yunhee":"“喔……好厉害喔。”{ta}说，可是兴致明显降了下来。","dohyun":"“喔，所以你是来炫耀的？”{ta}挑眉，语气有点刺。","harin":"{ta}点点头，可是没有再接话。好像你把一件温柔的事，说成了一件功劳。","yul":"“我问的不是你的资历。”{ta}说，“我问的是那个女孩。”"},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"害羞地说没什么，转身就要走","a":-3,"h":-1,"r":{"yunhee":"{ta}追了两步，看你头也不回，慢慢停下脚步，表情很失落。","dohyun":"“喂——”{ta}叫了一声，你没回头。{ta}站在原地，很不爽地踢了一下地面。","harin":"{ta}看着你的背影，把那瓶冰水慢慢放回了桌上。","yul":"“我还没说完。”{ta}的声音冷下来。你走了，{ta}也没有再叫你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"医护人员赶到时，那个女孩已经清醒了一点，抓着你的手一直说对不起。你蹲在她旁边，帮她扇风，等她的朋友赶来。\n\n等一切安顿好，你回到队伍。工作人员很抱歉地说，号码已经过了，只能排到最后。\n\n你在烈日下又站了一个多小时。汗水湿透了衬衫，手里的专辑被晒得发烫。可是你一点都不后悔。\n\n签售快结束时，你终于排到了。可是还没走到台前，就有工作人员拦住你。","after":{"dohyun":"后来，{ta}亲自送你走到场馆门口。\n\n“你下次排队，”{ta}说，“记得戴帽子。你的脸都晒红了。”\n\n你摸摸脸颊，确实烫得厉害。\n\n{ta}从口袋里掏出一个东西丢给你：是一个便携式小电扇，上面贴着 NOVA LINE 的贴纸。“我的。借你。”\n\n那天晚上，你在新闻上看到一则小报导：「NOVA LINE 签售现场粉丝中暑，忙内道贤签售后亲自确认粉丝状况」。\n\n报导里没有提到你。可是你的手机里，多了一则讯息：\n\n@msg 선풍기 돌려줘야 함 || 电扇要还我。\n@msg 그러니까 또 만나야 됨 || 所以还要再见面。","yul":"{ta}后来跟你聊了二十分钟。问你在哪里学的急救，问你的工作，问你平常是不是都这样。\n\n“这样是怎样？”你问。\n\n“把别人放在自己前面。”{ta}说，“这个习惯不好。会吃亏。”\n\n你说你不觉得是吃亏。{ta}看了你很久，没有再说什么。\n\n那天晚上，你收到一则讯息，附上一个连结，是附近一家你很喜欢的冷面店。\n\n@msg 오늘 더위 먹었을 거예요 || 你今天应该中暑了。\n@msg 내일 점심. 제가 살게요 || 明天中午，我请。\n@msg 거절은 안 받아요 || 不接受拒绝。","yunhee":"那个中暑的女孩后来在社群上发文，说她在签售会晕倒，有一个陌生人救了她。\n\n那篇文被转发了好几千次。底下有人留言说，看到允熙签售后特地去找那个人道谢。\n\n那天晚上，你收到一则讯息。\n\n@msg 그 팬분이 너 찾고 있대!! 고맙다고!! || 那位粉丝在找你！！说要谢谢你！！\n@msg 근데 나도 고마워… || 不过我也谢谢你……\n@msg 그 순간에 아무것도 못 해서 진짜 속상했거든 || 那时候我什么都做不了，真的很难受。\n\n你看着最后那一行，突然觉得，台上那个永远在笑的人，原来也会这样。","harin":"你离开前，{ta}叫住你，从包里拿出一小罐芦荟胶。\n\n“擦脸。”{ta}说，“晒成这样，晚上会痛。”\n\n你接过来，罐子上还贴着一张手写标签：「Tofu 的主人专用」。\n\n“我自己也会晒伤。”{ta}解释，“所以随身带着。”\n\n那天晚上，你的脸果然开始发烫。你擦着那罐芦荟胶，收到一封私讯：\n\n@msg 바르고 있어요? || 有在擦吗？\n@msg 오늘 당신 같은 사람을 봐서, 노래 하나 쓰고 싶어졌어요 || 今天看到你这样的人，突然想写一首歌。"}}],"friend":[{"id":"fri1","t":"好友的生日派对","tm":"晚上 20:00","p":"好友的生日派对在弘大一间包场的小酒馆。你推门进去时，灯光昏黄，有人在弹吉他。\n\n“对了，我高中同学也来了。”好友压低声音，“你别尖叫啊。”\n\n你顺着她的视线看过去，角落沙发上坐着的，是{name}。没有舞台妆，穿着普通的衣服，正在剥花生。\n\n好友把你拉过去：“这是{me}，我最好的朋友，{job}。”","c":{"yunhee":"{name}眼睛弯成月牙：“哇，她常常提到你！终于见到本人了！”","dohyun":"{name}抬了抬下巴：“你就是那个常常被她拿来炫耀的朋友？”","harin":"{name}轻轻点头，往旁边挪了挪，留出一个位子给你。","yul":"{name}打量了你一眼：“{job}？什么方向的？”第一句就是问题。"},"o":[{"t":"像对待普通人一样自然打招呼，坐下聊天","a":4,"h":0,"r":{"yunhee":"{ta}拉着你一起拍了好多照片，说不会上传。","dohyun":"“你不是粉丝？”{ta}有点意外，又有点高兴。","harin":"{ta}慢慢开口，说这种场合有人自然对待{ta}，很难得。","yul":"“好。没有大惊小怪。”{ta}给你倒了一杯酒。"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"老实承认你听过{ta}的歌，很喜欢某首B面曲","a":3,"h":0,"r":{"yunhee":"“真的吗！那首是我最爱的！”{ta}激动地抓住你的手。","dohyun":"“你是粉丝喔？”{ta}的笑容一下子变得很营业，“谢谢支持～”距离瞬间拉远了。","harin":"{ta}怔住：“那首是我写的。谢谢你听见它。”","yul":"“为什么喜欢？”{ta}追问，你说完理由后，{ta}沉默地点头。"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"帮忙张罗派对，没空多理{ta}","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你说话，你一直在忙。最后{ta}拿起包，提早走了。","dohyun":"你忙了一整晚，{ta}从头到尾都在跟别人玩。散场时，{ta}连再见都没跟你说。","harin":"{ta}一直想跟你说话，你却在忙。{ta}最后一个人去了露台。","yul":"你忙了一整晚，{ta}看你的眼神越来越冷：“你来这里，是为了躲我？”"},"m":{"yul":[1,0],"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}},{"t":"和{ta}拼酒，看谁先投降","a":2,"h":1,"r":{"yunhee":"{ta}三杯就脸红了，你还在倒。{ta}的笑容越来越勉强：“我、我真的不行了……”","dohyun":"“来啊！”{ta}兴奋得眼睛发亮，最后两个人都趴下。","harin":"你硬是要{ta}喝，{ta}拒绝了三次，脸色越来越白，最后起身离开了座位。","yul":"“我不跟陌生人拼酒。”{ta}把你的杯子推开，“尤其是想灌醉我的陌生人。”"},"m":{"dohyun":[3,0],"harin":[-2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}}],"x":"派对的气氛很好。有人在唱歌，有人在玩游戏，空气里都是炸鸡和啤酒的味道。\n\n一开始你还有点紧张，不太敢往{name}那边看。可是好友一直把你往那边推，最后你还是被按在了{ta}旁边的位子上。\n\n近看的{name}，跟屏幕上不太一样。没有舞台妆，皮肤上有一点点疲惫的痕迹，指甲剪得很短，袖口有一小块洗不掉的颜料。","after":{"dohyun":"派对到后来变成了卡拉OK大会。{name}被起哄唱了一首，却故意唱得很难听，全场笑到不行。\n\n轮到你的时候，{ta}抢过遥控器，点了一首合唱的歌。\n\n“不准拒绝。”{ta}说，“我刚刚为了大家牺牲形象了。”\n\n那首歌你们唱得乱七八糟，可是好友说，那是整晚最好笑的表演。\n\n散场时已经凌晨两点。{ta}站在门口叫车，帽子压得很低。\n\n“你住哪？”{ta}问，“顺路的话一起。”\n\n不顺路。可是{ta}还是坚持先送你。\n\n到家后，你收到一则讯息：「到了说一声。我不是担心，只是不想被你朋友骂。」","yul":"那天晚上，你们聊了很久。从你的工作，聊到{ta}最近在准备的一部电影，再聊到你们都喜欢的一个导演。\n\n{ta}讲话很快，观点很尖锐，但每次你反驳，{ta}都会停下来认真听。\n\n“你很少被说服吧？”你问。\n\n“很少。”{ta}说，“但你刚才那个论点，我会回去想想。”\n\n派对结束时，好友拉着你小声问：“你们聊什么聊那么久？他平常对人很冷淡的。”\n\n你说你也不知道。\n\n那天深夜，{ta}传来一个电影的连结：「你说的那部。我找到了。」\n\n后面又补了一句：「看完再跟你吵。」","yunhee":"{name}一整晚都黏在你旁边。一下拉你去拍照，一下拉你去抢最后一块蛋糕，一下又跟你分享{ta}手机里成员们的丑照。\n\n“这张不准外流喔！”{ta}一边说，一边笑到停不下来。\n\n好友在旁边看着，偷偷对你挤眉弄眼。\n\n派对结束时，{name}抱着你的手臂不肯放：“我们加好友！一定要！”\n\n那天晚上，你的手机响个不停。{ta}传了几十张今晚的照片给你，每一张你都在笑。\n\n最后一则讯息是：\n\n@msg 오늘 처음 본 사람 같지 않았어 || 今天不像是第一次见面。\n@msg 이상하지?? || 很奇怪吧？？","harin":"派对后半，大家都喝开了，越来越吵。{name}悄悄站起来，往露台走。\n\n你过了五分钟，也端着两杯水跟了出去。\n\n{ta}靠在栏杆上，看着弘大街头的灯。听到脚步声，{ta}回过头，看到是你，好像松了一口气。\n\n你们在露台上待了很久，没说太多话。{ta}说{ta}不太擅长人多的场合，可是好友的生日不能不来。\n\n“还好有你。”{ta}说，“不然我会在这里一个人站到结束。”\n\n那天晚上，你收到一封很短的私讯：\n\n@msg 오늘 물 고마웠어요 || 今天谢谢你的水。\n@msg 다음엔 조용한 데서 만나요 || 下次，在安静的地方见吧。"}},{"id":"fri2","t":"深夜工作室的拼单外卖","tm":"深夜 00:40","p":"你朋友的室友是作曲家，工作室就在你家楼下。今晚朋友把你叫下去，说要拼单叫炸鸡。\n\n工作室里很乱，到处是线和乐谱。录音间的门开着，里面有人戴着耳机，正在反复录同一句。\n\n是{name}。\n\n“{ta}来录 demo，已经录了四个小时。”朋友小声说，“别打扰{ta}。”\n\n外卖到的时候，{name}摘下耳机走出来，头发乱糟糟的，眼睛里全是血丝。","c":{"yunhee":"{name}一闻到炸鸡就活过来了：“天啊！是我最爱的那家！”","dohyun":"{name}直接坐下抓了一块：“谁点的？太懂了。”然后才注意到你，“你谁？”","harin":"{name}站在门边，好像不确定自己能不能加入。","yul":"{name}看了眼时间：“快一点了。你们明天不用上班？”"},"o":[{"t":"招呼{ta}一起吃，把最好的鸡腿给{ta}","a":3,"h":0,"r":{"yunhee":"“你人太好了！”{ta}啃得满嘴是油。","dohyun":"“懂事。”{ta}理所当然地收下。","harin":"{ta}小口吃着，说很久没有和人一起吃宵夜了。","yul":"“你自己吃。”{ta}把鸡腿推回来，换了一块翅膀。"},"m":{"dohyun":[2,0],"harin":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"说你刚才在门外听到的那一句，真的很好听","a":4,"h":0,"r":{"yunhee":"“真的吗？我一直觉得高音不稳耶！”","dohyun":"“我知道。”{ta}嘴硬，却偷偷笑了。","harin":"{ta}看着你很久：“你听到的是哪一个版本？第三遍还是第七遍？”","yul":"“好听不够。说具体。”你说完，{ta}若有所思。"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"提醒{ta}先喝点水，录这么久嗓子会坏","a":3,"h":0,"r":{"yunhee":"“嗯……知道了。”{ta}乖乖喝了，可是之前的兴奋全不见了。","dohyun":"“你是我妈吗？”{ta}不耐烦地说，把水推开。","harin":"{ta}点点头，可是话变少了。好像你的关心让{ta}觉得自己很狼狈。","yul":"“我知道自己的状况。”{ta}冷冷地说，“不需要你提醒。”"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吃完就回楼上，不打扰{ta}工作","a":-3,"h":-1,"r":{"yunhee":"“欸？要走了？”{ta}手里还拿着要分给你的鸡翅，愣在那里。","dohyun":"你上楼时，听见{ta}在后面说：“没意思。”","harin":"{ta}站在门边，看你上楼，什么都没说。","yul":"{ta}看都没看你，戴上耳机回了录音间。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"工作室的灯是暖黄色的，墙上贴满了便利贴，写着和弦和歌词的片段。角落的沙发上堆着一条毯子和几个空的咖啡杯，看起来有人在这里睡过不只一晚。\n\n朋友的室友是一个戴着毛线帽的作曲家，看到你们就挥手，然后继续盯着屏幕。\n\n你从录音间的玻璃往里看。{name}闭着眼睛唱着同一句，第七遍、第八遍，每一遍都有一点点不同。你听不出哪一遍比较好，但你听得出，{ta}很累了。","after":{"dohyun":"吃完炸鸡，{name}又回去录了两遍。第二遍结束时，作曲家终于比了一个OK的手势。\n\n{ta}从录音间出来，整个人倒在沙发上，像一条咸鱼。\n\n“完了。”{ta}说，“我要睡在这里。”\n\n你们收拾外卖盒时，{ta}突然坐起来：“喂，你明天也会来吗？”\n\n“我住楼上。”\n\n“那我饿了就去敲你的门。”{ta}说，说得理所当然。\n\n你以为{ta}在开玩笑。\n\n隔天晚上十一点，你的门铃真的响了。门外站着{name}，手里提着两份辣炒年糕。\n\n“昨天你请我，”{ta}说，“今天换我。”","yul":"{name}吃完后，又回到录音间。这一次{ta}没有关门。\n\n你听着{ta}唱那一句，第九遍、第十遍。到了第十一遍，你突然听懂了{ta}在找什么：一个更轻的转音。\n\n你没忍住，小声说了一句。\n\n录音间里的{ta}停了下来，看着你，看了很久。\n\n然后{ta}唱了第十二遍，用了你说的那个转音。\n\n作曲家跳起来：“就是这个！”\n\n凌晨两点，你回到楼上。手机亮了一下。\n\n@msg 그 한마디 덕분에 퇴근해요 || 托你那一句话的福，可以下班了。\n@msg 다음 데모도 들어줄래요? || 下一首 demo，也来听吗？","yunhee":"吃完炸鸡，{name}的精神好了很多，又回去录了三遍。\n\n最后一遍录完，{ta}在录音间里蹦蹦跳跳地跟大家比V。作曲家说今天终于可以收工了，{ta}就欢呼着冲出来，抱住离{ta}最近的人。\n\n那个人是你。\n\n{ta}愣了一秒，然后笑着放开：“啊！对不起！太开心了！”\n\n你回到楼上时，耳朵还是红的。\n\n半夜，你收到一则讯息：\n\n@msg 아까 안은 거… 실수 아님 || 刚才那个拥抱……不是失误。\n@msg 아 그러니까 고맙다는 뜻!! || 啊就是说谢谢的意思！！\n@msg 이상하게 듣지 마!! || 不要想歪！！","harin":"你回楼上前，在工作室门口回头看了一眼。{name}坐在角落的沙发上，抱着膝盖，戴着耳机，在听刚才录的那几遍。\n\n{ta}的表情很专注，偶尔皱眉，偶尔轻轻点头。\n\n那天之后，你常常在深夜听到楼下传来隐约的歌声。有时候是同一句，有时候是新的旋律。\n\n一个星期后，你在楼梯间遇到{ta}。{ta}看起来比那天精神多了，手里提着一袋猫粮。\n\n“那首歌，”{ta}说，“完成了。”\n\n{ta}递给你一个 USB：“你是第一个听的人。因为那天……你说好听。”"}},{"id":"fri3","t":"婚礼上的同一桌","tm":"中午 12:00","p":"大学学姐的婚礼，你被安排在第七桌。\n\n座位卡上，你旁边写着一个你在电视上看过无数次的名字。\n\n“新郎是{ta}的表哥。”学姐悄悄说，“{ta}今天是家属，不是偶像，拜托你们正常一点。”\n\n{name}准时入座，穿着简单的西装外套，和平常舞台上完全不一样。整张桌子突然安静得只剩下刀叉的声音。","c":{"yunhee":"{name}小声对你说：“大家好紧张喔，我们讲点话好不好？”","dohyun":"{name}拿起菜单研究：“这个牛排几分熟？”完全没在管气氛。","harin":"{name}很安静，只在你递酱料时说了声谢谢。","yul":"{name}低声对你说：“你左手边那位一直在偷拍。帮我挡一下。”"},"o":[{"t":"主动帮{ta}挡掉偷拍和搭讪","a":4,"h":0,"r":{"yunhee":"“你好可靠！”{ta}用嘴型对你说。","dohyun":"{ta}挑眉看你：“挺会的嘛，保镖。”","harin":"{ta}终于放松了肩膀，开始跟你聊天。","yul":"“配合得很好。”{ta}在你杯子里倒了酒。"},"m":{"yul":[3,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"聊新娘新郎的恋爱故事","a":3,"h":0,"r":{"yunhee":"“好浪漫！我也想要这样的婚礼！”","dohyun":"“好无聊喔，这种话题。”{ta}打了个哈欠，转头去玩手机了。","harin":"“他们会一直幸福吧。”{ta}看着台上，眼神很柔。","yul":"“我对别人的恋爱没兴趣。”{ta}说，“包括他的。”气氛冷了下来。"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"一起偷偷吐槽婚礼上的冗长致词","a":3,"h":1,"r":{"yunhee":"{ta}笑了两下，可是你吐槽得太过分了，{ta}的表情慢慢变得尴尬：“那是我表哥……”","dohyun":"“你也这样觉得？”{ta}跟你比赛谁先打哈欠。","harin":"{ta}没有笑。“他是真心的，”{ta}小声说，“我不想笑他。”","yul":"“这段可以剪掉三分之二。”{ta}评论得很专业。"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"专心吃饭，不想给{ta}压力","a":-3,"h":-1,"r":{"yunhee":"{ta}好几次想找你说话，你都只顾着吃。{ta}最后放下叉子，不吃了。","dohyun":"整顿饭你都没跟{ta}说话。散场时，{ta}说：“你是哑巴吗？”转身就走。","harin":"整顿饭，你们之间只有刀叉的声音。散场时，{ta}礼貌地点头，像对待陌生人。","yul":"那个人又偷拍了三次，你都没管。{ta}最后起身，换到了另一桌。"},"m":{"harin":[1,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"婚礼的仪式很长。新郎在台上念誓词念到一半就哭了，新娘一边笑一边帮他擦眼泪。\n\n你偷偷看了一眼旁边的{name}。{ta}看着台上，表情很柔和，好像真的在为表哥高兴。\n\n然后{ta}注意到你的视线，转头看你。你们对视了一秒，又同时转回去。\n\n接下来就是午宴。服务生开始上菜，整张桌子依然安静得可怕。","after":{"dohyun":"午宴后，新人在门口送客。{name}被一群亲戚围住，要合照、要签名。\n\n你本来想直接离开，却被{ta}一把拉住袖子：“等我。五分钟。”\n\n最后变成了二十分钟。{ta}终于脱身时，领带歪了，头发也乱了，一脸生无可恋。\n\n“走。”{ta}说，“我知道附近有一家很好吃的冰店。”\n\n你们穿着正装，坐在路边的冰店里吃红豆刨冰。{ta}吃得很快，嘴角沾了一点炼乳。\n\n你指了指，{ta}随手一擦，笑了：“今天最开心的就是现在。”\n\n那天晚上，{ta}传来一张照片，是你吃刨冰的侧脸。「偷拍成功。」","yul":"婚礼结束后，{name}在停车场叫住你。\n\n“刚才谢谢你。”{ta}说，“那个人后来又拍了三次，都被你挡掉了。”\n\n你说没什么，{ta}却很认真地看着你：“很少人愿意为了一个刚认识的人得罪别人。”\n\n“你是我学姐的家人。”你说。\n\n“不是因为这个吧。”{ta}说。\n\n你没有回答。{ta}也没有追问，只是拿出手机：“号码。”\n\n那天晚上，你收到一则讯息：\n\n@msg 오늘 같은 테이블이라 다행이었어요 || 今天能同桌，真是太好了。\n@msg 다음엔 테이블 말고, 둘이서 || 下次不要同桌，就我们两个。","yunhee":"午宴后，新娘把捧花丢了出来。所有人都在抢，{name}也冲上去，结果捧花打到{ta}的头，弹到了你怀里。\n\n全场爆笑。\n\n{name}捂着头，委屈地看着你：“那是我的！”\n\n“那还你？”\n\n“不要！”{ta}说，“是它自己选你的！”\n\n后来你们抱着那束捧花，在婚宴会场外面拍了好多照片。\n\n那天晚上，{ta}传来一则讯息：\n\n@msg 부케 받은 사람은 다음에 결혼한대!! || 听说接到捧花的人下一个结婚！！\n@msg …축하해?? ㅋㅋㅋ || ……恭喜？？ㅋㅋㅋ","harin":"婚礼结束后，大家都去续摊。{name}跟新人道别后，一个人走向公车站。\n\n你刚好也要搭同一班车。\n\n车上人很少，你们并排坐着。{ta}一直看着窗外，看了很久，才轻声说：\n\n“我小时候以为，结婚就是两个人终于不用再一个人了。”\n\n“现在呢？”\n\n“现在也是这样想。”{ta}说，“只是觉得，对我来说很难。”\n\n你不知道该怎么回答。{ta}也没有等你回答。\n\n下车前，{ta}转头看你：“今天跟你坐同一桌，很好。”\n\n那天晚上，你收到一首歌的连结。是一首很老的情歌，{ta}说，是今天婚礼上放的那首。"}},{"id":"fri4","t":"桌游局的搭档","tm":"晚上 19:30","p":"朋友拉你去一间桌游咖啡厅，说今晚人凑不齐。\n\n你到的时候，桌边已经坐了四个人。其中一个戴着毛线帽，正在洗牌，手法利落得像职业的。\n\n那是{name}。\n\n“抽签分组。”朋友宣布。你抽到红色，{name}也是红色。\n\n今晚的游戏是一个需要互相猜意图的合作游戏。只要配合失误一次，就会全盘皆输。","c":{"yunhee":"{name}举手欢呼：“搭档！我们一定会赢！”","dohyun":"{name}转着骰子：“你最好别拖我后腿。”","harin":"{name}小声说：“我很不会这种游戏……对不起。”","yul":"{name}把规则摊开：“我们先定好暗号。”"},"o":[{"t":"认真讨论策略，和{ta}定下暗号","a":3,"h":0,"r":{"yunhee":"{ta}的暗号是眨眼，结果一直眨，被识破了。","dohyun":"“摸鼻子就是要冲。”{ta}说完马上摸了三次。","harin":"{ta}慢慢放松下来：“好，我会努力记住。”","yul":"“很好。”{ta}跟你对了三遍，满意地点头。"},"m":{"yul":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"凭直觉乱打，跟{ta}一起冒险","a":3,"h":1,"r":{"yunhee":"“好刺激！”{ta}每一回合都尖叫。","dohyun":"“就是这样！”{ta}跟你击掌，两个人越玩越疯。","harin":"{ta}被吓到好几次，但最后笑得最开心。","yul":"“没有计划？”{ta}皱眉，最后却赢了，{ta}沉默了一下：“……运气也是实力。”"},"m":{"dohyun":[3,0],"yunhee":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"一直让{ta}做决定，你配合就好","a":2,"h":0,"r":{"yunhee":"“你也说点什么嘛……”{ta}说，后来就自己玩自己的了。","dohyun":"“你都没主见喔？”{ta}说，“跟你一组好无聊。”","harin":"你一直让{ta}做决定，{ta}压力大到手在发抖，最后小声说：“我……不想玩了。”","yul":"“我需要的是搭档，不是跟班。”{ta}说完，就不再问你的意见。"},"m":{"yul":[1,0],"harin":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"输了就耍赖说是规则有问题","a":-3,"h":-1,"r":{"yunhee":"“欸，可是我们真的输了啊……”{ta}尴尬地笑，转头跟别人说话去了。","dohyun":"“输不起？”{ta}冷笑一声，“下次不要跟我一组。”","harin":"{ta}被你逗笑了一下，可是看你一直耍赖，表情慢慢变得不自在。","yul":"“输就是输。”{ta}把规则书合上，“我不跟耍赖的人玩。”"},"m":{"yunhee":[1,0],"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"桌游咖啡厅在一栋老建筑的地下室，墙上满满都是游戏盒，灯光昏暗，每张桌子上都放着一盏小台灯。\n\n朋友介绍的时候，只说是「朋友的朋友」。直到{name}拿下毛线帽，你才认出来。\n\n其他人显然早就知道了，一点都不惊讶。有人跟你解释：“{ta}每个月都会来一次，这里的老板是{ta}的老同学，很安全。”\n\n你点点头，假装自己很冷静。","after":{"dohyun":"那天你们一共玩了五局。前三局你们配合得乱七八糟，第四局开始突然找到了节奏，最后两局连赢。\n\n赢了最后一局时，{name}兴奋地站起来，一把勾住你的肩膀大喊。整间桌游店的人都在看你们。\n\n“下个月，”{ta}说，“你还要来。我们要卫冕。”\n\n那天之后，你们有了一个群组，名字叫「红队不败」。\n\n群组里只有你们两个人。\n\n@msg 연습하자 || 来练习吧。\n@msg 온라인 버전 있음 || 有线上版。\n@msg 오늘 밤 11시 || 今晚十一点。","yul":"那天你们赢了三局，输了两局。输的那两局，{name}都会在结束后把规则书翻出来，跟你检讨哪一步走错了。\n\n其他人都受不了地走开了，只有你还在听。\n\n“你不觉得我很烦？”{ta}问。\n\n“有一点。”你说，“但你说得对。”\n\n{ta}愣了一下，笑了。那是你第一次看到{ta}笑得那么不设防。\n\n散场时，{ta}在门口等你。\n\n“下次，”{ta}说，“我们挑战那个最难的游戏。只有我们两个。”\n\n那天晚上，{ta}传来一张照片：一个厚得像字典的游戏盒。「研究规则中。」","yunhee":"那天你们输了四局，只赢了一局。可是{name}一点都不在意，每一局都笑得最大声。\n\n唯一赢的那一局，{ta}激动得抱着你转了一圈，撞翻了旁边的骰子盒。\n\n“我们是最佳搭档！”{ta}宣布。\n\n散场后，你们一起去便利商店买冰淇淋。{ta}站在冷冻柜前犹豫了五分钟，最后买了两种口味，分你一半。\n\n“我有选择困难症。”{ta}说，“所以每次都要找人分。”\n\n那天晚上，{ta}传来讯息：\n\n@msg 다음에도 아이스크림 반띵 해줄 거지?? || 下次也会跟我分冰淇淋吧？？","harin":"第三局开始，{name}慢慢不紧张了。你发现{ta}其实很会观察，只是不敢说出来。\n\n“你刚刚看出来了吧？”你小声问，“对面在骗人。”\n\n{ta}犹豫了一下，点点头。\n\n“那下次直接说。”你说，“我相信你。”\n\n最后一局，{ta}第一次主动出声，说出了对面的意图。你们赢了。\n\n{ta}看着你，眼睛亮得惊人：“我……我说对了。”\n\n那天晚上，{ta}传来一封私讯：\n\n@msg 오늘 처음으로 게임이 재밌었어요 || 今天第一次觉得游戏好玩。\n@msg 믿어줘서 고마워요 || 谢谢你相信我。"}},{"id":"fri5","t":"试营业的咖啡店","tm":"上午 10:30","p":"朋友的咖啡店下周开幕，今天试营业，只招待熟人。你被抓来当临时店员，负责端盘子和收集意见。\n\n十点半，门上的风铃响了。\n\n进来的人戴着口罩，压低帽檐，环顾四周后才拉下口罩。\n\n“{ta}是我们老板的大学学{g:弟|妹}。”另一个店员小声说，“今天是来帮忙试菜的。”\n\n{name}看着菜单，看了很久，然后抬头看你。","c":{"yunhee":"{name}眼睛一亮：“我可以每一样都点一点点吗？”","dohyun":"{name}手指敲着桌面：“最甜的那个。还有，推荐一个你最爱的。”","harin":"{name}小声问：“这里有……不是咖啡的东西吗？”","yul":"{name}直接说：“菜单太长了。你推荐三样，我只试那三样。”"},"o":[{"t":"推荐你最喜欢的一款，并说出理由","a":4,"h":0,"r":{"yunhee":"“好好喝！你很会推荐耶！”","dohyun":"“嗯……”{ta}喝完一杯，“再来一杯。”","harin":"{ta}捧着杯子，说你描述的味道很像一首歌。","yul":"“好。你懂。”{ta}又追问了烘焙度。"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"亲手帮{ta}做一杯特调","a":3,"h":1,"r":{"yunhee":"{ta}拿出底片相机拍你做饮料的样子。","dohyun":"“喂，这爱心是什么意思？”{ta}故意问。","harin":"“很好喝。”{ta}说完，又小口喝了一次，好像舍不得。","yul":"“步骤错了两个。”{ta}说，“你不熟就不要做。”{ta}把杯子推到一边。"},"m":{"yunhee":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"认真把{ta}的意见记下来，转达给老板","a":3,"h":0,"r":{"yunhee":"{ta}说了很多，你一直低头写。{ta}说着说着，就不说了。","dohyun":"“你干嘛一直记？”{ta}说，“好像在开会。”","harin":"{ta}说得很小声，你记得很大声，{ta}有点不好意思，后来就不太说了。","yul":"“你的笔记整理得比他们的企划还清楚。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"忙着招呼其他客人，只匆匆送上饮料","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你说话，你都在忙。{ta}最后跟老板说：“店员好冷淡喔。”","dohyun":"{ta}等了半天，你只匆匆放下饮料就走了。{ta}说：“服务真差。”","harin":"你匆匆放下饮料就走了，连{ta}问的问题都没回答。{ta}安静地喝完，提早走了。","yul":"你一直在忙别人。{ta}喝完那杯，结帐就走了，连评语都没写。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"咖啡店装潢得很温暖，原木桌椅，墙上挂着老板自己拍的照片。试营业只开放半天，客人都是熟人，气氛很轻松。\n\n你一早就到了，帮忙擦桌子、摆餐具、试做了几杯饮料。老板很满意，说你天生就适合干这行。\n\n十点半之前，店里只有几个老板的大学朋友。他们一边聊天，一边对你的拉花评头论足。\n\n然后门上的风铃响了。","after":{"dohyun":"{name}在店里待了一整个上午。试完所有甜点，又跟老板的朋友们打了一场手机游戏，赢了还要求大家请{ta}喝饮料。\n\n快中午时，{ta}晃到吧台前，看你洗杯子。\n\n“你明天还来吗？”{ta}问。\n\n“试营业只有今天。”\n\n“喔。”{ta}说，好像有点失望，“那正式开幕呢？”\n\n你说你只是来帮忙的，{ta}就皱眉：“那以后谁帮我做那杯？”\n\n那天晚上，老板打电话给你，语气很奇怪：“喂，我学弟问我你的联络方式。要给吗？”","yul":"{name}试完你推荐的三样，在笔记本上写了很长的评语。写完了，{ta}撕下那一页，递给你。\n\n“给老板。”{ta}说，“也给你。”\n\n你看了一眼。评语写得很专业，最后一行却跟咖啡无关：「店员很好。建议加薪。」\n\n{ta}离开前，站在门口回头：“你每天都在这里？”\n\n“只有今天。”\n\n“可惜。”{ta}说，“我本来打算常来的。”\n\n那天晚上，你收到一则讯息：\n\n@msg 커피 말고, 다른 데서도 만날 수 있어요? || 不在咖啡店的话，也可以见面吗？","yunhee":"{name}在店里待了很久，每一样都试了一口，最后撑得趴在桌上。\n\n“我好像吃太多了……”{ta}哀嚎。\n\n你端了一杯温水给{ta}，{ta}抬头，可怜兮兮地看着你：“你会做消化的饮料吗？”\n\n你做了一杯热的柚子茶。{ta}捧着杯子，眯着眼睛，像只晒太阳的猫。\n\n离开前，{ta}拿出底片相机，硬是拉着你在店门口拍了一张合照。\n\n“开幕那天我会来！”{ta}说，“你也要在喔！”\n\n那天晚上，你收到讯息：\n\n@msg 사진 현상하면 줄게!! || 照片洗出来给你！！\n@msg 그니까 또 만나야 돼 || 所以我们还要再见面。","harin":"你最后帮{name}做了一杯热巧克力，上面放了一点点肉桂。\n\n{ta}捧着杯子，喝了一口，眼睛慢慢弯起来。\n\n“这个味道，”{ta}说，“像小时候外婆家的冬天。”\n\n{ta}在店里坐了很久，坐在最角落的位子，一边喝，一边在笔记本上写东西。你忙着招呼其他客人，偶尔回头，发现{ta}在看你。\n\n离开前，{ta}在桌上留下一张纸条：「谢谢你的冬天。」\n\n那天晚上，老板转告你：“我学妹说，开幕后会常来。还说，希望你也在。”"}}],"child":[{"id":"chi1","t":"隔壁的奶奶","tm":"傍晚 18:10","p":"工作告一段落，你搬回小时候住的老社区休息一阵子。\n\n隔壁的奶奶还是那样，每天傍晚在院子里晒辣椒。她一看到你就拉着你的手：“哎哟，长这么大了！你还记得我孙子吗？小时候你们天天一起玩泥巴。”\n\n你还没想起来，院子的铁门就开了。有人提着一大袋超市的东西走进来，口罩拉到下巴。\n\n“奶奶，我买了你说的那个——”\n\n是{name}。{ta}看见你，整个人僵在门口。","c":{"yunhee":"“{me}！是你对不对！”{ta}直接扔下袋子冲过来，“你搬走那天我哭了一整晚耶！”","dohyun":"“哇，是你。”{ta}笑得很坏，“你以前被狗追，躲在我后面哭。”","harin":"{ta}站在原地看了你很久，才轻声说：“你以前……送过我一颗玻璃珠。我还留着。”","yul":"“{me}。”{ta}一口就叫出来，语气平静，“你以前说长大要当总统。现在呢？”"},"o":[{"t":"笑着接话，回忆你们小时候的糗事","a":4,"h":0,"r":{"yunhee":"{ta}一件一件翻旧帐，笑到奶奶出来叫你们进屋吃饭。","dohyun":"“你还记得那次你掉进水沟吗？”{ta}抢着讲你的糗事。","harin":"{ta}记得好多细节，连你那天穿的衣服颜色都记得。","yul":"{ta}纠正你记错的三个地方，说完自己也笑了。"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"装作想不起来，逗{ta}自己说","a":2,"h":1,"r":{"yunhee":"“你真的不记得我？”{ta}的眼眶一下子红了，你说是开玩笑，{ta}也笑不出来了。","dohyun":"“你骗人。”{ta}一眼就识破，“你耳朵红了。”","harin":"“……是吗。”{ta}的声音很轻，轻得像什么东西碎了。“我一直都记得你。”{ta}转身进门，没再出来。","yul":"“你骗人的技术很差。”{ta}冷冷地说，“我不喜欢被测试。”"},"m":{"dohyun":[2,0],"harin":[-4,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"帮奶奶接过袋子，留下来一起吃晚饭","a":3,"h":0,"r":{"yunhee":"{ta}一直帮你夹菜：“奶奶的泡菜锅最好吃了！”","dohyun":"{ta}一整晚都在跟奶奶讲话，你插不上嘴。{ta}好像故意不理你。","harin":"{ta}吃得很慢，说很久没有在这张桌子上吃饭了。","yul":"{ta}亲自下厨做了一道菜：“尝尝。比你小时候做的泥巴饭好吃。”"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"有点尴尬，说你只是回来住几天就先回家","a":-3,"h":-1,"r":{"yunhee":"{ta}追到你家门口，你已经关上门了。{ta}在门外站了很久。","dohyun":"“跑那么快？”{ta}说完，转身进门，门关得很重。","harin":"{ta}低下头：“……我知道。只是住几天。”那颗玻璃珠，{ta}没有拿出来。","yul":"{ta}看着你进门，什么都没说。之后几天，隔壁都没有亮灯。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"老社区几乎没变。巷口的杂货店还在，招牌褪了色；你小时候常爬的那棵柿子树，现在长得比二楼还高。\n\n你提着行李走进巷子，邻居们一个个探出头来跟你打招呼，好像你只是出门买了趟菜。\n\n你家的旧房子被收拾得很干净。妈妈说，隔壁奶奶这些年常常帮忙照看，还时不时问起你。\n\n你放下行李，走到院子里透气。隔着矮矮的围墙，你看见奶奶坐在小板凳上，正低头挑辣椒。","after":{"dohyun":"那天晚上，奶奶硬是留你吃了晚饭。{name}坐在你对面，一边扒饭一边跟奶奶告状，说你小时候抢{ta}的玩具车。\n\n“明明是你抢我的。”你说。\n\n“证据呢？”\n\n奶奶笑着拍了{ta}一下：“是你抢的，我记得清清楚楚。”\n\n{ta}委屈地瞪了你一眼，又笑了。\n\n吃完饭，你们坐在院子里吃西瓜。{ta}把籽吐得老远，说这是{ta}小时候的绝技。\n\n“你要住多久？”{ta}突然问。\n\n“还不确定。”\n\n“那，”{ta}说，“我这阵子也会常回来。奶奶一个人，我不放心。”\n\n你知道那不是全部的理由。","yul":"那天晚上，奶奶留你吃饭。{name}亲自下厨，炒了三个菜，每一道都好吃得不像话。\n\n“你什么时候学会做菜的？”你问。\n\n“前团解散那年。”{ta}说得很平淡，“那时候不想见人，只好每天在家做饭。”\n\n你不知道该说什么。{ta}却已经转移话题，问你这些年在做什么。\n\n饭后，你们在院子里站了一会儿。月亮很圆，{ta}点了一根烟，又想起什么似的掐掉了。\n\n“戒了。”{ta}说，“刚刚只是习惯。”\n\n离开前，{ta}在围墙上敲了两下：“有事就敲墙。小时候的暗号，还记得吧？”","yunhee":"那天晚上，奶奶做了一大桌菜。{name}一直帮你夹菜，夹到你的碗堆成小山。\n\n“多吃一点！”{ta}说，“你变瘦了！”\n\n“你又不知道我以前多胖。”\n\n“我知道！”{ta}说，“你五岁的时候脸圆得跟包子一样！”\n\n奶奶在旁边笑得前仰后合。\n\n吃完饭，{ta}拉着你去巷口的杂货店，买了两支你们小时候最爱吃的冰棒。\n\n“它还在卖耶！”{ta}兴奋地说，“味道一样！”\n\n你们坐在杂货店门口的台阶上吃冰棒，像二十年前一样。\n\n“你回来真好。”{ta}突然说，没有看你。","harin":"那天晚上，奶奶留你吃饭。{name}吃得很少，一直在听你和奶奶说话。\n\n饭后，{ta}送你回家，只有隔壁几步路。走到你家门口，{ta}停下来，从口袋里拿出一个东西。\n\n是一颗玻璃珠。蓝色的，里面有一道白色的花纹。\n\n“这个，”{ta}说，“是你搬走那天给我的。你说，看到它就会想起你。”\n\n你完全不记得了。\n\n“没关系。”{ta}笑了笑，“我记得就好。”\n\n{ta}把玻璃珠放回口袋，转身回家。走到一半，又回头：\n\n“明天……可以一起去看那棵柿子树吗？”"}},{"id":"chi2","t":"小学同学会","tm":"晚上 19:00","p":"小学同学会，二十几个人挤在一间烤肉店。大家聊着工作、结婚、房贷，你听着有点恍惚。\n\n“听说那个谁也会来。”班长神秘兮兮地说，“我只是随便传了讯息，没想到{ta}回了。”\n\n门帘被掀开。进来的人帽子压得很低，向大家点头。\n\n全场安静三秒，然后炸开。\n\n是{name}。等大家拍完照、要完签名，{ta}在人群里四处张望，最后在你旁边的空位坐下。","c":{"yunhee":"“{me}！我们以前是同桌对吧！”{ta}一屁股坐下，“你还欠我一块橡皮擦！”","dohyun":"“躲来这里。”{ta}拿起你的杯子喝了一口，“借我挡一下。”","harin":"{ta}坐下后，小声说：“这里比较安静。……你也是这样想的吗？”","yul":"“你是唯一一个没来要签名的。”{ta}说，“所以我坐这里。”"},"o":[{"t":"只跟{ta}聊小时候，不提{ta}现在的工作","a":4,"h":0,"r":{"yunhee":"{ta}笑得好放松：“好久没人只当我是{name}了。”","dohyun":"“你挺上道的。”{ta}一整晚都没离开你旁边。","harin":"{ta}说起小时候在教室后面养的蚕，眼睛亮亮的。","yul":"“很好。”{ta}点头，“我不想今晚还在工作。”"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"帮{ta}烤肉、夹菜，照顾{ta}","a":3,"h":0,"r":{"yunhee":"{ta}笑着说谢谢，可是每一块都没吃完。你好像太殷勤了。","dohyun":"“我自己有手。”{ta}把你夹的肉推回去，“你当我是小孩？”","harin":"{ta}也帮你夹了一块：“你也要吃。”","yul":"“火太大了。”{ta}拿过夹子，“我来。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"跟大家一起玩真心话游戏","a":2,"h":1,"r":{"yunhee":"{ta}玩得最开心，被罚喝了好多杯。","dohyun":"{ta}抽到大冒险，硬是在你耳边唱了一句歌。","harin":"真心话轮到{ta}，大家一直追问{ta}的私事。你没有帮{ta}挡，{ta}的脸色越来越白。","yul":"你被问到初恋，说了一个很长的故事。{ta}听完，表情很冷。"},"m":{"dohyun":[2,1],"yunhee":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[-4,-1,"bad"]}},{"t":"跟{ta}说你最近工作很累，想早点回家","a":-3,"h":-1,"r":{"yunhee":"“欸，这么早？”{ta}有点失望，可是很快就被其他同学拉走了。","dohyun":"“那你走啊。”{ta}说，转头跟别人喝酒，再也没看你。","harin":"“……好。”{ta}说，没有挽留。你走后，{ta}也很快离开了。","yul":"“{job}很累？”{ta}说，“那就回去吧。”说得像在打发你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"同学会的气氛比你想象中热闹。班长准备了一本旧相册，大家传着看，一边看一边尖叫。\n\n你在相册里找到了自己：五年级的运动会，你跑最后一名，脸上全是泥。旁边有人在笑，说你那时候摔了三次还坚持跑完。\n\n有人提起那个已经成为偶像的同学，大家都很兴奋，说要是{ta}真的来了，一定要合照。\n\n你没说话。你记得{ta}，记得不多，但记得{ta}曾经在你摔倒的时候，跑回来扶你起来。","after":{"dohyun":"同学会结束时已经很晚了。大家吵着要去续摊，{name}趁乱拉着你溜出了烤肉店。\n\n“快走！”{ta}说，“再待下去要被灌死了。”\n\n你们在夜晚的街道上跑了一段，跑到一个公园才停下来，两个人都在喘。\n\n“你还记得吗？”{ta}突然说，“运动会那次，你摔了三次。”\n\n“你还笑我。”\n\n“我笑完有回去扶你。”{ta}说，“你那时候哭得超丑。”\n\n你踢了{ta}一脚，{ta}笑着躲开。\n\n分开前，{ta}说：“下次同学会我不来了。太吵。”顿了顿，“但我们可以自己约。”","yul":"同学会快结束时，大家开始交换联络方式。好几个人围着{name}要号码，{ta}都礼貌地推掉了。\n\n轮到你的时候，你没有开口。\n\n{ta}看着你，等了几秒，然后自己拿出手机：“你不问？”\n\n“你刚刚拒绝了所有人。”\n\n“对。”{ta}说，“但没说要拒绝你。”\n\n你们交换了号码。{ta}存你的名字时，你看见{ta}打的备注是「值日生」。\n\n那天晚上，你收到一则讯息：\n\n@msg 운동회 때 넘어진 거 기억나요 || 我记得你运动会摔倒的事。\n@msg 세 번 넘어지고도 끝까지 뛴 거 || 摔了三次还跑到终点。\n@msg 그때부터 좀 멋있다고 생각했어요 || 从那时候起，就觉得你有点帅。","yunhee":"同学会散场时，{name}喝得有点多，抱着你说了一堆小时候的事。\n\n“你知道吗，”{ta}说，“你是第一个说我唱歌好听的人。在音乐课上。”\n\n你完全不记得。\n\n“我记得！”{ta}说，“那天我回家哭了好久，因为太开心了。后来我就决定要当歌手。”\n\n“所以你是因为我……”\n\n“对！都是你的错！”{ta}笑着说，然后又认真起来，“谢谢你。”\n\n{ta}的经纪人来接{ta}时，{ta}从车窗探出头，大声说：\n\n“下次见！一定要！”","harin":"同学会散场后，你在门口等车。{name}走过来，站在你旁边，没说话。\n\n过了一会儿，{ta}轻声说：“你还记得教室后面那盒蚕吗？”\n\n你记得。五年级的时候，班上养了一盒蚕，大部分人新鲜了几天就不管了。最后一直在喂的，只有你和另一个人。\n\n“那个人是你？”你问。\n\n{ta}点点头：“我们一起看着它们结茧。那天你说，它们好勇敢，把自己关起来，等着变成另一个样子。”\n\n“我说过这种话？”\n\n“说过。”{ta}说，“我一直记得。”\n\n车来了。{ta}看着你上车，轻轻挥手。"}},{"id":"chi3","t":"旧照片与交换日记","tm":"深夜 23:30","p":"社群上，一个老同学发了一张二十年前的合照，标注了好多人。照片上，你和一个瘦小的孩子挤在一起，手里抱着一本卡通封面的日记本。\n\n那个孩子，是{name}。\n\n留言区炸了。粉丝涌进来，问照片里另一个人是谁。你吓得关掉手机。\n\n半夜十一点半，一个陌生帐号传讯息给你。头像是一只手抱着那本日记本。","c":{"yunhee":"@msg 이거 기억나?? 우리 교환일기!! || 你记得这个吗？我们的交换日记！！\n@msg 아직도 내가 갖고 있어용 ㅠㅠ || 我到现在还留着呜呜","dohyun":"@msg 야 너 유명해졌네 ㅋㅋㅋ || 喂，你出名了耶ㅋㅋㅋ\n@msg 일기장 마지막 장 기억나? || 记得日记的最后一页吗？","harin":"@msg 오랜만이에요 || 好久不见。\n@msg 이 일기장, 아직 마지막 장이 비어 있어요 || 这本日记，最后一页还是空的。","yul":"@msg 사진 내리라고 했어요 || 我已经叫人把照片撤下了。\n@msg 그래서? 잘 지냈어요? || 所以呢？你过得好吗？"},"o":[{"t":"回覆说你还记得，问日记本还在不在","a":4,"h":0,"r":{"yunhee":"{ta}传了十几张日记内页的照片，每一张都附哭脸。","dohyun":"「当然在。最后一页是你写的，你自己看。」{ta}传来一张模糊的照片。","harin":"「想看的话，下次带给你。」{ta}说。","yul":"「在。」{ta}只回一个字，又补：「找个时间还你。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"先关心{ta}会不会因为照片被骂","a":3,"h":0,"r":{"yunhee":"「我没事啦！」{ta}回，可是之后的讯息变少了。","dohyun":"「我才不会被骂。」{ta}回，语气有点不耐烦，「你很爱担心喔。」","harin":"{ta}很久才回：「你一直都是这样的人。」","yul":"「我会处理。你不用担心。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"开玩笑：「你现在红到我都上热搜了」","a":2,"h":1,"r":{"yunhee":"「哈哈哈！你也太红了吧！」","dohyun":"「蹭我的热度喔？」{ta}回得很快。","harin":"「……嗯。」{ta}也只回了一个字。那本日记，{ta}再也没提起。","yul":"「这不好笑。」{ta}说，「粉丝在肉搜你，你知道吗？」"},"m":{"dohyun":[2,0],"yunhee":[1,0],"harin":[-2,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[-10,-3,"worst"]}},{"t":"只回一句「好久不见」，就不知道说什么了","a":-3,"h":-1,"r":{"yunhee":"{ta}传来一串哭脸贴图，然后好几天都没有再找你。","dohyun":"{ta}传了三则讯息，你都没回。{ta}最后传：「算了。」","harin":"{ta}很久没回。最后只传：「你现在……觉得我是很红的人吗？」","yul":"「……就这样？」{ta}隔了很久才回，然后就下线了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"你翻出那本旧日记的照片，看了很久。\n\n那是三年级的事了。你和{name}是同桌，有一阵子流行交换日记，你们就轮流在同一本本子上写东西：今天吃了什么、谁被老师骂了、长大想做什么。\n\n后来你转学了。那本日记最后在谁那里，你已经不记得了。\n\n现在你知道了。在{ta}那里。","after":{"dohyun":"你们后来聊到凌晨。{ta}一张一张传日记的照片给你，每一页都要配上{ta}的吐槽。\n\n「你看你这个字，丑死了ㅋㅋㅋ」\n「这天你说要当宇航员，结果呢？」\n「这页是我写的，我那时候好帅。」\n\n最后，{ta}传来最后一页的照片。\n\n那是你写的。歪歪扭扭的字：「道贤，不管你去哪里，我们都是好朋友。」\n\n你看着那行字，很久没有回。\n\n然后{ta}传来一句：\n\n@msg 그래서 연락한 거야 || 所以我才联络你。\n@msg 약속은 지켜야지 || 约定要遵守嘛。","yul":"你们的对话持续了一个多小时。{ta}说话一如既往地简短，可是问的问题都很准：你现在在做什么、住在哪里、过得好不好。\n\n最后，{ta}说：「日记，找时间还你。」\n\n「你留着吧。」你说。\n\n「不行。」{ta}说，「那是两个人的东西，应该一人一半。」\n\n「怎么一人一半？」\n\n「复印。」{ta}说，「我已经找好店了。」\n\n你笑出声。\n\n隔周，你收到一个包裹：一本装订得很精美的复印本，封面写着两个人的名字。\n\n里面夹着一张纸条：「原本我留着。你这本，从最后一页开始写。」","yunhee":"那天晚上，你们一直聊到天快亮。{ta}一页一页地跟你回忆日记里写的事，回忆到激动的地方就传语音，声音大得你不得不把手机拿远一点。\n\n「你还记得我们在操场埋了一个时光胶囊吗！」\n\n你不记得了。\n\n「我也不记得埋在哪里了！」{ta}说，「我们一起去找好不好！」\n\n你以为{ta}在开玩笑。\n\n一个星期后，你们真的在母校的操场上，拿着两把小铲子，被警卫追着跑。\n\n最后什么都没挖到。可是{ta}笑得比挖到宝还开心。","harin":"你们的对话断断续续地持续了好几天。{ta}每天晚上都会传一页日记的照片，配上一两句话。\n\n第一天是你画的一只兔子。「你那时候很会画画。」\n第二天是{ta}写的一首诗，三年级的那种诗。「好丢脸。」\n第三天是一页空白，只有日期。「这天我们吵架了，谁都没写。」\n\n第七天，{ta}问你：「最后一页，你想写什么？」\n\n你想了很久，才回：「我想当面写。」\n\n{ta}很久没有回覆。\n\n最后，{ta}只传了一个地址和一个时间。"}},{"id":"chi4","t":"牙医诊所的候诊室","tm":"上午 09:15","p":"牙齿痛了三天，你终于请假去看牙医。\n\n候诊室里只有一个人，戴着口罩，脸颊肿得很明显，正在填表格。你坐在对面，偷偷看了一眼{ta}写的名字。\n\n{name}。\n\n你脑中闪过一个画面：补习班的最后一排，那个总是在课本上画画、借你抄笔记的同桌。\n\n{ta}抬头，正好对上你的视线。","c":{"yunhee":"{ta}一下子站起来，又因为牙痛弯下腰：“呜……是你！补习班的！”","dohyun":"“哈，你也牙痛？”{ta}一边忍痛一边笑，“甜食吃太多了吧。”","harin":"{ta}拉下口罩一点，轻声说：“你还是习惯坐在角落呢。”","yul":"“你的笔记字很丑，但很好用。”{ta}说，“我记得。”"},"o":[{"t":"同病相怜地聊起牙痛","a":3,"h":0,"r":{"yunhee":"“好痛好痛！我们一起加油！”{ta}握紧你的手。","dohyun":"{ta}跟你比谁比较痛，最后两个人都笑到更痛。","harin":"“痛的时候，说话会分心。”{ta}说，“跟我说说你最近的事吧。”","yul":"“我不想聊牙齿。”{ta}说，“很无聊。”"},"m":{"dohyun":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"问{ta}现在还会画画吗","a":4,"h":0,"r":{"yunhee":"“你还记得！”{ta}翻出手机里的涂鸦给你看。","dohyun":"“画你啊。”{ta}随手在表格背面画了一个牙痛的你。","harin":"“会。现在都画在歌词本的边边。”{ta}说完有些害羞。","yul":"“没时间了。”{ta}说，过了一会儿又补，“偶尔。”"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"让{ta}先进去，说你没那么急","a":3,"h":0,"r":{"yunhee":"“这样不好吧……”{ta}犹豫着进去了，出来时你已经不在候诊室。","dohyun":"“我才不用你让。”{ta}的语气有点冲，“我又不是不能等。”","harin":"{ta}进去前，回头看了你一眼。出来后，{ta}没有再找你说话。","yul":"“好。我欠你一次。”"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"太痛了，没力气说话，只点了点头","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你说话，你都只点头。{ta}后来低头玩手机了。","dohyun":"{ta}跟你说话，你只点头。{ta}说：“好吧，你继续痛。”转头不理你了。","harin":"{ta}问你还画不画画，你只点头。{ta}没有再问了。","yul":"{ta}说了几句，看你一直不回，就戴上耳机了。"},"m":{"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"候诊室很安静，只有墙上的时钟在走，和远处传来的牙钻声。\n\n你捂着脸坐着，一边疼一边胡思乱想。补习班那时候，你们几乎每天都坐在一起，从初一到初三。{ta}很少说话，上课总在课本边上画画，可是每次你没听懂，{ta}都会默默把笔记推过来。\n\n后来你们考上了不同的高中，就再也没见过。\n\n你没想到，再见面会是在这里，两个人都肿着脸。","after":{"dohyun":"你们看完牙医出来，都肿着半边脸，说话含糊不清。\n\n{name}看着你，突然笑出声：“你好丑。”\n\n“你也是。”\n\n{ta}笑到捂着脸喊痛。\n\n你们在诊所门口站了一会儿，谁都没说要走。最后{ta}说：“我知道附近有一家很好吃的粥店。现在只能吃粥了。”\n\n那碗粥你们吃了一个小时。{ta}一边吃一边抱怨，说待会还有练习，脸肿成这样要被骂死。\n\n分开前，{ta}说：“下周复诊，几点？”\n\n你说了。{ta}点点头：“我也是那个时间。”\n\n你知道{ta}在说谎。","yul":"你们看完牙医，在门口遇到。{name}的脸还是肿的，可是已经恢复了平常那副冷静的样子。\n\n“明天有拍摄。”{ta}说，“导演会杀了我。”\n\n“冰敷。”你说，“每二十分钟一次。”\n\n{ta}看了你一眼：“你还是那么会照顾人。补习班的时候也是。”\n\n“我？”\n\n“你每次都把橡皮擦借我，然后自己用手指擦。”{ta}说，“我记得。”\n\n{ta}叫的车来了。上车前，{ta}回头：\n\n“复诊那天，一起来吧。看完我请你吃粥。”","yunhee":"你们看完牙医，一起坐在诊所门口的长椅上，各自捂着脸。\n\n“好痛喔……”{ta}哭丧着脸，“我明天还要直播……”\n\n你从包里拿出一包冰袋，分了一半给{ta}。\n\n{ta}感动得快哭了：“你怎么什么都有……”\n\n那天下午，你们在长椅上坐了很久。{ta}跟你讲补习班时候的事，讲到你们一起偷偷在桌底下吃辣炒年糕，被老师抓到罚站。\n\n“那是我第一次被罚站。”{ta}说，“可是一点都不难过，因为你在旁边。”\n\n{ta}说完，好像突然意识到自己说了什么，脸红了，又捂着脸喊痛。","harin":"看完牙医，你们一起走到公车站。{name}的脸肿着，说话不太方便，就拿出手机打字给你看。\n\n「你还记得我在课本上画的东西吗？」\n\n你说你记得一些，有花，有猫，还有一个很奇怪的人。\n\n{ta}打字：「那个很奇怪的人，是你。」\n\n你愣住了。\n\n{ta}笑了，脸一笑就痛，又捂住。\n\n公车来了。{ta}先上车，坐在靠窗的位子。车开走前，{ta}隔着玻璃，对你举起手机。\n\n屏幕上写着：「现在也还会画。」"}},{"id":"chi5","t":"钢琴老师的告别音乐会","tm":"下午 16:00","p":"小时候教你钢琴的老师要退休了。她的学生们在一间小音乐厅办了一场告别音乐会。\n\n你坐在第三排，翻着节目单，看见最后一个表演者的名字，愣住了。\n\n{name}。\n\n你想起来了。老师家的客厅，每周四下午，你上完课，下一个就是那个总是迟到、却弹得比谁都好的孩子。\n\n音乐会结束，大家围着老师拍照。老师拉着你的手，转头喊：“{name}，你记得{me}吗？以前你们常常抢我的饼干。”","c":{"yunhee":"{name}睁大眼睛：“天啊！你是那个弹错就哭的小朋友！”","dohyun":"{name}笑：“啊，是那个每次都要老师陪着才敢上台的人。”","harin":"{name}看着你，好像想说什么，最后只说：“你刚刚，有听我弹吗？”","yul":"{name}点头：“记得。你左手总是比右手慢半拍。”"},"o":[{"t":"说{ta}刚才弹的曲子让你差点哭出来","a":4,"h":0,"r":{"yunhee":"“真的吗！”{ta}眼眶一下子红了，“我练了好久！”","dohyun":"“哭了就哭了，干嘛说差点。”{ta}嘴上嫌，却很开心。","harin":"{ta}沉默很久，轻声说：“谢谢你听见了。”","yul":"“那段我改了和声。”{ta}问，“你听出来了？”"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"提议跟{ta}四手联弹一首小时候的曲子","a":3,"h":2,"r":{"yunhee":"“好啊好啊！”{ta}拉着你坐下，弹得乱七八糟，大家都笑了。","dohyun":"“你跟得上吗？”{ta}故意弹得很快。","harin":"{ta}的手很轻，配合你的节奏慢下来。","yul":"“你左手还是慢半拍。”{ta}说，却放慢了速度等你。"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"陪老师聊天，让{ta}和其他人拍照","a":2,"h":0,"r":{"yunhee":"{ta}拍照拍到一半，一直往你这边看，你都没过去。","dohyun":"{ta}远远看着你跟老师聊天，表情有点不爽，拍完照就走了。","harin":"{ta}一直在等你过来说点什么。你没有。","yul":"{ta}拍完照，站在原地等了一会儿，看你没过来，就自己离开了。"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"说你很久没弹琴了，有点不好意思","a":-3,"h":-1,"r":{"yunhee":"{ta}原本想拉你一起弹，听你这么说，就把手缩回去了。","dohyun":"“退步了吧？”{ta}说，“那就别弹了。”语气比玩笑更冷。","harin":"{ta}看着你，像是想说「我也是」，最后什么都没说。","yul":"“技能会退化。”{ta}说，“看来你放弃得很彻底。”"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"告别音乐会的观众不多，大部分都是老师以前的学生和家长。大家坐在小小的音乐厅里，一个接一个上台演奏。\n\n有人弹得很好，有人弹错了好几个音，可是老师每一个都很认真地听，每一个都用力鼓掌。\n\n你想起小时候，每个星期四下午，你坐在老师家那架旧钢琴前，一边弹一边偷看墙上的钟。下一个学生总是迟到，老师就会叹气，然后多陪你练十分钟。\n\n最后一个节目开始了。灯光暗下来，有人走上台。","after":{"dohyun":"音乐会结束后，学生们一起请老师吃饭。{name}坐在你旁边，一直跟你抢最后一块肉。\n\n“你还是那么幼稚。”你说。\n\n“你还是那么慢。”{ta}说，“刚刚四手联弹，你又慢了半拍。”\n\n老师在对面笑：“你们两个，小时候也是这样吵。”\n\n饭后，你们送老师回家。老师站在门口，拉着你们两个人的手：“以后要常常一起来看我。”\n\n“好。”你们同时说。\n\n回去的路上，{ta}突然说：“那下个月，一起来？”\n\n“好。”\n\n“说好了。”{ta}伸出小指，“不准反悔。”","yul":"音乐会结束后，大家围着老师拍照。{name}站在人群外面，等到人都散了，才走过去，给老师深深鞠了一个躬。\n\n你听见老师小声说：“你这孩子，这几年辛苦了。”\n\n{ta}没说话，只是低着头。\n\n后来{ta}走到你身边，你们一起走出音乐厅。外面已经天黑了。\n\n“老师刚才跟我说，”{ta}说，“当年我差点放弃音乐的时候，是她骗我说，有一个学生每周四都在等我。”\n\n“那个学生是我？”\n\n“是你。”{ta}说，“所以，谢谢你。虽然你那时候只是在等我快点进门，好让你下课。”","yunhee":"音乐会结束后，老师留大家喝茶。{name}一直黏在老师身边撒娇，说小时候老师最疼{ta}。\n\n“才不是，”老师笑着说，“我最疼的是每次都准时的那个。”\n\n所有人都看向你。{ta}夸张地倒抽一口气：“原来是你！你抢走了老师的爱！”\n\n后来{ta}拉着你坐到钢琴前，弹了一首小时候的练习曲。弹得乱七八糟，你们笑到停不下来。\n\n离开前，{ta}说：“我好久没这么开心地弹琴了。”\n\n{ta}看着你，眼睛亮亮的：“以后，可以常常一起弹吗？”","harin":"音乐会结束后，你在后台找到{name}。{ta}坐在钢琴前，手指放在琴键上，没有弹。\n\n“那首曲子，”{ta}说，“是老师教我的第一首。我一直弹不好。”\n\n“今天弹得很好。”\n\n“因为今天，”{ta}说，“我知道有人在听。”\n\n你在{ta}旁边坐下。{ta}开始弹一首很轻的曲子，是你从来没听过的。\n\n弹完了，{ta}说：“这是我写的。还没有名字。”\n\n“很好听。”\n\n{ta}看着你，过了很久，才轻声说：“那，以后就叫做〈星期四〉吧。”"}}],"chance":[{"id":"cha1","t":"拿错的伞","tm":"下午 17:20","p":"突如其来的大雨，你躲进一间小咖啡厅。门口的伞架上插着十几把伞，你的是一把透明伞，伞柄贴了一张小贴纸。\n\n喝完咖啡，雨小了。你拿起伞走到门口，撑开才发现——不对，这把没有贴纸。\n\n“不好意思。”身后有人叫住你，手里拿着一把有贴纸的透明伞。“这把好像是你的。”\n\n那人戴着口罩和帽子，但声音你太熟悉了。是{name}。","c":{"yunhee":"{ta}举着你的伞：“这个贴纸是限定版对不对！我找好久了！”","dohyun":"{ta}晃着你的伞：“你拿错了，小偷。”语气却是在笑。","harin":"{ta}有点不好意思：“我差点就带走了。还好你的贴纸很明显。”","yul":"{ta}伸手：“交换。你拿的那把，伞骨断了一根，我正要拿去修。”"},"o":[{"t":"笑着交换，顺口说贴纸的来历","a":3,"h":0,"r":{"yunhee":"你讲贴纸的故事讲了很久，{ta}听着听着，开始看窗外。","dohyun":"“这种幼稚的东西你也喜欢？”{ta}却多看了贴纸两眼。","harin":"{ta}安静地听你说完，然后礼貌地说：“谢谢。”就没有下文了。","yul":"“我明白了。”{ta}把伞还给你，“那就别再弄丢。”"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"雨还没停，提议一起撑到地铁站","a":4,"h":1,"r":{"yunhee":"“好啊！”{ta}挤在你旁边，一路上讲个不停。","dohyun":"“你太矮了，我来撑。”{ta}抢过伞。","harin":"{ta}点头，两个人肩膀之间隔着一个拳头的距离。","yul":"“我的车就在前面。”{ta}说，“你去哪？我送你。”"},"m":{"dohyun":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"问{ta}要不要再坐一下，等雨停","a":3,"h":0,"r":{"yunhee":"{ta}拿出底片相机，拍了窗外的雨。","dohyun":"“等雨停？”{ta}说，“好无聊。”{ta}撑起伞就走了。","harin":"{ta}坐在窗边，跟你说下雨天的声音很适合写歌。","yul":"“我没时间。”{ta}说，“十五分钟后有会议。”"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"道谢后马上离开，不打扰{ta}","a":-3,"h":-1,"r":{"yunhee":"“欸——”{ta}想说什么，你已经走了。{ta}看着手里那把伞，很失落。","dohyun":"你转身就走。{ta}在后面喊了一声，你没回头。","harin":"你走得很快。{ta}站在门口，看着雨，看了很久。","yul":"“东西换回来就好。”{ta}说完，比你更快地走进雨里。"},"m":{"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那间咖啡厅你常来。店不大，只有八张桌子，老板会放很老的爵士乐。下雨天的时候，窗玻璃上会起一层雾，外面的街道变得模模糊糊的。\n\n你坐在靠窗的位置，点了一杯热拿铁，看着雨发呆。\n\n不远处坐着一个戴着口罩的人，面前放着一本笔记本，一直在写东西。你没多想，那个人看起来跟普通的客人没什么不同。\n\n雨下了一个多小时，才慢慢变小。","after":{"dohyun":"后来你们一起在咖啡厅坐到雨停。{name}一直在跟你抱怨，说{ta}今天本来要去滑板公园，结果被雨困住。\n\n“你会滑板？”你问。\n\n“会啊。超厉害。”{ta}说，“下次带你去看。”\n\n雨停的时候，天边出现了一道很淡的彩虹。{ta}拿出手机拍了一张，又偷偷把镜头转向你。\n\n“喂，你在拍我？”\n\n“拍彩虹。”{ta}说，“你刚好在里面。”\n\n那天晚上，你收到一张照片。彩虹很淡，你的侧脸很清楚。\n\n@msg 우산 바뀐 거, 운명인가 ㅋ || 拿错伞，是命运吗ㅋ","yul":"后来你们在咖啡厅又坐了一会儿。{name}跟你聊起{ta}正在准备的角色，是一个总是在雨天出现的侦探。\n\n“所以你在观察下雨天的人？”你问。\n\n“在观察你。”{ta}说，“你看雨的样子，很像我要演的那个人。”\n\n你不知道该怎么回答。\n\n{ta}合上笔记本，看了看窗外：“雨停了。”\n\n可是{ta}没有站起来。\n\n又过了半个小时，{ta}才说：“那把伞，伞骨断了。你帮我挑一家修伞的店？”\n\n那天，你们走了三条街，才找到一家还开着的修伞店。","yunhee":"你们一起在咖啡厅等雨停。{name}拿出底片相机，对着窗外拍了好几张。\n\n“下雨天的照片洗出来，”{ta}说，“会有一种很温柔的颜色。”\n\n{ta}把相机转向你：“可以拍你吗？”\n\n你还没回答，快门就响了。\n\n“拍到了！”{ta}笑，“洗出来给你！”\n\n雨停时，你们一起走出咖啡厅。{ta}把那把有贴纸的伞还给你，又依依不舍地摸了摸那张贴纸。\n\n“我真的很喜欢这个……”\n\n你撕下贴纸，贴在{ta}的手背上。\n\n{ta}愣住了，然后笑得像个得到糖果的小孩。","harin":"你们在咖啡厅坐到雨停。{name}的笔记本一直摊在桌上，你瞥见上面写着几行歌词，被划掉了好几次。\n\n“写不出来？”你问。\n\n{ta}点点头：“一直写不出下雨的感觉。”\n\n你想了想，说起你小时候，下雨天总是躲在窗边，数着雨滴从玻璃上滑下来的路线。\n\n{ta}看着你，突然低头开始写。写了很久，才抬起头。\n\n“谢谢你。”{ta}说，“我写出来了。”\n\n那天晚上，{ta}传来一段很短的录音。是一首新歌的开头，歌词里有一句：「数着雨滴滑落的路线，等一把伞找回它的主人。」"}},{"id":"cha2","t":"深夜便利商店","tm":"凌晨 02:10","p":"凌晨两点，你加完班，去楼下的便利商店买泡面。\n\n收银台前站着一个人，戴口罩、穿连帽外套，手里抱着一堆零食。店员说：“一共一万两千三百韩元。”\n\n那人掏了掏口袋，翻了两次，然后很小声地说：“……可以刷卡吗？”\n\n“机器坏了，只收现金。”\n\n那人僵住了。你看见帽子下露出的一缕头发、和那双眼睛，心跳漏了一拍。是{name}。","c":{"yunhee":"{ta}快哭了：“可是我好饿……练了一整天……”","dohyun":"{ta}啧了一声：“那我先拿走，明天还？”店员摇头。","harin":"{ta}低头看着那堆东西，好像不知道该放回哪一样。","yul":"{ta}冷静地说：“我打电话叫助理送钱来。等我五分钟。”"},"o":[{"t":"直接帮{ta}付钱，说不用还","a":3,"h":0,"r":{"yunhee":"“你是天使吗！”{ta}硬塞给你一包软糖当谢礼。","dohyun":"“不用还？那我欠你一次。”{ta}挑眉，“我不喜欢欠人。”","harin":"{ta}不停道谢，最后从零食里挑了一包给你。","yul":"“我会还。”{ta}说，“给我你的号码。”"},"m":{"dohyun":[1,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"帮{ta}付钱，但半开玩笑要分你一包零食","a":4,"h":1,"r":{"yunhee":"“全部给你都可以！”{ta}最后跟你在门口一起吃。","dohyun":"“你挑。”{ta}看你挑了{ta}最爱的那包，“……你品味不错嘛。”","harin":"{ta}认真地问你喜欢哪一种，把那包放进你手里。","yul":"“交易成立。”{ta}拆开一包，分你一半。"},"m":{"yunhee":[2,0],"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[6,1,"best"]}},{"t":"帮{ta}把太多的零食放回去，只留最需要的","a":2,"h":0,"r":{"yunhee":"“可是我好饿……”{ta}委屈地看着你，你还是把东西放回去了。","dohyun":"“喂，那是我的！”{ta}抢回来，“你凭什么管我吃什么？”","harin":"{ta}有点难堪地看着你帮{ta}挑东西，脸慢慢红了。","yul":"“我不需要你帮我决定。”{ta}说，“放回去。”"},"m":{"yul":[1,0],"yunhee":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"假装没认出来，付完自己的东西就走","a":-3,"h":-1,"r":{"yunhee":"{ta}抱着零食，看你直接走了，眼眶有点红。","dohyun":"{ta}在你背后喊：“喂，你刚才明明看到我了。”你没回头。","harin":"{ta}最后放回了一大半。你走出门时，{ta}没有看你。","yul":"{ta}看着你走出去，表情很冷。你装作不认识{ta}，{ta}也就当不认识你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那间便利商店你来过无数次。凌晨两点的店里只有一个店员，在柜台后面打瞌睡。冷藏柜嗡嗡作响，杂志架上的封面被日光灯照得发白。\n\n你拿了一碗泡面、一罐啤酒，又在零食架前犹豫了一下，多拿了一包巧克力。今天加班太晚，你觉得自己值得。\n\n走到柜台时，前面已经有一个人在结帐。那人抱着一大堆零食，堆得快要挡住脸。","after":{"dohyun":"后来你们坐在便利商店门口的塑胶椅上，一起吃泡面。凌晨的街道很安静，只有偶尔经过的计程车。\n\n“练到现在？”你问。\n\n“嗯。新歌的舞太难了。”{ta}说，吸了一大口面，“队长一直骂我。”\n\n“你被骂了还这么开心？”\n\n“因为现在有人请我吃泡面。”{ta}说，笑得眼睛都眯起来。\n\n那天之后，你常常在凌晨两点的便利商店遇到{ta}。\n\n有时候{ta}带着两罐饮料，有时候{ta}已经帮你泡好了面。\n\n有一次，{ta}说：“我一直以为是巧合。后来才发现，我是故意算好时间来的。”","yul":"{ta}的助理五分钟后到了，把钱还给你，一毛不差。\n\n你以为事情就这样结束了。\n\n三天后，你在同一间便利商店，同一个时间，又遇到了{name}。{ta}站在泡面架前，好像在等什么。\n\n“又加班？”{ta}问。\n\n“又练习？”\n\n“拍夜戏。”{ta}说，“刚收工。”\n\n你们站在门口吃泡面。{ta}吃得很快，很安静，吃完后把两个人的垃圾一起丢掉。\n\n“你每天都这么晚？”{ta}问。\n\n“最近是。”\n\n“那，”{ta}说，“这周我也都拍夜戏。”","yunhee":"后来你们一起坐在便利商店门口，吃着那一大堆零食。\n\n“我今天好惨喔，”{ta}说，“练了十个小时，然后发现钱包忘在宿舍……”\n\n“你可以打给经纪人啊。”\n\n“可是他会骂我半夜偷吃零食！”{ta}委屈地说。\n\n你笑到不行。\n\n凌晨三点，{ta}的经纪人还是打来了，在电话里骂得很大声。{ta}一边道歉一边对你做鬼脸。\n\n挂掉电话后，{ta}说：“我要走了。可是……”\n\n{ta}拿出手机：“你的帐号！我要还你钱！”\n\n你说不用。{ta}就说：“那我请你吃饭。不准拒绝！”","harin":"后来你们在便利商店门口的长椅坐了一会儿。{name}抱着那包你挑剩的饼干，小口小口地吃。\n\n“我常常这个时间来。”{ta}说，“这时候人最少。”\n\n“睡不着？”\n\n“写不出歌的时候，就睡不着。”{ta}说，“出来走走，买点甜的东西，会好一点。”\n\n你点点头。你也是。加班到深夜的时候，总觉得需要一点甜的东西，才能撑到明天。\n\n{ta}吃完最后一块饼干，站起来：“谢谢你。今天的甜，是你给的。”\n\n你们走向不同的方向。走了几步，你回头，看见{ta}也在回头。"}},{"id":"cha3","t":"酒吧角落","tm":"深夜 23:50","p":"你和同事来梨泰院的一间小酒吧庆祝专案结束。同事们喝到一半就各自回家，只剩你一个人坐在吧台。\n\n角落的卡座里，有个人一个人喝酒。灯光很暗，桌上摆着三个空杯。\n\n你多看了一眼。那张侧脸，你在广告牌上看过无数次。是{name}。\n\n{ta}好像察觉到你的视线，抬起头。你们隔着半个酒吧对视。你没有尖叫，也没有拿出手机，只是默默转回去。\n\n过了一会儿，有人在你旁边的高脚椅坐下。","c":{"yunhee":"“你认出我了对吧？”{name}托着下巴，“可是你没尖叫耶，我好好奇。”","dohyun":"“喂。”{name}敲敲吧台，“你是没认出来，还是装的？”","harin":"{name}坐下后好一阵子没说话，最后轻声说：“可以陪我坐一下吗？不用聊天。”","yul":"“你很冷静。”{name}说，“这年头少见。”"},"o":[{"t":"什么都不问，陪{ta}安静喝一杯","a":4,"h":0,"r":{"yunhee":"{ta}最后忍不住，讲了一堆心事，又笑着说你是好听众。","dohyun":"“你真的很奇怪。”{ta}说，嘴角却翘起来。","harin":"{ta}喝完那杯，说：“谢谢。你没有问，我反而想说了。”","yul":"{ta}看了你很久：“这是我今天唯一不用说话的时间。”"},"m":{"harin":[3,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"关心地问{ta}是不是心情不好","a":3,"h":0,"r":{"yunhee":"{ta}眼眶一红，说今天被老师骂了。","dohyun":"“我心情很好。”{ta}说，语气很冲，“你管我？”","harin":"{ta}摇摇头，什么都没说。好像被问了，反而更不想说了。","yul":"“你很直接。”{ta}说，“对，很不好。合约的事。”"},"m":{"yunhee":[2,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"开玩笑说：「我只认得你是喝了三杯的人」","a":3,"h":1,"r":{"yunhee":"{ta}笑了两声，又安静下来。好像这个玩笑让{ta}更难过了。","dohyun":"“才三杯？我还没开始。”{ta}跟你碰杯。","harin":"{ta}轻轻笑了，说你很会让人放松。","yul":"“不好笑。”{ta}说，“我现在没有心情。”"},"m":{"dohyun":[2,1]},"sc":{"dohyun":[6,2,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,1,"good"]}},{"t":"提醒{ta}喝太多了，该回家","a":-3,"h":-1,"r":{"yunhee":"“你好像我经纪人……”{ta}说完就叫了车，没再跟你说话。","dohyun":"“你管我？”{ta}说完，又点了一杯，转身背对着你。","harin":"{ta}点点头，站起来，把酒钱放在桌上就走了。","yul":"“我知道自己的量。”{ta}说，“你可以走了。”"},"m":{"dohyun":[-5,0],"yul":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那间酒吧很小，在一栋旧楼的二楼，要爬一段很窄的楼梯才上得去。墙上贴着很多老电影的海报，吧台的灯是暗红色的。\n\n同事们都走了。你本来也想走，可是这杯酒还没喝完，就多坐了一会儿。\n\n调酒师是个话很少的大叔，擦着杯子，偶尔往角落看一眼。你顺着他的视线看过去，才注意到那个一个人喝酒的人。","after":{"dohyun":"那天你们一直喝到凌晨两点，酒吧打烊。\n\n走下那段窄窄的楼梯时，{name}脚下一滑，你一把扶住{ta}。\n\n“我没醉。”{ta}说。\n\n“你醉了。”\n\n“好吧，一点点。”{ta}靠在墙上，看着你笑，“你知道吗，今天我差点哭了。被老师骂得很惨。”\n\n“那现在呢？”\n\n“现在不想哭了。”{ta}说，“因为遇到一个奇怪的人。”\n\n你帮{ta}叫了车。上车前，{ta}抓着车门：“下周五，同一个时间，同一个位子。你来不来？”\n\n你说你会考虑。\n\n下周五，你去了。{ta}已经坐在那里，面前放着两杯酒。","yul":"你们在酒吧坐到打烊。{name}后来说了很多，关于合约，关于前团解散时那些没说出口的事。\n\n“我很少跟人说这些。”{ta}说，“跟陌生人说，反而容易一点。”\n\n“那我们现在还是陌生人吗？”\n\n{ta}看了你很久：“不是了。”\n\n离开时，{ta}在楼梯口停下来：“今天的事，你会说出去吗？”\n\n“不会。”\n\n“我知道。”{ta}说，“所以才跟你说。”\n\n那天之后，你偶尔会在深夜收到一则讯息，只有一个酒吧的名字和一个时间。\n\n你每次都去了。","yunhee":"那天你们一直聊到酒吧打烊。{name}的话越来越多，从被老师骂聊到{ta}小时候想当兽医，又聊到{ta}其实很怕黑。\n\n“所以我很少一个人出来。”{ta}说，“今天是因为太难过了。”\n\n“那现在呢？”\n\n“现在好多了！”{ta}笑，“因为有你！”\n\n下楼梯时，{ta}紧紧抓着你的袖子，说楼梯太黑了。\n\n到了街上，{ta}才松开手，有点不好意思：“对不起，我是不是很烦……”\n\n“不会。”\n\n{ta}看着你，突然认真地说：“下次我难过的时候，可以找你吗？”","harin":"你们在酒吧里坐了很久。{name}后来说了一些话，很少，很轻，像是在对自己说。\n\n{ta}说{ta}最近写不出歌，说{ta}害怕自己再也写不出来了，说{ta}有时候觉得，大家喜欢的是那个在舞台上的人，不是{ta}。\n\n你没有安慰{ta}，只是听着。\n\n打烊时，{ta}站起来，对你轻轻鞠了一个躬。\n\n“谢谢你没有说『你很棒』。”{ta}说，“大家都这样说，可是我不相信。”\n\n“那你相信什么？”\n\n{ta}想了想：“相信刚才，有一个人认真听我说话。”"}},{"id":"cha4","t":"临时顶替的拍摄","tm":"上午 08:00","p":"早上七点，你接到电话：一个杂志拍摄现场缺人，原本的同行临时生病，问你能不能去顶。\n\n身为{job}的你，虽然不是完全对口，但这种救火的事你做过不少。你抓了包就出门。\n\n到了片场，你才知道今天的拍摄对象是{name}。\n\n导演很赶，一直在骂人。灯光组手忙脚乱，现场气压低得不得了。轮到你上场时，{name}正坐在角落，看着你。","c":{"yunhee":"{name}朝你挥手，用嘴型说：“加油！”","dohyun":"{name}挑眉：“新人？别搞砸了，我想早点下班。”","harin":"{name}看着你，轻声说：“导演今天心情不好，不是你的问题。”","yul":"{name}说：“你只有二十分钟。我配合你，你说要什么。”"},"o":[{"t":"冷静地用你的专业把场面稳住","a":4,"h":0,"r":{"yunhee":"“你好专业！”{ta}在你身后鼓掌。","dohyun":"{ta}收起吊儿郎当的样子：“……你挺厉害的。”","harin":"{ta}在你身边小声说：“你在工作的时候，很不一样。”","yul":"“这才叫工作。”{ta}直接问你要名片。"},"m":{"yul":[3,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"先跟{ta}道歉，说你可能会慢一点","a":2,"h":0,"r":{"yunhee":"“没关系……”{ta}说，可是你慢了好几次，导演骂{ta}的时候，{ta}看了你一眼。","dohyun":"“道歉什么，做就对了。”{ta}不耐烦地说，“我想早点下班。”","harin":"{ta}点点头，可是你一直道歉，{ta}的表情越来越紧张。","yul":"“道歉浪费时间。”{ta}说，“你不行的话，现在说。”"},"m":{"harin":[1,0],"yul":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"趁空档跟{ta}开个玩笑，让{ta}放松","a":3,"h":1,"r":{"yunhee":"{ta}笑到停不下来，被导演瞪了一眼。","dohyun":"“你很有趣嘛。”{ta}开始跟你斗嘴。","harin":"{ta}轻笑，肩膀放松下来。","yul":"“不好笑。”{ta}说完，转身时嘴角翘起。"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"闷头做事，一句话都不多说","a":-3,"h":-1,"r":{"yunhee":"{ta}好几次想跟你搭话，你都没理。{ta}最后放弃了。","dohyun":"“你是机器人吗？”{ta}说，之后整个拍摄都没再跟你说话。","harin":"{ta}很想找人说话，你却一直闷着头。{ta}后来一个人坐在角落。","yul":"{ta}全程很配合，可是收工后一句话都没跟你说。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"片场在一栋老洋房里，摄影棚的灯光架得到处都是，地上全是线。工作人员来来去去，每个人都很赶，每个人都很烦躁。\n\n你一到，就被一个副导塞了一份流程表，说你只有十分钟熟悉状况。\n\n你快速看完，在心里排好顺序。这种救火的工作你做过很多次，只要不慌，就不会出错。\n\n只是你没想到，导演的脾气比你想象中糟糕得多。","after":{"dohyun":"拍摄比预定时间提前了半小时结束。导演难得地笑了，说今天的成果是这个月最好的。\n\n收工后，{name}在片场门口等你。\n\n“喂，”{ta}说，“你下次还来吗？”\n\n“我只是临时帮忙的。”\n\n“那就不要临时了。”{ta}说，“我跟公司说，以后都找你。”\n\n你以为{ta}在开玩笑。\n\n一个星期后，你接到一通电话，是{ta}所属公司打来的，问你下个月有没有空，说有一个长期的合作想谈。\n\n电话那头的人补了一句：“是道贤指定的。”","yul":"拍摄结束后，导演把你叫过去，说以后有机会还要合作。你礼貌地道谢，转身就看见{name}靠在门边。\n\n“你很专业。”{ta}说，“我讨厌跟不专业的人合作。”\n\n“谢谢。”\n\n“不是客套。”{ta}说，“我说的是实话。”\n\n{ta}递给你一张名片，背面写着一个私人号码。\n\n“我的工作室下个月有一个项目，”{ta}说，“我想找你。”\n\n“只是工作？”\n\n{ta}看了你一眼：“先从工作开始。”","yunhee":"拍摄结束时，{name}跑过来，一把抱住你。\n\n“你好厉害！导演今天居然没有骂我！”\n\n你被{ta}抱得有点喘不过气。\n\n收工后，{ta}坚持要请你吃饭，说是感谢你救了{ta}的拍摄。\n\n你们在片场附近的一家小餐馆吃了部队锅。{ta}一边吃一边讲导演的坏话，讲得眉飞色舞。\n\n“你知道吗，”{ta}说，“我今天本来很害怕的。可是你一来，我就不怕了。”\n\n“为什么？”\n\n“不知道！”{ta}说，“就是有一种……你在的话，就没问题的感觉。”","harin":"拍摄结束后，{name}在化妆室里卸妆。你进去收拾器材，{ta}从镜子里看着你。\n\n“谢谢你。”{ta}说，“导演骂人的时候，你挡在前面。”\n\n“那是我的工作。”\n\n“不是。”{ta}说，“那不是你的工作。”\n\n你没有说话。\n\n{ta}卸完妆，素着一张脸转过来，雀斑在灯下很清楚：“我很怕这种场面。但今天，我觉得没那么怕了。”\n\n你离开时，{ta}叫住你：“下次如果还有拍摄……我可以要求是你吗？”"}},{"id":"cha5","t":"延误的航班","tm":"晚上 22:30","p":"仁川机场，你的航班延误了三个小时。\n\n候机室里人很少，你找了一个靠窗的位子坐下。没多久，一个戴帽子的人在你对面坐下，抱着一个大背包，看起来累坏了。\n\n广播又响：航班再延误一小时。\n\n那人叹了口气，拉下口罩喝水。你看见那张脸，手里的咖啡差点洒出来。是{name}。\n\n登机时，你看着登机证上的座位号码，再看看{ta}的。——就在隔壁。","c":{"yunhee":"{ta}一坐下就哀嚎：“我们好有缘喔！你也是去大阪吗？”","dohyun":"{ta}瞥了你一眼：“刚才在候机室偷看我的是你吧？”","harin":"{ta}安静地坐下，从包里拿出一本书，偶尔偷偷看你。","yul":"{ta}看了你一眼：“你是刚才那个咖啡差点洒出来的。”"},"o":[{"t":"分享你带的零食和耳机，一起看电影","a":4,"h":1,"r":{"yunhee":"{ta}看到感人的地方哭了，抢你的面纸。","dohyun":"“这部好无聊。”{ta}却看完了，还在最后笑出声。","harin":"{ta}看到一半睡着了，头差点靠到你肩上，又惊醒。","yul":"“我看过了。”{ta}说，却陪你看完，还在剧情转折时剧透。"},"m":{"yunhee":[2,0],"harin":[1,1]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[6,2,"best"]}},{"t":"问{ta}这次是去工作还是休假","a":3,"h":0,"r":{"yunhee":"“工作！但我想偷偷去环球影城！”","dohyun":"“休假。终于。”{ta}伸了个懒腰。","harin":"“工作。”{ta}简短地说。被问到工作，{ta}好像有点累。","yul":"“谈合约。”{ta}说，“你呢？”"},"m":{"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[-4,-1,"bad"]}},{"t":"看{ta}很累，帮{ta}要了毯子，让{ta}睡","a":3,"h":0,"r":{"yunhee":"“我还不想睡啦……”{ta}说，可是你已经帮{ta}盖好了，{ta}只好闭上眼睛。","dohyun":"“你当我是小孩？”{ta}说，“我又不困。”{ta}戴上耳机，不理你了。","harin":"{ta}睡着前轻声说：“到了叫我。”","yul":"“不用。”{ta}说，“我不习惯在别人旁边睡。”"},"m":{"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"戴上眼罩睡觉，不打扰{ta}","a":-3,"h":-1,"r":{"yunhee":"{ta}一直偷看你，想跟你说话，可是你一直睡。","dohyun":"你醒来时，{ta}已经换了座位。","harin":"{ta}一个人看着窗外，看了一整趟飞行。","yul":"整趟飞行，你们没有说一句话。下飞机时，{ta}先走了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"候机室的灯光很冷，椅子硬得坐不住。窗外的跑道上，飞机一架一架地起降，可是没有一架是你的。\n\n你买了一杯咖啡，坐在靠窗的位置，打开电脑处理工作，处理到一半就放弃了。延误让人很难专心。\n\n对面坐下的那个人一直在打电话，声音压得很低，好像在跟谁道歉。挂掉电话后，那人叹了很长一口气，靠在椅背上，摘下了帽子。","after":{"dohyun":"飞机终于在凌晨起飞。你们在飞机上又聊了很久，聊到其他乘客都睡着了。\n\n降落前，{ta}突然说：“你在大阪待几天？”\n\n“三天。”\n\n“我也是。”{ta}说，“第二天下午我没有行程。”\n\n你看着{ta}。\n\n“我知道一家很好吃的章鱼烧。”{ta}说，“当地人才知道的那种。”\n\n“你是在约我？”\n\n“不是。”{ta}说，“我是在推荐美食。”\n\n第二天下午，你们在大阪的小巷子里吃章鱼烧，烫到两个人都在跳。\n\n{ta}笑得很开心：“这是我第一次在国外，不用当偶像。”","yul":"飞机终于起飞。你们在飞机上聊了一路，从合约聊到工作，从工作聊到各自喜欢的城市。\n\n降落前，{ta}问你住哪家饭店。你说了，{ta}点点头，没说什么。\n\n隔天晚上，你在饭店大厅收到一个纸袋，里面是一盒当地很难买的点心，和一张纸条：\n\n「昨晚延误，你一直没吃东西。」\n\n纸条下面写着一个电话号码，和一句话：「我在这边待到后天。如果你想找人吃饭的话。」\n\n你打了那个电话。\n\n{ta}接起来的第一句是：“所以呢？你想吃什么？”","yunhee":"飞机终于起飞了。{name}在飞机上睡得很熟，头一点一点地，最后靠到了你的肩膀上。\n\n你不敢动。\n\n{ta}睡了两个小时，醒来时发现自己靠在你肩上，整个人弹起来：“对、对不起！”\n\n“没关系。”\n\n{ta}捂着脸：“好丢脸喔……我有流口水吗？”\n\n“一点点。”\n\n“啊啊啊啊！”\n\n降落后，{ta}在出关的地方等你，硬塞给你一张环球影城的票：“经纪人多买了一张！你要去吗！”\n\n你看着那张票，又看看{ta}期待的脸。","harin":"飞机起飞后，{name}一直在看窗外。夜晚的云层下，城市的灯光一闪一闪的。\n\n“我很喜欢夜间飞行。”{ta}轻声说，“好像在星星中间。”\n\n你们聊了很多。{ta}说起{ta}第一次坐飞机，是去日本录第一张专辑，那时候{ta}紧张得一整晚没睡。\n\n“现在呢？”\n\n“现在还是会紧张。”{ta}说，“可是今天，好像没那么紧张了。”\n\n降落前，{ta}在你的手心里放了一颗糖。\n\n“降落的时候吃。”{ta}说，“耳朵比较不会痛。”\n\n那是一颗很普通的水果糖。你一直没吃，带回家放在桌上。"}}],"known":[{"id":"kno1","t":"练习生时期的同期","tm":"晚上 21:00","p":"你曾经是练习生。和{name}同一年进公司，一起熬过无数个练到凌晨的夜晚。\n\n后来你放弃了，换了一条路，成了{job}。{ta}出道了，越来越红。你们的联络，就停在你离开那天。\n\n五年后的今天，你打开手机，看见一则讯息。","c":{"yunhee":"@msg 야!!! 나 기억해?? || 喂！！！你还记得我吗？？\n@msg 우리 연습실 자판기 아직도 고장 나 있어 ㅋㅋ || 我们练习室的自动贩卖机到现在还是坏的ㅋㅋ","dohyun":"@msg 야 살아있냐 || 喂，还活着吗？\n@msg 네 자리 아직 비어 있어 || 你的位置还空着。","harin":"@msg 그때 못 한 말이 있어서요 || 那时候有句话没说。\n@msg 시간 되면 만나요 || 有时间的话，见个面吧。","yul":"@msg 번호 안 바꿨네요 || 你没换号码。\n@msg 그래서? 이번 주 토요일 시간 돼요? || 所以呢？这周六有空吗？"},"o":[{"t":"马上回覆，说你一直有在看{ta}的舞台","a":4,"h":0,"r":{"yunhee":"{ta}传来一连串尖叫的贴图：「真的吗！！你都有看！！」","dohyun":"「当然要看。」{ta}回，「不看你会后悔。」","harin":"{ta}只回了一句：「谢谢你没有忘记。」","yul":"「我知道。」{ta}说，「你在评论区留言的帐号，我认得。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"老实说你当初离开，是因为不甘心","a":3,"h":0,"r":{"yunhee":"{ta}很久才回：「……原来你那时候那么难过。我都不知道。」之后好几天都很安静。","dohyun":"「我也是。」{ta}说，「不甘心你走。」","harin":"{ta}隔了很久才回：「那时候我想说的，就是这个。」","yul":"「不甘心是好事。」{ta}说，「至少你没骗自己。」"},"m":{"yul":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"约{ta}去以前常去的那家小吃店","a":3,"h":0,"r":{"yunhee":"「好啊好啊！那家辣炒年糕！」","dohyun":"「那家倒了。」{ta}回，「你都没在关心这里的事吧。」","harin":"「……好。」{ta}说，可是没有约时间。","yul":"「那家早就倒了。」{ta}说，「你离开得很彻底。」"},"m":{"yunhee":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"犹豫很久，只回了一个「嗯」","a":-3,"h":-1,"r":{"yunhee":"「就一个嗯？！」{ta}传来生气的贴图，然后就不再传了。","dohyun":"「嗯是什么意思。」{ta}说，然后就再也没传了。","harin":"{ta}没有再回。那句「那时候没说的话」，就停在那里了。","yul":"「我知道了。」{ta}只回了这句。之后那个号码，再也没有亮过。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你看着那两行字，很久都没动。\n\n练习生的那几年，像一场很长很累的梦。你们每天早上九点进练习室，晚上十二点才离开，周末也不休息。月末评估的前一晚，所有人都在走廊上练到天亮。\n\n你记得{name}那时候的样子：瘦，黑眼圈很重，跳舞的时候眼神很凶，下了练习却会偷偷分你半个饭团。\n\n你离开的那天，{ta}不在。{ta}去拍出道预告了。你们连一声再见都没说。","after":{"dohyun":"你们约在以前常去的那家小吃店。老板还认得你们，一看到就笑：“哎哟，两个小鬼长大了。”\n\n{ta}点了跟以前一模一样的东西：两份辣炒年糕、一份鱼板、两瓶汽水。\n\n“你还记得我们以前的口味？”你问。\n\n“当然。”{ta}说，“我常常一个人来点两人份。”\n\n你愣住了。\n\n{ta}低头吃东西，假装没说过那句话。\n\n吃完后，{ta}送你到地铁站。\n\n“喂，”{ta}说，“你当初走的时候，我很生气。”\n\n“我知道。”\n\n“现在不气了。”{ta}说，“因为你现在过得很好。”","yul":"那个周六，你们在一家很安静的西餐厅见面。{ta}比你早到，已经点好了菜。\n\n“我记得你不吃香菜。”{ta}说。\n\n你确实不吃。可是你不记得自己跟{ta}说过。\n\n“练习生的时候，”{ta}说，“你每次都把便当里的香菜挑给我。”\n\n你们聊了很久。{ta}说起前团解散的事，说起那段很难熬的日子，语气平静得像在说别人的事。\n\n“那时候我常常想，”{ta}说，“如果你还在，会怎么样。”\n\n“会怎么样？”\n\n“大概会有人骂我。”{ta}说，“骂我不要放弃。”","yunhee":"你们约在以前练习室附近的那家咖啡厅。{ta}一看到你就冲过来，抱住你，抱了很久。\n\n“我好想你！”{ta}说，声音有点哽咽。\n\n你们坐下来，聊了整整三个小时。{ta}跟你说出道后的每一件事：第一次上音乐节目、第一次拿一位、第一次被恶评骂哭。\n\n“每次难过的时候，”{ta}说，“我都会想，如果你在就好了。你一定会说：『哭什么，明天继续练。』”\n\n你笑了：“我以前那么凶？”\n\n“超凶！”{ta}说，“可是我最喜欢你。”\n\n{ta}说完，好像意识到了什么，慌张地补了一句：“作为朋友！”","harin":"你们约在以前练习室附近的一个小公园。{ta}坐在长椅上，看到你走过来，站了起来。\n\n你们站着看对方，谁都没说话。\n\n最后是{ta}先开口：“那时候，我想跟你说的话是……”\n\n{ta}停住了。\n\n“是什么？”\n\n“是『不要走』。”{ta}说，“可是我说不出口。因为我知道，你留下来会很痛苦。”\n\n你看着{ta}，很久没说话。\n\n“现在，”{ta}说，“我想说另一句。”\n\n“什么？”\n\n“欢迎回来。”{ta}说，“虽然你不是回来当练习生，是回来……当我的朋友。”"}},{"id":"kno2","t":"综艺里提到的名字","tm":"晚上 22:40","p":"大学时，你和{name}在同一个音乐社团。{ta}休学去当练习生，之后你们就断了联系。\n\n今晚，你在家里配着啤酒看综艺。主持人问{name}：“学生时代有没有印象最深刻的人？”\n\n{ta}想了想，说出了你的名字。\n\n你的手机在接下来半小时里响个不停，朋友们疯狂传截图。你还没回过神来，一个陌生号码打来电话。","c":{"yunhee":"“{me}！你看到了吗？我是不是说得很好？”{ta}的声音兴奋得要命。","dohyun":"“喂，你看到了吧？”{ta}笑，“现在全国都知道你了。”","harin":"“我是不是给你添麻烦了？”{ta}的声音很轻，“我说完才后悔。”","yul":"“节目组会把你的名字消音。”{ta}说，“我已经交代了。”"},"o":[{"t":"笑着说你被吓到了，但很开心","a":4,"h":0,"r":{"yunhee":"“那就好！我一直怕你不记得我！”","dohyun":"“我就知道。”{ta}得意地说。","harin":"“那就好。”{ta}松了一口气，“我想再见你一面。”","yul":"“开心就好。”{ta}说，“周末出来吃饭。”"},"m":{"harin":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"问{ta}为什么会想到你","a":3,"h":1,"r":{"yunhee":"“因为你以前每天帮我占社团的位子！”","dohyun":"“因为你以前很烦。”{ta}说完又补，“好吧，很难忘。”","harin":"“因为……你听过我写的第一首歌。”","yul":"“因为你是唯一敢跟我吵架的人。”"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[2,1,"good"],"yul":[6,1,"best"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"抱怨你的手机快被打爆了","a":2,"h":0,"r":{"yunhee":"“对不起……”{ta}的声音一下子变得很小，“我以为你会开心。”","dohyun":"“那你换号码啊。”{ta}冷笑，“我又不是故意要打扰你。”","harin":"“嗯。”{ta}说，“我等你。”可是你一直没打回去。","yul":"“我会处理。”{ta}的语气很冷，“打扰了。”"},"m":{"dohyun":[1,0],"harin":[-3,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"冷静地说现在不太方便，改天再聊","a":-3,"h":-1,"r":{"yunhee":"“……好吧。”{ta}的声音很失落，“那我不打扰了。”","dohyun":"“喔。”{ta}挂了电话，五分钟后，节目组发了消音声明。","harin":"“对不起……”{ta}的声音更小了，“我果然不该说的。”","yul":"“好。”{ta}说，“我不会再打来了。”"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那个综艺你本来只是随便开着当背景音。直到主持人问出那个问题，你才抬起头。\n\n{name}想了很久。镜头给了{ta}一个特写，{ta}的表情很认真，好像真的在回忆什么。\n\n然后{ta}说出了你的名字，后面还加了一句：“那个人是我在社团的时候，唯一一个跟我说『你可以的』的人。”\n\n你手里的啤酒差点掉下来。\n\n你想起来了。大一那年，社团的公演，{ta}紧张得在后台发抖，是你在旁边说了一句：“你可以的。”\n\n你从来没想过，{ta}会记得。","after":{"dohyun":"那通电话后来聊了一个多小时。{ta}讲了很多社团时候的事，讲到你们一起被学长骂、一起偷吃公演的便当、一起在练习室的地板上睡着。\n\n“你知道吗，”{ta}说，“我休学那天，你在社团的留言板上写了一句话。”\n\n“我写了什么？”\n\n“『去吧，红了记得请客』。”{ta}说，“所以我现在打来，是要请客。”\n\n你笑出声。\n\n“这周末？”{ta}说，“我知道一家很好吃的烤肉。不准拒绝，这是你自己写的。”","yul":"电话那头，{ta}一直很冷静，冷静地道歉，冷静地说明节目组会怎么处理，冷静地问你需不需要律师。\n\n最后，{ta}停了一下：“其实我是故意说的。”\n\n“什么？”\n\n“说出你的名字。”{ta}说，“我找你很久了。社团解散后，所有人都失联了。我想，如果在电视上说出来，你也许会看到。”\n\n你不知道该说什么。\n\n“这个方法很笨。”{ta}说，“我知道。可是有用。”\n\n“那你找到我之后，想做什么？”\n\n“想当面说谢谢。”{ta}说，“顺便吃个饭。”","yunhee":"那通电话聊到半夜。{ta}兴奋地讲着社团的回忆，讲到激动处就尖叫，你不得不把手机拿远一点。\n\n“你还记得吗！公演那天我忘词，你在台下用口型提醒我！”\n\n你不记得了。可是{ta}讲得那么生动，你好像也想起来了一点。\n\n“所以我在节目上说的是真心的。”{ta}说，“你是我的恩人！”\n\n“太夸张了。”\n\n“一点都不夸张！”{ta}说，“我要请你吃饭！吃一百次！”\n\n挂掉电话前，{ta}的声音突然变小了：“其实……我一直很想再见你。”","harin":"那通电话后来变得很安静。你们都不太知道该说什么，可是谁都没有挂。\n\n最后，{ta}轻声说：“你记得那首歌吗？我在社团写的第一首。”\n\n你记得。那首歌没有名字，{ta}只在社团的练习室里弹过一次，弹完就说太丢脸了，再也不弹了。\n\n“我后来把它写完了。”{ta}说，“下一张专辑会收录。”\n\n“叫什么名字？”\n\n{ta}停了很久：“叫〈你可以的〉。”\n\n你握着手机，说不出话。\n\n“我想第一个弹给你听。”{ta}说，“可以吗？”"}},{"id":"kno3","t":"留在旧家的东西","tm":"下午 15:00","p":"你要搬家了。整理储藏室时，你翻到一个纸箱，上面用马克笔写着「{name}的东西」。\n\n那是好几年前的事了。你们住在同一栋旧公寓的对门，{ta}还是练习生，常常练到半夜才回来。后来{ta}出道搬走，留下这箱东西，说下次来拿，就再也没来过。\n\n箱子里有几件旧衣服、一个旧耳机、还有一本写满字的笔记本。\n\n你犹豫了很久，用旧号码传了一则讯息。没想到，三分钟后就有回覆。","c":{"yunhee":"@msg 헐 대박!! 그거 내 보물인데!! || 天啊大发！！那是我的宝贝！！","dohyun":"@msg 그거 아직도 있어? ㅋㅋㅋ || 那个还在？ㅋㅋㅋ\n@msg 노트는 읽지 마라 || 笔记本不准看。","harin":"@msg 그 노트… 혹시 읽었어요? || 那本笔记……你看了吗？","yul":"@msg 내가 갈게요 || 我过去。\n@msg 주소 그대로죠? || 地址没变吧？"},"o":[{"t":"说你没看笔记本，约时间还给{ta}","a":4,"h":0,"r":{"yunhee":"「你好有原则！我好感动！」","dohyun":"「真的没看？」{ta}半信半疑，「那我亲自去确认。」","harin":"「谢谢。」{ta}停了停，「其实……你看了也没关系。」","yul":"「我信你。」{ta}说，「明天下午三点。」"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"老实说你不小心看到第一页","a":3,"h":1,"r":{"yunhee":"「啊啊啊啊！好丢脸！」","dohyun":"「我就知道。」{ta}说，「你要负责。」","harin":"{ta}很久才回：「第一页写的，是关于你的。」","yul":"「诚实。」{ta}说，「那页是我的计划。现在都做到了。」"},"m":{"dohyun":[2,0],"harin":[2,1]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"拍一张旧耳机的照片传给{ta}","a":3,"h":0,"r":{"yunhee":"「呜呜那是我的宝贝……」{ta}说，「可是你拍得好模糊喔。」","dohyun":"「喔。」{ta}只回了一个字。好像那个耳机，对{ta}来说一点都不重要。","harin":"「谢谢。」{ta}说。没有再问笔记本的事。","yul":"「我要的是笔记本。」{ta}说，「耳机不重要。」"},"m":{},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"说你可以直接寄给{ta}的公司","a":-3,"h":-1,"r":{"yunhee":"「不要寄啦……」{ta}说，可是你坚持，{ta}就不说话了。","dohyun":"「寄？」{ta}说，「你连见我一面都不想？」","harin":"「……好。」{ta}说，「谢谢你帮我保管这么久。」像在道别。","yul":"「好。」{ta}说，「地址我让助理给你。」语气像在处理一件公事。"},"m":{"yunhee":[-2,0],"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那栋旧公寓是你大学毕业后住的第一个地方。房租便宜，隔音很差，每天晚上都能听见对门的人回来时，钥匙在锁孔里转动的声音。\n\n那时候的{name}还是练习生。{ta}常常凌晨两三点才回来，有几次在楼梯间撞见你，两个人都累得只能点头。\n\n后来有一次，{ta}的钥匙断在锁孔里，在门口坐了一整夜。你早上出门时发现，就把{ta}拉进你家，煮了一碗泡面。\n\n那之后，你们就熟了。","after":{"dohyun":"隔天下午，{ta}真的来了。戴着帽子和口罩，站在你新家的门口，四处张望。\n\n“你搬到这么远？”{ta}说，“我找了半天。”\n\n你把纸箱交给{ta}。{ta}打开，第一个拿出来的就是那本笔记本，翻都没翻，直接塞进背包。\n\n“真的没看？”\n\n“只看了第一页。”\n\n{ta}瞪着你，然后叹了一口气：“算了。反正你迟早会知道。”\n\n“知道什么？”\n\n{ta}没回答，只是拿起那个旧耳机，戴上，按了几下：“还能用。”\n\n临走前，{ta}在门口回头：“喂，你新家有泡面吗？”","yul":"隔天下午三点，{ta}准时出现在你家门口。\n\n{ta}打开纸箱，一件一件检查，最后拿起那本笔记本，翻开第一页，看了很久。\n\n“这是我十九岁写的。”{ta}说，“五年计划。”\n\n你看了一眼。第一行写着：「出道。」第二行：「拿一位。」第三行：「不要再让任何人失望。」\n\n“都做到了？”你问。\n\n“前两个做到了。”{ta}说，“第三个……没有。前团解散的时候，我让很多人失望了。”\n\n{ta}合上笔记本，看着你：“包括你。那时候我搬走，连一句话都没说。”","yunhee":"隔天，{ta}来拿东西的时候，带了一大袋水果和一盒蛋糕。\n\n“谢谢你帮我保管这么多年！”{ta}说。\n\n{ta}打开纸箱，看到那些旧衣服就笑：“好丑喔！我那时候怎么会穿这个！”\n\n看到那个旧耳机，{ta}安静下来。\n\n“这个，”{ta}说，“是我打工三个月买的。那时候我好穷，每天只吃一顿饭。”\n\n“我记得。”你说，“你常常来我家蹭饭。”\n\n{ta}看着你，眼眶红了：“你那时候对我好好。我一直都记得。”\n\n{ta}抱着那个纸箱，在你家坐到天黑。","harin":"隔天，{ta}来拿东西。{ta}站在你的新家门口，看了很久，才敲门。\n\n你把纸箱交给{ta}。{ta}没有马上打开，只是抱着。\n\n“那本笔记本，”{ta}说，“第一页写的是什么，你还记得吗？”\n\n你记得。那页只有一行字：「如果有一天我写出一首好歌，第一个要给对门的人听。」\n\n“我那时候不敢跟你说。”{ta}说，“后来搬走了，就更不敢了。”\n\n你没有说话。\n\n{ta}从包里拿出一张CD，放在你手里：“这是我的第一张专辑。晚了好几年。对不起。”"}},{"id":"kno4","t":"出道前打工的店","tm":"晚上 20:30","p":"你大学时在一家炸鸡店打工。那时候店里有个同事，总是边炸鸡边练发声，被老板骂了无数次。\n\n那个同事，就是现在的{name}。\n\n炸鸡店要收了。老板在群组里说，最后一天，大家回来吃一顿。\n\n你推开店门，里面只有老板和一个戴帽子的人，正在帮忙擦桌子。","c":{"yunhee":"{name}丢下抹布扑过来：“{me}！你终于来了！我们最佳搭档！”","dohyun":"{name}吹了声口哨：“哟，你还是那么慢。”","harin":"{name}安静地对你笑了笑，把一张椅子拉出来给你。","yul":"{name}说：“老板说你会迟到十分钟。你迟到了十二分钟。”"},"o":[{"t":"穿上旧围裙，跟{ta}一起炸最后一锅鸡","a":4,"h":1,"r":{"yunhee":"{ta}在旁边边唱边炸，跟以前一模一样。","dohyun":"“我们比谁炸得快。”{ta}胜负欲又上来了。","harin":"{ta}在你旁边，轻轻哼起那时候常练的那首歌。","yul":"“火候不对。”{ta}接过你的夹子，“我来。”"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"跟老板和{ta}聊以前的糗事","a":3,"h":0,"r":{"yunhee":"{ta}笑到趴在桌上。","dohyun":"“那次是你的错！”{ta}跟你吵了半天。","harin":"{ta}被你说的糗事弄得很尴尬，脸红了，后来就不太说话了。","yul":"“糗事没什么好聊的。”{ta}说，“过去就是过去。”"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"问{ta}现在当偶像，开不开心","a":3,"h":0,"r":{"yunhee":"{ta}愣了一下，笑得有点勉强：“开心……当然开心啊。”","dohyun":"“开心啊。”{ta}说，语气突然很冲，“干嘛问这个？”","harin":"“有时候。”{ta}轻声说，“你是第一个问我这个的人。”","yul":"“开心不是重点。”{ta}说，“重点是我做到了。”"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[6,0,"best"]}},{"t":"跟老板聊，没怎么理{ta}","a":-3,"h":-1,"r":{"yunhee":"“你都不理我！”{ta}抗议，你还是没理。{ta}就安静了。","dohyun":"{ta}在你背后偷吃你的炸鸡，你都没发现。最后{ta}也懒得逗你了。","harin":"{ta}一直在听你们说话，可是你一次都没有转头看{ta}。","yul":"{ta}跟老板谈完事情，就先走了。经过你身边时，没有停下来。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那家炸鸡店在大学后门的巷子里，招牌是手写的，油烟熏得有点发黄。你大学四年，有两年都在这里打工。\n\n那时候的{name}还是个瘦瘦的练习生，每天下午来打工三个小时，然后赶去公司练习。{ta}炸鸡的时候会偷偷练发声，被老板骂了无数次，可是从来没改过。\n\n有一次，{ta}在炸鸡的时候唱了一整首歌。整间店的客人都安静下来听，唱完后有人鼓掌。老板骂{ta}，可是那天给了{ta}加薪。","after":{"dohyun":"那天你们待到很晚。老板拿出珍藏的烧酒，三个人喝到半醉，讲了很多以前的事。\n\n老板说，{ta}刚来的时候瘦得像竹竿，每天偷吃炸鸡皮；说你那时候总是迟到，可是永远会多留一份炸鸡给{ta}。\n
