判刑。\n\n审判那天，{name}没有出庭。律师代为宣读了一份陈述书。上面写着，这段时间{ta}如何不敢出门、如何在半夜惊醒、如何在每一个人群里寻找你的脸。\n\n法官宣判时，你一直在想，事情是从哪里开始变成这样的。\n\n也许是从某一次，你选了那个最伤人的选项。也许是从你被拒绝之后，没有选择放手。\n\n喜欢一个人，从来不是可以不顾对方意愿的理由。","c":{"dohyun":"后来你在新闻上看到，{ta}重新开始了签售会。签售台前多了一道玻璃隔板，{ta}隔着玻璃，对每一个粉丝笑。","yul":"后来你听说，{ta}的工作室把这个案子的判决书公开了，作为警告。附注只有一句：「界线，不容越过。」","yunhee":"后来你听说，{ta}花了很长一段时间，才敢再一个人走在街上。{ta}的成员们，一直轮流陪着{ta}。","harin":"后来{ta}发表了一首新歌，歌名叫〈门锁〉。那是{ta}休养一年后，第一次站上舞台。"}}}},"tc":{"roster":[{"id":"yunhee","name":"車允熙","name_ko":"차윤희","gender":"女","age":"24","group":"VELVET HOUR（四人女團）","position":"主唱・門面","company":"Blossom Music","mbti":"ENFP","mate":"瑟琪","mgr":"金代理","tag":"陽光話癆的主唱，撒嬌自然，但心裡有一條線","personality":"開朗外放、情緒寫在臉上，擅長讓氣氛變熱。看起來好追，其實很清楚自己要什麼，被敷衍會立刻冷下來。認真起來非常專一。","speech":"語氣上揚，愛用語尾撒嬌，訊息貼圖和表情符號很多，一句話拆成好幾則發。口頭禪：「대박!」","hobby":"拍底片相機、逛二手市集、追綜藝","look":"163cm，淺栗色長卷發，笑起來有虎牙，喜歡寬大衛衣","circle":"隊友：隊長瑟琪（大姐頭）、rapper 娜妍（毒舌）、忙內書雅（害羞）；經紀人金代理","traits":["sunny","clingy"]},{"id":"dohyun","name":"白道賢","name_ko":"백도현","gender":"男","age":"22","group":"NOVA LINE（五人男團）","position":"主舞・忙內","company":"Lumen Entertainment","mbti":"ESTP","mate":"準浩","mgr":"樸室長","tag":"痞氣直球的忙內，愛逗人，勝負欲強到幼稚","personality":"行動派、愛冒險、嘴上不饒人，喜歡用捉弄掩飾在意。對喜歡的人會直接靠近，但被認真拒絕時會意外地失落又嘴硬。","speech":"幾乎都用半語，語氣輕佻，訊息很短但很密，常用「ㅋㅋㅋ」。口頭禪：「뭐 어때」。","hobby":"滑板、打遊戲、深夜吃炸雞","look":"178cm，漂成銀灰的頭髮，耳骨釘，舞臺下總穿運動服","circle":"隊友：隊長世溫（管他最嚴）、rapper 準浩（損友）、主舞泰陽、副唱民宇；經紀人樸室長","traits":["direct","sharp","tsundere"]},{"id":"harin","name":"徐夏琳","name_ko":"서하린","gender":"女","age":"27","group":"Solo 歌手","position":"創作歌手","company":"Moonroom Records","mbti":"INFJ","mate":"Jay 哥","mgr":"李室長","tag":"安靜敏感的創作歌手，慢熱，看人很準","personality":"溫柔內斂、觀察力強，習慣把情緒寫進歌裡。對人保持距離，信任一旦建立就很深。害怕被當成「偶像」而不是「人」。","speech":"說話輕、句子完整，偶爾用很文學的比喻；訊息常在深夜，字數不多但每句都斟酌過。口頭禪：「음… 그렇구나」。","hobby":"寫詞、養貓（名字叫 Tofu）、雨天散步","look":"167cm，黑色鎖骨發，素顏時有雀斑，常穿針織開衫","circle":"身邊的人：製作人兼老友 Jay 哥、造型師恩智、貓 Tofu；經紀人李室長","traits":["gentle","sensitive","slow"]},{"id":"yul","name":"姜律","name_ko":"강율","gender":"男","age":"29","group":"Solo（前男團 rapper，現兼演員）","position":"Rapper・演員","company":"自立工作室 RULE","mbti":"ENTJ","mate":"敏俊","mgr":"崔姐","tag":"毒舌腹黑的成熟系，掌控欲強，私下意外溫柔","personality":"自信、強勢、講效率，說話一針見血，討厭拐彎抹角。習慣掌握節奏，對感情卻極度謹慎，曾被前團的解散傷過。認定的人會護到底。","speech":"低音、語速快，半語與敬語切換看心情，諷刺時反而用敬語；訊息簡潔，常直接給時間地點。口頭禪：「그래서?」","hobby":"拳擊、收集黑膠、下廚","look":"185cm，深棕背頭，眉骨高，左手腕有細小刺青","circle":"身邊的人：前隊友兼好友敏俊、工作室代表崔姐、助理小吳","traits":["scheming","cold"]}],"open":{"fan":[{"id":"fan1","t":"便利貼上的問題","tm":"下午 15:20","p":"籤售會場的冷氣開得很足，你手裡那張便利貼被捏得有點皺。上面寫著你想了三天的問題：「如果今天不當偶像，你最想去哪裡發呆？」\n\n輪到你時，{name}低頭讀完，筆停在半空。\n\n下一秒，{ta}笑場了。不是營業的那種笑，是肩膀一抖、整個人往後靠的那種。旁邊的工作人員都愣住了。\n\n簽名很快就結束，你被引導離場，腦袋一片空白。\n\n散場後你繞到場館後門等朋友，卻看見一臺保姆車旁，{name}戴著口罩，正低頭找什麼。{ta}抬眼，正好對上你的視線。","c":{"yunhee":"{ta}眼睛一亮，小跑兩步：「啊！便利貼！대박，你害我在鏡頭前破功了啦！」","dohyun":"{ta}挑眉，雙手插口袋晃過來：「喂，你是故意的吧？害我差點被室長罵。」","harin":"{ta}輕輕拉下口罩一角：「음… 그렇구나。是你啊。那個問題，我會認真想的。」","yul":"{ta}瞥了你一眼，語氣平平：「是你寫的？問題不錯。比問我吃了沒有強多了。」"},"o":[{"t":"老實說出你自己的答案：你最想去海邊發呆","a":4,"h":0,"r":{"yunhee":"「我也是我也是！」{ta}差點跳起來，被{mgr}一把拉住袖子。","dohyun":"「海邊？好無聊。」{ta}嘴上嫌棄，卻又問：「哪一個海邊？」","harin":"{ta}眼神柔了下來：「海浪的聲音，像有人一直在替你說話。」","yul":"「具體一點。」{ta}追問哪片海、幾點去，像在開會。"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"慌張道歉，說不是故意讓{ta}笑場","a":2,"h":0,"r":{"yunhee":"{ta}的笑容僵了一下：「啊……嗯，沒關係啦。」可是{ta}沒有再往前走。","dohyun":"「道歉？」{ta}的笑一下子收了，「我還以為你挺有趣的。原來只是普通粉絲。」","harin":"{ta}的眼神暗了一下：「……你覺得那是一件需要道歉的事嗎。」","yul":"「又是道歉。」{ta}的語氣冷下來，「我最討厭沒做錯事還道歉的人。」"},"m":{"yul":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"開玩笑說：那下次籤售我再出一題更難的","a":3,"h":1,"r":{"yunhee":"「好啊！我會先做功課的！」{ta}認真地握拳。","dohyun":"「來啊，我會贏。」{ta}的勝負欲一下子就上來了。","harin":"{ta}輕笑：「那我得先想好答案才敢去了。」","yul":"「行。我等著看你能出多難。」"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"只是禮貌點頭，說朋友在等，先離開","a":-3,"h":-1,"r":{"yunhee":"「喔……好。」{ta}揮手的動作停在半空，像被潑了一盆冷水。","dohyun":"你轉身的時候，聽見{ta}「嘖」了一聲。再回頭，{ta}已經上車了，車門關得很響。","harin":"{ta}沒有挽留。你走遠後回頭，{ta}已經低頭走進車裡，連一眼都沒看。","yul":"{ta}點了一下頭，什麼都沒說，轉身就走。那個背影比籤售臺上冷了好幾度。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你排了兩個小時的隊。前面的人一個個上去，有人哭、有人尖叫、有人緊張到說不出話。你一直在心裡默唸那個問題，怕自己到時候會忘記怎麼開口。\n\n籤售臺很長，成員們坐成一排。輪到{name}之前，你偷偷看了{ta}很久：{ta}簽名的時候會微微歪頭，聽粉絲說話時會把筆放下，眼睛看著對方。那種認真，不太像營業。\n\n然後就輪到你了。","after":{"dohyun":"那天晚上，你在社群上看到一段飯拍：{name}在籤售臺上笑到彎腰的樣子，被轉發了幾千次。標題寫著「到底是誰讓道賢笑場」。\n\n你把手機扣在桌上，臉燙得不像話。\n\n十一點多，一個陌生帳號傳來私訊。頭像是一塊滑板。\n\n@msg 야 그 포스트잇 아직 있다 || 喂，那張便利貼我還留著。\n@msg 답은 다음에 알려줌 ㅋ || 答案下次告訴你ㅋ\n\n你盯著那兩行字看了很久，才發現自己一直在笑。","yul":"回家的地鐵上，你還在想{ta}那句「比問我吃了沒有強多了」。\n\n那天晚上，經紀公司的官方帳號發了籤售會的照片。其中一張，{name}低頭看著一張便利貼，嘴角有一點很淡的弧度。粉絲們在底下猜了一整晚，那張便利貼上寫了什麼。\n\n凌晨一點，你的私訊跳出一則訊息。帳號沒有頭像，只有一個名字的縮寫。\n\n@msg 바다. 동해. 새벽 5시 || 海。東海。清晨五點。\n@msg 그게 내 답이에요 || 那是我的答案。\n\n你還沒回，{ta}又補了一句：「不用回。只是不喜歡欠著問題。」","yunhee":"那天晚上，VELVET HOUR 的官方帳號上傳了一支籤售會的花絮。影片裡，{name}笑到趴在桌上，旁邊的成員一臉莫名其妙。\n\n留言區全在問：「是哪個粉絲！」「允熙笑到打嗝了哈哈哈」\n\n你縮在被子裡，把那支影片看了五遍。\n\n快十二點時，你的私訊跳出一個粉紅色頭像。\n\n@msg 혹시… 포스트잇 주인?? || 請問……是便利貼的主人嗎？？\n@msg 답 생각해봤어용!! 제주도!! || 我想好答案了！！濟州島！！\n@msg 아 근데 이거 회사에 들키면 혼나 ㅠㅠ || 啊不過被公司發現會被罵嗚嗚\n\n後面接著一排慌張的表情符號。","harin":"回家後，你翻開專輯，發現{ta}在簽名旁邊寫了一行很小的字，你剛才沒注意到：\n\n「謝謝你問了一個不需要標準答案的問題。」\n\n那天深夜，{name}在個人帳號上傳了一張照片：一片模糊的夜景，配文只有一句——「如果不是現在的我，大概會在某個安靜的地方發呆吧。」\n\n粉絲們以為是新歌預告。只有你知道，那是一個回答。\n\n凌晨兩點，你收到一封很短的私訊，帳號頭像是一隻白貓。\n\n@msg 혹시 불편하셨으면 미안해요 || 如果讓你不舒服了，對不起。\n@msg 그냥… 고맙다고 말하고 싶었어요 || 只是……想說聲謝謝。"}},{"id":"fan2","t":"臺上的遊戲與遺失的手機","tm":"晚上 19:40","p":"見面會進行到互動環節，主持人抽出的號碼，是你的座位。\n\n你幾乎是被推上臺的。遊戲是「默契考驗」：你和{name}背對背，同時比出答案。燈光很熱，臺下的尖叫聲像潮水。\n\n三題裡你們對中了兩題。下臺時你的腿還在抖，回到座位才發現——手機不見了。\n\n隔天中午，一個陌生號碼打來。是{name}的經紀人{mgr}，說工作人員在舞臺側邊撿到一支手機，鎖屏是你的貓。約好在公司附近的咖啡廳歸還。\n\n你到的時候，{mgr}身邊還坐著一個戴帽子的人。","c":{"yunhee":"{name}從帽簷下探出頭：「是我堅持要跟來的！想跟遊戲搭檔說聲謝謝～」","dohyun":"{name}晃著你的手機：「鎖屏是貓？跟你一點都不像。」","harin":"{name}把手機放在桌上，指尖推過來：「你的貓，很像我家的 Tofu。」","yul":"{name}看了眼手錶：「我剛好在附近。順便。」說得像早就排好的行程。"},"o":[{"t":"真誠道謝，請{ta}和{mgr}喝咖啡","a":3,"h":0,"r":{"yunhee":"「耶！那我要最貴的！」{ta}笑著點了草莓拿鐵。","dohyun":"「喝咖啡多沒意思，請我吃甜點。」","harin":"{ta}有些不自在地推開咖啡：「不用了……我不太習慣被請。」氣氛一下子變尷尬。","yul":"「我請。」{ta}已經付完了錢，「你是來拿東西的。」"},"m":{},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[-4,-1,"bad"]}},{"t":"聊起臺上的默契遊戲，問{ta}第三題為什麼比那個","a":4,"h":1,"r":{"yunhee":"「因為我以為你會比那個嘛！下次一定對中！」","dohyun":"「是你比錯了，不是我。」{ta}堅決不認輸。","harin":"{ta}想了想：「因為那一題，我想到的是安靜的東西。」","yul":"「直覺。」{ta}停了一下，「你的直覺跟我不一樣，有意思。」"},"m":{"dohyun":[1,0],"harin":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[6,1,"best"]}},{"t":"給{ta}看手機裡更多貓的照片","a":2,"h":0,"r":{"yunhee":"{ta}看著看著，開始低頭滑自己的手機。你說了半天，{ta}只回了「嗯嗯」。","dohyun":"{ta}看了兩張就打哈欠：「好了好了，我知道你很愛你的貓。」","harin":"{ta}也拿出手機：「這是 Tofu。它們應該會合得來。」","yul":"「我不是來看貓的。」{ta}看了眼手錶，「還有別的事嗎？」"},"m":{"harin":[3,0],"yunhee":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"拿回手機就禮貌告辭，不想打擾{ta}休息","a":-3,"h":-1,"r":{"yunhee":"{ta}張了張嘴，最後只是笑笑：「好吧，那你路上小心。」笑得很勉強。","dohyun":"{ta}的臉一下子沉下來：「我特地跟來，你就這樣？」{ta}起身就走了。","harin":"{ta}的手指在桌面上停了很久。「……好。」{ta}說完，就沒有再抬頭。","yul":"「很好。」{ta}說，「我也很忙。」{ta}比你先站起來，沒有再看你。"},"m":{"dohyun":[-2,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那天的咖啡廳在一條很安靜的巷子裡，門口掛著手寫的菜單板。你提早十分鐘到，推開門時，風鈴響了一聲。\n\n{mgr}坐在靠窗的位置，看起來是個很乾練的人，桌上擺著兩部手機和一本行程表。看到你，{mgr}禮貌地點頭，說：「我先確認一下，鎖屏的貓叫什麼名字？」\n\n你說了。{mgr}笑了一下，才把你的手機從包裡拿出來。\n\n就在這時，坐在旁邊那個戴帽子的人抬起頭。","after":{"dohyun":"{mgr}一直在看錶，十五分鐘後就起身說下一個行程要遲到了。\n\n{name}被拖走前，回頭看了你一眼，用口型說了兩個字。你沒看清楚。\n\n那天晚上，你的手機多了一個聯絡人。你不記得自己有存過，名字是「도현（貓的恩人）」。\n\n你這才想起來，剛才手機在{ta}手上的那幾分鐘。\n\n@msg 내 번호 저장해놨다 || 我把我的號碼存進去了。\n@msg 고양이 사진 더 보내 || 再傳貓的照片給我。\n@msg …명령 아님. 부탁임 || ……不是命令。是拜託。","yul":"{mgr}接了一通電話，表情變得很嚴肅，說要先回公司處理。{name}點點頭，沒有跟著走。\n\n「你可以走了。」{ta}對你說，「東西已經還了。」\n\n可是{ta}自己也沒動。你們就這樣各自喝著咖啡，安靜地坐了十分鐘。窗外有人在遛狗，{ta}看著那隻狗，看了很久。\n\n離開時，{ta}在櫃檯多買了一個可頌，塞進你手裡：「剛才那杯，算我的。這個算你的。」\n\n那天晚上，你收到一則訊息。\n\n@msg 강율입니다. 매니저한테 번호 받았어요 || 我是姜律。跟經紀人要了號碼。\n@msg 그래서? 그 고양이 이름이 뭐라고요? || 所以呢？那隻貓叫什麼名字來著？","yunhee":"那天下午，{name}和你聊了快一個小時。從貓聊到{ta}最近迷上的底片相機，從底片相機聊到{ta}練習生時期偷偷養在宿舍的倉鼠。\n\n{mgr}在旁邊看了好幾次手錶，最後終於忍不住：「允熙，錄音。」\n\n「再五分鐘！」\n\n「已經說了三次五分鐘了。」\n\n{name}只好站起來，臨走前塞給你一張拍立得——是剛才趁你不注意偷拍的，你正低頭看著手機裡的貓。\n\n「送你！」{ta}說，「作為讓我笑場的回禮。」\n\n那天晚上，你在拍立得背面發現一行字和一串數字：「下次帶貓的照片來！」","harin":"你們聊了很久貓的事。{ta}說 Tofu 很膽小，打雷的時候會躲進衣櫃；你說你的貓正好相反，最喜歡趴在窗臺看下雨。\n\n「那它們，」{ta}想了想，「一個怕雨，一個喜歡雨。」\n\n說完，{ta}自己先笑了，好像這句話讓{ta}想到了什麼。\n\n{mgr}在旁邊輕輕咳了一聲，{ta}才回過神來，站起身向你鞠躬。\n\n那天深夜，{ta}的個人帳號更新了一張照片：一隻白貓縮在衣櫃裡，配文寫著：「今天認識了一隻喜歡雨的貓。」\n\n你還在看那張照片，手機就震了一下。\n\n@msg 고양이 사진, 하나만 더 보내줄 수 있어요? || 貓的照片，可以再傳一張給我嗎？"}},{"id":"fan3","t":"視訊籤售的定格表情","tm":"晚上 21:05","p":"視訊籤售的一分鐘，你準備了好久。\n\n結果網絡在第二十秒斷了。畫面卡住時，你正好張著嘴、眼睛半閉，表情慘不忍睹。重新連上時，屏幕那頭的{name}已經笑到說不出話。\n\n一個月後，線下籤售。你本來以為那件事早被忘了。\n\n你把專輯推過去，{name}抬頭看你，停了兩秒。","c":{"yunhee":"「啊！是定格的那個！我截圖了耶！」{ta}說完才發現自己說漏嘴。","dohyun":"「你是那個——」{ta}模仿了一下你的表情，模仿得一模一樣。","harin":"「你那天，後來有好好睡覺嗎？那個時間已經很晚了。」","yul":"「你的網絡換了嗎？」{ta}一本正經，「那天浪費了我四十秒。」"},"o":[{"t":"自嘲：「那是我最上鏡的角度」","a":4,"h":0,"r":{"yunhee":"「對！超上鏡！我要拿來當壁紙！」","dohyun":"「哈，你挺會的嘛。」{ta}終於正眼看你。","harin":"{ta}笑出聲：「你很會把尷尬變成可愛。」","yul":"「自嘲是高級技能。」{ta}難得地點頭。"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"捂臉求{ta}忘掉那個畫面","a":2,"h":0,"r":{"yunhee":"「為什麼要忘掉？」{ta}嘟起嘴，「那是我最喜歡的畫面耶……算了。」","dohyun":"「忘掉？」{ta}笑得很壞，「不要。我要拿來笑你一輩子。」說完卻沒再理你。","harin":"{ta}愣了一下，輕聲說：「……好，我忘掉。」語氣裡有一點受傷。","yul":"「你太在意別人怎麼看你了。」{ta}冷淡地說，「這樣很累。」"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"問{ta}：那天你是不是也很累了？","a":3,"h":0,"r":{"yunhee":"「嗯……其實那天有點不舒服，你是第一個問的人。」","dohyun":"「我？我從來不累。」{ta}說完，打了個哈欠。","harin":"{ta}看了你很久：「你很細心。」","yul":"「累是工作的一部分。」{ta}頓了頓，「不過謝謝。」"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"安靜讓{ta}簽完，只說一句加油","a":-3,"h":-1,"r":{"yunhee":"{ta}原本準備了好多話，看你這麼冷淡，全部吞了回去。","dohyun":"{ta}簽名簽得很快，連頭都沒抬。簽完就喊：「下一位。」","harin":"{ta}抬頭看了你一眼，眼神裡有一種「果然」的失望。","yul":"{ta}簽完就把專輯推回來，一個字都沒多寫。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那一個月裡，你偶爾會在社群上看到那張截圖——你的定格表情，被粉絲做成了表情包，配文是「當偶像突然看向你」。\n\n你本來想當作沒這回事。可是今天線下籤售，排隊的時候，前面的女孩一直在看手機，手機上正好就是那張圖。\n\n你把帽子壓得更低一點，心裡默唸：{ta}每天見那麼多人，不可能記得的。\n\n輪到你了。","after":{"dohyun":"那天晚上，那張表情包突然又被轉發了一波。因為{name}在直播裡被問到「最近印象最深刻的粉絲」，{ta}想都沒想，就模仿了一個表情。\n\n一模一樣。\n\n留言區炸了。你的朋友傳了十幾張截圖給你，後面跟著一長串「ㅋㅋㅋㅋ」。\n\n快一點的時候，你收到一則私訊。\n\n@msg 미안 ㅋㅋㅋ 참을 수가 없었음 || 抱歉ㅋㅋㅋ 忍不住。\n@msg 대신 다음에 밥 사줄게 || 作為補償，下次請你吃飯。\n@msg 진짜임 || 是真的。","yul":"你離開籤售會時，工作人員追出來，遞給你一個信封。\n\n「{ta}說，這是那四十秒的補償。」\n\n信封裡是一張簽名照，背面用很工整的字寫著：「下次網絡斷線時，記得先閉上嘴巴。」\n\n你站在路邊笑出聲。\n\n那天晚上，你在信封的角落發現一串小小的數字，像是隨手寫上去的。你猶豫了很久，才傳了一則訊息過去。\n\n很快就有回覆。\n\n@msg 네. 강율 맞아요 || 對，是姜律。\n@msg 그 표정 짤, 내가 제일 먼저 저장했어요 || 那個表情包，我是第一個存的。","yunhee":"籤售結束後，VELVET HOUR 的官方帳號發了一則限時動態。照片裡，{name}拿著手機，屏幕上正是你那張定格的截圖，旁邊畫了一個大大的愛心。\n\n配文：「謝謝你一直來見我們！」\n\n你不知道該哭還是該笑。\n\n當天深夜，一個粉紅色頭像的帳號傳來訊息。\n\n@msg 혹시 화났어?? ㅠㅠ || 你是不是生氣了？？嗚嗚\n@msg 너무 귀여워서 그랬어용… || 因為太可愛了才這樣的……\n@msg 사과의 의미로 다음 주 연습실 구경 올래?! || 為了道歉，下週要不要來參觀練習室？！","harin":"那天回家的路上，你一直在想{ta}那句話：「那個時間已經很晚了。」\n\n視訊籤售是在晚上十一點。你那天確實很累，加班到十點，趕回家連衣服都沒換就上線了。\n\n{ta}看出來了。隔著一個卡住的畫面，{ta}看出來了。\n\n深夜，你收到一封私訊，是一段很短的錄音。點開來，是{ta}的聲音，很輕，像是怕吵醒誰：\n\n「那天之後，我一直有點擔心。……今天看到你，氣色好多了。那就好。晚安。」\n\n錄音只有十二秒。你聽了很多遍。"}},{"id":"fan4","t":"後臺的臨時工作人員","tm":"中午 12:30","p":"朋友臨時找你幫忙：籤售會缺一個現場引導，只要半天。你想著身為{job}的你，平常也算很會應付人，就答應了。\n\n結果你被分到後臺，負責遞水和提醒時間。\n\n午休十五分鐘，其他人都去吃便當，休息室裡只剩你和{name}。{ta}坐在鏡子前，盯著手裡那份沒動過的飯。","c":{"yunhee":"{ta}趴在桌上哀嚎：「好餓但吃不下……你在這裡工作多久了？」","dohyun":"{ta}蹺著腳滑手機：「新來的？別緊張，我不會咬人。」","harin":"{ta}揉著手腕，聲音很輕：「簽了四百多張，手有點不像自己的了。」","yul":"{ta}正在看下午的流程表，用筆圈出兩個地方：「這裡的時間有問題。你幫我跟主辦確認。」"},"o":[{"t":"把自己帶的潤喉糖分給{ta}","a":3,"h":0,"r":{"yunhee":"「哇！是柚子口味！你是天使吧！」","dohyun":"「就一顆？」{ta}嘴上嫌少，還是馬上吃了。","harin":"「謝謝。」{ta}把糖紙折成小小的星星。","yul":"{ta}看了包裝成分才吃：「這牌子不錯。」"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"專業地幫{ta}處理眼前的問題","a":4,"h":0,"r":{"yunhee":"「你好厲害！比我們經紀人還快！」","dohyun":"「嘖，挺能幹的嘛。」{ta}收起輕佻的表情。","harin":"{ta}安靜看著你做事，像在觀察什麼。","yul":"「效率很高。」{ta}第一次正眼看你，「你叫什麼名字？」"},"m":{"yul":[3,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"隨口聊起自己的工作，轉移{ta}的注意力","a":3,"h":0,"r":{"yunhee":"{ta}一開始很認真聽，後來眼神慢慢飄走了。你講得太久了。","dohyun":"{ta}聽了兩句就開始滑手機：「喔，是喔。」明顯沒在聽。","harin":"{ta}禮貌地點頭，可是你看得出來，{ta}只是想安靜一下。","yul":"「我在看流程表。」{ta}頭也不抬，「你的工作，晚點再說。」"},"m":{"yunhee":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"保持距離，專心做自己的工作","a":-3,"h":-1,"r":{"yunhee":"{ta}好幾次想搭話，最後都閉上嘴，自己默默吃飯。","dohyun":"「好冷淡。」{ta}說，之後整個下午都沒再跟你說話。","harin":"{ta}放下筷子，轉過身去，背對著你吃完了那份飯。","yul":"{ta}看了你一眼，在流程表上劃掉了什麼，再也沒叫過你。"},"m":{"yunhee":[-2,0],"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"後臺比你想象中亂很多。走廊上堆滿紙箱和衣架，造型師抱著一大疊衣服跑來跑去，有人在對講機裡喊著時間。\n\n你的工作很簡單：每隔四十分鐘，提醒成員們喝水、補妝、去洗手間。可是第一個小時你就發現，{name}幾乎沒動過桌上的水。\n\n你注意到了，{ta}也注意到你注意到了。","after":{"dohyun":"下午的籤售比上午更累。你在後臺看著{name}簽到第三百多張時，手腕開始輕輕抖。{ta}趁著換場的空檔，在桌子底下甩了甩手，又若無其事地繼續。\n\n收工後，你在後臺收拾垃圾，{ta}突然冒出來，往你手裡塞了一罐熱咖啡。\n\n「工資。」{ta}說，「你今天比我們經紀人還會照顧人。」\n\n那天晚上，你接到朋友的電話，說主辦方很滿意，問你下次還能不能來。\n\n掛掉電話後，你看見一則陌生號碼的訊息。\n\n@msg 다음에도 와 || 下次也來。\n@msg 너 있으니까 물 마시게 됨 || 有你在，我才會記得喝水。","yul":"那天下午，你幫{ta}確認了流程表上的兩個問題。主辦方原本還想敷衍，但你把時間一條條攤開來對，最後他們不得不改。\n\n{name}從頭到尾都在旁邊看著，一句話都沒說。\n\n收工時，{ta}的助理找到你，遞給你一張名片。「律哥說，如果你之後有興趣，工作室缺一個像你這樣的人。」\n\n你看著那張名片，上面是工作室的地址和一個手寫的電話號碼。\n\n晚上十點，你收到一則訊息。\n\n@msg 명함은 진심이에요 || 名片是認真的。\n@msg 근데 일 말고도, 연락해도 돼요 || 不過除了工作，也可以聯絡。","yunhee":"那天收工後，{name}纏著你要你的聯絡方式。\n\n「我們成員都說你超可靠！」{ta}說，「下次籤售我要指定你！」\n\n你說你只是臨時幫忙的，{ta}就鼓起臉：「那就不是工作，是朋友！」\n\n晚上，你收到一大串訊息，全部都是{ta}傳的：\n\n@msg 오늘 진짜 고마웠어용!! || 今天真的謝謝你！！\n@msg 목캔디 브랜드 뭐야?? 나도 살래!! || 潤喉糖是什麼牌子？？我也要買！！\n@msg 아 그리고 너 일하는 거 멋있었어 || 啊還有，你工作的樣子很帥。\n\n最後一則隔了五分鐘才傳來，像是猶豫了很久。","harin":"下午的籤售結束後，{name}在休息室裡一個人坐了很久。你進去收拾東西時，看見{ta}在一張紙巾上寫字，寫了又劃掉。\n\n{ta}注意到你，把紙巾揉成一團，又慢慢攤開，遞給你。\n\n上面寫著幾行字，像是歌詞：「今天有人看見了我手腕的酸。」\n\n「送你。」{ta}說，有點不好意思，「我不太會說謝謝，只好寫下來。」\n\n那天晚上，你把那張紙巾夾進了筆記本里。\n\n深夜，你收到一封私訊：\n\n@msg 그 냅킨… 버려도 돼요 || 那張紙巾……丟掉也沒關係。\n@msg 근데 안 버렸으면 좋겠어요 || 不過，希望你沒丟。"}},{"id":"fan5","t":"排隊時的中暑粉絲","tm":"下午 14:10","p":"戶外場地的隊伍排到馬路邊，七月的太陽毒得像要把人曬化。\n\n你前面的女孩突然晃了一下，整個人往旁邊倒。你一把扶住她，讓她坐到陰影裡，拿出水和冰袋，又叫了現場醫護。\n\n等你回到隊伍時，已經錯過了你的號碼。工作人員讓你排到最後。\n\n籤售結束前，一位工作人員找到你：「{name}說，剛才在臺上看到了。想當面謝謝你。」你被帶到帳篷後面。","c":{"yunhee":"{name}一看到你就衝過來：「你超帥的！我在臺上看得一清二楚！」","dohyun":"{name}抱著手臂：「你反應挺快啊。我都還沒看清楚。」","harin":"{name}把一瓶冰水遞給你：「你自己也曬了很久吧。先喝。」","yul":"{name}直接問：「那位粉絲現在怎麼樣？」確認沒事後，才轉向你。"},"o":[{"t":"說只是做了該做的事，先問那個女孩好不好","a":4,"h":0,"r":{"yunhee":"「你怎麼這麼好！」{ta}眼眶有點紅。","dohyun":"{ta}別開臉：「……嘖，好人。」","harin":"「已經送去休息了。」{ta}輕聲說，「你也該休息。」","yul":"「她沒事。」{ta}點頭，「你這樣的人不多。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"半開玩笑地問：那我錯過的簽名可以補嗎？","a":3,"h":1,"r":{"yunhee":"「可以！而且是特別版！」{ta}畫了滿滿一頁。","dohyun":"「想得美。」{ta}嘴上這麼說，還是簽了，還多畫了一個愛心又塗掉。","harin":"{ta}笑了：「我還以為你會客氣。」認真簽了名。","yul":"「交換條件。下次別把自己曬成這樣。」"},"m":{"dohyun":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"說你學過急救，平常就會注意","a":2,"h":0,"r":{"yunhee":"「喔……好厲害喔。」{ta}說，可是興致明顯降了下來。","dohyun":"「喔，所以你是來炫耀的？」{ta}挑眉，語氣有點刺。","harin":"{ta}點點頭，可是沒有再接話。好像你把一件溫柔的事，說成了一件功勞。","yul":"「我問的不是你的資歷。」{ta}說，「我問的是那個女孩。」"},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"害羞地說沒什麼，轉身就要走","a":-3,"h":-1,"r":{"yunhee":"{ta}追了兩步，看你頭也不回，慢慢停下腳步，表情很失落。","dohyun":"「喂——」{ta}叫了一聲，你沒回頭。{ta}站在原地，很不爽地踢了一下地面。","harin":"{ta}看著你的背影，把那瓶冰水慢慢放回了桌上。","yul":"「我還沒說完。」{ta}的聲音冷下來。你走了，{ta}也沒有再叫你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"醫護人員趕到時，那個女孩已經清醒了一點，抓著你的手一直說對不起。你蹲在她旁邊，幫她扇風，等她的朋友趕來。\n\n等一切安頓好，你回到隊伍。工作人員很抱歉地說，號碼已經過了，只能排到最後。\n\n你在烈日下又站了一個多小時。汗水溼透了襯衫，手裡的專輯被曬得發燙。可是你一點都不後悔。\n\n籤售快結束時，你終於排到了。可是還沒走到臺前，就有工作人員攔住你。","after":{"dohyun":"後來，{ta}親自送你走到場館門口。\n\n「你下次排隊，」{ta}說，「記得戴帽子。你的臉都曬紅了。」\n\n你摸摸臉頰，確實燙得厲害。\n\n{ta}從口袋裡掏出一個東西丟給你：是一個便攜式小電扇，上面貼著 NOVA LINE 的貼紙。「我的。借你。」\n\n那天晚上，你在新聞上看到一則小報導：「NOVA LINE 籤售現場粉絲中暑，忙內道賢籤售後親自確認粉絲狀況」。\n\n報導裡沒有提到你。可是你的手機裡，多了一則訊息：\n\n@msg 선풍기 돌려줘야 함 || 電扇要還我。\n@msg 그러니까 또 만나야 됨 || 所以還要再見面。","yul":"{ta}後來跟你聊了二十分鐘。問你在哪裡學的急救，問你的工作，問你平常是不是都這樣。\n\n「這樣是怎樣？」你問。\n\n「把別人放在自己前面。」{ta}說，「這個習慣不好。會吃虧。」\n\n你說你不覺得是吃虧。{ta}看了你很久，沒有再說什麼。\n\n那天晚上，你收到一則訊息，附上一個連結，是附近一家你很喜歡的冷麵店。\n\n@msg 오늘 더위 먹었을 거예요 || 你今天應該中暑了。\n@msg 내일 점심. 제가 살게요 || 明天中午，我請。\n@msg 거절은 안 받아요 || 不接受拒絕。","yunhee":"那個中暑的女孩後來在社群上發文，說她在籤售會暈倒，有一個陌生人救了她。\n\n那篇文被轉發了好幾千次。底下有人留言說，看到允熙籤售後特地去找那個人道謝。\n\n那天晚上，你收到一則訊息。\n\n@msg 그 팬분이 너 찾고 있대!! 고맙다고!! || 那位粉絲在找你！！說要謝謝你！！\n@msg 근데 나도 고마워… || 不過我也謝謝你……\n@msg 그 순간에 아무것도 못 해서 진짜 속상했거든 || 那時候我什麼都做不了，真的很難受。\n\n你看著最後那一行，突然覺得，臺上那個永遠在笑的人，原來也會這樣。","harin":"你離開前，{ta}叫住你，從包裡拿出一小罐蘆薈膠。\n\n「擦臉。」{ta}說，「曬成這樣，晚上會痛。」\n\n你接過來，罐子上還貼著一張手寫標籤：「Tofu 的主人專用」。\n\n「我自己也會曬傷。」{ta}解釋，「所以隨身帶著。」\n\n那天晚上，你的臉果然開始發燙。你擦著那罐蘆薈膠，收到一封私訊：\n\n@msg 바르고 있어요? || 有在擦嗎？\n@msg 오늘 당신 같은 사람을 봐서, 노래 하나 쓰고 싶어졌어요 || 今天看到你這樣的人，突然想寫一首歌。"}}],"friend":[{"id":"fri1","t":"好友的生日派對","tm":"晚上 20:00","p":"好友的生日派對在弘大一間包場的小酒館。你推門進去時，燈光昏黃，有人在彈吉他。\n\n「對了，我高中同學也來了。」好友壓低聲音，「你別尖叫啊。」\n\n你順著她的視線看過去，角落沙發上坐著的，是{name}。沒有舞臺妝，穿著普通的衣服，正在剝花生。\n\n好友把你拉過去：「這是{me}，我最好的朋友，{job}。」","c":{"yunhee":"{name}眼睛彎成月牙：「哇，她常常提到你！終於見到本人了！」","dohyun":"{name}抬了抬下巴：「你就是那個常常被她拿來炫耀的朋友？」","harin":"{name}輕輕點頭，往旁邊挪了挪，留出一個位子給你。","yul":"{name}打量了你一眼：「{job}？什麼方向的？」第一句就是問題。"},"o":[{"t":"像對待普通人一樣自然打招呼，坐下聊天","a":4,"h":0,"r":{"yunhee":"{ta}拉著你一起拍了好多照片，說不會上傳。","dohyun":"「你不是粉絲？」{ta}有點意外，又有點高興。","harin":"{ta}慢慢開口，說這種場合有人自然對待{ta}，很難得。","yul":"「好。沒有大驚小怪。」{ta}給你倒了一杯酒。"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"老實承認你聽過{ta}的歌，很喜歡某首B面曲","a":3,"h":0,"r":{"yunhee":"「真的嗎！那首是我最愛的！」{ta}激動地抓住你的手。","dohyun":"「你是粉絲喔？」{ta}的笑容一下子變得很營業，「謝謝支持～」距離瞬間拉遠了。","harin":"{ta}怔住：「那首是我寫的。謝謝你聽見它。」","yul":"「為什麼喜歡？」{ta}追問，你說完理由後，{ta}沉默地點頭。"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"幫忙張羅派對，沒空多理{ta}","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你說話，你一直在忙。最後{ta}拿起包，提早走了。","dohyun":"你忙了一整晚，{ta}從頭到尾都在跟別人玩。散場時，{ta}連再見都沒跟你說。","harin":"{ta}一直想跟你說話，你卻在忙。{ta}最後一個人去了露臺。","yul":"你忙了一整晚，{ta}看你的眼神越來越冷：「你來這裡，是為了躲我？」"},"m":{"yul":[1,0],"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}},{"t":"和{ta}拼酒，看誰先投降","a":2,"h":1,"r":{"yunhee":"{ta}三杯就臉紅了，你還在倒。{ta}的笑容越來越勉強：「我、我真的不行了……」","dohyun":"「來啊！」{ta}興奮得眼睛發亮，最後兩個人都趴下。","harin":"你硬是要{ta}喝，{ta}拒絕了三次，臉色越來越白，最後起身離開了座位。","yul":"「我不跟陌生人拼酒。」{ta}把你的杯子推開，「尤其是想灌醉我的陌生人。」"},"m":{"dohyun":[3,0],"harin":[-2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}}],"x":"派對的氣氛很好。有人在唱歌，有人在玩遊戲，空氣裡都是炸雞和啤酒的味道。\n\n一開始你還有點緊張，不太敢往{name}那邊看。可是好友一直把你往那邊推，最後你還是被按在了{ta}旁邊的位子上。\n\n近看的{name}，跟屏幕上不太一樣。沒有舞臺妝，皮膚上有一點點疲憊的痕跡，指甲剪得很短，袖口有一小塊洗不掉的顏料。","after":{"dohyun":"派對到後來變成了卡拉OK大會。{name}被起鬨唱了一首，卻故意唱得很難聽，全場笑到不行。\n\n輪到你的時候，{ta}搶過遙控器，點了一首合唱的歌。\n\n「不準拒絕。」{ta}說，「我剛剛為了大家犧牲形象了。」\n\n那首歌你們唱得亂七八糟，可是好友說，那是整晚最好笑的表演。\n\n散場時已經凌晨兩點。{ta}站在門口叫車，帽子壓得很低。\n\n「你住哪？」{ta}問，「順路的話一起。」\n\n不順路。可是{ta}還是堅持先送你。\n\n到家後，你收到一則訊息：「到了說一聲。我不是擔心，只是不想被你朋友罵。」","yul":"那天晚上，你們聊了很久。從你的工作，聊到{ta}最近在準備的一部電影，再聊到你們都喜歡的一個導演。\n\n{ta}講話很快，觀點很尖銳，但每次你反駁，{ta}都會停下來認真聽。\n\n「你很少被說服吧？」你問。\n\n「很少。」{ta}說，「但你剛才那個論點，我會回去想想。」\n\n派對結束時，好友拉著你小聲問：「你們聊什麼聊那麼久？他平常對人很冷淡的。」\n\n你說你也不知道。\n\n那天深夜，{ta}傳來一個電影的連結：「你說的那部。我找到了。」\n\n後面又補了一句：「看完再跟你吵。」","yunhee":"{name}一整晚都黏在你旁邊。一下拉你去拍照，一下拉你去搶最後一塊蛋糕，一下又跟你分享{ta}手機裡成員們的醜照。\n\n「這張不準外流喔！」{ta}一邊說，一邊笑到停不下來。\n\n好友在旁邊看著，偷偷對你擠眉弄眼。\n\n派對結束時，{name}抱著你的手臂不肯放：「我們加好友！一定要！」\n\n那天晚上，你的手機響個不停。{ta}傳了幾十張今晚的照片給你，每一張你都在笑。\n\n最後一則訊息是：\n\n@msg 오늘 처음 본 사람 같지 않았어 || 今天不像是第一次見面。\n@msg 이상하지?? || 很奇怪吧？？","harin":"派對後半，大家都喝開了，越來越吵。{name}悄悄站起來，往露臺走。\n\n你過了五分鐘，也端著兩杯水跟了出去。\n\n{ta}靠在欄杆上，看著弘大街頭的燈。聽到腳步聲，{ta}回過頭，看到是你，好像鬆了一口氣。\n\n你們在露臺上待了很久，沒說太多話。{ta}說{ta}不太擅長人多的場合，可是好友的生日不能不來。\n\n「還好有你。」{ta}說，「不然我會在這裡一個人站到結束。」\n\n那天晚上，你收到一封很短的私訊：\n\n@msg 오늘 물 고마웠어요 || 今天謝謝你的水。\n@msg 다음엔 조용한 데서 만나요 || 下次，在安靜的地方見吧。"}},{"id":"fri2","t":"深夜工作室的拼單外賣","tm":"深夜 00:40","p":"你朋友的室友是作曲家，工作室就在你家樓下。今晚朋友把你叫下去，說要拼單叫炸雞。\n\n工作室裡很亂，到處是線和樂譜。錄音間的門開著，裡面有人戴著耳機，正在反覆錄同一句。\n\n是{name}。\n\n「{ta}來錄 demo，已經錄了四個小時。」朋友小聲說，「別打擾{ta}。」\n\n外賣到的時候，{name}摘下耳機走出來，頭髮亂糟糟的，眼睛裡全是血絲。","c":{"yunhee":"{name}一聞到炸雞就活過來了：「天啊！是我最愛的那家！」","dohyun":"{name}直接坐下抓了一塊：「誰點的？太懂了。」然後才注意到你，「你誰？」","harin":"{name}站在門邊，好像不確定自己能不能加入。","yul":"{name}看了眼時間：「快一點了。你們明天不用上班？」"},"o":[{"t":"招呼{ta}一起吃，把最好的雞腿給{ta}","a":3,"h":0,"r":{"yunhee":"「你人太好了！」{ta}啃得滿嘴是油。","dohyun":"「懂事。」{ta}理所當然地收下。","harin":"{ta}小口吃著，說很久沒有和人一起吃宵夜了。","yul":"「你自己吃。」{ta}把雞腿推回來，換了一塊翅膀。"},"m":{"dohyun":[2,0],"harin":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"說你剛才在門外聽到的那一句，真的很好聽","a":4,"h":0,"r":{"yunhee":"「真的嗎？我一直覺得高音不穩耶！」","dohyun":"「我知道。」{ta}嘴硬，卻偷偷笑了。","harin":"{ta}看著你很久：「你聽到的是哪一個版本？第三遍還是第七遍？」","yul":"「好聽不夠。說具體。」你說完，{ta}若有所思。"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"提醒{ta}先喝點水，錄這麼久嗓子會壞","a":3,"h":0,"r":{"yunhee":"「嗯……知道了。」{ta}乖乖喝了，可是之前的興奮全不見了。","dohyun":"「你是我媽嗎？」{ta}不耐煩地說，把水推開。","harin":"{ta}點點頭，可是話變少了。好像你的關心讓{ta}覺得自己很狼狽。","yul":"「我知道自己的狀況。」{ta}冷冷地說，「不需要你提醒。」"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吃完就回樓上，不打擾{ta}工作","a":-3,"h":-1,"r":{"yunhee":"「欸？要走了？」{ta}手裡還拿著要分給你的雞翅，愣在那裡。","dohyun":"你上樓時，聽見{ta}在後面說：「沒意思。」","harin":"{ta}站在門邊，看你上樓，什麼都沒說。","yul":"{ta}看都沒看你，戴上耳機回了錄音間。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"工作室的燈是暖黃色的，牆上貼滿了便利貼，寫著和絃和歌詞的片段。角落的沙發上堆著一條毯子和幾個空的咖啡杯，看起來有人在這裡睡過不只一晚。\n\n朋友的室友是一個戴著毛線帽的作曲家，看到你們就揮手，然後繼續盯著屏幕。\n\n你從錄音間的玻璃往裡看。{name}閉著眼睛唱著同一句，第七遍、第八遍，每一遍都有一點點不同。你聽不出哪一遍比較好，但你聽得出，{ta}很累了。","after":{"dohyun":"吃完炸雞，{name}又回去錄了兩遍。第二遍結束時，作曲家終於比了一個OK的手勢。\n\n{ta}從錄音間出來，整個人倒在沙發上，像一條鹹魚。\n\n「完了。」{ta}說，「我要睡在這裡。」\n\n你們收拾外賣盒時，{ta}突然坐起來：「喂，你明天也會來嗎？」\n\n「我住樓上。」\n\n「那我餓了就去敲你的門。」{ta}說，說得理所當然。\n\n你以為{ta}在開玩笑。\n\n隔天晚上十一點，你的門鈴真的響了。門外站著{name}，手裡提著兩份辣炒年糕。\n\n「昨天你請我，」{ta}說，「今天換我。」","yul":"{name}吃完後，又回到錄音間。這一次{ta}沒有關門。\n\n你聽著{ta}唱那一句，第九遍、第十遍。到了第十一遍，你突然聽懂了{ta}在找什麼：一個更輕的轉音。\n\n你沒忍住，小聲說了一句。\n\n錄音間裡的{ta}停了下來，看著你，看了很久。\n\n然後{ta}唱了第十二遍，用了你說的那個轉音。\n\n作曲家跳起來：「就是這個！」\n\n凌晨兩點，你回到樓上。手機亮了一下。\n\n@msg 그 한마디 덕분에 퇴근해요 || 託你那一句話的福，可以下班了。\n@msg 다음 데모도 들어줄래요? || 下一首 demo，也來聽嗎？","yunhee":"吃完炸雞，{name}的精神好了很多，又回去錄了三遍。\n\n最後一遍錄完，{ta}在錄音間裡蹦蹦跳跳地跟大家比V。作曲家說今天終於可以收工了，{ta}就歡呼著衝出來，抱住離{ta}最近的人。\n\n那個人是你。\n\n{ta}愣了一秒，然後笑著放開：「啊！對不起！太開心了！」\n\n你回到樓上時，耳朵還是紅的。\n\n半夜，你收到一則訊息：\n\n@msg 아까 안은 거… 실수 아님 || 剛才那個擁抱……不是失誤。\n@msg 아 그러니까 고맙다는 뜻!! || 啊就是說謝謝的意思！！\n@msg 이상하게 듣지 마!! || 不要想歪！！","harin":"你回樓上前，在工作室門口回頭看了一眼。{name}坐在角落的沙發上，抱著膝蓋，戴著耳機，在聽剛才錄的那幾遍。\n\n{ta}的表情很專注，偶爾皺眉，偶爾輕輕點頭。\n\n那天之後，你常常在深夜聽到樓下傳來隱約的歌聲。有時候是同一句，有時候是新的旋律。\n\n一個星期後，你在樓梯間遇到{ta}。{ta}看起來比那天精神多了，手裡提著一袋貓糧。\n\n「那首歌，」{ta}說，「完成了。」\n\n{ta}遞給你一個 USB：「你是第一個聽的人。因為那天……你說好聽。」"}},{"id":"fri3","t":"婚禮上的同一桌","tm":"中午 12:00","p":"大學學姐的婚禮，你被安排在第七桌。\n\n座位卡上，你旁邊寫著一個你在電視上看過無數次的名字。\n\n「新郎是{ta}的表哥。」學姐悄悄說，「{ta}今天是家屬，不是偶像，拜託你們正常一點。」\n\n{name}準時入座，穿著簡單的西裝外套，和平常舞臺上完全不一樣。整張桌子突然安靜得只剩下刀叉的聲音。","c":{"yunhee":"{name}小聲對你說：「大家好緊張喔，我們講點話好不好？」","dohyun":"{name}拿起菜單研究：「這個牛排幾分熟？」完全沒在管氣氛。","harin":"{name}很安靜，只在你遞醬料時說了聲謝謝。","yul":"{name}低聲對你說：「你左手邊那位一直在偷拍。幫我擋一下。」"},"o":[{"t":"主動幫{ta}擋掉偷拍和搭訕","a":4,"h":0,"r":{"yunhee":"「你好可靠！」{ta}用嘴型對你說。","dohyun":"{ta}挑眉看你：「挺會的嘛，保鏢。」","harin":"{ta}終於放鬆了肩膀，開始跟你聊天。","yul":"「配合得很好。」{ta}在你杯子裡倒了酒。"},"m":{"yul":[3,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"聊新娘新郎的戀愛故事","a":3,"h":0,"r":{"yunhee":"「好浪漫！我也想要這樣的婚禮！」","dohyun":"「好無聊喔，這種話題。」{ta}打了個哈欠，轉頭去玩手機了。","harin":"「他們會一直幸福吧。」{ta}看著臺上，眼神很柔。","yul":"「我對別人的戀愛沒興趣。」{ta}說，「包括他的。」氣氛冷了下來。"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"一起偷偷吐槽婚禮上的冗長致詞","a":3,"h":1,"r":{"yunhee":"{ta}笑了兩下，可是你吐槽得太過分了，{ta}的表情慢慢變得尷尬：「那是我表哥……」","dohyun":"「你也這樣覺得？」{ta}跟你比賽誰先打哈欠。","harin":"{ta}沒有笑。「他是真心的，」{ta}小聲說，「我不想笑他。」","yul":"「這段可以剪掉三分之二。」{ta}評論得很專業。"},"m":{"dohyun":[2,0],"yul":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"專心吃飯，不想給{ta}壓力","a":-3,"h":-1,"r":{"yunhee":"{ta}好幾次想找你說話，你都只顧著吃。{ta}最後放下叉子，不吃了。","dohyun":"整頓飯你都沒跟{ta}說話。散場時，{ta}說：「你是啞巴嗎？」轉身就走。","harin":"整頓飯，你們之間只有刀叉的聲音。散場時，{ta}禮貌地點頭，像對待陌生人。","yul":"那個人又偷拍了三次，你都沒管。{ta}最後起身，換到了另一桌。"},"m":{"harin":[1,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"婚禮的儀式很長。新郎在臺上念誓詞唸到一半就哭了，新娘一邊笑一邊幫他擦眼淚。\n\n你偷偷看了一眼旁邊的{name}。{ta}看著臺上，表情很柔和，好像真的在為表哥高興。\n\n然後{ta}注意到你的視線，轉頭看你。你們對視了一秒，又同時轉回去。\n\n接下來就是午宴。服務生開始上菜，整張桌子依然安靜得可怕。","after":{"dohyun":"午宴後，新人在門口送客。{name}被一群親戚圍住，要合照、要簽名。\n\n你本來想直接離開，卻被{ta}一把拉住袖子：「等我。五分鐘。」\n\n最後變成了二十分鐘。{ta}終於脫身時，領帶歪了，頭髮也亂了，一臉生無可戀。\n\n「走。」{ta}說，「我知道附近有一家很好吃的冰店。」\n\n你們穿著正裝，坐在路邊的冰店裡吃紅豆刨冰。{ta}吃得很快，嘴角沾了一點煉乳。\n\n你指了指，{ta}隨手一擦，笑了：「今天最開心的就是現在。」\n\n那天晚上，{ta}傳來一張照片，是你吃刨冰的側臉。「偷拍成功。」","yul":"婚禮結束後，{name}在停車場叫住你。\n\n「剛才謝謝你。」{ta}說，「那個人後來又拍了三次，都被你擋掉了。」\n\n你說沒什麼，{ta}卻很認真地看著你：「很少人願意為了一個剛認識的人得罪別人。」\n\n「你是我學姐的家人。」你說。\n\n「不是因為這個吧。」{ta}說。\n\n你沒有回答。{ta}也沒有追問，只是拿出手機：「號碼。」\n\n那天晚上，你收到一則訊息：\n\n@msg 오늘 같은 테이블이라 다행이었어요 || 今天能同桌，真是太好了。\n@msg 다음엔 테이블 말고, 둘이서 || 下次不要同桌，就我們兩個。","yunhee":"午宴後，新娘把捧花丟了出來。所有人都在搶，{name}也衝上去，結果捧花打到{ta}的頭，彈到了你懷裡。\n\n全場爆笑。\n\n{name}捂著頭，委屈地看著你：「那是我的！」\n\n「那還你？」\n\n「不要！」{ta}說，「是它自己選你的！」\n\n後來你們抱著那束捧花，在婚宴會場外面拍了好多照片。\n\n那天晚上，{ta}傳來一則訊息：\n\n@msg 부케 받은 사람은 다음에 결혼한대!! || 聽說接到捧花的人下一個結婚！！\n@msg …축하해?? ㅋㅋㅋ || ……恭喜？？ㅋㅋㅋ","harin":"婚禮結束後，大家都去續攤。{name}跟新人道別後，一個人走向公車站。\n\n你剛好也要搭同一班車。\n\n車上人很少，你們並排坐著。{ta}一直看著窗外，看了很久，才輕聲說：\n\n「我小時候以為，結婚就是兩個人終於不用再一個人了。」\n\n「現在呢？」\n\n「現在也是這樣想。」{ta}說，「只是覺得，對我來說很難。」\n\n你不知道該怎麼回答。{ta}也沒有等你回答。\n\n下車前，{ta}轉頭看你：「今天跟你坐同一桌，很好。」\n\n那天晚上，你收到一首歌的連結。是一首很老的情歌，{ta}說，是今天婚禮上放的那首。"}},{"id":"fri4","t":"桌遊局的搭檔","tm":"晚上 19:30","p":"朋友拉你去一間桌遊咖啡廳，說今晚人湊不齊。\n\n你到的時候，桌邊已經坐了四個人。其中一個戴著毛線帽，正在洗牌，手法利落得像職業的。\n\n那是{name}。\n\n「抽籤分組。」朋友宣佈。你抽到紅色，{name}也是紅色。\n\n今晚的遊戲是一個需要互相猜意圖的合作遊戲。只要配合失誤一次，就會全盤皆輸。","c":{"yunhee":"{name}舉手歡呼：「搭檔！我們一定會贏！」","dohyun":"{name}轉著骰子：「你最好別拖我後腿。」","harin":"{name}小聲說：「我很不會這種遊戲……對不起。」","yul":"{name}把規則攤開：「我們先定好暗號。」"},"o":[{"t":"認真討論策略，和{ta}定下暗號","a":3,"h":0,"r":{"yunhee":"{ta}的暗號是眨眼，結果一直眨，被識破了。","dohyun":"「摸鼻子就是要衝。」{ta}說完馬上摸了三次。","harin":"{ta}慢慢放鬆下來：「好，我會努力記住。」","yul":"「很好。」{ta}跟你對了三遍，滿意地點頭。"},"m":{"yul":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"憑直覺亂打，跟{ta}一起冒險","a":3,"h":1,"r":{"yunhee":"「好刺激！」{ta}每一回合都尖叫。","dohyun":"「就是這樣！」{ta}跟你擊掌，兩個人越玩越瘋。","harin":"{ta}被嚇到好幾次，但最後笑得最開心。","yul":"「沒有計劃？」{ta}皺眉，最後卻贏了，{ta}沉默了一下：「……運氣也是實力。」"},"m":{"dohyun":[3,0],"yunhee":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"一直讓{ta}做決定，你配合就好","a":2,"h":0,"r":{"yunhee":"「你也說點什麼嘛……」{ta}說，後來就自己玩自己的了。","dohyun":"「你都沒主見喔？」{ta}說，「跟你一組好無聊。」","harin":"你一直讓{ta}做決定，{ta}壓力大到手在發抖，最後小聲說：「我……不想玩了。」","yul":"「我需要的是搭檔，不是跟班。」{ta}說完，就不再問你的意見。"},"m":{"yul":[1,0],"harin":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"輸了就耍賴說是規則有問題","a":-3,"h":-1,"r":{"yunhee":"「欸，可是我們真的輸了啊……」{ta}尷尬地笑，轉頭跟別人說話去了。","dohyun":"「輸不起？」{ta}冷笑一聲，「下次不要跟我一組。」","harin":"{ta}被你逗笑了一下，可是看你一直耍賴，表情慢慢變得不自在。","yul":"「輸就是輸。」{ta}把規則書合上，「我不跟耍賴的人玩。」"},"m":{"yunhee":[1,0],"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"桌遊咖啡廳在一棟老建築的地下室，牆上滿滿都是遊戲盒，燈光昏暗，每張桌子上都放著一盞小檯燈。\n\n朋友介紹的時候，只說是「朋友的朋友」。直到{name}拿下毛線帽，你才認出來。\n\n其他人顯然早就知道了，一點都不驚訝。有人跟你解釋：「{ta}每個月都會來一次，這裡的老闆是{ta}的老同學，很安全。」\n\n你點點頭，假裝自己很冷靜。","after":{"dohyun":"那天你們一共玩了五局。前三局你們配合得亂七八糟，第四局開始突然找到了節奏，最後兩局連贏。\n\n贏了最後一局時，{name}興奮地站起來，一把勾住你的肩膀大喊。整間桌遊店的人都在看你們。\n\n「下個月，」{ta}說，「你還要來。我們要衛冕。」\n\n那天之後，你們有了一個群組，名字叫「紅隊不敗」。\n\n群組裡只有你們兩個人。\n\n@msg 연습하자 || 來練習吧。\n@msg 온라인 버전 있음 || 有線上版。\n@msg 오늘 밤 11시 || 今晚十一點。","yul":"那天你們贏了三局，輸了兩局。輸的那兩局，{name}都會在結束後把規則書翻出來，跟你檢討哪一步走錯了。\n\n其他人都受不了地走開了，只有你還在聽。\n\n「你不覺得我很煩？」{ta}問。\n\n「有一點。」你說，「但你說得對。」\n\n{ta}愣了一下，笑了。那是你第一次看到{ta}笑得那麼不設防。\n\n散場時，{ta}在門口等你。\n\n「下次，」{ta}說，「我們挑戰那個最難的遊戲。只有我們兩個。」\n\n那天晚上，{ta}傳來一張照片：一個厚得像字典的遊戲盒。「研究規則中。」","yunhee":"那天你們輸了四局，只贏了一局。可是{name}一點都不在意，每一局都笑得最大聲。\n\n唯一贏的那一局，{ta}激動得抱著你轉了一圈，撞翻了旁邊的骰子盒。\n\n「我們是最佳搭檔！」{ta}宣佈。\n\n散場後，你們一起去便利商店買冰淇淋。{ta}站在冷凍櫃前猶豫了五分鐘，最後買了兩種口味，分你一半。\n\n「我有選擇困難症。」{ta}說，「所以每次都要找人分。」\n\n那天晚上，{ta}傳來訊息：\n\n@msg 다음에도 아이스크림 반띵 해줄 거지?? || 下次也會跟我分冰淇淋吧？？","harin":"第三局開始，{name}慢慢不緊張了。你發現{ta}其實很會觀察，只是不敢說出來。\n\n「你剛剛看出來了吧？」你小聲問，「對面在騙人。」\n\n{ta}猶豫了一下，點點頭。\n\n「那下次直接說。」你說，「我相信你。」\n\n最後一局，{ta}第一次主動出聲，說出了對面的意圖。你們贏了。\n\n{ta}看著你，眼睛亮得驚人：「我……我說對了。」\n\n那天晚上，{ta}傳來一封私訊：\n\n@msg 오늘 처음으로 게임이 재밌었어요 || 今天第一次覺得遊戲好玩。\n@msg 믿어줘서 고마워요 || 謝謝你相信我。"}},{"id":"fri5","t":"試營業的咖啡店","tm":"上午 10:30","p":"朋友的咖啡店下週開幕，今天試營業，只招待熟人。你被抓來當臨時店員，負責端盤子和收集意見。\n\n十點半，門上的風鈴響了。\n\n進來的人戴著口罩，壓低帽簷，環顧四周後才拉下口罩。\n\n「{ta}是我們老闆的大學學{g:弟|妹}。」另一個店員小聲說，「今天是來幫忙試菜的。」\n\n{name}看著菜單，看了很久，然後抬頭看你。","c":{"yunhee":"{name}眼睛一亮：「我可以每一樣都點一點點嗎？」","dohyun":"{name}手指敲著桌面：「最甜的那個。還有，推薦一個你最愛的。」","harin":"{name}小聲問：「這裡有……不是咖啡的東西嗎？」","yul":"{name}直接說：「菜單太長了。你推薦三樣，我只試那三樣。」"},"o":[{"t":"推薦你最喜歡的一款，並說出理由","a":4,"h":0,"r":{"yunhee":"「好好喝！你很會推薦耶！」","dohyun":"「嗯……」{ta}喝完一杯，「再來一杯。」","harin":"{ta}捧著杯子，說你描述的味道很像一首歌。","yul":"「好。你懂。」{ta}又追問了烘焙度。"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"親手幫{ta}做一杯特調","a":3,"h":1,"r":{"yunhee":"{ta}拿出底片相機拍你做飲料的樣子。","dohyun":"「喂，這愛心是什麼意思？」{ta}故意問。","harin":"「很好喝。」{ta}說完，又小口喝了一次，好像捨不得。","yul":"「步驟錯了兩個。」{ta}說，「你不熟就不要做。」{ta}把杯子推到一邊。"},"m":{"yunhee":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"認真把{ta}的意見記下來，轉達給老闆","a":3,"h":0,"r":{"yunhee":"{ta}說了很多，你一直低頭寫。{ta}說著說著，就不說了。","dohyun":"「你幹嘛一直記？」{ta}說，「好像在開會。」","harin":"{ta}說得很小聲，你記得很大聲，{ta}有點不好意思，後來就不太說了。","yul":"「你的筆記整理得比他們的企劃還清楚。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"忙著招呼其他客人，只匆匆送上飲料","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你說話，你都在忙。{ta}最後跟老闆說：「店員好冷淡喔。」","dohyun":"{ta}等了半天，你只匆匆放下飲料就走了。{ta}說：「服務真差。」","harin":"你匆匆放下飲料就走了，連{ta}問的問題都沒回答。{ta}安靜地喝完，提早走了。","yul":"你一直在忙別人。{ta}喝完那杯，結帳就走了，連評語都沒寫。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"咖啡店裝潢得很溫暖，原木桌椅，牆上掛著老闆自己拍的照片。試營業只開放半天，客人都是熟人，氣氛很輕鬆。\n\n你一早就到了，幫忙擦桌子、擺餐具、試做了幾杯飲料。老闆很滿意，說你天生就適合幹這行。\n\n十點半之前，店裡只有幾個老闆的大學朋友。他們一邊聊天，一邊對你的拉花評頭論足。\n\n然後門上的風鈴響了。","after":{"dohyun":"{name}在店裡待了一整個上午。試完所有甜點，又跟老闆的朋友們打了一場手機遊戲，贏了還要求大家請{ta}喝飲料。\n\n快中午時，{ta}晃到吧檯前，看你洗杯子。\n\n「你明天還來嗎？」{ta}問。\n\n「試營業只有今天。」\n\n「喔。」{ta}說，好像有點失望，「那正式開幕呢？」\n\n你說你只是來幫忙的，{ta}就皺眉：「那以後誰幫我做那杯？」\n\n那天晚上，老闆打電話給你，語氣很奇怪：「喂，我學弟問我你的聯絡方式。要給嗎？」","yul":"{name}試完你推薦的三樣，在筆記本上寫了很長的評語。寫完了，{ta}撕下那一頁，遞給你。\n\n「給老闆。」{ta}說，「也給你。」\n\n你看了一眼。評語寫得很專業，最後一行卻跟咖啡無關：「店員很好。建議加薪。」\n\n{ta}離開前，站在門口回頭：「你每天都在這裡？」\n\n「只有今天。」\n\n「可惜。」{ta}說，「我本來打算常來的。」\n\n那天晚上，你收到一則訊息：\n\n@msg 커피 말고, 다른 데서도 만날 수 있어요? || 不在咖啡店的話，也可以見面嗎？","yunhee":"{name}在店裡待了很久，每一樣都試了一口，最後撐得趴在桌上。\n\n「我好像吃太多了……」{ta}哀嚎。\n\n你端了一杯溫水給{ta}，{ta}抬頭，可憐兮兮地看著你：「你會做消化的飲料嗎？」\n\n你做了一杯熱的柚子茶。{ta}捧著杯子，眯著眼睛，像只曬太陽的貓。\n\n離開前，{ta}拿出底片相機，硬是拉著你在店門口拍了一張合照。\n\n「開幕那天我會來！」{ta}說，「你也要在喔！」\n\n那天晚上，你收到訊息：\n\n@msg 사진 현상하면 줄게!! || 照片洗出來給你！！\n@msg 그니까 또 만나야 돼 || 所以我們還要再見面。","harin":"你最後幫{name}做了一杯熱巧克力，上面放了一點點肉桂。\n\n{ta}捧著杯子，喝了一口，眼睛慢慢彎起來。\n\n「這個味道，」{ta}說，「像小時候外婆家的冬天。」\n\n{ta}在店裡坐了很久，坐在最角落的位子，一邊喝，一邊在筆記本上寫東西。你忙著招呼其他客人，偶爾回頭，發現{ta}在看你。\n\n離開前，{ta}在桌上留下一張紙條：「謝謝你的冬天。」\n\n那天晚上，老闆轉告你：「我學妹說，開幕後會常來。還說，希望你也在。」"}}],"child":[{"id":"chi1","t":"隔壁的奶奶","tm":"傍晚 18:10","p":"工作告一段落，你搬回小時候住的老社區休息一陣子。\n\n隔壁的奶奶還是那樣，每天傍晚在院子裡曬辣椒。她一看到你就拉著你的手：「哎喲，長這麼大了！你還記得我孫子嗎？小時候你們天天一起玩泥巴。」\n\n你還沒想起來，院子的鐵門就開了。有人提著一大袋超市的東西走進來，口罩拉到下巴。\n\n「奶奶，我買了你說的那個——」\n\n是{name}。{ta}看見你，整個人僵在門口。","c":{"yunhee":"「{me}！是你對不對！」{ta}直接扔下袋子衝過來，「你搬走那天我哭了一整晚耶！」","dohyun":"「哇，是你。」{ta}笑得很壞，「你以前被狗追，躲在我後面哭。」","harin":"{ta}站在原地看了你很久，才輕聲說：「你以前……送過我一顆玻璃珠。我還留著。」","yul":"「{me}。」{ta}一口就叫出來，語氣平靜，「你以前說長大要當總統。現在呢？」"},"o":[{"t":"笑著接話，回憶你們小時候的糗事","a":4,"h":0,"r":{"yunhee":"{ta}一件一件翻舊帳，笑到奶奶出來叫你們進屋吃飯。","dohyun":"「你還記得那次你掉進水溝嗎？」{ta}搶著講你的糗事。","harin":"{ta}記得好多細節，連你那天穿的衣服顏色都記得。","yul":"{ta}糾正你記錯的三個地方，說完自己也笑了。"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"裝作想不起來，逗{ta}自己說","a":2,"h":1,"r":{"yunhee":"「你真的不記得我？」{ta}的眼眶一下子紅了，你說是開玩笑，{ta}也笑不出來了。","dohyun":"「你騙人。」{ta}一眼就識破，「你耳朵紅了。」","harin":"「……是嗎。」{ta}的聲音很輕，輕得像什麼東西碎了。「我一直都記得你。」{ta}轉身進門，沒再出來。","yul":"「你騙人的技術很差。」{ta}冷冷地說，「我不喜歡被測試。」"},"m":{"dohyun":[2,0],"harin":[-4,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"幫奶奶接過袋子，留下來一起吃晚飯","a":3,"h":0,"r":{"yunhee":"{ta}一直幫你夾菜：「奶奶的泡菜鍋最好吃了！」","dohyun":"{ta}一整晚都在跟奶奶講話，你插不上嘴。{ta}好像故意不理你。","harin":"{ta}吃得很慢，說很久沒有在這張桌子上吃飯了。","yul":"{ta}親自下廚做了一道菜：「嚐嚐。比你小時候做的泥巴飯好吃。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"有點尷尬，說你只是回來住幾天就先回家","a":-3,"h":-1,"r":{"yunhee":"{ta}追到你家門口，你已經關上門了。{ta}在門外站了很久。","dohyun":"「跑那麼快？」{ta}說完，轉身進門，門關得很重。","harin":"{ta}低下頭：「……我知道。只是住幾天。」那顆玻璃珠，{ta}沒有拿出來。","yul":"{ta}看著你進門，什麼都沒說。之後幾天，隔壁都沒有亮燈。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"老社區幾乎沒變。巷口的雜貨店還在，招牌褪了色；你小時候常爬的那棵柿子樹，現在長得比二樓還高。\n\n你提著行李走進巷子，鄰居們一個個探出頭來跟你打招呼，好像你只是出門買了趟菜。\n\n你家的舊房子被收拾得很乾淨。媽媽說，隔壁奶奶這些年常常幫忙照看，還時不時問起你。\n\n你放下行李，走到院子裡透氣。隔著矮矮的圍牆，你看見奶奶坐在小板凳上，正低頭挑辣椒。","after":{"dohyun":"那天晚上，奶奶硬是留你吃了晚飯。{name}坐在你對面，一邊扒飯一邊跟奶奶告狀，說你小時候搶{ta}的玩具車。\n\n「明明是你搶我的。」你說。\n\n「證據呢？」\n\n奶奶笑著拍了{ta}一下：「是你搶的，我記得清清楚楚。」\n\n{ta}委屈地瞪了你一眼，又笑了。\n\n吃完飯，你們坐在院子裡吃西瓜。{ta}把籽吐得老遠，說這是{ta}小時候的絕技。\n\n「你要住多久？」{ta}突然問。\n\n「還不確定。」\n\n「那，」{ta}說，「我這陣子也會常回來。奶奶一個人，我不放心。」\n\n你知道那不是全部的理由。","yul":"那天晚上，奶奶留你吃飯。{name}親自下廚，炒了三個菜，每一道都好吃得不像話。\n\n「你什麼時候學會做菜的？」你問。\n\n「前團解散那年。」{ta}說得很平淡，「那時候不想見人，只好每天在家做飯。」\n\n你不知道該說什麼。{ta}卻已經轉移話題，問你這些年在做什麼。\n\n飯後，你們在院子裡站了一會兒。月亮很圓，{ta}點了一根菸，又想起什麼似的掐掉了。\n\n「戒了。」{ta}說，「剛剛只是習慣。」\n\n離開前，{ta}在圍牆上敲了兩下：「有事就敲牆。小時候的暗號，還記得吧？」","yunhee":"那天晚上，奶奶做了一大桌菜。{name}一直幫你夾菜，夾到你的碗堆成小山。\n\n「多吃一點！」{ta}說，「你變瘦了！」\n\n「你又不知道我以前多胖。」\n\n「我知道！」{ta}說，「你五歲的時候臉圓得跟包子一樣！」\n\n奶奶在旁邊笑得前仰後合。\n\n吃完飯，{ta}拉著你去巷口的雜貨店，買了兩支你們小時候最愛吃的冰棒。\n\n「它還在賣耶！」{ta}興奮地說，「味道一樣！」\n\n你們坐在雜貨店門口的臺階上吃冰棒，像二十年前一樣。\n\n「你回來真好。」{ta}突然說，沒有看你。","harin":"那天晚上，奶奶留你吃飯。{name}吃得很少，一直在聽你和奶奶說話。\n\n飯後，{ta}送你回家，只有隔壁幾步路。走到你家門口，{ta}停下來，從口袋裡拿出一個東西。\n\n是一顆玻璃珠。藍色的，裡面有一道白色的花紋。\n\n「這個，」{ta}說，「是你搬走那天給我的。你說，看到它就會想起你。」\n\n你完全不記得了。\n\n「沒關係。」{ta}笑了笑，「我記得就好。」\n\n{ta}把玻璃珠放回口袋，轉身回家。走到一半，又回頭：\n\n「明天……可以一起去看那棵柿子樹嗎？」"}},{"id":"chi2","t":"小學同學會","tm":"晚上 19:00","p":"小學同學會，二十幾個人擠在一間烤肉店。大家聊著工作、結婚、房貸，你聽著有點恍惚。\n\n「聽說那個誰也會來。」班長神秘兮兮地說，「我只是隨便傳了訊息，沒想到{ta}回了。」\n\n門簾被掀開。進來的人帽子壓得很低，向大家點頭。\n\n全場安靜三秒，然後炸開。\n\n是{name}。等大家拍完照、要完簽名，{ta}在人群裡四處張望，最後在你旁邊的空位坐下。","c":{"yunhee":"「{me}！我們以前是同桌對吧！」{ta}一屁股坐下，「你還欠我一塊橡皮擦！」","dohyun":"「躲來這裡。」{ta}拿起你的杯子喝了一口，「借我擋一下。」","harin":"{ta}坐下後，小聲說：「這裡比較安靜。……你也是這樣想的嗎？」","yul":"「你是唯一一個沒來要簽名的。」{ta}說，「所以我坐這裡。」"},"o":[{"t":"只跟{ta}聊小時候，不提{ta}現在的工作","a":4,"h":0,"r":{"yunhee":"{ta}笑得好放鬆：「好久沒人只當我是{name}了。」","dohyun":"「你挺上道的。」{ta}一整晚都沒離開你旁邊。","harin":"{ta}說起小時候在教室後面養的蠶，眼睛亮亮的。","yul":"「很好。」{ta}點頭，「我不想今晚還在工作。」"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"幫{ta}烤肉、夾菜，照顧{ta}","a":3,"h":0,"r":{"yunhee":"{ta}笑著說謝謝，可是每一塊都沒吃完。你好像太殷勤了。","dohyun":"「我自己有手。」{ta}把你夾的肉推回去，「你當我是小孩？」","harin":"{ta}也幫你夾了一塊：「你也要吃。」","yul":"「火太大了。」{ta}拿過夾子，「我來。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"跟大家一起玩真心話遊戲","a":2,"h":1,"r":{"yunhee":"{ta}玩得最開心，被罰喝了好多杯。","dohyun":"{ta}抽到大冒險，硬是在你耳邊唱了一句歌。","harin":"真心話輪到{ta}，大家一直追問{ta}的私事。你沒有幫{ta}擋，{ta}的臉色越來越白。","yul":"你被問到初戀，說了一個很長的故事。{ta}聽完，表情很冷。"},"m":{"dohyun":[2,1],"yunhee":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[-4,-1,"bad"]}},{"t":"跟{ta}說你最近工作很累，想早點回家","a":-3,"h":-1,"r":{"yunhee":"「欸，這麼早？」{ta}有點失望，可是很快就被其他同學拉走了。","dohyun":"「那你走啊。」{ta}說，轉頭跟別人喝酒，再也沒看你。","harin":"「……好。」{ta}說，沒有挽留。你走後，{ta}也很快離開了。","yul":"「{job}很累？」{ta}說，「那就回去吧。」說得像在打發你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"同學會的氣氛比你想象中熱鬧。班長準備了一本舊相冊，大家傳著看，一邊看一邊尖叫。\n\n你在相冊裡找到了自己：五年級的運動會，你跑最後一名，臉上全是泥。旁邊有人在笑，說你那時候摔了三次還堅持跑完。\n\n有人提起那個已經成為偶像的同學，大家都很興奮，說要是{ta}真的來了，一定要合照。\n\n你沒說話。你記得{ta}，記得不多，但記得{ta}曾經在你摔倒的時候，跑回來扶你起來。","after":{"dohyun":"同學會結束時已經很晚了。大家吵著要去續攤，{name}趁亂拉著你溜出了烤肉店。\n\n「快走！」{ta}說，「再待下去要被灌死了。」\n\n你們在夜晚的街道上跑了一段，跑到一個公園才停下來，兩個人都在喘。\n\n「你還記得嗎？」{ta}突然說，「運動會那次，你摔了三次。」\n\n「你還笑我。」\n\n「我笑完有回去扶你。」{ta}說，「你那時候哭得超醜。」\n\n你踢了{ta}一腳，{ta}笑著躲開。\n\n分開前，{ta}說：「下次同學會我不來了。太吵。」頓了頓，「但我們可以自己約。」","yul":"同學會快結束時，大家開始交換聯絡方式。好幾個人圍著{name}要號碼，{ta}都禮貌地推掉了。\n\n輪到你的時候，你沒有開口。\n\n{ta}看著你，等了幾秒，然後自己拿出手機：「你不問？」\n\n「你剛剛拒絕了所有人。」\n\n「對。」{ta}說，「但沒說要拒絕你。」\n\n你們交換了號碼。{ta}存你的名字時，你看見{ta}打的備註是「值日生」。\n\n那天晚上，你收到一則訊息：\n\n@msg 운동회 때 넘어진 거 기억나요 || 我記得你運動會摔倒的事。\n@msg 세 번 넘어지고도 끝까지 뛴 거 || 摔了三次還跑到終點。\n@msg 그때부터 좀 멋있다고 생각했어요 || 從那時候起，就覺得你有點帥。","yunhee":"同學會散場時，{name}喝得有點多，抱著你說了一堆小時候的事。\n\n「你知道嗎，」{ta}說，「你是第一個說我唱歌好聽的人。在音樂課上。」\n\n你完全不記得。\n\n「我記得！」{ta}說，「那天我回家哭了好久，因為太開心了。後來我就決定要當歌手。」\n\n「所以你是因為我……」\n\n「對！都是你的錯！」{ta}笑著說，然後又認真起來，「謝謝你。」\n\n{ta}的經紀人來接{ta}時，{ta}從車窗探出頭，大聲說：\n\n「下次見！一定要！」","harin":"同學會散場後，你在門口等車。{name}走過來，站在你旁邊，沒說話。\n\n過了一會兒，{ta}輕聲說：「你還記得教室後面那盒蠶嗎？」\n\n你記得。五年級的時候，班上養了一盒蠶，大部分人新鮮了幾天就不管了。最後一直在喂的，只有你和另一個人。\n\n「那個人是你？」你問。\n\n{ta}點點頭：「我們一起看著它們結繭。那天你說，它們好勇敢，把自己關起來，等著變成另一個樣子。」\n\n「我說過這種話？」\n\n「說過。」{ta}說，「我一直記得。」\n\n車來了。{ta}看著你上車，輕輕揮手。"}},{"id":"chi3","t":"舊照片與交換日記","tm":"深夜 23:30","p":"社群上，一個老同學發了一張二十年前的合照，標註了好多人。照片上，你和一個瘦小的孩子擠在一起，手裡抱著一本卡通封面的日記本。\n\n那個孩子，是{name}。\n\n留言區炸了。粉絲湧進來，問照片裡另一個人是誰。你嚇得關掉手機。\n\n半夜十一點半，一個陌生帳號傳訊息給你。頭像是一隻手抱著那本日記本。","c":{"yunhee":"@msg 이거 기억나?? 우리 교환일기!! || 你記得這個嗎？我們的交換日記！！\n@msg 아직도 내가 갖고 있어용 ㅠㅠ || 我到現在還留著嗚嗚","dohyun":"@msg 야 너 유명해졌네 ㅋㅋㅋ || 喂，你出名了耶ㅋㅋㅋ\n@msg 일기장 마지막 장 기억나? || 記得日記的最後一頁嗎？","harin":"@msg 오랜만이에요 || 好久不見。\n@msg 이 일기장, 아직 마지막 장이 비어 있어요 || 這本日記，最後一頁還是空的。","yul":"@msg 사진 내리라고 했어요 || 我已經叫人把照片撤下了。\n@msg 그래서? 잘 지냈어요? || 所以呢？你過得好嗎？"},"o":[{"t":"回覆說你還記得，問日記本還在不在","a":4,"h":0,"r":{"yunhee":"{ta}傳了十幾張日記內頁的照片，每一張都附哭臉。","dohyun":"「當然在。最後一頁是你寫的，你自己看。」{ta}傳來一張模糊的照片。","harin":"「想看的話，下次帶給你。」{ta}說。","yul":"「在。」{ta}只回一個字，又補：「找個時間還你。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"先關心{ta}會不會因為照片被罵","a":3,"h":0,"r":{"yunhee":"「我沒事啦！」{ta}回，可是之後的訊息變少了。","dohyun":"「我才不會被罵。」{ta}回，語氣有點不耐煩，「你很愛擔心喔。」","harin":"{ta}很久才回：「你一直都是這樣的人。」","yul":"「我會處理。你不用擔心。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"開玩笑：「你現在紅到我都上熱搜了」","a":2,"h":1,"r":{"yunhee":"「哈哈哈！你也太紅了吧！」","dohyun":"「蹭我的熱度喔？」{ta}回得很快。","harin":"「……嗯。」{ta}也只回了一個字。那本日記，{ta}再也沒提起。","yul":"「這不好笑。」{ta}說，「粉絲在肉搜你，你知道嗎？」"},"m":{"dohyun":[2,0],"yunhee":[1,0],"harin":[-2,0]},"sc":{"dohyun":[2,1,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[-10,-3,"worst"]}},{"t":"只回一句「好久不見」，就不知道說什麼了","a":-3,"h":-1,"r":{"yunhee":"{ta}傳來一串哭臉貼圖，然後好幾天都沒有再找你。","dohyun":"{ta}傳了三則訊息，你都沒回。{ta}最後傳：「算了。」","harin":"{ta}很久沒回。最後只傳：「你現在……覺得我是很紅的人嗎？」","yul":"「……就這樣？」{ta}隔了很久才回，然後就下線了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"你翻出那本舊日記的照片，看了很久。\n\n那是三年級的事了。你和{name}是同桌，有一陣子流行交換日記，你們就輪流在同一本本子上寫東西：今天吃了什麼、誰被老師罵了、長大想做什麼。\n\n後來你轉學了。那本日記最後在誰那裡，你已經不記得了。\n\n現在你知道了。在{ta}那裡。","after":{"dohyun":"你們後來聊到凌晨。{ta}一張一張傳日記的照片給你，每一頁都要配上{ta}的吐槽。\n\n「你看你這個字，醜死了ㅋㅋㅋ」\n「這天你說要當宇航員，結果呢？」\n「這頁是我寫的，我那時候好帥。」\n\n最後，{ta}傳來最後一頁的照片。\n\n那是你寫的。歪歪扭扭的字：「道賢，不管你去哪裡，我們都是好朋友。」\n\n你看著那行字，很久沒有回。\n\n然後{ta}傳來一句：\n\n@msg 그래서 연락한 거야 || 所以我才聯絡你。\n@msg 약속은 지켜야지 || 約定要遵守嘛。","yul":"你們的對話持續了一個多小時。{ta}說話一如既往地簡短，可是問的問題都很準：你現在在做什麼、住在哪裡、過得好不好。\n\n最後，{ta}說：「日記，找時間還你。」\n\n「你留著吧。」你說。\n\n「不行。」{ta}說，「那是兩個人的東西，應該一人一半。」\n\n「怎麼一人一半？」\n\n「複印。」{ta}說，「我已經找好店了。」\n\n你笑出聲。\n\n隔週，你收到一個包裹：一本裝訂得很精美的複印本，封面寫著兩個人的名字。\n\n裡面夾著一張紙條：「原本我留著。你這本，從最後一頁開始寫。」","yunhee":"那天晚上，你們一直聊到天快亮。{ta}一頁一頁地跟你回憶日記裡寫的事，回憶到激動的地方就傳語音，聲音大得你不得不把手機拿遠一點。\n\n「你還記得我們在操場埋了一個時光膠囊嗎！」\n\n你不記得了。\n\n「我也不記得埋在哪裡了！」{ta}說，「我們一起去找好不好！」\n\n你以為{ta}在開玩笑。\n\n一個星期後，你們真的在母校的操場上，拿著兩把小鏟子，被警衛追著跑。\n\n最後什麼都沒挖到。可是{ta}笑得比挖到寶還開心。","harin":"你們的對話斷斷續續地持續了好幾天。{ta}每天晚上都會傳一頁日記的照片，配上一兩句話。\n\n第一天是你畫的一隻兔子。「你那時候很會畫畫。」\n第二天是{ta}寫的一首詩，三年級的那種詩。「好丟臉。」\n第三天是一頁空白，只有日期。「這天我們吵架了，誰都沒寫。」\n\n第七天，{ta}問你：「最後一頁，你想寫什麼？」\n\n你想了很久，才回：「我想當面寫。」\n\n{ta}很久沒有回覆。\n\n最後，{ta}只傳了一個地址和一個時間。"}},{"id":"chi4","t":"牙醫診所的候診室","tm":"上午 09:15","p":"牙齒痛了三天，你終於請假去看牙醫。\n\n候診室裡只有一個人，戴著口罩，臉頰腫得很明顯，正在填表格。你坐在對面，偷偷看了一眼{ta}寫的名字。\n\n{name}。\n\n你腦中閃過一個畫面：補習班的最後一排，那個總是在課本上畫畫、借你抄筆記的同桌。\n\n{ta}抬頭，正好對上你的視線。","c":{"yunhee":"{ta}一下子站起來，又因為牙痛彎下腰：「嗚……是你！補習班的！」","dohyun":"「哈，你也牙痛？」{ta}一邊忍痛一邊笑，「甜食吃太多了吧。」","harin":"{ta}拉下口罩一點，輕聲說：「你還是習慣坐在角落呢。」","yul":"「你的筆記字很醜，但很好用。」{ta}說，「我記得。」"},"o":[{"t":"同病相憐地聊起牙痛","a":3,"h":0,"r":{"yunhee":"「好痛好痛！我們一起加油！」{ta}握緊你的手。","dohyun":"{ta}跟你比誰比較痛，最後兩個人都笑到更痛。","harin":"「痛的時候，說話會分心。」{ta}說，「跟我說說你最近的事吧。」","yul":"「我不想聊牙齒。」{ta}說，「很無聊。」"},"m":{"dohyun":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"問{ta}現在還會畫畫嗎","a":4,"h":0,"r":{"yunhee":"「你還記得！」{ta}翻出手機裡的塗鴉給你看。","dohyun":"「畫你啊。」{ta}隨手在表格背面畫了一個牙痛的你。","harin":"「會。現在都畫在歌詞本的邊邊。」{ta}說完有些害羞。","yul":"「沒時間了。」{ta}說，過了一會兒又補，「偶爾。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"讓{ta}先進去，說你沒那麼急","a":3,"h":0,"r":{"yunhee":"「這樣不好吧……」{ta}猶豫著進去了，出來時你已經不在候診室。","dohyun":"「我才不用你讓。」{ta}的語氣有點衝，「我又不是不能等。」","harin":"{ta}進去前，回頭看了你一眼。出來後，{ta}沒有再找你說話。","yul":"「好。我欠你一次。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"太痛了，沒力氣說話，只點了點頭","a":-3,"h":-1,"r":{"yunhee":"{ta}一直想跟你說話，你都只點頭。{ta}後來低頭玩手機了。","dohyun":"{ta}跟你說話，你只點頭。{ta}說：「好吧，你繼續痛。」轉頭不理你了。","harin":"{ta}問你還畫不畫畫，你只點頭。{ta}沒有再問了。","yul":"{ta}說了幾句，看你一直不回，就戴上耳機了。"},"m":{"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"候診室很安靜，只有牆上的時鐘在走，和遠處傳來的牙鑽聲。\n\n你捂著臉坐著，一邊疼一邊胡思亂想。補習班那時候，你們幾乎每天都坐在一起，從初一到初三。{ta}很少說話，上課總在課本邊上畫畫，可是每次你沒聽懂，{ta}都會默默把筆記推過來。\n\n後來你們考上了不同的高中，就再也沒見過。\n\n你沒想到，再見面會是在這裡，兩個人都腫著臉。","after":{"dohyun":"你們看完牙醫出來，都腫著半邊臉，說話含糊不清。\n\n{name}看著你，突然笑出聲：「你好醜。」\n\n「你也是。」\n\n{ta}笑到捂著臉喊痛。\n\n你們在診所門口站了一會兒，誰都沒說要走。最後{ta}說：「我知道附近有一家很好吃的粥店。現在只能吃粥了。」\n\n那碗粥你們吃了一個小時。{ta}一邊吃一邊抱怨，說待會還有練習，臉腫成這樣要被罵死。\n\n分開前，{ta}說：「下週複診，幾點？」\n\n你說了。{ta}點點頭：「我也是那個時間。」\n\n你知道{ta}在說謊。","yul":"你們看完牙醫，在門口遇到。{name}的臉還是腫的，可是已經恢復了平常那副冷靜的樣子。\n\n「明天有拍攝。」{ta}說，「導演會殺了我。」\n\n「冰敷。」你說，「每二十分鐘一次。」\n\n{ta}看了你一眼：「你還是那麼會照顧人。補習班的時候也是。」\n\n「我？」\n\n「你每次都把橡皮擦借我，然後自己用手指擦。」{ta}說，「我記得。」\n\n{ta}叫的車來了。上車前，{ta}回頭：\n\n「複診那天，一起來吧。看完我請你吃粥。」","yunhee":"你們看完牙醫，一起坐在診所門口的長椅上，各自捂著臉。\n\n「好痛喔……」{ta}哭喪著臉，「我明天還要直播……」\n\n你從包裡拿出一包冰袋，分了一半給{ta}。\n\n{ta}感動得快哭了：「你怎麼什麼都有……」\n\n那天下午，你們在長椅上坐了很久。{ta}跟你講補習班時候的事，講到你們一起偷偷在桌底下吃辣炒年糕，被老師抓到罰站。\n\n「那是我第一次被罰站。」{ta}說，「可是一點都不難過，因為你在旁邊。」\n\n{ta}說完，好像突然意識到自己說了什麼，臉紅了，又捂著臉喊痛。","harin":"看完牙醫，你們一起走到公車站。{name}的臉腫著，說話不太方便，就拿出手機打字給你看。\n\n「你還記得我在課本上畫的東西嗎？」\n\n你說你記得一些，有花，有貓，還有一個很奇怪的人。\n\n{ta}打字：「那個很奇怪的人，是你。」\n\n你愣住了。\n\n{ta}笑了，臉一笑就痛，又捂住。\n\n公車來了。{ta}先上車，坐在靠窗的位子。車開走前，{ta}隔著玻璃，對你舉起手機。\n\n屏幕上寫著：「現在也還會畫。」"}},{"id":"chi5","t":"鋼琴老師的告別音樂會","tm":"下午 16:00","p":"小時候教你鋼琴的老師要退休了。她的學生們在一間小音樂廳辦了一場告別音樂會。\n\n你坐在第三排，翻著節目單，看見最後一個表演者的名字，愣住了。\n\n{name}。\n\n你想起來了。老師家的客廳，每週四下午，你上完課，下一個就是那個總是遲到、卻彈得比誰都好的孩子。\n\n音樂會結束，大家圍著老師拍照。老師拉著你的手，轉頭喊：「{name}，你記得{me}嗎？以前你們常常搶我的餅乾。」","c":{"yunhee":"{name}睜大眼睛：「天啊！你是那個彈錯就哭的小朋友！」","dohyun":"{name}笑：「啊，是那個每次都要老師陪著才敢上臺的人。」","harin":"{name}看著你，好像想說什麼，最後只說：「你剛剛，有聽我彈嗎？」","yul":"{name}點頭：「記得。你左手總是比右手慢半拍。」"},"o":[{"t":"說{ta}剛才彈的曲子讓你差點哭出來","a":4,"h":0,"r":{"yunhee":"「真的嗎！」{ta}眼眶一下子紅了，「我練了好久！」","dohyun":"「哭了就哭了，幹嘛說差點。」{ta}嘴上嫌，卻很開心。","harin":"{ta}沉默很久，輕聲說：「謝謝你聽見了。」","yul":"「那段我改了和聲。」{ta}問，「你聽出來了？」"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"提議跟{ta}四手聯彈一首小時候的曲子","a":3,"h":2,"r":{"yunhee":"「好啊好啊！」{ta}拉著你坐下，彈得亂七八糟，大家都笑了。","dohyun":"「你跟得上嗎？」{ta}故意彈得很快。","harin":"{ta}的手很輕，配合你的節奏慢下來。","yul":"「你左手還是慢半拍。」{ta}說，卻放慢了速度等你。"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"陪老師聊天，讓{ta}和其他人拍照","a":2,"h":0,"r":{"yunhee":"{ta}拍照拍到一半，一直往你這邊看，你都沒過去。","dohyun":"{ta}遠遠看著你跟老師聊天，表情有點不爽，拍完照就走了。","harin":"{ta}一直在等你過來說點什麼。你沒有。","yul":"{ta}拍完照，站在原地等了一會兒，看你沒過來，就自己離開了。"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"說你很久沒彈琴了，有點不好意思","a":-3,"h":-1,"r":{"yunhee":"{ta}原本想拉你一起彈，聽你這麼說，就把手縮回去了。","dohyun":"「退步了吧？」{ta}說，「那就別彈了。」語氣比玩笑更冷。","harin":"{ta}看著你，像是想說「我也是」，最後什麼都沒說。","yul":"「技能會退化。」{ta}說，「看來你放棄得很徹底。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"告別音樂會的觀眾不多，大部分都是老師以前的學生和家長。大家坐在小小的音樂廳裡，一個接一個上臺演奏。\n\n有人彈得很好，有人彈錯了好幾個音，可是老師每一個都很認真地聽，每一個都用力鼓掌。\n\n你想起小時候，每個星期四下午，你坐在老師家那架舊鋼琴前，一邊彈一邊偷看牆上的鐘。下一個學生總是遲到，老師就會嘆氣，然後多陪你練十分鐘。\n\n最後一個節目開始了。燈光暗下來，有人走上臺。","after":{"dohyun":"音樂會結束後，學生們一起請老師吃飯。{name}坐在你旁邊，一直跟你搶最後一塊肉。\n\n「你還是那麼幼稚。」你說。\n\n「你還是那麼慢。」{ta}說，「剛剛四手聯彈，你又慢了半拍。」\n\n老師在對面笑：「你們兩個，小時候也是這樣吵。」\n\n飯後，你們送老師回家。老師站在門口，拉著你們兩個人的手：「以後要常常一起來看我。」\n\n「好。」你們同時說。\n\n回去的路上，{ta}突然說：「那下個月，一起來？」\n\n「好。」\n\n「說好了。」{ta}伸出小指，「不準反悔。」","yul":"音樂會結束後，大家圍著老師拍照。{name}站在人群外面，等到人都散了，才走過去，給老師深深鞠了一個躬。\n\n你聽見老師小聲說：「你這孩子，這幾年辛苦了。」\n\n{ta}沒說話，只是低著頭。\n\n後來{ta}走到你身邊，你們一起走出音樂廳。外面已經天黑了。\n\n「老師剛才跟我說，」{ta}說，「當年我差點放棄音樂的時候，是她騙我說，有一個學生每週四都在等我。」\n\n「那個學生是我？」\n\n「是你。」{ta}說，「所以，謝謝你。雖然你那時候只是在等我快點進門，好讓你下課。」","yunhee":"音樂會結束後，老師留大家喝茶。{name}一直黏在老師身邊撒嬌，說小時候老師最疼{ta}。\n\n「才不是，」老師笑著說，「我最疼的是每次都準時的那個。」\n\n所有人都看向你。{ta}誇張地倒抽一口氣：「原來是你！你搶走了老師的愛！」\n\n後來{ta}拉著你坐到鋼琴前，彈了一首小時候的練習曲。彈得亂七八糟，你們笑到停不下來。\n\n離開前，{ta}說：「我好久沒這麼開心地彈琴了。」\n\n{ta}看著你，眼睛亮亮的：「以後，可以常常一起彈嗎？」","harin":"音樂會結束後，你在後臺找到{name}。{ta}坐在鋼琴前，手指放在琴鍵上，沒有彈。\n\n「那首曲子，」{ta}說，「是老師教我的第一首。我一直彈不好。」\n\n「今天彈得很好。」\n\n「因為今天，」{ta}說，「我知道有人在聽。」\n\n你在{ta}旁邊坐下。{ta}開始彈一首很輕的曲子，是你從來沒聽過的。\n\n彈完了，{ta}說：「這是我寫的。還沒有名字。」\n\n「很好聽。」\n\n{ta}看著你，過了很久，才輕聲說：「那，以後就叫做〈星期四〉吧。」"}}],"chance":[{"id":"cha1","t":"拿錯的傘","tm":"下午 17:20","p":"突如其來的大雨，你躲進一間小咖啡廳。門口的傘架上插著十幾把傘，你的是一把透明傘，傘柄貼了一張小貼紙。\n\n喝完咖啡，雨小了。你拿起傘走到門口，撐開才發現——不對，這把沒有貼紙。\n\n「不好意思。」身後有人叫住你，手裡拿著一把有貼紙的透明傘。「這把好像是你的。」\n\n那人戴著口罩和帽子，但聲音你太熟悉了。是{name}。","c":{"yunhee":"{ta}舉著你的傘：「這個貼紙是限定版對不對！我找好久了！」","dohyun":"{ta}晃著你的傘：「你拿錯了，小偷。」語氣卻是在笑。","harin":"{ta}有點不好意思：「我差點就帶走了。還好你的貼紙很明顯。」","yul":"{ta}伸手：「交換。你拿的那把，傘骨斷了一根，我正要拿去修。」"},"o":[{"t":"笑著交換，順口說貼紙的來歷","a":3,"h":0,"r":{"yunhee":"你講貼紙的故事講了很久，{ta}聽著聽著，開始看窗外。","dohyun":"「這種幼稚的東西你也喜歡？」{ta}卻多看了貼紙兩眼。","harin":"{ta}安靜地聽你說完，然後禮貌地說：「謝謝。」就沒有下文了。","yul":"「我明白了。」{ta}把傘還給你，「那就別再弄丟。」"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"雨還沒停，提議一起撐到地鐵站","a":4,"h":1,"r":{"yunhee":"「好啊！」{ta}擠在你旁邊，一路上講個不停。","dohyun":"「你太矮了，我來撐。」{ta}搶過傘。","harin":"{ta}點頭，兩個人肩膀之間隔著一個拳頭的距離。","yul":"「我的車就在前面。」{ta}說，「你去哪？我送你。」"},"m":{"dohyun":[1,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"問{ta}要不要再坐一下，等雨停","a":3,"h":0,"r":{"yunhee":"{ta}拿出底片相機，拍了窗外的雨。","dohyun":"「等雨停？」{ta}說，「好無聊。」{ta}撐起傘就走了。","harin":"{ta}坐在窗邊，跟你說下雨天的聲音很適合寫歌。","yul":"「我沒時間。」{ta}說，「十五分鐘後有會議。」"},"m":{"harin":[2,0],"yunhee":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"道謝後馬上離開，不打擾{ta}","a":-3,"h":-1,"r":{"yunhee":"「欸——」{ta}想說什麼，你已經走了。{ta}看著手裡那把傘，很失落。","dohyun":"你轉身就走。{ta}在後面喊了一聲，你沒回頭。","harin":"你走得很快。{ta}站在門口，看著雨，看了很久。","yul":"「東西換回來就好。」{ta}說完，比你更快地走進雨裡。"},"m":{"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那間咖啡廳你常來。店不大，只有八張桌子，老闆會放很老的爵士樂。下雨天的時候，窗玻璃上會起一層霧，外面的街道變得模模糊糊的。\n\n你坐在靠窗的位置，點了一杯熱拿鐵，看著雨發呆。\n\n不遠處坐著一個戴著口罩的人，面前放著一本筆記本，一直在寫東西。你沒多想，那個人看起來跟普通的客人沒什麼不同。\n\n雨下了一個多小時，才慢慢變小。","after":{"dohyun":"後來你們一起在咖啡廳坐到雨停。{name}一直在跟你抱怨，說{ta}今天本來要去滑板公園，結果被雨困住。\n\n「你會滑板？」你問。\n\n「會啊。超厲害。」{ta}說，「下次帶你去看。」\n\n雨停的時候，天邊出現了一道很淡的彩虹。{ta}拿出手機拍了一張，又偷偷把鏡頭轉向你。\n\n「喂，你在拍我？」\n\n「拍彩虹。」{ta}說，「你剛好在裡面。」\n\n那天晚上，你收到一張照片。彩虹很淡，你的側臉很清楚。\n\n@msg 우산 바뀐 거, 운명인가 ㅋ || 拿錯傘，是命運嗎ㅋ","yul":"後來你們在咖啡廳又坐了一會兒。{name}跟你聊起{ta}正在準備的角色，是一個總是在雨天出現的偵探。\n\n「所以你在觀察下雨天的人？」你問。\n\n「在觀察你。」{ta}說，「你看雨的樣子，很像我要演的那個人。」\n\n你不知道該怎麼回答。\n\n{ta}合上筆記本，看了看窗外：「雨停了。」\n\n可是{ta}沒有站起來。\n\n又過了半個小時，{ta}才說：「那把傘，傘骨斷了。你幫我挑一家修傘的店？」\n\n那天，你們走了三條街，才找到一家還開著的修傘店。","yunhee":"你們一起在咖啡廳等雨停。{name}拿出底片相機，對著窗外拍了好幾張。\n\n「下雨天的照片洗出來，」{ta}說，「會有一種很溫柔的顏色。」\n\n{ta}把相機轉向你：「可以拍你嗎？」\n\n你還沒回答，快門就響了。\n\n「拍到了！」{ta}笑，「洗出來給你！」\n\n雨停時，你們一起走出咖啡廳。{ta}把那把有貼紙的傘還給你，又依依不捨地摸了摸那張貼紙。\n\n「我真的很喜歡這個……」\n\n你撕下貼紙，貼在{ta}的手背上。\n\n{ta}愣住了，然後笑得像個得到糖果的小孩。","harin":"你們在咖啡廳坐到雨停。{name}的筆記本一直攤在桌上，你瞥見上面寫著幾行歌詞，被劃掉了好幾次。\n\n「寫不出來？」你問。\n\n{ta}點點頭：「一直寫不出下雨的感覺。」\n\n你想了想，說起你小時候，下雨天總是躲在窗邊，數著雨滴從玻璃上滑下來的路線。\n\n{ta}看著你，突然低頭開始寫。寫了很久，才抬起頭。\n\n「謝謝你。」{ta}說，「我寫出來了。」\n\n那天晚上，{ta}傳來一段很短的錄音。是一首新歌的開頭，歌詞裡有一句：「數著雨滴滑落的路線，等一把傘找回它的主人。」"}},{"id":"cha2","t":"深夜便利商店","tm":"凌晨 02:10","p":"凌晨兩點，你加完班，去樓下的便利商店買泡麵。\n\n收銀臺前站著一個人，戴口罩、穿連帽外套，手裡抱著一堆零食。店員說：「一共一萬兩千三百韓元。」\n\n那人掏了掏口袋，翻了兩次，然後很小聲地說：「……可以刷卡嗎？」\n\n「機器壞了，只收現金。」\n\n那人僵住了。你看見帽子下露出的一縷頭髮、和那雙眼睛，心跳漏了一拍。是{name}。","c":{"yunhee":"{ta}快哭了：「可是我好餓……練了一整天……」","dohyun":"{ta}嘖了一聲：「那我先拿走，明天還？」店員搖頭。","harin":"{ta}低頭看著那堆東西，好像不知道該放回哪一樣。","yul":"{ta}冷靜地說：「我打電話叫助理送錢來。等我五分鐘。」"},"o":[{"t":"直接幫{ta}付錢，說不用還","a":3,"h":0,"r":{"yunhee":"「你是天使嗎！」{ta}硬塞給你一包軟糖當謝禮。","dohyun":"「不用還？那我欠你一次。」{ta}挑眉，「我不喜歡欠人。」","harin":"{ta}不停道謝，最後從零食裡挑了一包給你。","yul":"「我會還。」{ta}說，「給我你的號碼。」"},"m":{"dohyun":[1,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"幫{ta}付錢，但半開玩笑要分你一包零食","a":4,"h":1,"r":{"yunhee":"「全部給你都可以！」{ta}最後跟你在門口一起吃。","dohyun":"「你挑。」{ta}看你挑了{ta}最愛的那包，「……你品味不錯嘛。」","harin":"{ta}認真地問你喜歡哪一種，把那包放進你手裡。","yul":"「交易成立。」{ta}拆開一包，分你一半。"},"m":{"yunhee":[2,0],"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[6,1,"best"]}},{"t":"幫{ta}把太多的零食放回去，只留最需要的","a":2,"h":0,"r":{"yunhee":"「可是我好餓……」{ta}委屈地看著你，你還是把東西放回去了。","dohyun":"「喂，那是我的！」{ta}搶回來，「你憑什麼管我吃什麼？」","harin":"{ta}有點難堪地看著你幫{ta}挑東西，臉慢慢紅了。","yul":"「我不需要你幫我決定。」{ta}說，「放回去。」"},"m":{"yul":[1,0],"yunhee":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"假裝沒認出來，付完自己的東西就走","a":-3,"h":-1,"r":{"yunhee":"{ta}抱著零食，看你直接走了，眼眶有點紅。","dohyun":"{ta}在你背後喊：「喂，你剛才明明看到我了。」你沒回頭。","harin":"{ta}最後放回了一大半。你走出門時，{ta}沒有看你。","yul":"{ta}看著你走出去，表情很冷。你裝作不認識{ta}，{ta}也就當不認識你。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那間便利商店你來過無數次。凌晨兩點的店裡只有一個店員，在櫃檯後面打瞌睡。冷藏櫃嗡嗡作響，雜誌架上的封面被日光燈照得發白。\n\n你拿了一碗泡麵、一罐啤酒，又在零食架前猶豫了一下，多拿了一包巧克力。今天加班太晚，你覺得自己值得。\n\n走到櫃檯時，前面已經有一個人在結帳。那人抱著一大堆零食，堆得快要擋住臉。","after":{"dohyun":"後來你們坐在便利商店門口的塑膠椅上，一起吃泡麵。凌晨的街道很安靜，只有偶爾經過的計程車。\n\n「練到現在？」你問。\n\n「嗯。新歌的舞太難了。」{ta}說，吸了一大口面，「隊長一直罵我。」\n\n「你被罵了還這麼開心？」\n\n「因為現在有人請我吃泡麵。」{ta}說，笑得眼睛都眯起來。\n\n那天之後，你常常在凌晨兩點的便利商店遇到{ta}。\n\n有時候{ta}帶著兩罐飲料，有時候{ta}已經幫你泡好了面。\n\n有一次，{ta}說：「我一直以為是巧合。後來才發現，我是故意算好時間來的。」","yul":"{ta}的助理五分鐘後到了，把錢還給你，一毛不差。\n\n你以為事情就這樣結束了。\n\n三天後，你在同一間便利商店，同一個時間，又遇到了{name}。{ta}站在泡麵架前，好像在等什麼。\n\n「又加班？」{ta}問。\n\n「又練習？」\n\n「拍夜戲。」{ta}說，「剛收工。」\n\n你們站在門口吃泡麵。{ta}吃得很快，很安靜，吃完後把兩個人的垃圾一起丟掉。\n\n「你每天都這麼晚？」{ta}問。\n\n「最近是。」\n\n「那，」{ta}說，「這周我也都拍夜戲。」","yunhee":"後來你們一起坐在便利商店門口，吃著那一大堆零食。\n\n「我今天好慘喔，」{ta}說，「練了十個小時，然後發現錢包忘在宿舍……」\n\n「你可以打給經紀人啊。」\n\n「可是他會罵我半夜偷吃零食！」{ta}委屈地說。\n\n你笑到不行。\n\n凌晨三點，{ta}的經紀人還是打來了，在電話裡罵得很大聲。{ta}一邊道歉一邊對你做鬼臉。\n\n掛掉電話後，{ta}說：「我要走了。可是……」\n\n{ta}拿出手機：「你的帳號！我要還你錢！」\n\n你說不用。{ta}就說：「那我請你吃飯。不準拒絕！」","harin":"後來你們在便利商店門口的長椅坐了一會兒。{name}抱著那包你挑剩的餅乾，小口小口地吃。\n\n「我常常這個時間來。」{ta}說，「這時候人最少。」\n\n「睡不著？」\n\n「寫不出歌的時候，就睡不著。」{ta}說，「出來走走，買點甜的東西，會好一點。」\n\n你點點頭。你也是。加班到深夜的時候，總覺得需要一點甜的東西，才能撐到明天。\n\n{ta}吃完最後一塊餅乾，站起來：「謝謝你。今天的甜，是你給的。」\n\n你們走向不同的方向。走了幾步，你回頭，看見{ta}也在回頭。"}},{"id":"cha3","t":"酒吧角落","tm":"深夜 23:50","p":"你和同事來梨泰院的一間小酒吧慶祝專案結束。同事們喝到一半就各自回家，只剩你一個人坐在吧檯。\n\n角落的卡座裡，有個人一個人喝酒。燈光很暗，桌上擺著三個空杯。\n\n你多看了一眼。那張側臉，你在廣告牌上看過無數次。是{name}。\n\n{ta}好像察覺到你的視線，抬起頭。你們隔著半個酒吧對視。你沒有尖叫，也沒有拿出手機，只是默默轉回去。\n\n過了一會兒，有人在你旁邊的高腳椅坐下。","c":{"yunhee":"「你認出我了對吧？」{name}託著下巴，「可是你沒尖叫耶，我好好奇。」","dohyun":"「喂。」{name}敲敲吧檯，「你是沒認出來，還是裝的？」","harin":"{name}坐下後好一陣子沒說話，最後輕聲說：「可以陪我坐一下嗎？不用聊天。」","yul":"「你很冷靜。」{name}說，「這年頭少見。」"},"o":[{"t":"什麼都不問，陪{ta}安靜喝一杯","a":4,"h":0,"r":{"yunhee":"{ta}最後忍不住，講了一堆心事，又笑著說你是好聽眾。","dohyun":"「你真的很奇怪。」{ta}說，嘴角卻翹起來。","harin":"{ta}喝完那杯，說：「謝謝。你沒有問，我反而想說了。」","yul":"{ta}看了你很久：「這是我今天唯一不用說話的時間。」"},"m":{"harin":[3,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"關心地問{ta}是不是心情不好","a":3,"h":0,"r":{"yunhee":"{ta}眼眶一紅，說今天被老師罵了。","dohyun":"「我心情很好。」{ta}說，語氣很衝，「你管我？」","harin":"{ta}搖搖頭，什麼都沒說。好像被問了，反而更不想說了。","yul":"「你很直接。」{ta}說，「對，很不好。合約的事。」"},"m":{"yunhee":[2,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"開玩笑說：「我只認得你是喝了三杯的人」","a":3,"h":1,"r":{"yunhee":"{ta}笑了兩聲，又安靜下來。好像這個玩笑讓{ta}更難過了。","dohyun":"「才三杯？我還沒開始。」{ta}跟你碰杯。","harin":"{ta}輕輕笑了，說你很會讓人放鬆。","yul":"「不好笑。」{ta}說，「我現在沒有心情。」"},"m":{"dohyun":[2,1]},"sc":{"dohyun":[6,2,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,1,"good"]}},{"t":"提醒{ta}喝太多了，該回家","a":-3,"h":-1,"r":{"yunhee":"「你好像我經紀人……」{ta}說完就叫了車，沒再跟你說話。","dohyun":"「你管我？」{ta}說完，又點了一杯，轉身背對著你。","harin":"{ta}點點頭，站起來，把酒錢放在桌上就走了。","yul":"「我知道自己的量。」{ta}說，「你可以走了。」"},"m":{"dohyun":[-5,0],"yul":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那間酒吧很小，在一棟舊樓的二樓，要爬一段很窄的樓梯才上得去。牆上貼著很多老電影的海報，吧檯的燈是暗紅色的。\n\n同事們都走了。你本來也想走，可是這杯酒還沒喝完，就多坐了一會兒。\n\n調酒師是個話很少的大叔，擦著杯子，偶爾往角落看一眼。你順著他的視線看過去，才注意到那個一個人喝酒的人。","after":{"dohyun":"那天你們一直喝到凌晨兩點，酒吧打烊。\n\n走下那段窄窄的樓梯時，{name}腳下一滑，你一把扶住{ta}。\n\n「我沒醉。」{ta}說。\n\n「你醉了。」\n\n「好吧，一點點。」{ta}靠在牆上，看著你笑，「你知道嗎，今天我差點哭了。被老師罵得很慘。」\n\n「那現在呢？」\n\n「現在不想哭了。」{ta}說，「因為遇到一個奇怪的人。」\n\n你幫{ta}叫了車。上車前，{ta}抓著車門：「下週五，同一個時間，同一個位子。你來不來？」\n\n你說你會考慮。\n\n下週五，你去了。{ta}已經坐在那裡，面前放著兩杯酒。","yul":"你們在酒吧坐到打烊。{name}後來說了很多，關於合約，關於前團解散時那些沒說出口的事。\n\n「我很少跟人說這些。」{ta}說，「跟陌生人說，反而容易一點。」\n\n「那我們現在還是陌生人嗎？」\n\n{ta}看了你很久：「不是了。」\n\n離開時，{ta}在樓梯口停下來：「今天的事，你會說出去嗎？」\n\n「不會。」\n\n「我知道。」{ta}說，「所以才跟你說。」\n\n那天之後，你偶爾會在深夜收到一則訊息，只有一個酒吧的名字和一個時間。\n\n你每次都去了。","yunhee":"那天你們一直聊到酒吧打烊。{name}的話越來越多，從被老師罵聊到{ta}小時候想當獸醫，又聊到{ta}其實很怕黑。\n\n「所以我很少一個人出來。」{ta}說，「今天是因為太難過了。」\n\n「那現在呢？」\n\n「現在好多了！」{ta}笑，「因為有你！」\n\n下樓梯時，{ta}緊緊抓著你的袖子，說樓梯太黑了。\n\n到了街上，{ta}才鬆開手，有點不好意思：「對不起，我是不是很煩……」\n\n「不會。」\n\n{ta}看著你，突然認真地說：「下次我難過的時候，可以找你嗎？」","harin":"你們在酒吧裡坐了很久。{name}後來說了一些話，很少，很輕，像是在對自己說。\n\n{ta}說{ta}最近寫不出歌，說{ta}害怕自己再也寫不出來了，說{ta}有時候覺得，大家喜歡的是那個在舞臺上的人，不是{ta}。\n\n你沒有安慰{ta}，只是聽著。\n\n打烊時，{ta}站起來，對你輕輕鞠了一個躬。\n\n「謝謝你沒有說『你很棒』。」{ta}說，「大家都這樣說，可是我不相信。」\n\n「那你相信什麼？」\n\n{ta}想了想：「相信剛才，有一個人認真聽我說話。」"}},{"id":"cha4","t":"臨時頂替的拍攝","tm":"上午 08:00","p":"早上七點，你接到電話：一個雜誌拍攝現場缺人，原本的同行臨時生病，問你能不能去頂。\n\n身為{job}的你，雖然不是完全對口，但這種救火的事你做過不少。你抓了包就出門。\n\n到了片場，你才知道今天的拍攝對象是{name}。\n\n導演很趕，一直在罵人。燈光組手忙腳亂，現場氣壓低得不得了。輪到你上場時，{name}正坐在角落，看著你。","c":{"yunhee":"{name}朝你揮手，用嘴型說：「加油！」","dohyun":"{name}挑眉：「新人？別搞砸了，我想早點下班。」","harin":"{name}看著你，輕聲說：「導演今天心情不好，不是你的問題。」","yul":"{name}說：「你只有二十分鐘。我配合你，你說要什麼。」"},"o":[{"t":"冷靜地用你的專業把場面穩住","a":4,"h":0,"r":{"yunhee":"「你好專業！」{ta}在你身後鼓掌。","dohyun":"{ta}收起吊兒郎當的樣子：「……你挺厲害的。」","harin":"{ta}在你身邊小聲說：「你在工作的時候，很不一樣。」","yul":"「這才叫工作。」{ta}直接問你要名片。"},"m":{"yul":[3,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"先跟{ta}道歉，說你可能會慢一點","a":2,"h":0,"r":{"yunhee":"「沒關係……」{ta}說，可是你慢了好幾次，導演罵{ta}的時候，{ta}看了你一眼。","dohyun":"「道歉什麼，做就對了。」{ta}不耐煩地說，「我想早點下班。」","harin":"{ta}點點頭，可是你一直道歉，{ta}的表情越來越緊張。","yul":"「道歉浪費時間。」{ta}說，「你不行的話，現在說。」"},"m":{"harin":[1,0],"yul":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"趁空檔跟{ta}開個玩笑，讓{ta}放鬆","a":3,"h":1,"r":{"yunhee":"{ta}笑到停不下來，被導演瞪了一眼。","dohyun":"「你很有趣嘛。」{ta}開始跟你鬥嘴。","harin":"{ta}輕笑，肩膀放鬆下來。","yul":"「不好笑。」{ta}說完，轉身時嘴角翹起。"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"悶頭做事，一句話都不多說","a":-3,"h":-1,"r":{"yunhee":"{ta}好幾次想跟你搭話，你都沒理。{ta}最後放棄了。","dohyun":"「你是機器人嗎？」{ta}說，之後整個拍攝都沒再跟你說話。","harin":"{ta}很想找人說話，你卻一直悶著頭。{ta}後來一個人坐在角落。","yul":"{ta}全程很配合，可是收工後一句話都沒跟你說。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"片場在一棟老洋房裡，攝影棚的燈光架得到處都是，地上全是線。工作人員來來去去，每個人都很趕，每個人都很煩躁。\n\n你一到，就被一個副導塞了一份流程表，說你只有十分鐘熟悉狀況。\n\n你快速看完，在心裡排好順序。這種救火的工作你做過很多次，只要不慌，就不會出錯。\n\n只是你沒想到，導演的脾氣比你想象中糟糕得多。","after":{"dohyun":"拍攝比預定時間提前了半小時結束。導演難得地笑了，說今天的成果是這個月最好的。\n\n收工後，{name}在片場門口等你。\n\n「喂，」{ta}說，「你下次還來嗎？」\n\n「我只是臨時幫忙的。」\n\n「那就不要臨時了。」{ta}說，「我跟公司說，以後都找你。」\n\n你以為{ta}在開玩笑。\n\n一個星期後，你接到一通電話，是{ta}所屬公司打來的，問你下個月有沒有空，說有一個長期的合作想談。\n\n電話那頭的人補了一句：「是道賢指定的。」","yul":"拍攝結束後，導演把你叫過去，說以後有機會還要合作。你禮貌地道謝，轉身就看見{name}靠在門邊。\n\n「你很專業。」{ta}說，「我討厭跟不專業的人合作。」\n\n「謝謝。」\n\n「不是客套。」{ta}說，「我說的是實話。」\n\n{ta}遞給你一張名片，背面寫著一個私人號碼。\n\n「我的工作室下個月有一個項目，」{ta}說，「我想找你。」\n\n「只是工作？」\n\n{ta}看了你一眼：「先從工作開始。」","yunhee":"拍攝結束時，{name}跑過來，一把抱住你。\n\n「你好厲害！導演今天居然沒有罵我！」\n\n你被{ta}抱得有點喘不過氣。\n\n收工後，{ta}堅持要請你吃飯，說是感謝你救了{ta}的拍攝。\n\n你們在片場附近的一家小餐館吃了部隊鍋。{ta}一邊吃一邊講導演的壞話，講得眉飛色舞。\n\n「你知道嗎，」{ta}說，「我今天本來很害怕的。可是你一來，我就不怕了。」\n\n「為什麼？」\n\n「不知道！」{ta}說，「就是有一種……你在的話，就沒問題的感覺。」","harin":"拍攝結束後，{name}在化妝室裡卸妝。你進去收拾器材，{ta}從鏡子裡看著你。\n\n「謝謝你。」{ta}說，「導演罵人的時候，你擋在前面。」\n\n「那是我的工作。」\n\n「不是。」{ta}說，「那不是你的工作。」\n\n你沒有說話。\n\n{ta}卸完妝，素著一張臉轉過來，雀斑在燈下很清楚：「我很怕這種場面。但今天，我覺得沒那麼怕了。」\n\n你離開時，{ta}叫住你：「下次如果還有拍攝……我可以要求是你嗎？」"}},{"id":"cha5","t":"延誤的航班","tm":"晚上 22:30","p":"仁川機場，你的航班延誤了三個小時。\n\n候機室裡人很少，你找了一個靠窗的位子坐下。沒多久，一個戴帽子的人在你對面坐下，抱著一個大揹包，看起來累壞了。\n\n廣播又響：航班再延誤一小時。\n\n那人嘆了口氣，拉下口罩喝水。你看見那張臉，手裡的咖啡差點灑出來。是{name}。\n\n登機時，你看著登機證上的座位號碼，再看看{ta}的。——就在隔壁。","c":{"yunhee":"{ta}一坐下就哀嚎：「我們好有緣喔！你也是去大阪嗎？」","dohyun":"{ta}瞥了你一眼：「剛才在候機室偷看我的是你吧？」","harin":"{ta}安靜地坐下，從包裡拿出一本書，偶爾偷偷看你。","yul":"{ta}看了你一眼：「你是剛才那個咖啡差點灑出來的。」"},"o":[{"t":"分享你帶的零食和耳機，一起看電影","a":4,"h":1,"r":{"yunhee":"{ta}看到感人的地方哭了，搶你的面紙。","dohyun":"「這部好無聊。」{ta}卻看完了，還在最後笑出聲。","harin":"{ta}看到一半睡著了，頭差點靠到你肩上，又驚醒。","yul":"「我看過了。」{ta}說，卻陪你看完，還在劇情轉折時劇透。"},"m":{"yunhee":[2,0],"harin":[1,1]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[6,1,"best"],"harin":[6,2,"best"]}},{"t":"問{ta}這次是去工作還是休假","a":3,"h":0,"r":{"yunhee":"「工作！但我想偷偷去環球影城！」","dohyun":"「休假。終於。」{ta}伸了個懶腰。","harin":"「工作。」{ta}簡短地說。被問到工作，{ta}好像有點累。","yul":"「談合約。」{ta}說，「你呢？」"},"m":{"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[-4,-1,"bad"]}},{"t":"看{ta}很累，幫{ta}要了毯子，讓{ta}睡","a":3,"h":0,"r":{"yunhee":"「我還不想睡啦……」{ta}說，可是你已經幫{ta}蓋好了，{ta}只好閉上眼睛。","dohyun":"「你當我是小孩？」{ta}說，「我又不困。」{ta}戴上耳機，不理你了。","harin":"{ta}睡著前輕聲說：「到了叫我。」","yul":"「不用。」{ta}說，「我不習慣在別人旁邊睡。」"},"m":{"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"戴上眼罩睡覺，不打擾{ta}","a":-3,"h":-1,"r":{"yunhee":"{ta}一直偷看你，想跟你說話，可是你一直睡。","dohyun":"你醒來時，{ta}已經換了座位。","harin":"{ta}一個人看著窗外，看了一整趟飛行。","yul":"整趟飛行，你們沒有說一句話。下飛機時，{ta}先走了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"候機室的燈光很冷，椅子硬得坐不住。窗外的跑道上，飛機一架一架地起降，可是沒有一架是你的。\n\n你買了一杯咖啡，坐在靠窗的位置，打開電腦處理工作，處理到一半就放棄了。延誤讓人很難專心。\n\n對面坐下的那個人一直在打電話，聲音壓得很低，好像在跟誰道歉。掛掉電話後，那人嘆了很長一口氣，靠在椅背上，摘下了帽子。","after":{"dohyun":"飛機終於在凌晨起飛。你們在飛機上又聊了很久，聊到其他乘客都睡著了。\n\n降落前，{ta}突然說：「你在大阪待幾天？」\n\n「三天。」\n\n「我也是。」{ta}說，「第二天下午我沒有行程。」\n\n你看著{ta}。\n\n「我知道一家很好吃的章魚燒。」{ta}說，「當地人才知道的那種。」\n\n「你是在約我？」\n\n「不是。」{ta}說，「我是在推薦美食。」\n\n第二天下午，你們在大阪的小巷子裡吃章魚燒，燙到兩個人都在跳。\n\n{ta}笑得很開心：「這是我第一次在國外，不用當偶像。」","yul":"飛機終於起飛。你們在飛機上聊了一路，從合約聊到工作，從工作聊到各自喜歡的城市。\n\n降落前，{ta}問你住哪家飯店。你說了，{ta}點點頭，沒說什麼。\n\n隔天晚上，你在飯店大廳收到一個紙袋，裡面是一盒當地很難買的點心，和一張紙條：\n\n「昨晚延誤，你一直沒吃東西。」\n\n紙條下面寫著一個電話號碼，和一句話：「我在這邊待到後天。如果你想找人吃飯的話。」\n\n你打了那個電話。\n\n{ta}接起來的第一句是：「所以呢？你想吃什麼？」","yunhee":"飛機終於起飛了。{name}在飛機上睡得很熟，頭一點一點地，最後靠到了你的肩膀上。\n\n你不敢動。\n\n{ta}睡了兩個小時，醒來時發現自己靠在你肩上，整個人彈起來：「對、對不起！」\n\n「沒關係。」\n\n{ta}捂著臉：「好丟臉喔……我有流口水嗎？」\n\n「一點點。」\n\n「啊啊啊啊！」\n\n降落後，{ta}在出關的地方等你，硬塞給你一張環球影城的票：「經紀人多買了一張！你要去嗎！」\n\n你看著那張票，又看看{ta}期待的臉。","harin":"飛機起飛後，{name}一直在看窗外。夜晚的雲層下，城市的燈光一閃一閃的。\n\n「我很喜歡夜間飛行。」{ta}輕聲說，「好像在星星中間。」\n\n你們聊了很多。{ta}說起{ta}第一次坐飛機，是去日本錄第一張專輯，那時候{ta}緊張得一整晚沒睡。\n\n「現在呢？」\n\n「現在還是會緊張。」{ta}說，「可是今天，好像沒那麼緊張了。」\n\n降落前，{ta}在你的手心裡放了一顆糖。\n\n「降落的時候吃。」{ta}說，「耳朵比較不會痛。」\n\n那是一顆很普通的水果糖。你一直沒吃，帶回家放在桌上。"}}],"known":[{"id":"kno1","t":"練習生時期的同期","tm":"晚上 21:00","p":"你曾經是練習生。和{name}同一年進公司，一起熬過無數個練到凌晨的夜晚。\n\n後來你放棄了，換了一條路，成了{job}。{ta}出道了，越來越紅。你們的聯絡，就停在你離開那天。\n\n五年後的今天，你打開手機，看見一則訊息。","c":{"yunhee":"@msg 야!!! 나 기억해?? || 喂！！！你還記得我嗎？？\n@msg 우리 연습실 자판기 아직도 고장 나 있어 ㅋㅋ || 我們練習室的自動販賣機到現在還是壞的ㅋㅋ","dohyun":"@msg 야 살아있냐 || 喂，還活著嗎？\n@msg 네 자리 아직 비어 있어 || 你的位置還空著。","harin":"@msg 그때 못 한 말이 있어서요 || 那時候有句話沒說。\n@msg 시간 되면 만나요 || 有時間的話，見個面吧。","yul":"@msg 번호 안 바꿨네요 || 你沒換號碼。\n@msg 그래서? 이번 주 토요일 시간 돼요? || 所以呢？這週六有空嗎？"},"o":[{"t":"馬上回覆，說你一直有在看{ta}的舞臺","a":4,"h":0,"r":{"yunhee":"{ta}傳來一連串尖叫的貼圖：「真的嗎！！你都有看！！」","dohyun":"「當然要看。」{ta}回，「不看你會後悔。」","harin":"{ta}只回了一句：「謝謝你沒有忘記。」","yul":"「我知道。」{ta}說，「你在評論區留言的帳號，我認得。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"老實說你當初離開，是因為不甘心","a":3,"h":0,"r":{"yunhee":"{ta}很久才回：「……原來你那時候那麼難過。我都不知道。」之後好幾天都很安靜。","dohyun":"「我也是。」{ta}說，「不甘心你走。」","harin":"{ta}隔了很久才回：「那時候我想說的，就是這個。」","yul":"「不甘心是好事。」{ta}說，「至少你沒騙自己。」"},"m":{"yul":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"約{ta}去以前常去的那家小吃店","a":3,"h":0,"r":{"yunhee":"「好啊好啊！那家辣炒年糕！」","dohyun":"「那家倒了。」{ta}回，「你都沒在關心這裡的事吧。」","harin":"「……好。」{ta}說，可是沒有約時間。","yul":"「那家早就倒了。」{ta}說，「你離開得很徹底。」"},"m":{"yunhee":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"猶豫很久，只回了一個「嗯」","a":-3,"h":-1,"r":{"yunhee":"「就一個嗯？！」{ta}傳來生氣的貼圖，然後就不再傳了。","dohyun":"「嗯是什麼意思。」{ta}說，然後就再也沒傳了。","harin":"{ta}沒有再回。那句「那時候沒說的話」，就停在那裡了。","yul":"「我知道了。」{ta}只回了這句。之後那個號碼，再也沒有亮過。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你看著那兩行字，很久都沒動。\n\n練習生的那幾年，像一場很長很累的夢。你們每天早上九點進練習室，晚上十二點才離開，週末也不休息。月末評估的前一晚，所有人都在走廊上練到天亮。\n\n你記得{name}那時候的樣子：瘦，黑眼圈很重，跳舞的時候眼神很兇，下了練習卻會偷偷分你半個飯糰。\n\n你離開的那天，{ta}不在。{ta}去拍出道預告了。你們連一聲再見都沒說。","after":{"dohyun":"你們約在以前常去的那家小吃店。老闆還認得你們，一看到就笑：「哎喲，兩個小鬼長大了。」\n\n{ta}點了跟以前一模一樣的東西：兩份辣炒年糕、一份魚板、兩瓶汽水。\n\n「你還記得我們以前的口味？」你問。\n\n「當然。」{ta}說，「我常常一個人來點兩人份。」\n\n你愣住了。\n\n{ta}低頭吃東西，假裝沒說過那句話。\n\n吃完後，{ta}送你到地鐵站。\n\n「喂，」{ta}說，「你當初走的時候，我很生氣。」\n\n「我知道。」\n\n「現在不氣了。」{ta}說，「因為你現在過得很好。」","yul":"那個週六，你們在一家很安靜的西餐廳見面。{ta}比你早到，已經點好了菜。\n\n「我記得你不吃香菜。」{ta}說。\n\n你確實不吃。可是你不記得自己跟{ta}說過。\n\n「練習生的時候，」{ta}說，「你每次都把便當裡的香菜挑給我。」\n\n你們聊了很久。{ta}說起前團解散的事，說起那段很難熬的日子，語氣平靜得像在說別人的事。\n\n「那時候我常常想，」{ta}說，「如果你還在，會怎麼樣。」\n\n「會怎麼樣？」\n\n「大概會有人罵我。」{ta}說，「罵我不要放棄。」","yunhee":"你們約在以前練習室附近的那家咖啡廳。{ta}一看到你就衝過來，抱住你，抱了很久。\n\n「我好想你！」{ta}說，聲音有點哽咽。\n\n你們坐下來，聊了整整三個小時。{ta}跟你說出道後的每一件事：第一次上音樂節目、第一次拿一位、第一次被惡評罵哭。\n\n「每次難過的時候，」{ta}說，「我都會想，如果你在就好了。你一定會說：『哭什麼，明天繼續練。』」\n\n你笑了：「我以前那麼兇？」\n\n「超兇！」{ta}說，「可是我最喜歡你。」\n\n{ta}說完，好像意識到了什麼，慌張地補了一句：「作為朋友！」","harin":"你們約在以前練習室附近的一個小公園。{ta}坐在長椅上，看到你走過來，站了起來。\n\n你們站著看對方，誰都沒說話。\n\n最後是{ta}先開口：「那時候，我想跟你說的話是……」\n\n{ta}停住了。\n\n「是什麼？」\n\n「是『不要走』。」{ta}說，「可是我說不出口。因為我知道，你留下來會很痛苦。」\n\n你看著{ta}，很久沒說話。\n\n「現在，」{ta}說，「我想說另一句。」\n\n「什麼？」\n\n「歡迎回來。」{ta}說，「雖然你不是回來當練習生，是回來……當我的朋友。」"}},{"id":"kno2","t":"綜藝裡提到的名字","tm":"晚上 22:40","p":"大學時，你和{name}在同一個音樂社團。{ta}休學去當練習生，之後你們就斷了聯繫。\n\n今晚，你在家裡配著啤酒看綜藝。主持人問{name}：「學生時代有沒有印象最深刻的人？」\n\n{ta}想了想，說出了你的名字。\n\n你的手機在接下來半小時裡響個不停，朋友們瘋狂傳截圖。你還沒回過神來，一個陌生號碼打來電話。","c":{"yunhee":"「{me}！你看到了嗎？我是不是說得很好？」{ta}的聲音興奮得要命。","dohyun":"「喂，你看到了吧？」{ta}笑，「現在全國都知道你了。」","harin":"「我是不是給你添麻煩了？」{ta}的聲音很輕，「我說完才後悔。」","yul":"「節目組會把你的名字消音。」{ta}說，「我已經交代了。」"},"o":[{"t":"笑著說你被嚇到了，但很開心","a":4,"h":0,"r":{"yunhee":"「那就好！我一直怕你不記得我！」","dohyun":"「我就知道。」{ta}得意地說。","harin":"「那就好。」{ta}鬆了一口氣，「我想再見你一面。」","yul":"「開心就好。」{ta}說，「週末出來吃飯。」"},"m":{"harin":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"問{ta}為什麼會想到你","a":3,"h":1,"r":{"yunhee":"「因為你以前每天幫我佔社團的位子！」","dohyun":"「因為你以前很煩。」{ta}說完又補，「好吧，很難忘。」","harin":"「因為……你聽過我寫的第一首歌。」","yul":"「因為你是唯一敢跟我吵架的人。」"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[2,1,"good"],"yul":[6,1,"best"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"抱怨你的手機快被打爆了","a":2,"h":0,"r":{"yunhee":"「對不起……」{ta}的聲音一下子變得很小，「我以為你會開心。」","dohyun":"「那你換號碼啊。」{ta}冷笑，「我又不是故意要打擾你。」","harin":"「嗯。」{ta}說，「我等你。」可是你一直沒打回去。","yul":"「我會處理。」{ta}的語氣很冷，「打擾了。」"},"m":{"dohyun":[1,0],"harin":[-3,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-10,-3,"worst"]}},{"t":"冷靜地說現在不太方便，改天再聊","a":-3,"h":-1,"r":{"yunhee":"「……好吧。」{ta}的聲音很失落，「那我不打擾了。」","dohyun":"「喔。」{ta}掛了電話，五分鐘後，節目組發了消音聲明。","harin":"「對不起……」{ta}的聲音更小了，「我果然不該說的。」","yul":"「好。」{ta}說，「我不會再打來了。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那個綜藝你本來只是隨便開著當背景音。直到主持人問出那個問題，你才抬起頭。\n\n{name}想了很久。鏡頭給了{ta}一個特寫，{ta}的表情很認真，好像真的在回憶什麼。\n\n然後{ta}說出了你的名字，後面還加了一句：「那個人是我在社團的時候，唯一一個跟我說『你可以的』的人。」\n\n你手裡的啤酒差點掉下來。\n\n你想起來了。大一那年，社團的公演，{ta}緊張得在後臺發抖，是你在旁邊說了一句：「你可以的。」\n\n你從來沒想過，{ta}會記得。","after":{"dohyun":"那通電話後來聊了一個多小時。{ta}講了很多社團時候的事，講到你們一起被學長罵、一起偷吃公演的便當、一起在練習室的地板上睡著。\n\n「你知道嗎，」{ta}說，「我休學那天，你在社團的留言板上寫了一句話。」\n\n「我寫了什麼？」\n\n「『去吧，紅了記得請客』。」{ta}說，「所以我現在打來，是要請客。」\n\n你笑出聲。\n\n「這週末？」{ta}說，「我知道一家很好吃的烤肉。不準拒絕，這是你自己寫的。」","yul":"電話那頭，{ta}一直很冷靜，冷靜地道歉，冷靜地說明節目組會怎麼處理，冷靜地問你需不需要律師。\n\n最後，{ta}停了一下：「其實我是故意說的。」\n\n「什麼？」\n\n「說出你的名字。」{ta}說，「我找你很久了。社團解散後，所有人都失聯了。我想，如果在電視上說出來，你也許會看到。」\n\n你不知道該說什麼。\n\n「這個方法很笨。」{ta}說，「我知道。可是有用。」\n\n「那你找到我之後，想做什麼？」\n\n「想當面說謝謝。」{ta}說，「順便吃個飯。」","yunhee":"那通電話聊到半夜。{ta}興奮地講著社團的回憶，講到激動處就尖叫，你不得不把手機拿遠一點。\n\n「你還記得嗎！公演那天我忘詞，你在臺下用口型提醒我！」\n\n你不記得了。可是{ta}講得那麼生動，你好像也想起來了一點。\n\n「所以我在節目上說的是真心的。」{ta}說，「你是我的恩人！」\n\n「太誇張了。」\n\n「一點都不誇張！」{ta}說，「我要請你吃飯！吃一百次！」\n\n掛掉電話前，{ta}的聲音突然變小了：「其實……我一直很想再見你。」","harin":"那通電話後來變得很安靜。你們都不太知道該說什麼，可是誰都沒有掛。\n\n最後，{ta}輕聲說：「你記得那首歌嗎？我在社團寫的第一首。」\n\n你記得。那首歌沒有名字，{ta}只在社團的練習室裡彈過一次，彈完就說太丟臉了，再也不彈了。\n\n「我後來把它寫完了。」{ta}說，「下一張專輯會收錄。」\n\n「叫什麼名字？」\n\n{ta}停了很久：「叫〈你可以的〉。」\n\n你握著手機，說不出話。\n\n「我想第一個彈給你聽。」{ta}說，「可以嗎？」"}},{"id":"kno3","t":"留在舊家的東西","tm":"下午 15:00","p":"你要搬家了。整理儲藏室時，你翻到一個紙箱，上面用馬克筆寫著「{name}的東西」。\n\n那是好幾年前的事了。你們住在同一棟舊公寓的對門，{ta}還是練習生，常常練到半夜才回來。後來{ta}出道搬走，留下這箱東西，說下次來拿，就再也沒來過。\n\n箱子裡有幾件舊衣服、一箇舊耳機、還有一本寫滿字的筆記本。\n\n你猶豫了很久，用舊號碼傳了一則訊息。沒想到，三分鐘後就有回覆。","c":{"yunhee":"@msg 헐 대박!! 그거 내 보물인데!! || 天啊大發！！那是我的寶貝！！","dohyun":"@msg 그거 아직도 있어? ㅋㅋㅋ || 那個還在？ㅋㅋㅋ\n@msg 노트는 읽지 마라 || 筆記本不準看。","harin":"@msg 그 노트… 혹시 읽었어요? || 那本筆記……你看了嗎？","yul":"@msg 내가 갈게요 || 我過去。\n@msg 주소 그대로죠? || 地址沒變吧？"},"o":[{"t":"說你沒看筆記本，約時間還給{ta}","a":4,"h":0,"r":{"yunhee":"「你好有原則！我好感動！」","dohyun":"「真的沒看？」{ta}半信半疑，「那我親自去確認。」","harin":"「謝謝。」{ta}停了停，「其實……你看了也沒關係。」","yul":"「我信你。」{ta}說，「明天下午三點。」"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"老實說你不小心看到第一頁","a":3,"h":1,"r":{"yunhee":"「啊啊啊啊！好丟臉！」","dohyun":"「我就知道。」{ta}說，「你要負責。」","harin":"{ta}很久才回：「第一頁寫的，是關於你的。」","yul":"「誠實。」{ta}說，「那頁是我的計劃。現在都做到了。」"},"m":{"dohyun":[2,0],"harin":[2,1]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"拍一張舊耳機的照片傳給{ta}","a":3,"h":0,"r":{"yunhee":"「嗚嗚那是我的寶貝……」{ta}說，「可是你拍得好模糊喔。」","dohyun":"「喔。」{ta}只回了一個字。好像那個耳機，對{ta}來說一點都不重要。","harin":"「謝謝。」{ta}說。沒有再問筆記本的事。","yul":"「我要的是筆記本。」{ta}說，「耳機不重要。」"},"m":{},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"說你可以直接寄給{ta}的公司","a":-3,"h":-1,"r":{"yunhee":"「不要寄啦……」{ta}說，可是你堅持，{ta}就不說話了。","dohyun":"「寄？」{ta}說，「你連見我一面都不想？」","harin":"「……好。」{ta}說，「謝謝你幫我保管這麼久。」像在道別。","yul":"「好。」{ta}說，「地址我讓助理給你。」語氣像在處理一件公事。"},"m":{"yunhee":[-2,0],"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那棟舊公寓是你大學畢業後住的第一個地方。房租便宜，隔音很差，每天晚上都能聽見對門的人回來時，鑰匙在鎖孔裡轉動的聲音。\n\n那時候的{name}還是練習生。{ta}常常凌晨兩三點才回來，有幾次在樓梯間撞見你，兩個人都累得只能點頭。\n\n後來有一次，{ta}的鑰匙斷在鎖孔裡，在門口坐了一整夜。你早上出門時發現，就把{ta}拉進你家，煮了一碗泡麵。\n\n那之後，你們就熟了。","after":{"dohyun":"隔天下午，{ta}真的來了。戴著帽子和口罩，站在你新家的門口，四處張望。\n\n「你搬到這麼遠？」{ta}說，「我找了半天。」\n\n你把紙箱交給{ta}。{ta}打開，第一個拿出來的就是那本筆記本，翻都沒翻，直接塞進揹包。\n\n「真的沒看？」\n\n「只看了第一頁。」\n\n{ta}瞪著你，然後嘆了一口氣：「算了。反正你遲早會知道。」\n\n「知道什麼？」\n\n{ta}沒回答，只是拿起那個舊耳機，戴上，按了幾下：「還能用。」\n\n臨走前，{ta}在門口回頭：「喂，你新家有泡麵嗎？」","yul":"隔天下午三點，{ta}準時出現在你家門口。\n\n{ta}打開紙箱，一件一件檢查，最後拿起那本筆記本，翻開第一頁，看了很久。\n\n「這是我十九歲寫的。」{ta}說，「五年計劃。」\n\n你看了一眼。第一行寫著：「出道。」第二行：「拿一位。」第三行：「不要再讓任何人失望。」\n\n「都做到了？」你問。\n\n「前兩個做到了。」{ta}說，「第三個……沒有。前團解散的時候，我讓很多人失望了。」\n\n{ta}合上筆記本，看著你：「包括你。那時候我搬走，連一句話都沒說。」","yunhee":"隔天，{ta}來拿東西的時候，帶了一大袋水果和一盒蛋糕。\n\n「謝謝你幫我保管這麼多年！」{ta}說。\n\n{ta}打開紙箱，看到那些舊衣服就笑：「好醜喔！我那時候怎麼會穿這個！」\n\n看到那個舊耳機，{ta}安靜下來。\n\n「這個，」{ta}說，「是我打工三個月買的。那時候我好窮，每天只吃一頓飯。」\n\n「我記得。」你說，「你常常來我家蹭飯。」\n\n{ta}看著你，眼眶紅了：「你那時候對我好好。我一直都記得。」\n\n{ta}抱著那個紙箱，在你家坐到天黑。","harin":"隔天，{ta}來拿東西。{ta}站在你的新家門口，看了很久，才敲門。\n\n你把紙箱交給{ta}。{ta}沒有馬上打開，只是抱著。\n\n「那本筆記本，」{ta}說，「第一頁寫的是什麼，你還記得嗎？」\n\n你記得。那頁只有一行字：「如果有一天我寫出一首好歌，第一個要給對門的人聽。」\n\n「我那時候不敢跟你說。」{ta}說，「後來搬走了，就更不敢了。」\n\n你沒有說話。\n\n{ta}從包裡拿出一張CD，放在你手裡：「這是我的第一張專輯。晚了好幾年。對不起。」"}},{"id":"kno4","t":"出道前打工的店","tm":"晚上 20:30","p":"你大學時在一家炸雞店打工。那時候店裡有個同事，總是邊炸雞邊練發聲，被老闆罵了無數次。\n\n那個同事，就是現在的{name}。\n\n炸雞店要收了。老闆在群組裡說，最後一天，大家回來吃一頓。\n\n你推開店門，裡面只有老闆和一個戴帽子的人，正在幫忙擦桌子。","c":{"yunhee":"{name}丟下抹布撲過來：「{me}！你終於來了！我們最佳搭檔！」","dohyun":"{name}吹了聲口哨：「喲，你還是那麼慢。」","harin":"{name}安靜地對你笑了笑，把一張椅子拉出來給你。","yul":"{name}說：「老闆說你會遲到十分鐘。你遲到了十二分鐘。」"},"o":[{"t":"穿上舊圍裙，跟{ta}一起炸最後一鍋雞","a":4,"h":1,"r":{"yunhee":"{ta}在旁邊邊唱邊炸，跟以前一模一樣。","dohyun":"「我們比誰炸得快。」{ta}勝負欲又上來了。","harin":"{ta}在你旁邊，輕輕哼起那時候常練的那首歌。","yul":"「火候不對。」{ta}接過你的夾子，「我來。」"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[6,1,"best"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"跟老闆和{ta}聊以前的糗事","a":3,"h":0,"r":{"yunhee":"{ta}笑到趴在桌上。","dohyun":"「那次是你的錯！」{ta}跟你吵了半天。","harin":"{ta}被你說的糗事弄得很尷尬，臉紅了，後來就不太說話了。","yul":"「糗事沒什麼好聊的。」{ta}說，「過去就是過去。」"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[-4,-1,"bad"]}},{"t":"問{ta}現在當偶像，開不開心","a":3,"h":0,"r":{"yunhee":"{ta}愣了一下，笑得有點勉強：「開心……當然開心啊。」","dohyun":"「開心啊。」{ta}說，語氣突然很衝，「幹嘛問這個？」","harin":"「有時候。」{ta}輕聲說，「你是第一個問我這個的人。」","yul":"「開心不是重點。」{ta}說，「重點是我做到了。」"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[6,0,"best"]}},{"t":"跟老闆聊，沒怎麼理{ta}","a":-3,"h":-1,"r":{"yunhee":"「你都不理我！」{ta}抗議，你還是沒理。{ta}就安靜了。","dohyun":"{ta}在你背後偷吃你的炸雞，你都沒發現。最後{ta}也懶得逗你了。","harin":"{ta}一直在聽你們說話，可是你一次都沒有轉頭看{ta}。","yul":"{ta}跟老闆談完事情，就先走了。經過你身邊時，沒有停下來。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那家炸雞店在大學後門的巷子裡，招牌是手寫的，油煙燻得有點發黃。你大學四年，有兩年都在這裡打工。\n\n那時候的{name}還是個瘦瘦的練習生，每天下午來打工三個小時，然後趕去公司練習。{ta}炸雞的時候會偷偷練發聲，被老闆罵了無數次，可是從來沒改過。\n\n有一次，{ta}在炸雞的時候唱了一整首歌。整間店的客人都安靜下來聽，唱完後有人鼓掌。老闆罵{ta}，可是那天給了{ta}加薪。","after":{"dohyun":"那天你們待到很晚。老闆拿出珍藏的燒酒，三個人喝到半醉，講了很多以前的事。\n\n老闆說，{ta}剛來的時候瘦得像竹竿，每天偷吃炸雞皮；說你那時候總是遲到，可是永遠會多留一份炸雞給{ta}。\n\n「我都知道。」老闆說，「你們兩個，那時候就很好。」\n\n離開時，你們站在店門口，看著老闆把招牌取下來。\n\n「結束了。」{ta}說。\n\n「嗯。」\n\n「可是，」{ta}轉頭看你，「我們不會結束吧？」\n\n你沒聽懂。{ta}卻已經轉身走了，留下一句：「下週，我請你吃別家的炸雞。」","yul":"那天老闆做了最後一鍋炸雞。三個人坐在空蕩蕩的店裡，吃著、喝著、聊著。\n\n老闆問{ta}現在過得怎麼樣。{ta}說很好。\n\n「騙人。」老闆說，「你從小說謊就會摸耳朵。」\n\n{ta}的手停在耳朵旁邊。\n\n後來老闆去廚房收拾，只剩你們兩個。{ta}看著窗外，很久才說：「其實不太好。前團解散後，我一直在想，我到底是為了什麼在做這些。」\n\n「現在想到了嗎？」\n\n「還沒。」{ta}說，「但今天回到這裡，好像想起了一點。」\n\n{ta}看著你：「想起那時候，有人每天留一份炸雞給我。」","yunhee":"那天你們在店裡待到半夜。老闆放了很老的歌，{ta}拉著你在空蕩蕩的店裡跳舞，跳得亂七八糟。\n\n「我們以前打烊後都這樣！」{ta}說，「你忘了嗎！」\n\n你沒忘。那時候你們打烊後，會把椅子推到牆邊，在油膩的地板上跳舞，跳到老闆來趕人。\n\n後來{ta}累了，坐在地上，靠著牆。\n\n「我好捨不得。」{ta}說，「這裡是我最開心的地方。」\n\n你在{ta}旁邊坐下。\n\n{ta}把頭靠在你肩上：「可是還好，你還在。」","harin":"那天晚上，老闆說想聽{ta}唱歌，就像以前一樣。\n\n{ta}猶豫了很久，最後站在油鍋旁邊，清唱了一首。是{ta}以前常常在這裡練的那首歌。\n\n整間店很安靜。老闆閉著眼睛聽，聽到一半就哭了。\n\n唱完後，{ta}看著你：「我那時候每次唱，都是唱給你聽的。你知道嗎？」\n\n你不知道。\n\n「你那時候總是背對著我炸雞。」{ta}說，「可是我知道你在聽。因為你炸雞的節奏，會跟著我的歌。」\n\n你看著{ta}，突然說不出話來。"}},{"id":"kno5","t":"家庭聚會","tm":"中午 12:30","p":"你們兩家是世交。小時候過年過節都在一起，你和{name}從小一起長大，打打鬧鬧到中學。\n\n後來{ta}當了練習生，你們見面的次數越來越少。\n\n今年中秋，兩家又聚在一起。長輩們在客廳聊天，不知道誰開了個頭：「你們兩個小時候說要結婚的，還記得嗎？」\n\n滿屋子的人都笑了。你和{name}被趕到廚房，說是要一起準備水果。","c":{"yunhee":"{name}笑到停不下來：「天啊！那是我們五歲的時候吧！」","dohyun":"{name}靠著冰箱：「喂，你當真了？」","harin":"{name}低著頭洗葡萄：「我那時候……是認真的喔。五歲的那種認真。」","yul":"{name}把刀遞給你：「你削皮，我切。分工。」完全不接那個話題。"},"o":[{"t":"跟{ta}一起吐槽長輩們的玩笑","a":3,"h":0,"r":{"yunhee":"{ta}跟著你一起吐槽，吐槽著吐槽著，笑容慢慢淡了。","dohyun":"{ta}笑了兩聲，又安靜下來：「他們也沒那麼煩啦。」好像你說得太過分了。","harin":"{ta}沒有笑。「我……」{ta}說，「我那時候是認真的。」","yul":"「他們無聊。」{ta}說，「我們不用理。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"開玩笑說：「那時候是你先求婚的」","a":3,"h":2,"r":{"yunhee":"「才不是！你先的！」{ta}拿葡萄丟你。","dohyun":"「你記錯了。」{ta}說，「是你哭著要嫁給我。」","harin":"{ta}看了你一眼：「是你。我記得很清楚。」","yul":"「我沒有證據。」{ta}突然說，「你記錯了。」語氣冷了下來。"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[-4,-1,"bad"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"認真問{ta}這幾年過得好不好","a":4,"h":0,"r":{"yunhee":"{ta}說著說著有點哽咽，又笑著說沒事。","dohyun":"「好得很。」{ta}說，過了一會兒，「偶爾會累。」","harin":"「有你問，就好一點了。」","yul":"「好。」{ta}說，「現在問這個，很像你。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"專心切水果，迴避這個話題","a":-3,"h":-1,"r":{"yunhee":"{ta}一直偷看你，等你說點什麼。你沒有。{ta}的眼神慢慢暗下去。","dohyun":"{ta}站在你旁邊削蘋果，一直等你說話。你沒說。{ta}削完就走了。","harin":"{ta}似乎鬆了一口氣，可是那口氣裡，有一點難過。","yul":"「效率很好。」{ta}說，可是那盤水果切完後，{ta}就離開了廚房。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你們兩家的交情，從你們出生前就開始了。爸爸們是大學同學，媽媽們是同一個教會的朋友。你和{name}只差一歲，從小被放在一起養，一起洗澡、一起上幼兒園、一起被罰站。\n\n後來{ta}去當練習生，你們見面的次數一年比一年少。到了最近幾年，只有過年和中秋才見得到，見了面也只是點點頭，像是陌生的親戚。\n\n可是長輩們好像完全沒察覺這種生疏，依然像以前一樣，喜歡把你們湊在一起。","after":{"dohyun":"切完水果，你們被派去院子裡幫忙烤肉。{name}搶過夾子，說你烤的肉一定會焦。\n\n「你才會烤焦。」\n\n「我？我烤肉天下第一。」\n\n結果{ta}烤焦了三塊。你笑到蹲在地上，{ta}氣得用夾子夾你的袖子。\n\n那天晚上，長輩們喝多了，又開始講你們小時候的事。講到你們五歲那年說要結婚，{ta}突然站起來：\n\n「我去買飲料。」\n\n{ta}拉著你一起出門。走到巷口，{ta}停下來，背對著你：\n\n「喂，那件事……我不是開玩笑的。五歲的時候不是，現在也……」\n\n{ta}沒說完，就轉身走了。","yul":"切完水果，你們端著盤子回到客廳，長輩們又開始起鬨。\n\n{name}面不改色地放下盤子：「我們兩個都還有工作，沒時間想這些。」\n\n長輩們笑得更大聲了。\n\n後來，你在陽臺上透氣，{ta}走過來，遞給你一罐啤酒。\n\n「抱歉。」{ta}說，「他們每年都這樣。」\n\n「你剛剛處理得很好。」\n\n「我很擅長處理這種場面。」{ta}說，停了一下，「可是不擅長處理你。」\n\n你轉頭看{ta}。{ta}看著遠處，沒有看你。\n\n「紙條的事，」{ta}說，「我說有證據，是真的。我一直留著。」","yunhee":"切完水果，你們被長輩們趕去附近的超市買飲料。{name}一路上都在笑，笑你們小時候的糗事，笑長輩們的玩笑。\n\n「你記得嗎！」{ta}說，「我們五歲的時候，還在院子裡辦過婚禮！你穿我媽的高跟鞋，摔了好幾次！」\n\n「是你穿的。」\n\n「不是！是你！」\n\n你們在超市裡吵了一路，吵到收銀員都在偷笑。\n\n回去的路上，{ta}突然安靜下來。\n\n「其實，」{ta}說，「我那時候是認真的。」\n\n「什麼？」\n\n「沒什麼！」{ta}說，跑到前面去了。","harin":"切完水果，你們一起把盤子端出去。長輩們還在聊，沒人注意到你們。\n\n{name}拉著你的袖子，小聲說：「我們出去走走？」\n\n你們沿著小時候常走的那條河堤散步。中秋的月亮很圓，河面上全是月光。\n\n「你還記得這裡嗎？」{ta}問，「我們小時候在這裡放過河燈。」\n\n你記得。你們各寫了一個願望，放進河燈裡，看著它們漂走。\n\n「你那時候寫了什麼？」你問。\n\n{ta}停下腳步，看著河面：「我寫的是：希望長大以後，還可以跟你一起看月亮。」\n\n{ta}轉頭看你，笑了：「實現了呢。」"}}]},"friend":[{"id":"f1","t":"練習後的辣炒年糕","d":3,"tm":"深夜 23:10","p":"那天之後，你們交換了聯繫方式。訊息不多，偶爾幾句，都是很普通的問候。\n\n今晚十一點，手機亮了。","c":{"yunhee":"@msg 배고파 죽겠어용 ㅠㅠ || 餓死了嗚嗚\n@msg 떡볶이 먹으러 갈래?? || 要不要去吃辣炒年糕？？","dohyun":"@msg 나와 || 出來。\n@msg 떡볶이. 내가 쏨 || 辣炒年糕，我請。","harin":"@msg 오늘 비 와서, 따뜻한 거 먹고 싶어요 || 今天下雨，想吃熱的東西。\n@msg 같이 갈래요? || 要一起去嗎？","yul":"@msg 30분 뒤 회사 앞 포장마차 || 三十分鐘後，公司前面的路邊攤。\n@msg 올 거죠? || 會來吧？"},"o":[{"t":"馬上答應，換衣服出門","a":4,"h":0,"r":{"yunhee":"{ta}一看到你就揮手，嘴裡已經塞滿年糕：「我先吃了！對不起！」","dohyun":"「慢死了。」{ta}說，卻把最大塊的年糕推到你那邊。","harin":"{ta}坐在最裡面，帽子壓得很低，看見你才露出一點笑。","yul":"「準時。」{ta}說，已經幫你倒好了一杯水。"},"m":{"yul":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"說你已經吃過了，但可以陪{ta}聊天","a":3,"h":0,"r":{"yunhee":"「那你看我吃！」{ta}吃得超級開心。","dohyun":"「吃過了也給我吃。」{ta}硬塞一塊到你嘴裡。","harin":"「那我們慢慢吃，慢慢聊。」","yul":"「陪我？好。」{ta}說，「那你說說你今天的工作。」"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"提議找一家更隱密的店，怕{ta}被認出來","a":3,"h":0,"r":{"yunhee":"@msg 아… 그렇네… || 啊……也是……\n{ta}來了，可是一直東張西望，吃得很不開心。","dohyun":"@msg 왜 이렇게 겁이 많아 || 你怎麼這麼膽小。\n{ta}最後還是來了那家路邊攤，可是一整晚都在滑手機。","harin":"@msg 네… 제가 생각이 짧았네요 || 嗯……是我想得太簡單了。\n{ta}那天沒有來。","yul":"@msg 내가 고른 데가 안전하다고 했잖아요 || 我說過我選的店很安全。\n@msg 날 못 믿어요? || 你不相信我？"},"m":{"harin":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"說今天太累了，改天","a":-3,"h":-1,"r":{"yunhee":"@msg 힝 ㅠㅠ || 哼嗚嗚\n{ta}隔天又約了一次，你又拒絕了。之後{ta}就不太約你了。","dohyun":"@msg ㅇㅋ || OK。\n那之後一個星期，{ta}都沒有再約你。","harin":"@msg 네 || 好。\n{ta}沒有再傳訊息。下雨的晚上，你的手機很安靜。","yul":"@msg 알겠어요 || 知道了。\n那之後，{ta}的訊息變得很公事公辦。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你看著那則訊息，猶豫了幾秒。\n\n已經十一點了。你剛洗完澡，頭髮還是溼的，明天還要上班。理智告訴你應該回一句「改天吧」，然後睡覺。\n\n可是你想起那天的{ta}，想起{ta}說話時的樣子。那是你第一次覺得，屏幕裡那個人，也是一個會餓、會累、會想找人吃宵夜的普通人。\n\n你的手指停在鍵盤上。","after":{"dohyun":"那天之後，凌晨的宵夜變成了你們的固定行程。\n\n{ta}練習結束，就會傳一句「出來」。有時候是辣炒年糕，有時候是豬腳，有時候只是便利商店的三角飯糰。\n\n{ta}吃東西很快，像在跟誰比賽。吃完了就靠在椅子上，跟你抱怨今天被隊長罵了幾次、被編舞老師罰跳了幾遍。\n\n「你為什麼不跟隊友去吃？」你有一次問。\n\n「他們吵死了。」{ta}說，然後又補了一句，「跟你吃比較安靜。」\n\n你說你明明也很吵。\n\n{ta}看了你一眼：「你是安靜的吵。不一樣。」\n\n你不懂那是什麼意思。但你記住了那句話。","yul":"那天之後，{ta}偶爾會在深夜約你。不是每天，一個星期一兩次，時間地點都寫得很精確。\n\n你們會在路邊攤坐半個小時，聊一些很普通的事。{ta}的工作、你的工作、最近看的書、最近吃到的好東西。\n\n{ta}很少說自己的事。可是有一次，{ta}喝了兩杯燒酒，突然說：\n\n「我以前很討厭一個人吃飯。前團解散後，有一整年都是一個人。」\n\n「現在呢？」\n\n「現在，」{ta}說，「一個星期有兩天不用一個人。」\n\n{ta}說完就低頭喝湯，好像什麼都沒說過。\n\n你也低頭，假裝沒聽見。","yunhee":"那天之後，{ta}幾乎每天都會傳訊息給你。早上是「早安！」配一張練習室的自拍，中午是「你吃什麼！」配{ta}的午餐，晚上是「好累喔」配一個癱倒的貼圖。\n\n你有時候回，有時候忙到忘記回。{ta}也不在意，隔天照樣傳。\n\n有一次，你一整天都沒回。晚上十點，{ta}傳來一則：\n\n@msg 혹시 무슨 일 있어?? || 你是不是出什麼事了？？\n\n你解釋說只是工作太忙。{ta}馬上回了一個大大的笑臉：\n\n@msg 다행이다!! 걱정했잖아 || 太好了！！害我擔心死了。\n\n你看著那句「擔心」，看了很久。","harin":"那天之後，{ta}偶爾會在下雨的晚上傳訊息。\n\n不是每次都約你出去。有時候只是一張窗外的照片，配一句：「下雨了。」有時候是一段幾秒鐘的錄音，是{ta}隨手哼的旋律。\n\n你學會了在下雨的晚上，把手機放在枕頭旁邊。\n\n有一次，你問{ta}：「為什麼都是下雨天？」\n\n{ta}隔了很久才回：\n\n@msg 비 오는 날엔 혼자 있는 게 조금 더 외로워서요 || 因為下雨天，一個人會更寂寞一點。\n@msg 그리고… 당신 고양이가 비를 좋아한다고 해서 || 還有……因為你說你的貓喜歡雨。"}},{"id":"f2","t":"{mate}的生日","d":4,"tm":"晚上 20:00","p":"{name}說，{mate}生日，要在常去的一間烤肉店包廂辦一場小派對，問你要不要來。\n\n「人不多，都是自己人。」{ta}說，「{mate}說想見見你。」\n\n你到的時候，包廂裡已經很熱鬧。{mate}一看到你就大喊：「就是你啊！{name}最近手機都不離手，原來是在跟你聊天！」\n\n全場起鬨。","c":{"yunhee":"{name}跳起來去捂{mate}的嘴：「不要亂講啦！」笑得耳朵都紅了。","dohyun":"{name}踹了{mate}一腳：「閉嘴。」然後若無其事地坐到你旁邊。","harin":"{name}低下頭，小聲說：「對不起，他們……我沒有那樣說過。」","yul":"{name}淡淡地說：「我是在談工作。」{mate}笑得更大聲了。"},"o":[{"t":"大方地跟{mate}打招呼，送上你準備的禮物","a":4,"h":0,"r":{"yunhee":"「你準備了禮物！」{ta}比{mate}還開心。","dohyun":"「你還準備禮物？」{ta}有點吃味，「我生日你也要送。」","harin":"{ta}看著你跟大家相處得很好，鬆了一口氣。","yul":"「禮物選得不錯。」{ta}說，「你很會做功課。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"開玩笑反擊：「是{ta}一直在煩我」","a":3,"h":1,"r":{"yunhee":"「喂！你怎麼出賣我！」{ta}笑著打你。","dohyun":"「你說什麼？」{ta}瞪你，大家笑得更兇了。","harin":"{ta}瞪大眼睛，然後笑出聲來。","yul":"「我只是效率高。」{ta}說，大家又起鬨了一輪。"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[6,1,"best"],"harin":[2,1,"good"]}},{"t":"幫{name}解圍，說你們只是朋友","a":2,"h":0,"r":{"yunhee":"「對……好朋友。」{ta}的笑容僵了一下，後來就一直跟成員們待在一起。","dohyun":"「對啊，朋友。」{ta}說，語氣很衝。整晚都沒再跟你坐在一起。","harin":"{ta}點點頭，可是那一晚，{ta}都坐在離你最遠的地方。","yul":"「對。」{ta}說，「只是朋友。」說完就不再看你了。"},"m":{"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"被起鬨太尷尬，找藉口先去洗手間","a":-3,"h":-1,"r":{"yunhee":"{ta}追出來找你，你說你要先走。{ta}站在走廊上，很久都沒回包廂。","dohyun":"你回來時，{ta}已經坐到了包廂的另一頭，一眼都沒看你。","harin":"{ta}傳訊息問你還好嗎，你沒回。{ta}後來也提早離開了。","yul":"你回來時，{ta}已經在跟別人說話。你們一整晚都沒有再交談。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你在派對開始前一個小時就到了附近，在一家小店挑禮物。挑了很久，最後選了一個{mate}在綜藝裡提過很想要的東西。\n\n結帳時，你突然有點緊張。那是{name}的朋友，是{ta}生活裡很重要的人。你不知道他們會怎麼看你，會不會覺得你是那種想借機接近偶像的人。\n\n你在包廂門口站了一會兒，深呼吸，才推開門。","after":{"dohyun":"派對後半，大家都喝開了。{mate}拉著你，非要你說你跟{name}到底是怎麼認識的。\n\n你說了。{mate}聽完，拍著桌子大笑：「我就說嘛！他最近手機都不離手！」\n\n{name}在旁邊，臉紅到脖子：「閉嘴！」\n\n後來{ta}被灌了好幾杯，靠在沙發上，眯著眼睛看你。\n\n「他們很喜歡你。」{ta}說，口齒有點不清，「我看得出來。」\n\n「那你呢？」你半開玩笑。\n\n{ta}看著你，過了很久，才說：「我比他們更早喜歡你。……當朋友。」\n\n{ta}說完就閉上眼睛裝睡。你看見{ta}的耳朵紅了。","yul":"派對快結束時，{mate}把你拉到一邊。\n\n「我認識他很多年了。」{mate}說，「前團解散後，他有一年幾乎不跟任何人說話。」\n\n你看向{name}。{ta}正在跟另一個朋友說話，表情很放鬆。\n\n「這陣子，」{mate}說，「他變了很多。會笑了，會主動約人了。我們都在猜是誰。」\n\n你沒有說話。\n\n「我不知道你們是什麼關係，」{mate}說，「但謝謝你。」\n\n那天晚上回家後，你收到{ta}的訊息：\n\n@msg 민준이가 이상한 말 했죠? || 敏俊是不是說了什麼奇怪的話？\n@msg …다 사실이에요 || ……都是真的。","yunhee":"那天派對，{name}的成員們輪流來跟你聊天。{mate}問你的工作，娜妍問你的星座，書雅害羞地問你可不可以加好友。\n\n{name}一直在旁邊緊張地盯著，好像怕她們說錯什麼。\n\n後來大家玩遊戲，你和{name}被分在同一組。你們配合得很好，贏了三局。\n\n「你們好有默契喔～」{mate}故意拉長聲音。\n\n{name}瞪了她一眼，可是嘴角一直在笑。\n\n散場時，{mate}偷偷跟你說：「允熙很少帶朋友來見我們。你是第一個。」\n\n你回頭看{name}。{ta}正在跟你揮手，笑得很燦爛。","harin":"派對的人比{ta}說的多。{name}一直坐在角落，偶爾跟人說兩句話，大部分時間都在安靜地聽。\n\n你坐到{ta}旁邊。{ta}看了你一眼，輕輕鬆了一口氣。\n\n「人好多。」{ta}小聲說。\n\n「要出去透透氣嗎？」\n\n{ta}搖頭：「我答應了 Jay 哥要待到切蛋糕。」\n\n於是你們一起坐在角落，看著大家鬧。偶爾有人來起鬨，你就幫{ta}擋掉。\n\n切完蛋糕後，{ta}拉著你的袖子，從後門溜了出去。\n\n外面的空氣很涼。{ta}深吸了一口氣：「謝謝你。今天如果沒有你，我撐不下來。」"}},
