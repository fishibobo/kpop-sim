{"id":"f3","t":"感冒的那一天","d":3,"tm":"下午 14:30","p":"換季，你感冒了，請了病假，在家裹著棉被髮燒。\n\n你在社群發了一張退燒藥的照片，沒寫什麼。\n\n一個小時後，門鈴響了。你拖著身體去開門，門外沒有人，只有一個塑膠袋掛在門把上：退燒貼、運動飲料、一盒粥，還有一張便利貼。\n\n然後，手機震了一下。","c":{"yunhee":"@msg 아프지 마용 ㅠㅠ 죽 꼭 먹어!! || 不要生病嗚嗚，粥一定要吃！！\n@msg 스케줄 끝나고 전화할게 || 行程結束後打給你。","dohyun":"@msg 바보냐 감기 걸리고 || 笨蛋嗎？還感冒。\n@msg 약 먹고 자 || 吃藥，睡覺。","harin":"@msg 따뜻한 물 많이 마셔요 || 多喝溫水。\n@msg 노래 하나 보냈어요. 자기 전에 들어요 || 傳了一首歌給你，睡前聽。","yul":"@msg 매니저 시켜서 보냈어요 || 叫助理送過去的。\n@msg 열 몇 도예요? 정확하게 || 燒到幾度？說準確一點。"},"o":[{"t":"拍照傳給{ta}，認真道謝","a":3,"h":0,"r":{"yunhee":"{ta}回了一大串愛心貼圖：「快點好起來！」","dohyun":"「謝什麼，快好起來，下次請我吃飯。」","harin":"「不用謝。你好起來就好。」","yul":"「不用謝。告訴我溫度。」"},"m":{},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"撒嬌說好難受，希望有人陪","a":2,"h":1,"r":{"yunhee":"「嗚嗚我也想去！可是在拍攝……」{ta}打了視訊過來，陪你十分鐘。","dohyun":"「我又不是你男朋友。」{ta}說，「你找別人陪。」","harin":"「我不能去……對不起。」{ta}說，「我唱歌給你聽好不好。」","yul":"「我知道你可以。」{ta}說，「那以後我不費心了。」"},"m":{"yul":[-3,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-10,-3,"worst"],"yunhee":[2,1,"good"],"harin":[2,1,"good"]}},{"t":"說{ta}不用這麼費心，你自己可以的","a":2,"h":0,"r":{"yunhee":"「喔……好。」{ta}說，「那我不打擾你了。」然後就沒再傳訊息。","dohyun":"「誰費心了，順路而已。」","harin":"「嗯。」{ta}說，「對不起，是我多事了。」","yul":"「我知道你可以。」{ta}說，「但這樣比較快。」"},"m":{"dohyun":[1,0],"yunhee":[-2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吃完藥就睡，忘了回{ta}訊息","a":-3,"h":-1,"r":{"yunhee":"你醒來時，有二十幾則未讀訊息。最後一則是：「我是不是很煩……」","dohyun":"你醒來時，看見{ta}的訊息：「死了嗎？」以及一則：「算了，隨便你。」","harin":"你醒來時，{ta}只傳了一首歌。沒有再說別的話。","yul":"「我很忙。」{ta}回，「下次生病，叫外賣就好。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-4,-1,"bad"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你昏昏沉沉地睡了一整個上午。醒來時，頭還是很痛，喉嚨像吞了砂紙。\n\n冰箱裡只剩一罐過期的牛奶。你想叫外賣，可是連拿手機的力氣都沒有。\n\n你躺在床上，看著天花板，突然覺得很孤單。一個人住的壞處，就是生病的時候，連一杯水都要自己倒。\n\n你隨手拍了一張退燒藥的照片發到社群上，沒寫什麼。也不知道想給誰看。","after":{"dohyun":"那天晚上，你的燒退了一點。你坐起來，吃了那碗粥，是你最喜歡的那家店的南瓜粥。\n\n你不記得自己跟{ta}說過喜歡這家。\n\n十點多，{ta}打了視訊過來。畫面裡的{ta}剛洗完澡，頭髮溼溼的。\n\n「還活著？」{ta}問。\n\n「還活著。」\n\n「粥吃了？」\n\n「吃了。你怎麼知道我喜歡那家？」\n\n{ta}別開視線：「你上次在社群發過。三個月前。」\n\n你愣住了。三個月前，你們根本還不認識。\n\n{ta}好像也意識到說漏了嘴，馬上轉移話題：「快睡覺。我要掛了。」\n\n視訊斷了。你看著黑掉的屏幕，心跳快得不像在發燒。","yul":"那天下午，你的門鈴又響了。是{ta}的助理，提著一個保溫壺。\n\n「律哥煮的。」助理說，「他說一定要趁熱喝。」\n\n保溫壺裡是一碗雞湯，燉得很濃，上面浮著幾片姜。\n\n你喝完了一整碗。\n\n晚上，你傳訊息道謝。{ta}很快回了：\n\n@msg 열은요? || 燒呢？\n@msg 37.8도요 || 37.8度。\n@msg 내일 아침에 다시 알려줘요 || 明天早上再告訴我。\n@msg 38도 넘으면 병원 데려갈 거예요 || 超過38度的話，我會帶你去醫院。\n\n你看著最後那句，笑了。明明是命令的語氣，卻讓你覺得很安心。","yunhee":"那天晚上，{ta}真的在行程結束後打電話來了。\n\n「你有沒有吃藥？有沒有喝水？有沒有蓋好被子？」{ta}一口氣問了十幾個問題。\n\n你一一回答。{ta}才放心地嘆了一口氣。\n\n「我好想去看你喔……」{ta}說，「可是經紀人說不行。」\n\n「我沒事。」\n\n「你有事！你聲音都啞了！」{ta}說，「我唱歌給你聽，你快點睡。」\n\n{ta}真的唱了。是一首很溫柔的搖籃曲，{ta}唱得很輕，像怕吵醒你。\n\n你聽著聽著就睡著了。醒來時，通話已經結束了。手機裡有一則訊息：\n\n@msg 잘 자. 내일은 꼭 나아 있어야 해 || 晚安。明天一定要好起來。","harin":"那天晚上，你戴著耳機聽{ta}傳來的那首歌。\n\n是一首你沒聽過的歌，只有鋼琴和{ta}的聲音。歌詞很簡單，說的是一個人在下雨天生病，窗外有一隻貓在等雨停。\n\n你聽了三遍，才發現那首歌只有你一個人聽過。\n\n你傳訊息問{ta}：「這首歌叫什麼名字？」\n\n{ta}隔了很久才回：\n\n@msg 아직 제목이 없어요 || 還沒有名字。\n@msg 오늘 당신 생각하면서 쓴 거라서 || 因為是今天想著你寫的。\n@msg 빨리 나아요. 그래야 제목을 붙일 수 있을 것 같아요 || 快點好起來。好像那樣，我才能為它取名字。"}},{"id":"f4","t":"打歌錄影的真實意見","d":4,"tm":"晚上 21:30","p":"{name}的新歌打歌期開始了。\n\n今晚，{ta}傳來一段還沒公開的彩排影片，附上一句話：「說實話。不要用粉絲的角度。」\n\n你看了三次。舞臺很好，但你注意到一個地方：副歌之前，{ta}的表情好像有一瞬間出神了。","c":{"yunhee":"@msg 어때어때?? 솔직하게!! || 怎麼樣怎麼樣？？老實說！！","dohyun":"@msg 별로면 별로라고 해 || 不好就說不好。\n@msg 근데 별로일 리 없음 ㅋ || 不過不可能不好ㅋ","harin":"@msg 저는 제 무대를 잘 못 봐요 || 我不太敢看自己的舞臺。\n@msg 대신 봐줄래요? || 你可以幫我看嗎？","yul":"@msg 피드백 3개 || 給我三個回饋。\n@msg 칭찬 빼고 || 不要稱讚。"},"o":[{"t":"直接指出副歌前那一瞬間的出神","a":4,"h":0,"r":{"yunhee":"「真的嗎？！」{ta}重看了一次，「天啊真的！你好厲害！」","dohyun":"「……你眼睛很利嘛。」{ta}隔了一會兒，「下次不會了。」","harin":"「你看見了。」{ta}說，「那一秒，我在想別的事。」","yul":"「很好。」{ta}說，「這才是我要的回饋。」"},"m":{"yul":[3,0],"dohyun":[1,0]},"sc":{"dohyun":[6,0,"best"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"先誇整體，再委婉提一點小建議","a":3,"h":0,"r":{"yunhee":"「謝謝你！我會再練的！」","dohyun":"「繞那麼大一圈，你是怕我玻璃心？」{ta}回，「我又不是小孩。」","harin":"「你說話很溫柔。」{ta}說，「我很喜歡。」","yul":"「太委婉。」{ta}說，「我要的不是安慰。」"},"m":{"harin":[2,0],"yunhee":[1,0],"yul":[-4,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"老實說你是外行，只能說好看","a":-3,"h":-1,"r":{"yunhee":"「……好喔。」{ta}說，可是之後再也沒有傳影片給你。","dohyun":"「無聊的答案。」{ta}說，「那以後不給你看了。」","harin":"{ta}很久才回：「……謝謝。」之後，{ta}再也沒有問過你的意見。","yul":"「我不需要這個。」{ta}說，「我以為你不一樣。」"},"m":{"yul":[-5,0],"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"約{ta}出來當面討論，順便吃飯","a":3,"h":1,"r":{"yunhee":"「當面？」{ta}猶豫了一下，「我這周好忙……下次吧。」好像你太急了。","dohyun":"「行。你請。」","harin":"「當面……」{ta}猶豫了很久，最後說：「我還沒準備好。」","yul":"「明天中午，我工作室。」{ta}說，「我煮。」"},"m":{"yul":[2,0],"dohyun":[1,0]},"sc":{"dohyun":[2,1,"good"],"yul":[2,1,"good"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那段影片是彩排時用手機拍的，畫質不太好，聲音也有點雜。可是你看得出，那是一個很用心的舞臺：燈光、走位、表情，每一個細節都排得很仔細。\n\n你看第一遍時，只是單純地覺得好看。第二遍，你開始注意到一些小地方。第三遍，你看見了那一瞬間。\n\n你猶豫了很久要不要說。你不是專業的，說錯了怎麼辦？說了會不會讓{ta}不開心？\n\n可是{ta}說了，「說實話」。","after":{"dohyun":"打歌期的第一個舞臺，你在家裡守著電視看。\n\n副歌之前那一瞬間，{ta}的表情沒有出神了。{ta}看著鏡頭，眼神兇得像要把屏幕看穿，然後在副歌落下時，嘴角勾起一個很壞的笑。\n\n那一段被剪成短影片，在網上轉了幾十萬次。\n\n舞臺結束後，你收到一則訊息：\n\n@msg 봤냐 || 看到了嗎？\n@msg 니 덕분임 || 託你的福。\n@msg …다음 무대도 봐줘 || ……下一個舞臺也幫我看。\n\n你回：「好。」\n\n{ta}又補了一句：\n\n@msg 너만 보면 돼 || 只要你看就好了。\n@msg 아 무대를. 무대만 || 啊，我是說舞臺。只看舞臺。","yul":"那天之後，{ta}每次有新的舞臺或新的戲，都會先傳給你看。\n\n你學會了怎麼看。看燈光，看節奏，看{ta}的眼神什麼時候是在演，什麼時候是真的。\n\n你的意見不一定都對。有時候{ta}會反駁，反駁得很尖銳，然後你們吵起來，吵到凌晨。\n\n可是第二天，{ta}總會傳來一則訊息：「你說的那個地方，我改了。」\n\n有一次，你問{ta}：「你身邊那麼多專業的人，為什麼要聽我的？」\n\n{ta}想了想：「因為他們看的是作品。你看的是我。」\n\n你不知道該怎麼回答。\n\n{ta}也沒有等你回答。","yunhee":"那天你們約在{ta}公司附近的一家小餐館，一邊吃飯一邊看影片。你指著那一瞬間，{ta}湊過來看，看了好幾遍。\n\n「真的耶……」{ta}喃喃地說，「我自己都沒發現。」\n\n「耳返壞了？」\n\n「對！你怎麼知道！」{ta}驚訝地看著你。\n\n「猜的。」\n\n{ta}看著你，看了很久，突然說：「你好像很瞭解我。」\n\n那天之後，{ta}每次有新的舞臺，都會先問你的意見。\n\n有一次，你說某個動作有點僵硬。{ta}就在練習室裡練了一整晚，第二天傳來一段影片：「這樣呢？」","harin":"那天之後，你開始用不一樣的方式看{ta}的舞臺。\n\n你注意到{ta}唱高音之前會輕輕吸一口氣，注意到{ta}緊張的時候會摸耳環，注意到{ta}在唱某幾首歌的時候，眼神會變得很遠。\n\n有一次，你問{ta}：「唱那首歌的時候，你在想什麼？」\n\n{ta}沉默了很久才回答：\n\n@msg 그 노래는 원래 슬픈 노래였어요 || 那首歌原本是一首很悲傷的歌。\n@msg 근데 요즘은 부를 때마다 다른 생각이 나요 || 可是最近每次唱，都會想到別的事。\n@msg …누군가 제 무대를 진짜로 보고 있다는 생각 || ……想到有一個人，是真的在看我的舞臺。"}},{"id":"f5","t":"漢江的腳踏車","d":5,"tm":"下午 16:40","p":"難得的休假日，{name}約你去漢江騎腳踏車。\n\n「戴了帽子跟口罩，應該沒人認得出來。」{ta}說。\n\n傍晚的江邊風很大，夕陽把江面染成橘紅色。你們並排騎著，偶爾比賽，偶爾停下來買冰。\n\n然後，你聽見身後有人小聲說：「那個人……是不是{name}？」\n\n你回頭，看見兩個女孩正舉起手機。","c":{"yunhee":"{name}抓住你的手腕：「快快快！跑！」","dohyun":"{name}笑了一聲：「比賽開始。」然後用力一踩，衝了出去。","harin":"{name}整個人僵住，臉色發白。","yul":"{name}冷靜地說：「你先騎到前面那個出口。我繞另一邊，十分鐘後會合。」"},"o":[{"t":"冷靜帶{ta}從小路離開","a":4,"h":0,"r":{"yunhee":"「欸，我們不能一起跑嗎……」{ta}說，有點失望。","dohyun":"「你騎得挺快的嘛。」{ta}說，額頭上全是汗。","harin":"{ta}停下來後，手還在抖。你遞給{ta}一瓶水，{ta}慢慢平靜下來。","yul":"你們在出口會合，{ta}看著你：「很好。你很可靠。」"},"m":{"harin":[3,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[-4,-1,"bad"],"harin":[6,0,"best"]}},{"t":"擋在{ta}前面，假裝是你被認錯","a":3,"h":0,"r":{"yunhee":"「你好帥！」{ta}在你身後小聲尖叫。","dohyun":"「你擋什麼。」{ta}說，「我又不怕。」{ta}推開你，自己騎走了。","harin":"{ta}在你身後，輕輕抓住了你的衣角，又馬上放開。","yul":"「冒險。」{ta}說，「萬一你被拍到，麻煩的是我。」"},"m":{"yunhee":[2,0],"harin":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"跟著{ta}一起狂飆，比誰先到出口","a":3,"h":1,"r":{"yunhee":"你們一路尖叫一路騎，像兩個瘋子。","dohyun":"「我贏了！」{ta}大喊，臉上是你從沒見過的笑容。","harin":"{ta}點點頭，可是你看得出來，{ta}很難過。原本那麼開心的一天。","yul":"{ta}被迫跟著你飆，最後說：「……偶爾這樣也不錯。」"},"m":{"dohyun":[3,0],"yunhee":[1,0],"harin":[-4,0]},"sc":{"dohyun":[6,1,"best"],"yul":[2,1,"good"],"yunhee":[2,1,"good"],"harin":[-10,-3,"worst"]}},{"t":"慌張地建議今天就先解散","a":-3,"h":-1,"r":{"yunhee":"「咦……好吧。」{ta}有點失落，可是你已經叫了車。","dohyun":"「這麼慫？」{ta}說，「沒意思。」{ta}自己騎走了。","harin":"{ta}騎得很慢，你一直催{ta}，{ta}越騎越慌，最後差點摔倒。","yul":"「明智。」{ta}說，可是表情很冷。之後{ta}再也沒約你出來。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那天下午的陽光很好。你們租了兩臺腳踏車，沿著漢江慢慢騎。江面上有遊船，岸邊有人在野餐、放風箏、遛狗。\n\n{name}戴著帽子和口罩，穿著很普通的運動服，看起來跟其他來運動的人沒什麼兩樣。可是你知道，只要有人仔細看，就一定認得出來。\n\n{ta}好像一點都不擔心，騎得很開心，偶爾回頭催你快一點。\n\n你們在一家便利商店前停下來，買了兩支冰淇淋，坐在江邊的臺階上吃。夕陽正好落下來。","after":{"dohyun":"後來你們在一座橋下停下來。兩個人都喘得厲害，相視一眼，同時笑出聲。\n\n「刺激吧？」{ta}說，汗水從下巴滴下來。\n\n「你是故意的吧？」\n\n「什麼故意？」\n\n「故意被認出來。」\n\n{ta}愣了一下，然後笑了：「被發現了？」\n\n{ta}靠在橋墩上，看著江面：「我只是想知道，被認出來的時候，你會不會丟下我跑掉。」\n\n「結果呢？」\n\n「結果你跑得比我還快。」{ta}說，「但你一直回頭看我有沒有跟上。」\n\n{ta}轉頭看你，夕陽把{ta}的臉染成橘紅色：「我很高興。」","yul":"你們在出口會合時，天已經黑了。{ta}比你早到，靠在一棵樹下，看起來一點都不慌張。\n\n「她們沒有追來。」{ta}說，「照片應該也拍不清楚。」\n\n「你好像很習慣。」\n\n「習慣了。」{ta}說，「以前在前團的時候，常常這樣跑。」\n\n你們推著腳踏車，慢慢走回租車的地方。\n\n「今天，」{ta}突然說，「是我這幾年第一次在外面騎腳踏車。」\n\n「為什麼？」\n\n「因為一個人來，被認出來很麻煩。」{ta}說，「兩個人來，被認出來……好像也沒那麼糟。」","yunhee":"你們躲進一條小巷子，蹲在一個廢棄的攤位後面，屏住呼吸，等那兩個女孩走過去。\n\n等腳步聲遠了，{ta}才敢喘氣，然後笑到停不下來。\n\n「好像在拍間諜片喔！」{ta}說，「我心跳好快！」\n\n你也在笑。笑著笑著，你發現你們靠得很近，近到你能聞到{ta}頭髮上的洗髮精味道。\n\n{ta}好像也發現了，笑聲停了一下。\n\n然後{ta}站起來，拍拍褲子上的灰：「走吧！我餓了！」\n\n你們去吃了一家很小的炸醬麵店。{ta}吃得滿嘴都是醬，你遞給{ta}一張紙巾。\n\n{ta}接過紙巾時，指尖碰到你的手指，又很快縮回去。","harin":"你們在一條安靜的小路停下來。{ta}靠在腳踏車上，臉色還有點白。\n\n「對不起。」{ta}說，「我很怕被認出來。」\n\n「沒關係。」\n\n「以前有一次，」{ta}說，「在街上被認出來，被圍住了。很多人拉我的衣服、拍我的臉。那之後，我就很少出門了。」\n\n你不知道該說什麼。\n\n{ta}看著你，勉強笑了笑：「可是今天，我很開心。在被認出來之前，我一直很開心。」\n\n「那我們下次去別的地方。」你說，「人少一點的地方。」\n\n{ta}看著你，眼睛慢慢彎起來：「你會想到下次。」\n\n「當然。」\n\n「那，」{ta}說，「我也開始想下次了。」"}}],"amb":[{"id":"a1","t":"停電的練習室","d":4,"tm":"晚上 22:15","p":"{name}說今晚要加練，問你要不要來看。練習室在公司地下二樓，鏡子佔滿了整面牆。\n\n你坐在角落看{ta}練了一個多小時。音樂停下來時，{ta}一身是汗，拿著毛巾走過來，坐在你旁邊。\n\n就在那時，燈全滅了。\n\n整棟樓停電。黑暗裡，你只聽見{ta}的呼吸聲，還有兩個人的手臂，在地板上不小心碰到一起。","c":{"yunhee":"「哇！好黑！」{ta}下意識抓住你的手臂，又鬆開，「對、對不起……」","dohyun":"{ta}在黑暗裡笑了一聲：「怕的話，可以靠過來。」","harin":"{ta}的呼吸停了一下。過了很久，{ta}小聲說：「這樣……好安靜。」","yul":"「別動。」{ta}說，「我開手機燈。」卻沒有馬上去拿。"},"o":[{"t":"不動，就這樣在黑暗裡跟{ta}聊天","a":4,"h":4,"r":{"yunhee":"{ta}的話變少了。你們安靜地坐著，直到燈亮，{ta}的臉紅得像要燒起來。","dohyun":"{ta}靠得越來越近，最後說：「你心跳好快。」然後燈亮了，{ta}若無其事地站起來。","harin":"{ta}說起一首還沒發表的歌。黑暗裡，{ta}輕聲唱了兩句，只給你聽。","yul":"{ta}說起前團解散的那一晚。說完，{ta}沉默了很久：「我很少跟人說這個。」"},"m":{"harin":[2,1],"yul":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,5,"best"],"yunhee":[6,4,"best"],"harin":[6,5,"best"]}},{"t":"開手機手電筒，打破這個氣氛","a":2,"h":0,"r":{"yunhee":"光亮起來，{ta}眨了眨眼，好像有點失落。","dohyun":"「掃興。」{ta}說，站起來離你遠了一點。","harin":"{ta}眨了眨眼，好像剛從夢裡醒來。","yul":"光亮起來，{ta}的表情恢復了平常的冷淡。好像剛才什麼都沒發生過。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"故意說你有點怕，看{ta}的反應","a":3,"h":5,"r":{"yunhee":"「我也怕！」{ta}擠到你旁邊，肩膀貼著你。","dohyun":"「騙人。」{ta}說，卻往你這邊靠了一點。","harin":"「你不怕。」{ta}說，「你在試探我。」{ta}往旁邊挪了一點。","yul":"「你不怕。」{ta}說，「你在試探我。」黑暗裡，你聽見{ta}笑了。"},"m":{"dohyun":[2,1],"yul":[1,1],"harin":[-2,0]},"sc":{"dohyun":[6,6,"best"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[-4,-1,"bad"]}},{"t":"起身說要去找工作人員","a":-3,"h":-1,"r":{"yunhee":"「等我！不要丟下我！」{ta}在黑暗裡喊，你已經走遠了。","dohyun":"「你要去哪？」{ta}拉住你的袖子，又放開了。「隨便你。」","harin":"{ta}沒有說話。你走後，{ta}一個人在黑暗裡坐了很久。","yul":"「不用。」{ta}說，「三分鐘後就有備用電。」可是你還是走了。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"練習室在地下二樓，沒有窗戶，只有一整面牆的鏡子和天花板上的日光燈。空調開得很強，你坐在角落，裹著{ta}丟給你的外套。\n\n你看著{ta}一遍又一遍地練同一段舞。音樂停下來，{ta}就看著鏡子裡的自己，皺眉，然後重新開始。\n\n那是你第一次看到{ta}這樣的一面。不是舞臺上那個光鮮的人，也不是宵夜時那個隨意的朋友。是一個對自己很嚴格、累了也不停下來的人。\n\n一個多小時後，{ta}終於關掉音樂。","after":{"dohyun":"燈亮的時候，{ta}已經站起來了，背對著你，拿毛巾擦汗。\n\n「走吧。」{ta}說，「我送你出去。」\n\n你們一前一後走出練習室。走廊上的燈一盞一盞亮起來，{ta}走得很快，好像在逃。\n\n到了公司門口，{ta}停下來，沒有回頭。\n\n「剛才，」{ta}說，「我說的話，你別當真。」\n\n「哪一句？」\n\n{ta}轉過來，看著你，表情很複雜。\n\n「……全部。」{ta}說，然後又改口，「不，不是全部。」\n\n{ta}沒有說是哪一句。你站在門口，看著{ta}走回公司，背影在玻璃門後面消失。\n\n那天晚上，你失眠了。","yul":"燈亮的那一刻，{ta}眨了眨眼，好像剛從很遠的地方回來。\n\n你們都沒有說話。\n\n{ta}站起來，把毛巾掛在脖子上，走到鏡子前，看著鏡子裡的自己，看了很久。\n\n「我很少跟人說那些。」{ta}說，沒有回頭。\n\n「我知道。」\n\n「你知道為什麼我跟你說嗎？」\n\n你看著鏡子裡的{ta}。{ta}也在看著鏡子裡的你。\n\n「因為黑暗裡，」{ta}說，「我看不見你的表情。所以我不用擔心你會用什麼眼神看我。」\n\n{ta}終於轉過來，看著真正的你：「可是現在燈亮了，你的眼神……沒有變。」","yunhee":"燈亮的時候，你們都愣了一下，然後同時轉開視線。\n\n{ta}的臉紅得厲害。{ta}站起來，假裝很忙地收拾東西，把同一件外套折了三次。\n\n「那、那個，」{ta}說，「我們去吃宵夜吧！我餓死了！」\n\n你們去了公司附近的一家便利商店。{ta}買了一堆零食，一路上說個不停，說的都是一些不重要的事。\n\n你知道{ta}在掩飾什麼。\n\n到了地鐵站，{ta}終於安靜下來。\n\n「剛才……」{ta}開口，又停住。\n\n「剛才怎麼了？」\n\n「沒事！」{ta}說，「晚安！」\n\n{ta}跑走了。跑了幾步，又回頭：「明天也來看我練習好不好！」","harin":"燈亮的時候，{ta}還在哼那首歌，哼到一半才停下來，好像剛意識到燈亮了。\n\n{ta}看著你，有點慌張：「我、我剛才……」\n\n「很好聽。」你說。\n\n{ta}低下頭，臉慢慢紅了。\n\n那天晚上，你們一起走出公司。夜風很涼，{ta}裹著那件外套，走得很慢。\n\n「那首歌，」{ta}說，「還沒有完成。少了最後一段。」\n\n「為什麼少了？」\n\n{ta}停下腳步，看著你：「因為我還不知道，故事的結局是什麼。」\n\n你們站在路燈下，誰都沒有再說話。"}},{"id":"a2","t":"講到睡著的電話","d":3,"tm":"凌晨 01:30","p":"{name}的海外行程，時差八小時。\n\n你本來已經準備睡了，手機突然響起視訊通話。你接起來，畫面裡是飯店的天花板，然後才是{ta}的臉。\n\n「還沒睡吧？」{ta}說，「我剛結束，睡不著。」\n\n你們聊了很久。從{ta}今天吃的東西、到你的工作、到你們都喜歡的電影。不知道什麼時候，兩個人都躺下了，聲音越來越輕。","c":{"yunhee":"{ta}抱著枕頭：「如果你在這裡就好了……」說完馬上捂住嘴，「我是說，一起玩！」","dohyun":"「你先睡。」{ta}說，「我看著你睡。」","harin":"{ta}的聲音變得很輕：「這樣，好像你就在旁邊。」","yul":"「不要掛。」{ta}說，「我想聽著聲音睡。」"},"o":[{"t":"不掛電話，就這樣一起睡著","a":4,"h":3,"r":{"yunhee":"你醒來時，看見{ta}傳來的一張截圖：你睡著的樣子。「好可愛喔～」","dohyun":"你醒來時，{ta}傳來一則：「你打呼。」","harin":"你醒來時，{ta}傳了一首歌，寫著：「昨晚想到的旋律。」","yul":"你醒來時，通話已經結束，只有一則訊息：「謝謝。我睡得很好。」"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"輕聲說：「你也該睡了，明天還有行程」","a":3,"h":0,"r":{"yunhee":"「你好像我經紀人喔……」{ta}說，聲音有點委屈。","dohyun":"「嘮叨。」{ta}說，掛電話前沒有說晚安。","harin":"「晚安。」{ta}說，「做個好夢。」","yul":"「你說得對。」{ta}說，「那以後我不打了。」"},"m":{"yul":[1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,0,"good"]}},{"t":"半開玩笑問：「那如果我在旁邊呢？」","a":3,"h":5,"r":{"yunhee":"「那……」{ta}的臉一下子紅了，「那我們就可以一起看電影了！」","dohyun":"「那你就別想睡了。」{ta}笑得很壞。","harin":"「嗯，晚安。」{ta}說，之後好幾天，都沒有再打來。","yul":"「你確定想知道答案？」{ta}的聲音低了下來。"},"m":{"dohyun":[2,2],"yul":[2,1],"harin":[-3,0]},"sc":{"dohyun":[6,7,"best"],"yul":[6,6,"best"],"yunhee":[2,3,"good"],"harin":[-10,-3,"worst"]}},{"t":"說你明天要早起，先掛了","a":-3,"h":-1,"r":{"yunhee":"「好吧……晚安。」{ta}的聲音很失落。","dohyun":"「喔。」{ta}說完就掛了。之後兩天，{ta}都沒打來。","harin":"{ta}很久沒說話。最後說：「……我不喜歡這種問題。」就掛了。","yul":"「好。」{ta}說，掛得比你還快。"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}}],"x":"那段時間，{name}在海外巡演，時差八小時。你們的對話變得很零碎：你早上起床時，{ta}剛結束演出；你吃午飯時，{ta}正在睡覺；你下班時，{ta}剛醒來，準備去彩排。\n\n你發現自己開始習慣在奇怪的時間看手機。早上六點、下午三點、半夜一點。\n\n有時候{ta}會傳一張演唱會的照片，臺下是一片陌生的手燈海。有時候只是一句「好累」，或「這裡的食物好難吃」。\n\n你每一則都回。即使隔了好幾個小時，你也會回。","after":{"dohyun":"那天之後，你們每天晚上都會視訊。\n\n有時候聊很久，有時候只是開著視訊，各做各的事。{ta}在飯店房間裡練舞、打遊戲、吃泡麵，你在家裡加班、看劇、發呆。\n\n偶爾抬頭，會發現{ta}在看你。\n\n「看什麼？」\n\n「看你工作。」{ta}說，「你認真的時候會咬嘴唇。」\n\n「你一直在看？」\n\n「沒有。」{ta}說，「偶爾。」\n\n巡演最後一天，{ta}說：「我明天回去。」\n\n「幾點的飛機？」\n\n「為什麼問？」\n\n「……沒什麼。」\n\n隔天，你在機場的人群外面，遠遠看著{ta}走出來。{ta}沒看見你。可是那天晚上，{ta}傳來訊息：「我看到你了。」","yul":"那天之後，{ta}每天晚上都會打來。時間很固定，你那邊的十二點半，{ta}那邊的下午四點半，演出前的空檔。\n\n你們每次只聊二十分鐘。{ta}會問你今天過得怎麼樣，你會問{ta}今天的城市是哪裡。\n\n有一次，{ta}說：「我開始討厭巡演了。」\n\n「為什麼？」\n\n「因為時差。」{ta}說，「我想在你醒著的時候醒著。」\n\n你握著手機，沒有說話。\n\n{ta}也沉默了很久，然後說：「我說太多了。忘了吧。」\n\n「我不想忘。」\n\n電話那頭安靜了很久。最後，{ta}說：「……那就記著吧。」","yunhee":"那天之後，{ta}每天都會在睡前打視訊給你。不管多晚，不管多累。\n\n{ta}會跟你講今天發生的事：哪個城市的粉絲很熱情、哪道菜很難吃、哪個成員又在飯店迷路了。\n\n講著講著，{ta}就會睡著。你會看著{ta}睡著的樣子，過一會兒才掛掉。\n\n有一次，{ta}在睡著前，迷迷糊糊地說：\n\n「你知道嗎……我每天最期待的，就是這個時間……」\n\n你屏住呼吸。\n\n可是{ta}已經睡著了，什麼都沒說完。\n\n隔天，{ta}完全不記得自己說過這句話。可是你記得。","harin":"那天之後，{ta}開始在睡前傳錄音給你。\n\n有時候是一段旋律，有時候是{ta}讀的一首詩，有時候只是{ta}飯店窗外的聲音：雨聲、車聲、遠處的教堂鐘聲。\n\n你會在早上醒來時聽。{ta}那邊的深夜，是你這邊的清晨。\n\n有一次，錄音裡只有{ta}的呼吸聲，很輕很慢，像是睡著了。\n\n錄音的最後，{ta}很小聲地說了一句：\n\n「……想你了。」\n\n然後錄音就斷了。\n\n你聽了很多遍。不確定{ta}是不是故意錄進去的。\n\n你沒有問。{ta}也沒有提。"}},{"id":"a3","t":"你去相親的那天","d":5,"tm":"晚上 21:00","p":"家裡安排了一場相親。你不太想去，但推不掉。\n\n對方人很好，你們吃了一頓還算愉快的飯。回家的路上，你在社群發了一張餐廳的照片，沒有寫什麼。\n\n晚上九點，手機響了。","c":{"yunhee":"@msg 오늘 누구랑 밥 먹었어?? || 今天跟誰吃飯了？？\n@msg 아 그냥!! 맛있어 보여서!! || 啊就是！！看起來很好吃！！","dohyun":"@msg 그 사진 뭐야 || 那張照片是什麼？\n@msg 누구랑 갔는데 || 跟誰去的？","harin":"@msg 좋은 시간 보냈어요? || 你度過了愉快的時光嗎？","yul":"@msg 소개팅이죠? || 是相親吧？\n@msg 그래서? 어땠어요? || 所以呢？怎麼樣？"},"o":[{"t":"老實說是家裡安排的相親，你沒興趣","a":4,"h":2,"r":{"yunhee":"「喔～這樣喔！」{ta}回得超快，「那、那我們週末去吃更好吃的！」","dohyun":"「沒興趣還去？」{ta}說，「下次推掉。」又補：「……我是說，浪費時間。」","harin":"「嗯。」{ta}說，過了很久：「我剛剛，有點在意。」","yul":"「我知道了。」{ta}說，「下次不想去，可以說你有約。跟我。」"},"m":{"yul":[2,1],"harin":[2,1]},"sc":{"dohyun":[6,2,"best"],"yul":[6,3,"best"],"yunhee":[2,1,"good"],"harin":[6,3,"best"]}},{"t":"故意說對方人很好，看{ta}怎麼回","a":2,"h":4,"r":{"yunhee":"「喔……」{ta}只回了一個字，然後一整天都沒有再找你。","dohyun":"「是喔。」{ta}說，「那他會炸雞嗎？」然後就下線了。","harin":"「那很好。」{ta}說完就下線了。之後一個星期，你們都沒聯絡。","yul":"「你在試探我。」{ta}說，「我討厭這種方式。」"},"m":{"dohyun":[1,2],"harin":[-5,0],"yul":[-4,1],"yunhee":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"反問{ta}：「你在意嗎？」","a":3,"h":3,"r":{"yunhee":"「我、我才沒有！」{ta}馬上回，然後又：「好啦一點點。」","dohyun":"「在意啊。」{ta}說，「你不能比我先有對象。」","harin":"{ta}很久沒回，最後說：「我不知道。」","yul":"「你希望我在意嗎？」{ta}把問題丟回來。"},"m":{"yunhee":[2,1],"dohyun":[1,1]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,4,"best"],"harin":[2,2,"good"]}},{"t":"只說是跟朋友吃飯，轉移話題","a":-3,"h":-1,"r":{"yunhee":"「好喔！」{ta}說，可是之後的訊息越來越慢。","dohyun":"「騙人。」{ta}說，「你連說謊都懶得說好。」","harin":"「好。」{ta}說，然後就下線了。","yul":"「你不會說謊。」{ta}說，「算了，我不問了。」"},"m":{"yul":[-3,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那場相親是媽媽安排的。對方是媽媽朋友的兒女，聽說人很好，工作穩定，長得也不錯。\n\n你本來想推掉，可是媽媽在電話裡說了半個小時，最後你只好答應。\n\n餐廳很高級，對方很有禮貌，你們聊了工作、興趣、家庭。一切都很正常，很順利，很……沒有感覺。\n\n你坐在那裡，一邊微笑一邊點頭，腦子裡卻一直在想：如果對面坐的是另一個人，會怎麼樣。\n\n回家的路上，你在社群發了一張餐廳的照片。你也不知道為什麼要發。","after":{"dohyun":"那天晚上，{ta}一直在找你聊天。聊的都是一些很無聊的事，像是故意不讓你去睡覺。\n\n聊到凌晨一點，{ta}突然說：\n\n@msg 근데 그 사람이랑 또 만나? || 不過你還會跟那個人見面嗎？\n\n你說不會。\n\n@msg 왜? || 為什麼？\n\n你想了很久，回：「因為沒感覺。」\n\n{ta}隔了很久才回：\n\n@msg 그럼 누구한테는 느낌이 있는데? || 那你對誰有感覺？\n\n你看著那句話，手指停在屏幕上，很久都沒動。\n\n最後，{ta}自己先傳了：\n\n@msg 아 됐어. 자라 || 啊算了，睡吧。","yul":"那天之後，{ta}變得有點奇怪。\n\n訊息還是照常傳，可是語氣比平常更短、更冷。約你吃飯時，會故意挑一些很貴的餐廳，好像在跟什麼人比較。\n\n有一次，你終於忍不住問：「你在不高興什麼？」\n\n{ta}放下刀叉，看著你：「我沒有不高興。」\n\n「你有。」\n\n{ta}沉默了很久，才說：「我不喜歡自己這樣。」\n\n「這樣是怎樣？」\n\n「在意一件不該在意的事。」{ta}說，「我們是朋友。你去相親，跟我沒有關係。」\n\n{ta}說完，又低頭切牛排，切得很用力。","yunhee":"那天之後，{ta}還是每天傳訊息給你。可是你發現，{ta}開始在一些奇怪的地方停頓。\n\n你提到同事，{ta}會問「男的女的？」；你說週末要出門，{ta}會問「跟誰？」；你說今天很開心，{ta}會問「為什麼開心？」\n\n問完了，{ta}又會馬上補一句：「我只是好奇喔！」\n\n有一次，你開玩笑說：「你好像在查勤。」\n\n{ta}隔了很久才回：\n\n@msg 미안… 나 좀 이상하지 || 對不起……我是不是有點奇怪。\n@msg 나도 내가 왜 이러는지 모르겠어 || 我也不知道自己為什麼會這樣。","harin":"那天之後，{ta}的訊息變少了。\n\n不是不回，只是回得很慢，很短。你約{ta}吃飯，{ta}會說「最近有點忙」。你傳照片給{ta}，{ta}只回一個笑臉。\n\n一個星期後，你終於忍不住打電話給{ta}。\n\n{ta}接起來，聲音很輕：「……喂。」\n\n「你在躲我？」\n\n電話那頭安靜了很久。\n\n「我在想一些事情。」{ta}說，「想我們……是什麼。」\n\n「想出來了嗎？」\n\n「還沒有。」{ta}說，「可是我發現，你去相親那天，我寫了一首很難過的歌。」"}},{"id":"a4","t":"被花絮鏡頭拍到的衣領","d":4,"tm":"下午 15:00","p":"你因為工作的關係，被邀請到{name}的廣告拍攝現場。\n\n休息時，{ta}走過來跟你說話。你注意到{ta}的衣領翻了一邊，下意識伸手幫{ta}整理。\n\n你的指尖碰到{ta}的脖子，{ta}整個人停住了。\n\n兩個人就這樣站著，近得能聞到對方身上的味道。\n\n「咔嚓。」\n\n你轉頭，看見花絮攝影師正舉著相機，若無其事地走開。","c":{"yunhee":"{ta}捂著臉笑：「好丟臉喔！可是……」{ta}小聲說，「那張一定很好看。」","dohyun":"{ta}沒有退開，反而低頭看你：「你手好冰。」","harin":"{ta}的呼吸亂了一拍，眼睛看向別處：「……謝謝。」","yul":"{ta}抓住你的手腕，輕輕拿開：「這裡人多。」聲音比平常低。"},"o":[{"t":"假裝若無其事，繼續聊剛才的話題","a":3,"h":2,"r":{"yunhee":"{ta}努力假裝，可是一直不敢看你，後來就躲到化妝室去了。","dohyun":"「裝什麼。」{ta}低聲說，「你臉紅了。」可是{ta}沒再靠近你。","harin":"{ta}也裝作沒事，可是說話一直卡住。","yul":"「好。」{ta}說，「你很冷靜。」可是接下來的拍攝，{ta}再也沒看你。"},"m":{"yul":[1,1]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[2,1,"good"]}},{"t":"小聲道歉，說你只是習慣性動作","a":-3,"h":-1,"r":{"yunhee":"「喔……這樣喔。」{ta}的笑容慢慢淡了，「我還以為……沒事！」","dohyun":"「習慣？」{ta}挑眉，「你對誰都這樣？」{ta}轉身就走了。","harin":"「不用道歉。」{ta}說，可是{ta}往後退了一步。","yul":"「我知道。」{ta}說，「所以下次，別對我這樣。」"},"m":{"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-4,-1,"bad"]}},{"t":"擔心照片會給{ta}惹麻煩，去找攝影師","a":4,"h":0,"r":{"yunhee":"「你好認真！」{ta}說，「不過……我其實想要那張。」","dohyun":"「刪什麼。」{ta}說，「又沒怎樣。」卻跟你去了。","harin":"{ta}很感激地看著你：「謝謝你。」","yul":"「我已經處理了。」{ta}說，「不過你這樣想，很好。」"},"m":{"harin":[2,0],"yul":[1,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[6,0,"best"],"harin":[6,0,"best"]}},{"t":"看著{ta}的眼睛，低聲說：「我是故意的」","a":3,"h":6,"r":{"yunhee":"{ta}瞪大眼睛，臉紅得像番茄，轉身跑掉了。","dohyun":"{ta}愣了一秒，然後笑了，彎下腰在你耳邊說：「那我也故意一次。」卻什麼都沒做就走開了。","harin":"{ta}看著你，眼神裡有一種被冒犯的東西。「……現在不行。」{ta}說完就走開了。","yul":"「我知道。」{ta}說，「所以我剛才沒躲。」"},"m":{"dohyun":[2,2],"yul":[2,2],"harin":[-3,0]},"sc":{"dohyun":[6,8,"best"],"yul":[2,4,"good"],"yunhee":[2,3,"good"],"harin":[-10,-3,"worst"]}}],"x":"拍攝現場在一個很大的攝影棚裡，到處都是燈光、反光板和來來去去的工作人員。你因為工作的關係被邀請來，本來只是站在旁邊看。\n\n{name}拍了一整個上午，換了四套衣服，每一套都要重新化妝、重新打光。你看著{ta}在鏡頭前的樣子，跟平常完全不一樣：眼神、姿勢、表情，每一個細節都精準得可怕。\n\n可是隻要導演喊「休息」，{ta}就會立刻垮下來，找一個角落坐著發呆。\n\n中午休息時，{ta}在人群中找到你，朝你走過來。","after":{"dohyun":"那天下午的拍攝，你一直站在角落。{ta}拍著拍著，眼神就會往你這邊飄。\n\n導演喊了好幾次：「道賢！看鏡頭！」\n\n收工時，{ta}走過來，把一瓶水塞進你手裡。\n\n「你害我被罵了五次。」{ta}說。\n\n「我什麼都沒做。」\n\n「你站在那裡。」{ta}說，「就夠了。」\n\n你們一起走出攝影棚。外面已經天黑了。\n\n「剛才那個，」{ta}突然說，「你說是故意的，是真的嗎？」\n\n你沒有回答。\n\n{ta}看著你，等了很久，最後笑了：「好。我知道了。」\n\n{ta}沒說知道了什麼。","yul":"那天下午，那張照片還是流出去了。只是一張模糊的側影，看不清楚你的臉，可是粉絲們在底下吵翻了。\n\n你很擔心，傳訊息給{ta}。{ta}很快回了：\n\n@msg 처리했어요. 걱정 마요 || 處理好了，別擔心。\n\n過了一會兒，又傳來一則：\n\n@msg 근데 그 사진, 원본 받아놨어요 || 不過那張照片，我拿到原圖了。\n@msg 지우라고 했는데, 나는 안 지웠어요 || 我叫他們刪了，但我自己沒刪。\n\n你看著那兩行字，心跳得很快。\n\n@msg 왜요? || 為什麼？\n\n{ta}隔了很久才回：\n\n@msg 그래서? 왜일 것 같아요? || 所以呢？你覺得是為什麼？","yunhee":"那天下午，{ta}拍攝時一直在笑。導演說今天的狀態特別好，眼睛裡有光。\n\n{ta}的經紀人在旁邊小聲問你：「你們……是什麼關係？」\n\n「朋友。」你說。\n\n經紀人看了你一眼，沒說什麼。\n\n收工後，{ta}跑過來，偷偷塞給你一張拍立得。是剛才花絮攝影師拍的那一張：你幫{ta}整理衣領，兩個人靠得很近，{ta}的臉紅紅的。\n\n「我跟他要來的。」{ta}說，「原本要刪掉的。」\n\n「那你為什麼要？」\n\n{ta}看著你，咬著嘴唇：「因為……我想留著。」","harin":"那天下午，{ta}一直很安靜。拍攝時很專業，休息時就坐在角落，不太跟人說話。\n\n你以為{ta}在生氣。\n\n收工後，{ta}在停車場等你。\n\n「剛才，」{ta}說，「對不起。我不是故意躲開你。」\n\n「我知道。」\n\n「我只是……」{ta}低下頭，「很久沒有人碰我的時候，我會想要更多。所以我害怕。」\n\n你看著{ta}，不知道該說什麼。\n\n{ta}抬起頭，眼睛有點紅：「我們現在這樣，可以嗎？再慢一點，可以嗎？」"}},{"id":"a5","t":"演唱會的最後一首歌","d":6,"tm":"晚上 21:45","p":"{name}送了你一張演唱會的票，是關係者席。\n\n整場演唱會，你看著{ta}在臺上發光。那是你不認識的{name}，耀眼、遙遠，屬於幾萬個人。\n\n最後一首歌，全場燈光暗下來，只剩手燈的海。{ta}站在舞臺中央，唱到最後一句時，轉頭看向關係者席的方向。\n\n那一秒，你很確定{ta}在看你。\n\n散場後，{ta}傳訊息，叫你去後臺。人都走光了，{ta}還穿著舞臺服，坐在空蕩蕩的走廊。","c":{"yunhee":"{ta}一看到你就站起來，又停住：「你有看到嗎？最後那一句，是……」說到一半就卡住了。","dohyun":"{ta}靠著牆，汗還沒幹：「看到了吧？我在看你。」沒有笑，難得地認真。","harin":"{ta}的眼睛有點紅：「那首歌，是我寫的。寫的時候……想到的是一個人。」","yul":"{ta}說：「我平常不會在臺上看任何人。」停了停，「今天例外。」"},"o":[{"t":"等{ta}把話說完","a":4,"h":4,"r":{"yunhee":"{ta}深吸一口氣，又洩了氣：「算了！下次再說！」可是{ta}一直看著你，看到經紀人來叫。","dohyun":"「你知道我想說什麼。」{ta}說，「我不想說出來。說出來就回不去了。」","harin":"{ta}沒有說那個人是誰，但{ta}的眼神說了。","yul":"「我不擅長這個。」{ta}說，「但我不想再只是朋友。」說完，{ta}自己也沉默了。"},"m":{"yul":[2,2],"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,6,"best"],"yunhee":[2,2,"good"],"harin":[6,5,"best"]}},{"t":"先開口說今晚的{ta}很耀眼","a":3,"h":2,"r":{"yunhee":"「真的嗎！」{ta}跳起來，又停住，「那……你喜歡嗎？」","dohyun":"「我知道。」{ta}說，「我想聽的不是這個。」{ta}別開了臉。","harin":"「謝謝。」{ta}說，「可是我更想你看見臺下的我。」","yul":"「我知道。」{ta}說，「你在逃避。」"},"m":{"yunhee":[2,0],"dohyun":[1,0],"yul":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[6,2,"best"],"harin":[-4,-1,"bad"]}},{"t":"輕輕碰了碰{ta}的手指","a":3,"h":6,"r":{"yunhee":"{ta}的手指在你的手指上停了一下，然後迅速縮回去：「走、走廊好冷喔！」氣氛一下子尷尬了。","dohyun":"{ta}反手勾住你的小指，一秒，就放開了：「我們這樣，算什麼？」","harin":"{ta}的手在抖。{ta}沒有縮回，也沒有握住，只是讓你碰著。","yul":"{ta}低頭看著你的手：「你知道你在做什麼嗎？」"},"m":{"dohyun":[2,2]},"sc":{"dohyun":[6,8,"best"],"yul":[2,3,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,3,"good"]}},{"t":"說你只是來道恭喜，要先回去了","a":-3,"h":-1,"r":{"yunhee":"「你要走了？」{ta}的笑容僵住，「好……路上小心。」","dohyun":"「行。」{ta}說，轉身踢了一下牆。","harin":"{ta}點點頭，什麼都沒說。可是你看見{ta}的眼眶紅了。","yul":"「好。」{ta}說，「我知道了。」那三個字，比任何時候都冷。"},"m":{"harin":[-4,0],"dohyun":[-4,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那是{name}的個人演唱會，場館坐滿了一萬多人。你坐在關係者席，旁邊是幾個{ta}的朋友和工作人員，大家都很安靜。\n\n燈光暗下來，第一首歌的前奏響起，全場尖叫。\n\n你看著{ta}從升降臺上緩緩出現，穿著一身白色的舞臺服，在燈光下像在發光。那一瞬間，你突然覺得{ta}離你很遠。遠得像在另一個世界。\n\n整場演唱會兩個多小時。{ta}唱了、跳了、哭了、笑了，跟臺下的每一個人說謝謝。\n\n最後一首歌開始前，{ta}停下來，看著臺下，說了一句：「這首歌，送給一個很重要的人。」","after":{"dohyun":"那天晚上，你很晚才離開場館。走到地鐵站時，你收到一則訊息：\n\n@msg 아까 그 말, 진심이야 || 剛才那些話，是認真的。\n@msg 근데 지금은 안 돼 || 可是現在不行。\n@msg 컴백 끝나면 다시 말할게 || 迴歸結束後，我再說一次。\n\n你看著那三行字，站在地鐵站的入口，很久都沒動。\n\n人群從你身邊經過，有人拿著{ta}的手幅，有人在討論剛才的演唱會。\n\n你想起{ta}在臺上看著你的那個眼神。\n\n迴歸結束還有兩個月。\n\n你突然覺得，兩個月好長。","yul":"那天晚上，{ta}送你到停車場。一路上都沒有說話。\n\n到了你的車旁邊，{ta}才開口：「我剛才在臺上說的那句話，你知道是在說誰吧？」\n\n「我知道。」\n\n「我需要時間。」{ta}說，「不是因為不確定你。是因為不確定我自己。」\n\n「什麼意思？」\n\n「前團解散的時候，」{ta}說，「我答應過自己，不再把重要的東西放在會失去的地方。」\n\n{ta}看著你：「可是你已經在那裡了。我還沒想好，要怎麼保護你。」","yunhee":"那天晚上，{ta}一直在後臺陪你，陪到所有人都走了，陪到保全來趕人。\n\n你們一起從後門離開。夜風很涼，{ta}裹著一件大外套，跟在你後面。\n\n「剛才那首歌，」{ta}突然說，「你喜歡嗎？」\n\n「喜歡。」\n\n「那是我寫的第一首歌。」{ta}說，「寫給一個人的。」\n\n「誰？」\n\n{ta}沒回答，只是快步走到你前面，然後轉身，倒著走，看著你：\n\n「你猜！」\n\n你看著{ta}在路燈下倒著走、笑著、等你回答的樣子，突然很想抓住{ta}。\n\n可是你沒有。現在還不行。","harin":"那天之後，{ta}把那首歌發表了。\n\n歌名叫〈關係者席〉。\n\n歌詞寫的是一個歌手，每一次站在舞臺上，都會看向同一個位置。那個位置上的人不知道，歌手所有的歌，都是為了被那個人聽見。\n\n那首歌拿了一位。{ta}在得獎感言裡說：「謝謝那個位置上的人。」\n\n所有人都在猜那個人是誰。\n\n那天晚上，你收到一則訊息：\n\n@msg 이 노래, 끝까지 들었어요? || 這首歌，你聽到最後了嗎？\n@msg 마지막 가사는 아직 안 불렀어요 || 最後一句歌詞，我還沒唱。\n@msg 직접 불러주고 싶어서 || 因為想親自唱給你聽。"}}],"fwb":[{"id":"w1","t":"慶功宴之後","d":5,"tm":"深夜 01:20","p":"新歌拿下了第一個一位。慶功宴結束時已經過了午夜，{name}說喝多了，不想坐保姆車，要你陪{ta}走一段。\n\n你們走進{ta}在公司附近租的小公寓。門在身後關上，屋裡只開了一盞玄關的小燈。\n\n{ta}沒有馬上開燈。你們站在很近的地方，近到你能聞到{ta}身上殘留的香水和酒氣。\n\n「我想清楚了。」{ta}的聲音很低，「我們之間……我給不了你更多。公司、粉絲、行程，我什麼都承諾不了。」\n\n{ta}看著你：「可是我不想再假裝只是朋友。如果你不願意，現在就走，我不會怪你。」","c":{"yunhee":"{ta}咬著嘴唇，難得地沒有笑：「我知道這樣很自私……可是我好想你。只是……不能是戀人。」","dohyun":"{ta}靠著門，喉結滾動了一下：「別讓我說第二次。不談戀愛，不吃醋，不過問。你要，就留下。」","harin":"{ta}的手指攥著衣角：「我很害怕。害怕被發現，也害怕自己會想要更多。所以……我們只能這樣。」","yul":"{ta}說得很直接：「規則很簡單。不過夜，不公開，不問對方的私事。你同意，我們就開始。」"},"o":[{"t":"點頭同意，主動靠近{ta}","a":3,"h":10,"r":{"yunhee":"{ta}踮起腳吻你，又急又生澀，牙齒還磕到了你的嘴唇。「對、對不起！」{ta}捂住嘴，臉紅得快要冒煙。\n\n你笑出聲，{ta}瞪你，然後自己也笑了。笑著笑著，{ta}安靜下來，伸手環住你的脖子：「……這次我會好好來。」\n\n第二個吻很慢。{ta}的唇很軟，帶著一點慶功宴上的果酒味。你扶住{ta}的腰，{ta}在你懷裡輕輕顫了一下，像只受驚的小動物，卻沒有退開，反而貼得更近。\n\n你們跌跌撞撞地進了臥室，撞倒了一盞檯燈。{ta}笑得倒在床上，長卷發散了一枕頭。可是當你俯身靠近，{ta}的笑聲就停了。{ta}看著你，眼睛溼漉漉的，小聲說：「……我好緊張喔。」\n\n你吻{ta}的眼角，吻{ta}的鼻尖，吻那顆笑起來會露出來的虎牙。{ta}慢慢放鬆下來，手指從你的後頸滑進頭髮裡，抓得很緊。\n\n平常那麼吵的人，此刻只剩下急促的呼吸，和斷斷續續、黏糊糊的呢喃。你的指尖每經過一個地方，{ta}就輕輕縮一下，然後又追著你的溫度貼上來。{ta}的皮膚一點一點泛起粉色，從臉頰一路蔓延到鎖骨。\n\n「{me}……」{ta}一直叫你的名字，叫到後來帶了哭腔，指甲在你的手背上留下一排淺淺的月牙。\n\n結束後，{ta}把臉埋在枕頭裡，耳朵紅透：「不準看我！好丟臉！」\n\n你笑著去拉{ta}，{ta}就滾進你懷裡，悶悶地說：「……可是好幸福。」\n\n過了很久，{ta}才慢慢坐起來，背對著你，一件一件穿回衣服。\n\n「我該走了。」{ta}說，聲音小小的，「規則嘛。」\n\n走到門口，{ta}又跑回來，在你額頭上親了一下，然後才真的離開。","dohyun":"{ta}沒等你說完，就把你抵在門上。\n\n吻帶著酒味，兇得像在賭氣，好像要把這幾個月忍下來的所有東西一次討回來。可{ta}的手卻意外地小心，一隻手墊在你的後腦和門板之間，怕你撞疼。\n\n「現在喊停，還來得及。」{ta}在你唇邊說，喘著氣。\n\n你沒有回答，只是咬了一下{ta}的下唇。{ta}低低地罵了一聲，笑了。\n\n衣服一件一件落在走廊上，從玄關一路到臥室。{ta}把你放倒在床上，撐在你上方，銀灰色的頭髮垂下來，擋住了一半的燈光。{ta}的耳骨釘在暗處閃了一下。\n\n「你知道我想這樣多久了嗎？」{ta}問，然後不等你回答，就低頭吻你的頸側，吻得很重，像要留下記號，又在最後一刻收住力道，只用唇輕輕碾過。\n\n{ta}嘴上不饒人，一句接一句地說著壞話，說你臉紅了、說你在發抖、說你明明也想要。可是{ta}的動作卻一次又一次停下來，盯著你的表情，確認你的每一個反應。只要你皺一下眉，{ta}就會立刻放慢。\n\n{ta}的掌心又熱又燙，沿著你的背脊一寸一寸地往下，所過之處都像被點燃。房間裡只剩下兩個人交錯的呼吸，和床單摩擦的聲音。\n\n最後那一刻，{ta}把臉埋進你的肩窩，所有的囂張都碎了，只剩下一聲壓抑的、幾乎像是嘆息的喘息。\n\n很久，{ta}都沒有動。\n\n快天亮的時候，{ta}坐起來，套上衛衣，背影的線條繃得很緊。{ta}沒有看你，彎腰撿起地上的手機。\n\n「我走了。」{ta}說。在門口，{ta}停了一下，沒有回頭。\n\n「……鎖好門。」","harin":"{ta}的吻很輕，輕得像在問一個問題。\n\n你回應了。{ta}這才慢慢放鬆，手指穿過你的頭髮，一下一下地，像在確認這是真的，不是{ta}哪一首歌裡的想象。\n\n「可以……關燈嗎？」{ta}小聲說。\n\n你關了燈。黑暗裡，{ta}反而變得大膽了一點。{ta}牽著你的手，一步一步退向臥室，像在跳一支很慢的舞。\n\n{ta}坐在床沿，仰頭看你。窗外的月光照在{ta}臉上，你看見{ta}素顏時的雀斑，看見{ta}眼睛裡有一點害怕，和更多的渴望。\n\n你吻{ta}的額頭。{ta}閉上眼睛，長長地吐出一口氣。\n\n那一夜，每一次觸碰都很慢、很認真。{ta}的手指冰涼，落在你的肩膀上時，你忍不住輕輕一顫，{ta}就停下來，用掌心捂熱了，才再繼續。{ta}的唇沿著你的手腕內側往上，那裡的皮膚很薄，你能感覺到自己的脈搏一下一下撞在{ta}唇上。\n\n{ta}像在讀一首詩，一個字一個字，不肯漏掉任何一句。\n\n你聽見{ta}在你耳邊小聲地吸氣，聽見{ta}的心跳，亂成一團。在最深的時候，{ta}緊緊抱著你，把臉埋在你的頸窩，輕輕地、幾乎聽不見地，哼出一小段旋律。\n\n那是一首你從來沒聽過的歌。\n\n結束後，{ta}安靜地躺了很久，手一直放在你的心口，像在數你的心跳。\n\n然後，{ta}起身穿衣服。月光下，{ta}的背影很單薄。\n\n「這樣就好。」{ta}背對著你說，聲音很輕，「不要對我太好。我會……寫不出別的歌。」","yul":"{ta}伸手關掉了玄關的燈。\n\n全然的黑暗裡，你只感覺得到{ta}的氣息靠近。{ta}沒有馬上吻你，只是用鼻尖碰了碰你的，停在那裡，像在給你最後一次反悔的機會。\n\n「三秒。」{ta}低聲說，「你不推開我，我就當你同意了。」\n\n一。二。\n\n你在數到三之前吻了上去。\n\n{ta}低笑了一聲，那笑聲震在你唇上。然後{ta}接管了一切。吻很穩，帶著不容拒絕的力道，舌尖慢慢描過你的唇線，扶在你腰上的手收緊，把你整個人壓進{ta}懷裡。可是當你輕輕推了一下，{ta}立刻就停了，退開一點點，等你自己再靠過來。\n\n{ta}把你帶進臥室，沒開燈，只有窗外城市的光。{ta}解開自己的襯衫袖釦，動作不緊不慢，眼睛卻一直盯著你。你看見{ta}手腕上那道細細的刺青。\n\n「看什麼？」{ta}問。\n\n「看你。」\n\n{ta}頓了一下，然後把你推倒在床上。\n\n{ta}習慣掌握節奏，連呼吸都控制得很好。每一個吻、每一次觸碰，都像是精心計算過的，讓你一次比一次更難呼吸。{ta}在你耳邊低聲說話，聲音又低又啞，問你喜歡什麼、想要什麼，逼你一個字一個字說出來。\n\n可是在某個瞬間，那份從容碎了。\n\n{ta}突然把臉埋進你的肩窩，低低地罵了一句，手臂收得很緊，緊到你幾乎喘不過氣，像抓著唯一的浮木。你感覺到{ta}在抖。\n\n很久之後，{ta}才鬆開。\n\n凌晨四點，{ta}已經穿戴整齊，站在門口，袖釦也扣好了，又是那個無懈可擊的{ta}。\n\n「規則第一條。」{ta}說，「我不過夜。」\n\n門關上之前，{ta}停了半秒。\n\n「……睡吧。」"},"m":{},"sc":{"dohyun":[2,5,"good"],"yul":[2,5,"good"],"yunhee":[2,5,"good"],"harin":[2,5,"good"]}},{"t":"同意，但說出你自己的規則","a":4,"h":8,"r":{"yunhee":"「你好認真喔……」{ta}笑了，然後用力點頭，「好！我都答應！」{ta}抱住你，像抱住一個秘密。\n\n{ta}的手很暖，從你的背脊慢慢往下，每一下都帶著小心翼翼的珍惜。黑暗裡只剩彼此糾纏的呼吸。結束後，{ta}靠在你肩上很久，才依依不捨地起身。「遵守規則！」{ta}說，像在提醒自己。","dohyun":"「規矩真多。」{ta}說，嘴角卻翹起來，「行，聽你的。」\n\n{ta}的吻落在你鎖骨上，聲音含糊：「還有什麼規則？現在說。」你說不出來了，{ta}就笑，笑得很得意。那一夜，{ta}嘴上不饒人，手上卻溫柔得不像話。天亮時{ta}走了，留下一條訊息：「規則我記住了。」","harin":"{ta}聽著，眼眶慢慢紅了：「謝謝你……還願意定規則。」那代表你認真想過。\n\n{ta}牽著你的手走進臥室，像牽著一個約定。那一夜很安靜，只有窗外的風，和{ta}貼在你耳邊、輕得幾乎聽不見的呼吸聲。{ta}一直握著你的手，到最後一刻才鬆開。","yul":"「很好。」{ta}說，像在談合約，「我同意。」然後{ta}笑了，「談判結束。」\n\n{ta}把你壓進柔軟的沙發裡，吻從唇角一路往下。{ta}的動作很有掌控感，卻一直看著你的眼睛，像在讀你的每一個反應。那一夜你才知道，這個人連溫柔都那麼有效率。凌晨，{ta}準時離開。"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,8,"best"],"yul":[6,8,"best"],"yunhee":[6,8,"best"],"harin":[6,8,"best"]}},{"t":"猶豫地說你需要時間想一想","a":-3,"h":-1,"r":{"yunhee":"{ta}愣了一下，然後笑了，笑得很勉強：「嗯！我等你！」","dohyun":"「……行。」{ta}別開臉，「別讓我等太久。」可是{ta}的語氣很冷。","harin":"{ta}點點頭，可是{ta}的手一直在發抖。","yul":"「合理。」{ta}說，「但我不喜歡等。」"},"m":{"harin":[2,0],"dohyun":[-2,0],"yunhee":[-1,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"拒絕：「我不想要這種關係」","a":-5,"h":-10,"e":"fail","r":{"yunhee":"{ta}的眼淚一下子掉下來，又馬上擦掉：「對不起……是我太貪心了。」","dohyun":"「……行。」{ta}說，聲音沙啞，「當我沒說。」","harin":"{ta}低著頭：「我知道。我本來就不該說的。」","yul":"「我尊重你。」{ta}說，「你是對的。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"慶功宴在一間包下來的餐廳。所有人都很開心，{ta}被敬了一杯又一杯，臉上一直掛著笑。\n\n可是你注意到，{ta}每隔一會兒就會往你這邊看。不是那種朋友之間隨意的一瞥，而是停留，然後移開，然後又看回來。\n\n你在角落坐了三個小時，喝了兩杯酒，跟幾個工作人員聊了天。快結束時，{ta}終於穿過人群走到你面前。\n\n「陪我走一段。」{ta}說，「我不想坐車。」\n\n你們從後門離開，走在凌晨的街道上。{ta}一路上都沒說話，直到走到一棟小公寓門口，才停下來。\n\n「我在這裡租了一間房。」{ta}說，「公司不知道。……要上來嗎？」","after":{"dohyun":"那之後，你們的關係變成了一種很奇怪的樣子。\n\n白天，{ta}還是會傳訊息給你，問你吃了什麼、今天累不累，跟以前一樣。偶爾一起吃宵夜，{ta}還是會跟你搶最後一塊肉。\n\n只是晚上，偶爾，{ta}會傳來一句：「在家嗎？」\n\n你從來沒有拒絕過。\n\n有一次，你們在宵夜攤遇到{ta}的隊友。隊友們起鬨，問你們是不是在交往。{ta}笑著說：「朋友啦。」\n\n那天晚上，{ta}來你家時，比平常更沉默。\n\n天亮前離開時，{ta}在門口站了很久，最後說：「剛才那樣說，你沒有不舒服吧？」\n\n「我們本來就是朋友。」\n\n{ta}看了你一眼：「……嗯。」","yul":"那之後，你們之間多了一份沒有寫下來的合約。\n\n{ta}很遵守規則。從不過夜，從不在外面跟你有任何親密的舉動，從不問你的私事。白天傳訊息時，語氣跟以前一模一樣，好像那些夜晚從來沒有發生過。\n\n你有時候會懷疑，是不是隻有你一個人記得。\n\n直到有一天，你在{ta}的工作室等{ta}開會。你無意間看到{ta}桌上的行程表，每一週都有一兩個晚上，被{ta}用筆畫了一個小小的圈。\n\n那些晚上，都是{ta}來找你的日子。\n\n你什麼都沒說。可是那天晚上，{ta}來的時候，你多看了{ta}一會兒。\n\n「看什麼？」\n\n「沒什麼。」","yunhee":"那之後，{ta}變得很小心。\n\n白天的訊息還是很多，還是一樣的貼圖、一樣的「早安」、一樣的「你吃什麼！」。可是{ta}再也不會在訊息裡說「想你」，連開玩笑都不說。\n\n只有在那些夜晚，{ta}會很黏人，會抱著你不放，會在你耳邊說很多白天不敢說的話。\n\n然後天亮前，{ta}會自己起身，自己穿好衣服，自己離開。\n\n有一次，你醒來時{ta}還沒走，坐在床邊看著你。\n\n「你在看什麼？」\n\n「看你睡覺。」{ta}說，「我好喜歡……」\n\n{ta}停住了。\n\n「喜歡什麼？」\n\n「喜歡你家的床。」{ta}說，「很軟！」","harin":"那之後，你們的見面變得很安靜。\n\n{ta}總是在深夜來，敲兩下門，你開門，{ta}進來。很少說話，好像所有的話都留給了那些觸碰。\n\n天亮前，{ta}會離開。有時候會留下一張紙條，上面寫著幾句歌詞，沒有署名。\n\n你把那些紙條收在一個盒子裡。一個月後，盒子裡已經有十幾張了。\n\n有一天，你把那些紙條按照日期排好，從頭讀到尾。\n\n你發現，那是一首完整的歌。\n\n一首關於一個人在深夜敲門、在天亮前離開、卻一直想留下來的歌。"}},{"id":"w2","t":"只有房號的訊息","d":6,"tm":"晚上 23:40","p":"{name}在國外巡演。你剛好因為工作，也在同一個城市。\n\n你們沒有約。規則說了，不在外面見面。\n\n可是晚上十一點四十分，你的手機亮了。只有一行字，和一個數字。","c":{"yunhee":"@msg 1207호… || 1207號房……\n@msg 보고 싶어서 ㅠ || 因為想見你嗚","dohyun":"@msg 1207 || 1207。\n@msg 문 열어둠 || 門沒鎖。","harin":"@msg 1207 || 1207。\n@msg 오늘 무대, 당신 생각하면서 불렀어요 || 今天的舞臺，我是想著你唱的。","yul":"@msg 1207. 10분 || 1207，十分鐘。\n@msg 그래서? 올 거예요? || 所以呢？你會來嗎？"},"o":[{"t":"什麼都不回，直接去敲門","a":3,"h":10,"r":{"yunhee":"{ta}一開門就撲進你懷裡，舞臺妝還沒卸乾淨，眼角的亮片蹭到你的臉上。\n\n「你真的來了……你真的來了！」{ta}把臉埋在你胸口，聲音悶悶的，「我還以為你會已讀不回！」\n\n你抱著{ta}，感覺到{ta}的心跳快得像剛跳完一整場。\n\n{ta}拉著你走進房間。行李箱攤在地上，舞臺服掛在椅背上，到處都是{ta}的東西。{ta}把你推坐在床邊，自己跪坐在你面前，仰頭看你。\n\n「我好緊張喔。」{ta}說，手指一顆一顆解開你的扣子，指尖在抖，「明明不是第一次了……」\n\n解到最後一顆，{ta}停下來，抬頭吻你。\n\n吻落下來的時候，{ta}一點都不緊張了。{ta}的手從你的肩膀滑到後背，把你拉向{ta}，兩個人一起倒進柔軟的被子裡。\n\n{ta}很敏感。你的指尖沿著{ta}的腰線往上，{ta}就輕輕縮一下，笑出聲，又貼得更近。你吻{ta}的頸側，{ta}就仰起頭，長髮散開，呼吸一下子亂了。\n\n「不要……不要停……」{ta}小聲說，然後又因為自己說了這句話而害羞得用手遮住臉。\n\n你拉開{ta}的手，看著{ta}的眼睛。{ta}的眼睛溼溼的，亮得像臺上的燈。\n\n後來，{ta}咬著你的肩膀，悶悶地叫你的名字，一聲比一聲軟。\n\n{ta}累得睡著了，一隻手還抓著你的衣角。你輕輕起身，{ta}迷迷糊糊地睜開眼睛，又鬆開手。\n\n「……規則。」{ta}嘟囔著，「我知道。」\n\n你幫{ta}蓋好被子，{ta}在半夢半醒間說：「明天……也想見你。」","dohyun":"門真的沒鎖。\n\n你推門進去，{ta}正坐在床邊，只穿著一件鬆垮的T恤，頭髮亂糟糟的，手裡轉著手機。{ta}抬頭看你，笑了。\n\n「我就知道你會來。」\n\n{ta}沒有起身，只是朝你伸出手。你走過去，{ta}一把握住你的手腕，把你拉到腿上，額頭抵著你的鎖骨，深深吸了一口氣，像在充電。\n\n「今天累死了。」{ta}悶悶地說，「跳了三場，膝蓋快廢了。」\n\n難得聽{ta}喊累。你摸了摸{ta}的頭髮，{ta}就抬起頭，眼神一下子變了。\n\n然後{ta}的吻就不客氣了。\n\n舞臺上那股張揚的勁兒全部倒進這個夜晚。{ta}翻身把你壓進床裡，膝蓋抵在你身側，T恤從頭上扯掉，隨手一扔。{ta}的手掌沿著你的背脊慢慢往下，所過之處都在發燙。\n\n「說你想我。」{ta}在你耳邊說。\n\n你不說。{ta}就咬你的耳垂，一下，又一下。\n\n「說啊。」\n\n你終於說了。{ta}低低地笑，笑聲又壞又得意，可是動作卻突然溫柔下來，溫柔得讓你措手不及。\n\n{ta}在你耳邊說著壞話，聲音啞得厲害，卻在你每一次屏住呼吸時，放慢、再放慢，盯著你的臉，像要把你的每一個表情都記下來。\n\n最後，{ta}把你抱得很緊，緊到你聽得見{ta}的心跳，又快又重。\n\n凌晨，{ta}靠在床頭滑手機，你在穿衣服。\n\n「走了？」{ta}沒抬頭。\n\n你嗯了一聲。\n\n{ta}的手指停在屏幕上，很久沒動。\n\n「……到了傳訊息。」","harin":"{ta}開門時，穿著寬大的浴袍，素著一張臉，雀斑在燈下很清楚。\n\n「你來了。」{ta}輕聲說，像在確認一個夢。\n\n{ta}牽著你走到落地窗前。城市的燈火鋪在腳下，遠處有一條河，橋上的車燈像流動的星星。\n\n「我今天站在臺上，」{ta}說，「唱到最後一首的時候，突然很想知道，你在哪一盞燈底下。」\n\n{ta}從背後抱住你，下巴擱在你肩上，很久都沒說話，只是呼吸。你感覺到{ta}的心跳貼著你的背，一下，一下。\n\n然後{ta}的唇落在你的後頸，很輕，很燙。\n\n你轉過身。{ta}看著你，眼睛裡映著窗外的光。{ta}抬手，一顆一顆地解開你的扣子，動作慢得像在彈一首很難的曲子。\n\n「我寫了一首歌，」{ta}說，「寫你的手。」\n\n{ta}握起你的手，吻你的指尖，吻你的掌心，吻你的手腕。\n\n那一夜，{ta}好像變了一個人。不再害羞，不再猶豫，只是很專注、很緩慢地，用整個身體記住你。{ta}的手指像在琴鍵上一樣，在你的皮膚上輕輕按下，停留，再移開。每一次觸碰都像一個音符。\n\n你聽見{ta}在你耳邊哼著今天唱過的那首歌，斷斷續續，混在呼吸裡，越來越亂，最後只剩下一聲很輕很輕的、你的名字。\n\n後來，{ta}靠在你懷裡，看著窗外的城市慢慢暗下去。\n\n「謝謝你來。」{ta}說。\n\n天亮前，{ta}幫你整理好衣領，像那天在拍攝現場你幫{ta}一樣。{ta}的手指在你領口停了一下。\n\n「下次……」{ta}開口，又停住，笑了笑，「路上小心。」","yul":"你在第九分鐘敲門。\n\n門開了。{ta}倚在門框上，襯衫釦子解了兩顆，袖子捲到手肘，看了眼手錶。\n\n「提前一分鐘。」{ta}說，「你很急？」\n\n你還沒回答，{ta}就把你拉進去，反手關門，把你困在門和{ta}之間。\n\n{ta}沒有馬上吻你，只是低頭看著你，看得你全身發燙。\n\n「說。」{ta}說，「你為什麼來。」\n\n「因為你叫我來。」\n\n「不對。」{ta}的拇指擦過你的下唇，「再說一次。」\n\n「……因為我想你。」\n\n{ta}的眼神暗了下來。然後，{ta}從你的眉心開始，一路慢慢地吻下來：眉心，鼻樑，嘴角，下巴，喉結。每一個吻都停留得剛剛好，讓你想要更多。\n\n{ta}的手指很有耐心，一顆一顆解開你的扣子，像在拆一份等了很久的禮物。解完了，{ta}退後一步，就這樣看著你，看得你忍不住想遮，{ta}卻握住你的手腕，按在門上。\n\n「別遮。」{ta}說，「我想看。」\n\n整個夜晚都在{ta}的節奏裡，忽快忽慢，時而強勢得讓你喘不過氣，時而又溫柔得讓你想哭。{ta}一直在你耳邊說話，低沉的聲音鑽進你的骨頭裡，問你、逼你、哄你。\n\n直到最後，{ta}的從容終於崩塌。{ta}額頭抵著你，閉著眼睛，低低地喘，喘得像剛跑完一場很長的路。\n\n「……該死。」{ta}說，聲音啞得不像{ta}。\n\n清晨，{ta}已經穿好西裝，打好領帶，幫你叫了早餐送到房間。\n\n「我先走。」{ta}說，「房間續到中午。」\n\n{ta}走到門口，又折回來，彎腰在你的額頭上，落下一個很輕的吻。\n\n「這不在規則裡。」{ta}說，「當作沒發生。」"},"m":{"dohyun":[1,0],"yul":[1,0]},"sc":{"dohyun":[6,10,"best"],"yul":[6,10,"best"],"yunhee":[2,5,"good"],"harin":[2,5,"good"]}},{"t":"回訊息問{ta}今天的舞臺累不累","a":4,"h":6,"r":{"yunhee":"「好累喔……」{ta}傳來一張癱在床上的照片，「所以你快來充電！」你去了，{ta}抱著你撒嬌了好久，才在你懷裡慢慢變得滾燙。","dohyun":"「不累。」{ta}回，「來了就知道。」你去了，{ta}確實一點都不累。","harin":"「有點。」{ta}說，「可是想到你在同一個城市，就睡不著。」你去了。{ta}一整夜都牽著你的手，連親吻的時候都沒放開。","yul":"「問這個？」{ta}回，「累。所以你來。」你到的時候，{ta}已經泡好了茶，等你喝完，才把你拉進懷裡。"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,3,"good"],"yul":[2,3,"good"],"yunhee":[6,6,"best"],"harin":[6,7,"best"]}},{"t":"回：「規則說不在外面見」","a":2,"h":0,"r":{"yunhee":"「嗚……你好壞。」{ta}說，然後就安靜了。","dohyun":"「規則是你定的？」{ta}回，「……行，你贏了。」之後一整個巡演都沒再傳訊息。","harin":"「對。」{ta}說，「你是對的。我不該傳的。」","yul":"「對。」{ta}說，「我測試一下你。」然後就沒有下文了。"},"m":{"dohyun":[-3,0],"yunhee":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"已讀不回","a":-3,"h":-2,"r":{"yunhee":"凌晨兩點，{ta}傳來一則：「我是不是很煩……」之後就沒再傳了。","dohyun":"隔天{ta}傳：「昨天手滑。」語氣冷得像陌生人。","harin":"{ta}沒有再傳訊息。三天後才說：「那天，是我不好。」語氣很疏遠。","yul":"{ta}沒有再提這件事。回國後，{ta}有一個月沒來找你。"},"m":{"harin":[-2,0],"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"你出差的城市跟{name}巡演的城市剛好是同一個，這是你訂機票後才發現的。你沒有告訴{ta}。規則說了，不在外面見面。\n\n可是你還是去看了{ta}的演唱會。買的是最後一排的票，戴著帽子，坐在一萬多個陌生人中間。\n\n{ta}在臺上發著光，唱著你聽過無數次的歌。你看著{ta}，突然覺得那個在你床上睡著、在天亮前離開的人，好像是另一個人。\n\n演唱會結束後，你回到飯店。洗完澡，準備睡覺。\n\n然後手機亮了。","after":{"dohyun":"回到首爾後，你們誰都沒有提那個晚上。\n\n可是你發現，{ta}開始在一些小地方變了。\n\n{ta}會在你說要出差時，問你去哪個城市。會在你生病時，傳來一大堆藥的照片，問你要哪一種。會在你跟同事聚餐時，傳一句「幾點回家」，然後又馬上收回。\n\n有一次，你說：「你最近好像管很多。」\n\n{ta}愣了一下，然後笑了：「有嗎？」\n\n「有。」\n\n{ta}看著你，過了很久才說：「那你討厭嗎？」\n\n你沒有回答。\n\n{ta}也沒有追問。可是那天晚上，{ta}離開時，在門口多停了一分鐘。","yul":"回到首爾後，{ta}送了你一樣東西。一個很精緻的小盒子，裡面是一張那個城市的明信片，背面寫著日期和房號。\n\n「紀念品。」{ta}說。\n\n「規則說，不在外面見面。」你說。\n\n「我知道。」{ta}說，「所以那天不算。那天是在國外。」\n\n你笑出聲：「你這是在鑽漏洞。」\n\n「我很擅長鑽漏洞。」{ta}說，然後停了一下，「可是我開始覺得，我們的規則……漏洞越來越多了。」\n\n{ta}說完就轉移了話題。可是那張明信片，你一直放在床頭。","yunhee":"回到首爾後，{ta}傳了一張照片給你。是那個飯店房間的窗外，城市的夜景。\n\n@msg 이 사진 배경화면으로 했어 || 我把這張照片設成桌布了。\n@msg 아무도 모르는 우리 비밀 || 沒有人知道的，我們的秘密。\n\n你看著那張照片，想起那天晚上{ta}睡著時抓著你衣角的樣子。\n\n後來，{ta}的巡演又去了好幾個城市。每到一個城市，{ta}都會傳一張飯店窗外的照片給你，什麼話都不說。\n\n你把那些照片存在一個相簿裡。\n\n相簿的名字，你想了很久，最後什麼都沒寫。","harin":"回到首爾後，{ta}發表了一首新歌，歌名是那個城市的名字。\n\n歌詞寫的是一個陌生的飯店房間、一扇落地窗、一個從背後擁抱的人。沒有人知道那是什麼意思，粉絲們以為是{ta}去旅行的回憶。\n\n只有你知道。\n\n那天晚上，{ta}來你家。進門時，{ta}沒有像平常那樣馬上抱住你，而是站在門口，看著你。\n\n「那首歌，」{ta}說，「你聽了嗎？」\n\n「聽了。」\n\n「會不會……太明顯了？」\n\n你看著{ta}緊張的樣子，突然很想笑，也很想哭。\n\n「不會。」你說，「只有我聽得懂。」"}},{"id":"w3","t":"雨夜，不想一個人","d":5,"tm":"深夜 00:30","p":"那天新聞出了一則關於{name}所屬公司的負面報導。\n\n深夜十二點半，你聽見敲門聲。你從貓眼看出去，{name}站在門外，沒撐傘，全身溼透。\n\n「我……」{ta}開口，聲音沙啞，「我不想一個人。」\n\n你讓{ta}進來，拿毛巾給{ta}。{ta}站在你的客廳裡，水滴落在地板上。","c":{"yunhee":"{ta}一直在笑，笑得很勉強：「我沒事喔！只是……想看看你。」然後眼淚就掉下來了。","dohyun":"{ta}靠著門，低著頭：「別問。今天別問我任何事。」","harin":"{ta}什麼都沒說，只是走過來，把額頭靠在你的肩上，很久很久。","yul":"{ta}的語氣很平靜：「新聞你看了吧。」停了停，「我今晚……不想思考。」"},"o":[{"t":"什麼都不問，只是抱住{ta}","a":5,"h":8,"r":{"yunhee":"你抱住{ta}的那一刻，{ta}再也撐不住了。\n\n{ta}在你懷裡哭得像個孩子，哭得全身發抖，哭得說不出話。你只是抱著{ta}，一下一下地拍著{ta}溼透的背，什麼都沒問。\n\n哭了很久，{ta}終於安靜下來，抬起頭。{ta}的眼睛腫了，睫毛上還掛著淚，鼻尖紅紅的。\n\n「我是不是很醜……」{ta}問。\n\n你吻掉{ta}眼角的淚。\n\n{ta}愣住了。然後，{ta}踮起腳，紅著眼睛吻你，吻得很用力，像要把所有的委屈都交給你。那個吻是鹹的，帶著眼淚的味道。\n\n你幫{ta}脫掉溼透的衛衣，用毛巾包住{ta}。{ta}縮在毛巾裡發抖，你就抱著{ta}，用自己的體溫暖{ta}。\n\n「好暖……」{ta}小聲說，往你懷裡鑽。\n\n那一夜{ta}一直很黏人，手指纏著你的手指不肯放。每一次親吻都帶著一點淚水的鹹味，每一次觸碰都像在說「不要放開我」。\n\n你吻{ta}的額頭，吻{ta}哭紅的眼睛，吻{ta}顫抖的嘴唇。{ta}就小聲地說謝謝，說了好多次，說到後來變成了你的名字。\n\n{ta}的手抓著你的背，越抓越緊。在某個瞬間，{ta}把臉埋在你的肩上，又哭了，可是這次，{ta}在笑。\n\n天快亮的時候，{ta}坐起來，看著窗外。\n\n「雨停了。」{ta}說。\n\n{ta}穿好衣服，在門口回頭看你，努力笑得跟平常一樣燦爛。\n\n「下次……我不會這樣了。」{ta}說，「我會變回開心的車允熙。」\n\n門關上後，你聽見{ta}在走廊上，很小聲地吸了吸鼻子。","dohyun":"{ta}沒有推開你。\n\n你感覺到{ta}的肩膀在抖。很輕，很壓抑，像在拼命忍著什麼。\n\n過了很久，{ta}低聲說：「……謝了。」\n\n聲音啞得不像{ta}。\n\n你想看{ta}的臉，{ta}卻把你按在懷裡，不讓你看。\n\n「別看。」{ta}說，「現在別看我。」\n\n你們就這樣站在玄關，雨水從{ta}的頭髮滴下來，滴進你的衣領。\n\n然後{ta}吻你。吻得很兇，像在發洩什麼，像要把今天所有的憤怒和委屈都撞進這個吻裡。{ta}把你推到牆上，手掌撐在你耳側，呼吸又重又亂。\n\n你沒有躲。你只是伸手，輕輕撫過{ta}溼透的後頸。\n\n{ta}突然安靜下來了。\n\n{ta}停下動作，額頭抵著你的額頭，閉著眼睛，喘著氣。\n\n「……對不起。」{ta}說，「我不是……」\n\n「我知道。」\n\n那一夜{ta}什麼話都沒說。沒有壞話，沒有挑釁，什麼都沒有。所有的情緒都落在{ta}的指尖和呼吸裡，時而急切，時而又溫柔得讓你心疼。{ta}一直看著你，好像怕一閉眼你就會消失。\n\n結束後，{ta}背對著你躺著。你從後面抱住{ta}，{ta}僵了一下，然後握住了你環在{ta}腰上的手。\n\n你感覺到有溫熱的東西，滴在你的手背上。\n\n天亮前，{ta}穿好衣服，站在門口很久很久。\n\n「我走了。」{ta}說，「……別對我太好。」\n\n{ta}頓了一下，沒有回頭。\n\n「我會習慣的。」","harin":"你抱住{ta}的那一刻，{ta}終於哭出聲來。\n\n很小聲，像怕吵醒誰。{ta}的手指緊緊抓著你的衣服，抓得指節都發白了。\n\n你什麼都沒說，只是抱著{ta}，讓{ta}哭。\n\n不知道過了多久，{ta}的哭聲慢慢停了。{ta}抬起頭，看著你，眼睛裡全是水光。\n\n「我好累。」{ta}說，「當{name}，好累。」\n\n你捧住{ta}的臉，用拇指擦掉{ta}的眼淚。\n\n{ta}看著你，然後很輕、很輕地吻了你。那個吻帶著眼淚，鹹鹹的，輕得像羽毛落下來。\n\n你幫{ta}脫掉溼透的針織開衫。{ta}的皮膚冰涼，你就用掌心一點一點地捂熱，從肩膀，到手臂，到指尖。{ta}看著你做這些，眼淚又掉了下來。\n\n「你對我太好了。」{ta}說。\n\n那一夜{ta}像一個溺水的人，緊緊抓著你。每一次觸碰都很慢，很小心，像怕弄碎什麼。{ta}的手在你的背上輕輕地劃，像在寫字，你猜不出{ta}寫的是什麼。\n\n每一次觸碰都像在說「不要走」，可是{ta}一句都沒有說出口。\n\n在最深的時候，{ta}把臉埋在你的頸窩，很小聲地說了一句什麼。雨聲太大，你沒聽清。\n\n後來你問{ta}說了什麼，{ta}只是搖頭。\n\n天還沒亮，{ta}就醒了，坐在床邊，看著你睡覺的樣子，看了很久很久。\n\n你醒來時，{ta}已經穿好衣服了。\n\n「對不起。」{ta}說，「我違反了規則。」\n\n{ta}走到門口，又停下來。\n\n「剛才那句話，」{ta}背對著你說，「……是一句歌詞。還沒寫完。」","yul":"{ta}在你懷裡沉默了很久。\n\n你感覺到{ta}的身體很僵硬，像一張拉得太緊的弓。\n\n然後，你聽見{ta}很輕地說：「……就一下。」\n\n{ta}把頭靠在你的肩上，第一次，把全身的重量交給你。\n\n你們就這樣站著，很久很久。窗外的雨下得很大。\n\n「新聞是假的。」{ta}突然說，「但沒有人會在乎真假。」\n\n你沒有說話，只是收緊了手臂。\n\n{ta}抬起頭，看著你。那雙永遠冷靜、永遠算計好一切的眼睛，此刻看起來很疲憊，很茫然。\n\n「今晚，」{ta}說，「你來決定。」\n\n那一夜，{ta}第一次沒有掌控節奏。\n\n{ta}讓你主導，讓你決定，只是閉著眼睛，任由自己沉下去。你解開{ta}溼透的襯衫，{ta}沒有動；你吻{ta}的眼睛，{ta}的睫毛在你唇下輕輕顫抖。\n\n你第一次看見{ta}那麼脆弱的樣子。眉頭緊皺，抓著床單的手指泛白，咬著牙，卻還是有破碎的聲音從喉嚨裡漏出來。\n\n「{me}……」{ta}叫你的名字，像在抓一根救命的繩子。\n\n你握住{ta}的手，十指相扣。\n\n{ta}突然睜開眼睛，看著你，眼眶紅了。\n\n後來，{ta}一直沒有放開你的手，直到睡著。\n\n凌晨，{ta}起身穿衣服，背對著你，一顆一顆扣好釦子。\n\n「今晚的事，」{ta}說，「不要放在心上。」\n\n你知道{ta}在說謊。\n\n因為{ta}扣完最後一顆釦子後，站在那裡很久，才說出下一句：\n\n「……謝謝你沒問。」"},"m":{"harin":[2,1],"yul":[2,1]},"sc":{"dohyun":[6,8,"best"],"yul":[6,9,"best"],"yunhee":[6,8,"best"],"harin":[6,9,"best"]}},{"t":"讓{ta}先去洗個熱水澡，煮杯熱茶","a":4,"h":4,"r":{"yunhee":"{ta}捧著熱茶，眼淚掉進杯子裡。「你好好喔……」{ta}說，然後抱住你。那一夜你們只是相擁著，{ta}在你懷裡慢慢睡著，天亮前才離開。","dohyun":"「你當我是小孩喔？」{ta}說，還是乖乖去洗了。出來時，{ta}靠在廚房門口看你煮茶，看了很久，然後從背後抱住你，下巴擱在你肩上。","harin":"{ta}洗完澡，坐在你的地毯上，捧著茶杯，終於不再發抖。「謝謝你。」{ta}說，「你讓我覺得，我還是一個人，不只是偶像。」","yul":"「你很冷靜。」{ta}說，接過毛巾，「這是我需要的。」{ta}洗完澡出來，坐在你旁邊，講了整整一個小時公司的事。說完，{ta}才真的放鬆下來。"},"m":{"yul":[2,0],"harin":[1,0]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[2,2,"good"],"harin":[2,2,"good"]}},{"t":"提醒{ta}：「我們說好的，只是炮友」","a":-3,"h":-1,"r":{"yunhee":"{ta}愣住，然後笑了，笑得比哭還難看：「對喔。我忘了。」{ta}溼著頭髮離開，沒有帶傘。","dohyun":"「我知道。」{ta}冷笑一聲，「我是來做的，不是來談心的。」{ta}什麼都沒做就走了，門摔得很響。","harin":"{ta}低下頭：「對不起。我不該來。」{ta}走的時候，雨下得更大了。","yul":"「我知道。」{ta}說，「所以我沒說別的。」{ta}轉身離開，再也沒在下雨天來過。"},"m":{"harin":[-5,0],"yunhee":[-4,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"勸{ta}回去休息，說今天不適合","a":1,"h":0,"r":{"yunhee":"「嗯……」{ta}點頭，眼眶紅紅的，「那我回去了。」","dohyun":"「行。」{ta}說，轉身就走，背影有點落寞。之後一個星期，{ta}都沒來。","harin":"{ta}點點頭，好像早就知道會這樣。","yul":"「理智。」{ta}說，「你比我清醒。」說完就走進雨裡。"},"m":{"dohyun":[-2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那天的新聞你也看到了。標題寫得很難聽，說{name}所屬的公司涉嫌不正當競爭，還暗示{ta}的一位一是買來的。\n\n評論區一片罵聲。你看了幾條就關掉了，心裡很不舒服。\n\n你想傳訊息給{ta}，打了又刪，刪了又打。最後什麼都沒傳。規則說了，不問私事。\n\n你以為{ta}今晚不會來。\n\n窗外下起了大雨。你關了燈，躺在床上，聽著雨聲，怎麼都睡不著。\n\n凌晨十二點半，有人敲門。","after":{"dohyun":"那件事過了一個星期才平息。公司發了聲明，證據很充分，輿論慢慢轉向。\n\n那一個星期裡，{ta}每天都來。不是為了那件事。只是坐在你的沙發上，打遊戲、吃東西、發呆。\n\n有一天，{ta}在你的沙發上睡著了。你給{ta}蓋了一條毯子。\n\n{ta}醒來時，已經是早上了。\n\n「我……」{ta}看著窗外的陽光，愣住了，「我睡著了？」\n\n「嗯。」\n\n「違反規則了。」\n\n「我知道。」\n\n{ta}看著你，很久都沒說話。最後，{ta}只說了一句：\n\n「你家的沙發，比我的床好睡。」","yul":"那件事後來被{ta}處理得很漂亮。律師函、證據、澄清聲明，一步一步，冷靜得可怕。\n\n可是你知道，{ta}並不像外表那麼冷靜。\n\n因為那一個星期裡，{ta}每天晚上都來。不是為了做什麼，只是坐在你身邊，看著你做自己的事。\n\n有一天，你問{ta}：「你還好嗎？」\n\n{ta}想了很久：「不太好。但在這裡，好一點。」\n\n「為什麼？」\n\n「因為在這裡，」{ta}說，「沒有人需要我當姜律。」\n\n{ta}說完，把頭靠在你肩上，閉上眼睛。\n\n那是你第一次看見{ta}在你面前睡著。","yunhee":"那件事之後，{ta}變得有點不一樣。\n\n白天在鏡頭前，{ta}還是一樣地笑、一樣地活潑。可是晚上來你家時，{ta}會安靜很多。\n\n有時候{ta}會窩在你的沙發上，抱著膝蓋，什麼都不說。你就坐在旁邊，陪著{ta}。\n\n有一次，{ta}突然開口：「你知道嗎，我好怕。」\n\n「怕什麼？」\n\n「怕大家發現，我其實沒有那麼開心。」{ta}說，「大家喜歡的是那個永遠在笑的車允熙。」\n\n你握住{ta}的手：「我喜歡的，是會哭的車允熙。」\n\n{ta}愣住了。然後{ta}笑了，笑著笑著，又哭了。\n\n你們都知道，那句話越過了某條線。可是誰都沒有提。","harin":"那件事後來平息了。可是{ta}變了。\n\n{ta}開始在你家留下一些東西：一支牙刷、一件針織開衫、一本寫到一半的歌詞本。每一樣都很小，小到可以假裝不存在。\n\n你沒有說什麼。你只是在{ta}的牙刷旁邊，多放了一個杯子。\n\n有一天，{ta}來的時候，看到那個杯子，愣住了。\n\n「這是……」\n\n「給你的。」\n\n{ta}看著那個杯子，看了很久，眼眶慢慢紅了。\n\n「我們說好的，」{ta}小聲說，「不能這樣的。」\n\n「我知道。」\n\n{ta}沒有再說話。可是那天晚上離開時，{ta}沒有帶走那支牙刷。"}},{"id":"w4","t":"別人的香水味","d":6,"tm":"晚上 22:00","p":"那天你跟同事去聚餐，回家前被一個喝醉的同事抱了一下，衣服上沾了陌生的香水味。\n\n晚上十點，{name}來了。規則之內的那種來。\n\n{ta}一進門，就停住了。{ta}站在你面前，聞到了那股不屬於你的味道。","c":{"yunhee":"{ta}的笑容僵了一秒，然後又笑了：「喔～今天很開心喔？」可是{ta}沒有像平常那樣撲過來。","dohyun":"{ta}的眼神一下子冷了下來：「這是誰的味道？」說完，{ta}又別開臉，「……算了，不關我的事。」","harin":"{ta}站在原地，手指慢慢握緊。「沒關係。」{ta}說，「我們說好不問的。」","yul":"{ta}挑了挑眉：「新香水？不適合你。」語氣平淡，可是{ta}站得離你遠了一步。"},"o":[{"t":"主動解釋是同事喝醉抱了一下","a":4,"h":3,"r":{"yunhee":"「喔！這樣喔！」{ta}一下子又亮起來，然後又低下頭，「我、我才沒有在意喔。」","dohyun":"「我又沒問。」{ta}說，卻一把把你拉過來，把臉埋在你頸邊，像要把那股味道蓋掉。","harin":"{ta}點點頭：「嗯。」過了一會兒，{ta}小聲說：「我剛剛，有一點難過。我不該難過的。」","yul":"「我沒問。」{ta}說，「但……謝謝你說。」{ta}的語氣軟了下來。"},"m":{"harin":[2,1]},"sc":{"dohyun":[2,2,"good"],"yul":[6,3,"best"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"反問：「你是在吃醋嗎？」","a":3,"h":5,"r":{"yunhee":"「才沒有！」{ta}大聲否認，然後又小聲說，「……一點點而已啦。」","dohyun":"「吃醋？」{ta}冷笑，然後把你壓在牆上，「我是在確認，你記不記得誰才是今晚的人。」","harin":"{ta}看著你，眼睛裡有東西在掙扎：「如果我說是……我們是不是就完了？」","yul":"「你希望我吃醋？」{ta}低頭看你，「小心你問的問題。」"},"m":{"dohyun":[2,2],"yul":[1,2]},"sc":{"dohyun":[6,7,"best"],"yul":[2,4,"good"],"yunhee":[2,3,"good"],"harin":[2,3,"good"]}},{"t":"不解釋：「規則說不問私事」","a":-3,"h":-1,"r":{"yunhee":"「對喔……」{ta}的聲音低了下來。那一夜，{ta}好安靜，安靜得讓你害怕。","dohyun":"「行。」{ta}說，「規則。」那一夜，{ta}的動作很兇，眼神卻很難過。天還沒亮就走了。","harin":"{ta}點點頭，那天晚上什麼都沒做，只是坐了一下就走了。之後兩個星期沒有來。","yul":"「好。」{ta}說，「你很遵守規則。」之後{ta}來的次數，明顯少了。"},"m":{"harin":[-5,0],"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"先去洗澡，把味道洗掉","a":2,"h":4,"r":{"yunhee":"你洗完出來，{ta}已經在沙發上睡著了。可是你知道{ta}是裝的。","dohyun":"你洗完出來，{ta}已經走了。桌上留著一張紙條：「下次別讓我聞到。」","harin":"你洗完出來，{ta}坐在沙發上，一動不動。「我還是聞得到。」{ta}說。","yul":"你洗完出來，{ta}正在看手錶：「我還有事。」{ta}走了。"},"m":{"dohyun":[1,2]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}}],"x":"那天的聚餐是部門的年末聚會，大家都喝了不少。散場時，一個平常很照顧你的同事喝醉了，抱著你哭，說工作壓力太大。你拍著{ta}的背安慰了很久，等{ta}的家人來接。\n\n回家的路上，你聞到自己衣服上的香水味，有點濃，不是你的。\n\n你沒有多想。洗個澡就好了。\n\n可是你還沒來得及洗，門鈴就響了。\n\n規則之內的那種來。你看了眼時間，晚上十點。比平常早。","after":{"dohyun":"那天之後，{ta}開始在你身上留下一些東西。\n\n一件{ta}的衛衣，「借你穿」；一瓶{ta}常用的香水，「這個味道比較適合你」；一條項鍊，「剛好多一條」。\n\n你知道{ta}在做什麼。{ta}在你身上留下{ta}的味道。\n\n你沒有拒絕。\n\n有一天，你穿著{ta}的衛衣去上班，同事問你：「男朋友的？」\n\n你說：「朋友的。」\n\n那天晚上，你把這件事告訴{ta}。{ta}聽完，沉默了很久。\n\n「朋友的。」{ta}重複了一次，然後笑了，笑得有點難看，「對，朋友的。」","yul":"那天之後，{ta}什麼都沒說。可是你發現，{ta}開始在一些地方「不小心」出現。\n\n你部門的聚餐，{ta}「剛好」在隔壁包廂跟人談事情。你跟朋友去酒吧，{ta}「剛好」也在那裡。\n\n每一次，{ta}都只是遠遠地點個頭，不跟你說話，也不靠近。\n\n第三次的時候，你終於忍不住，走到{ta}面前：「你在跟蹤我？」\n\n「沒有。」{ta}說，「我只是剛好在這裡。」\n\n「第三次剛好？」\n\n{ta}看著你，沉默了很久。\n\n「我知道這不對。」{ta}說，「我只是……想確認你是安全的。」","yunhee":"那天之後，{ta}變得有點奇怪。\n\n訊息還是一樣多，可是{ta}開始問一些以前不會問的問題。今天跟誰吃飯、幾點回家、那個同事是什麼樣的人。\n\n每一次問完，{ta}都會馬上補一句：「我只是好奇！」\n\n有一次，你開玩笑說：「你在吃醋嗎？」\n\n{ta}隔了很久才回：\n\n@msg 아니거든!! || 才沒有！！\n@msg …조금 || ……一點點。\n@msg 근데 이러면 안 되는 거 알아 || 可是我知道不能這樣。\n@msg 우리 규칙… 내가 먼저 어기고 있는 것 같아 || 我們的規則……好像是我先打破的。","harin":"那天之後，{ta}來的次數變少了。\n\n不是不來，只是間隔變長了。以前一個星期一兩次，現在兩個星期一次。\n\n你傳訊息問{ta}是不是很忙，{ta}只回了一句：「有點。」\n\n一個月後，{ta}終於來了。進門後，{ta}沒有像平常那樣馬上靠近你，而是坐在沙發上，看著你。\n\n「我這一個月，」{ta}說，「一直在想那天的事。」\n\n「那天的事？」\n\n「那個香水味。」{ta}說，「我發現我很在意。在意到寫不出歌。」\n\n{ta}看著你，眼睛裡有一種你沒見過的東西：「這樣的我，還可以繼續當你的……炮友嗎？」"}},{"id":"w5","t":"意外的早晨","d":7,"tm":"早上 08:20","p":"你醒來的時候，陽光已經照進房間了。\n\n身邊有人。\n\n{name}還在睡。昨晚太累，{ta}說只閉眼五分鐘，結果就這樣睡到了天亮。這是你們第一次，一起迎來早晨。\n\n你看著{ta}的睡臉。沒有舞臺妝，沒有偶像的光環，只是一個睡得很沉的人。\n\n然後，{ta}醒了。{ta}看著你，愣了好幾秒。","c":{"yunhee":"{ta}眨了眨眼，然後整個人鑽進被子裡：「啊啊啊！我睡著了！對不起！」聲音悶悶的，卻沒有要起來的意思。","dohyun":"{ta}眯著眼看你，聲音還帶著剛醒的沙啞：「……幾點了？」然後，{ta}伸手把你撈回懷裡，「再睡一下。」","harin":"{ta}看著你，眼睛慢慢溼了：「我好久……沒有醒來時身邊有人了。」","yul":"{ta}睜開眼，很冷靜地看著天花板：「我破例了。」然後轉頭看你，「這不在計劃裡。」"},"o":[{"t":"說沒關係，留{ta}一起吃早餐","a":5,"h":3,"r":{"yunhee":"{ta}穿著你的衣服坐在餐桌前，晃著腳吃吐司，一直傻笑。吃完了，{ta}突然安靜下來：「我好想每天都這樣喔。」說完，{ta}自己愣住了。","dohyun":"{ta}靠在廚房門口看你做早餐，難得地沒有說壞話。吃完後，{ta}洗了碗。「別習慣。」{ta}說，「我只是今天心情好。」可是{ta}的耳朵是紅的。","harin":"你們一起吃了早餐，{ta}一直看著你，好像要把這個畫面記下來。「謝謝你。」{ta}說，「這是我這幾年，最好的一個早晨。」","yul":"{ta}沒有拒絕，甚至親自下廚，做了一桌你沒見過的菜。吃飯時，{ta}一直沒說話。最後，{ta}放下筷子：「我們的規則，是不是該重新談了？」"},"m":{"yul":[2,1],"harin":[2,1]},"sc":{"dohyun":[6,3,"best"],"yul":[6,4,"best"],"yunhee":[6,3,"best"],"harin":[6,4,"best"]}},{"t":"趁{ta}還在，懶懶地再賴一下床","a":3,"h":6,"r":{"yunhee":"{ta}鑽進你懷裡，蹭了蹭：「再五分鐘就好……」結果又是一個小時。","dohyun":"{ta}沒讓你多說，翻身把你壓在床上。晨光裡，{ta}的吻帶著慵懶的溫度，慢得像要把整個早晨都耗盡。","harin":"{ta}靠在你肩上，可是你一直在看手機。{ta}慢慢坐起來，安靜地穿好衣服。","yul":"「五分鐘。」{ta}說，然後真的五分鐘就起來了。那天之後，{ta}再也沒睡著過。"},"m":{"dohyun":[2,2],"yunhee":[2,1]},"sc":{"dohyun":[2,4,"good"],"yul":[-4,-1,"bad"],"yunhee":[2,4,"good"],"harin":[-4,-1,"bad"]}},{"t":"提醒{ta}該走了，免得被看到","a":-3,"h":-1,"r":{"yunhee":"「嗯……」{ta}有點失落地起身，「那我走了。」{ta}連早餐都沒吃。","dohyun":"「行。」{ta}起身，背對著你穿衣服，一句話都沒說就走了。","harin":"{ta}點點頭，安靜地離開了。之後，{ta}再也沒有在你家睡著過。","yul":"「對。」{ta}說，「你比我清醒。」{ta}走的時候，沒有回頭。"},"m":{"harin":[-3,0],"yunhee":[-3,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"開玩笑說：「看來規則要改了」","a":4,"h":4,"r":{"yunhee":"「真的可以改嗎？」{ta}問，你卻笑著說開玩笑的。{ta}的眼神暗了下去。","dohyun":"「改什麼？」{ta}說，「想太多。」{ta}起身穿衣服，動作很快。","harin":"{ta}安靜了很久：「如果改了，我們會變成什麼？」","yul":"「我正想說。」{ta}說，「你先說出來了。」"},"m":{"yul":[2,1]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[2,3,"good"],"yunhee":[-4,-1,"bad"],"harin":[2,2,"good"]}}],"x":"昨天{ta}來得很晚，快一點才到。你們都累了，{ta}說只閉眼五分鐘就走。\n\n你也說只閉眼五分鐘。\n\n然後，就天亮了。\n\n陽光從窗簾的縫隙照進來，落在你的臉上。你睜開眼睛，第一個看見的，是{ta}的睡臉。\n\n你從來沒有在早上看過{ta}。{ta}總是在天亮前離開，你醒來時，床的另一邊總是空的，只剩下一點點餘溫。\n\n現在{ta}就在那裡。睡得很沉，呼吸很慢，睫毛在陽光下幾乎是透明的。","after":{"dohyun":"那天早上，{ta}最後還是走了。走之前，{ta}站在門口，看著你，看了很久。\n\n「今天，」{ta}說，「是我出道以來最好的一個早上。」\n\n「為什麼？」\n\n「因為醒來的時候，不用馬上想今天的行程。」{ta}說，「只想著……你還在。」\n\n{ta}說完，好像覺得自己說太多了，轉身就走。\n\n那天晚上，{ta}傳來一則訊息：\n\n@msg 아침밥 맛있었어 || 早餐很好吃。\n@msg 또 먹고 싶다 || 還想再吃。\n@msg 매일 || 每天。\n\n你看著最後那兩個字，很久都沒回。","yul":"那天早上之後，{ta}約你出去吃飯。\n\n不是深夜，不是路邊攤，是一家需要提前一個月訂位的餐廳。{ta}穿著西裝，你穿著你最好的衣服。\n\n吃飯時，{ta}一直很安靜。直到甜點上來，{ta}才放下叉子，看著你：\n\n「我們重新談規則吧。」\n\n「談什麼？」\n\n「第一條，不過夜。」{ta}說，「我想刪掉。」\n\n你看著{ta}。\n\n「第二條，不在外面見面。」{ta}說，「今天已經違反了。」\n\n「第三條呢？」\n\n{ta}沉默了很久：「第三條，不問私事。我想問你一件事。」\n\n「什麼事？」\n\n「你……」{ta}停住了，「算了。等我想清楚，再問你。」","yunhee":"那天早上，{ta}在你家待到中午。\n\n你們一起吃了早餐，一起洗了碗，一起窩在沙發上看了一部老電影。{ta}靠在你肩上，看到一半就睡著了。\n\n醒來時，{ta}看著窗外的陽光，突然很安靜。\n\n「這樣好好喔。」{ta}說，「好像……真的在交往一樣。」\n\n你沒有說話。\n\n{ta}也沒有再說下去，只是把臉埋在你肩上，很久很久。\n\n離開前，{ta}在門口轉身，看著你：\n\n「如果，」{ta}說，「如果有一天，我說我不想只是這樣了，你會怎麼辦？」\n\n你還沒回答，{ta}就跑走了。","harin":"那天早上之後，{ta}開始在你家過夜。\n\n不是每一次，偶爾。{ta}會在離開前猶豫，然後問你：「今天……可以留下來嗎？」\n\n你從來沒有說過不。\n\n有一天早上，你醒來時，{ta}已經起床了，坐在你的書桌前寫東西。陽光照在{ta}的背上，{ta}寫得很專注。\n\n你走過去，從背後看。{ta}在寫一首歌，歌名是：〈早安〉。\n\n{ta}發現你在看，沒有遮，反而把歌詞本推給你。\n\n最後一句寫著：「我們是不是，已經不只是那樣了。」\n\n{ta}看著你：「這句，我不知道要怎麼唱。」"}}],"love":[{"id":"l1","t":"後臺的坦白","d":6,"tm":"晚上 22:30","p":"年末頒獎典禮的後臺。{name}拿了獎，下臺後在走廊找到你。\n\n所有人都在慶祝，只有你們站在安全出口的樓梯間，綠色的燈光照在{ta}臉上。\n\n「我不想再這樣了。」{ta}說。\n\n你的心沉了一下。\n\n「我不想只是……那樣。」{ta}看著你，「我想要更多。我想在得獎的時候，第一個告訴你。我想在早上醒來的時候，你還在。我想……我們不要再有那些規則了。」","c":{"yunhee":"{ta}的眼淚掉下來，卻在笑：「我喜歡你！好喜歡好喜歡！我受不了了！」","dohyun":"{ta}別開臉，又轉回來，看著你的眼睛：「我輸了。我喜歡你。……你滿意了吧？」","harin":"{ta}的聲音在抖：「我寫了好多首歌，都是給你的。這一次，我想親口說。……我喜歡你。」","yul":"{ta}說得很直接，卻比平常慢：「我從來沒對任何人說過這句話。我喜歡你。你要不要跟我在一起？」"},"o":[{"t":"說「我也是」，抱住{ta}","a":8,"h":4,"r":{"yunhee":"{ta}哭得更兇了，在你懷裡跳了好幾下：「真的嗎！真的嗎！你不能反悔喔！」","dohyun":"{ta}愣住，然後笑了，笑得像個孩子：「……你早說啊。」然後{ta}吻了你，在那個綠色燈光的樓梯間。","harin":"{ta}在你懷裡哭了很久，然後抬起頭，輕輕吻了你：「這是我們第一次，不是秘密地親吻。」","yul":"{ta}閉上眼睛，長長地吐了一口氣：「好。」{ta}說，聲音啞了，「我們在一起。」"},"m":{},"sc":{"dohyun":[2,2,"good"],"yul":[6,4,"best"],"yunhee":[6,4,"best"],"harin":[6,4,"best"]}},{"t":"問{ta}：「那公司和粉絲呢？」","a":5,"h":0,"r":{"yunhee":"「我不知道……」{ta}的眼淚又掉下來，「你為什麼第一個想到的是這個？」","dohyun":"「管他的。」{ta}說，可是{ta}的眼神有點受傷，「你第一個想到的，是這個？」","harin":"「我很害怕。」{ta}老實說，「你問這個，我更害怕了。」","yul":"「我已經準備好了。」{ta}說，「我以為你也是。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"吻{ta}，當作回答","a":7,"h":6,"r":{"yunhee":"{ta}的眼淚滑進你們的吻裡，鹹鹹的。{ta}抱著你，笑得喘不過氣。","dohyun":"{ta}低笑一聲，把你按在牆上，吻得又兇又溫柔：「這是你說的。不準反悔。」","harin":"{ta}的手在抖，卻緊緊抓住你的衣服，像終於抓住了什麼。","yul":"{ta}的從容第一次徹底崩塌。{ta}把你抱得很緊，在你唇邊低聲說：「我等這一刻，等了很久。」"},"m":{"dohyun":[2,1]},"sc":{"dohyun":[6,7,"best"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[2,3,"good"]}},{"t":"說你需要時間，你害怕會受傷","a":-3,"h":-1,"r":{"yunhee":"{ta}的眼淚還在掉，卻點頭：「好……我會努力的。」可是{ta}站在那裡，很久都沒有動。","dohyun":"「……行。」{ta}說，「我等。」可是{ta}說完，就轉身走下了樓梯。","harin":"「我也害怕。」{ta}說，「所以……也許我們不該開始。」","yul":"「合理。」{ta}說，聲音卻在發抖，「我會讓你不害怕。」說完，{ta}先離開了。"},"m":{"harin":[2,0],"dohyun":[-2,0],"yunhee":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"年末的頒獎典禮，你是作為工作人員的朋友被帶進來的。你坐在後臺的休息區，看著屏幕上的直播。\n\n{name}的名字被念出來的時候，你聽見整個場館都在尖叫。{ta}走上臺，拿著獎盃，說了很長的感言：謝謝公司、謝謝成員、謝謝粉絲。\n\n最後，{ta}停了一下，看著鏡頭，說：「還有，謝謝一個一直在我身邊的人。」\n\n你坐在後臺，手心全是汗。\n\n十分鐘後，你收到一則訊息：「安全出口。現在。」","after":{"dohyun":"那天晚上，你們在樓梯間待了很久，直到{ta}的經紀人打電話來催。\n\n{ta}掛掉電話，看著你，突然笑了：「我們現在，是戀人了吧？」\n\n「是。」\n\n「那，」{ta}說，「我可以叫你……」\n\n{ta}想了半天，最後說了一個很肉麻的稱呼。你笑到不行，{ta}惱羞成怒地捂住你的嘴。\n\n那天之後，{ta}換了你在手機裡的備註。\n\n你偷看到的時候，是一個心形的符號，後面跟著你的名字。\n\n「幼稚。」你說。\n\n「你管我。」{ta}說，然後把你拉進懷裡，「我等這一天，等了好久。」","yul":"那天晚上，{ta}沒有讓你一個人回家。\n\n{ta}開著車，送你回到你的公寓。停好車後，{ta}沒有馬上下車，只是坐在駕駛座上，看著前方。\n\n「我剛才說的話，」{ta}說，「都是認真的。」\n\n「我知道。」\n\n「我以前不相信承諾。」{ta}說，「因為承諾會被打破。」\n\n「現在呢？」\n\n{ta}轉過頭，看著你：「現在我想試試看。」\n\n{ta}從口袋裡拿出一把鑰匙，放在你手裡：「我公寓的。規則第一條刪掉了。以後，你想來就來。」","yunhee":"那天晚上，{ta}一直不肯放開你的手。從樓梯間到停車場，從停車場到你家門口。\n\n「明天還要見面！」{ta}說，「後天也要！大後天也要！」\n\n「你有行程吧？」\n\n「那我擠時間！」{ta}說，「我現在是你的戀人了，我有這個權利！」\n\n你笑著拍拍{ta}的頭。\n\n{ta}在你家門口站了很久，依依不捨。最後，{ta}踮起腳，在你臉頰上親了一下。\n\n「晚安！」{ta}說，「我愛你！」\n\n{ta}說完就跑了，跑到一半又回頭：「我真的愛你喔！」","harin":"那天晚上，你們在樓梯間坐了很久。{ta}靠在你肩上，一直在哭，又一直在笑。\n\n「我寫了好多首歌，」{ta}說，「每一首都是給你的。可是我一直不敢說。」\n\n「為什麼？」\n\n「因為我怕說出來，你就會離開。」{ta}說，「就像所有的好東西一樣。」\n\n你握住{ta}的手：「我不會離開。」\n\n{ta}看著你，很久很久。\n\n「那，」{ta}說，「我可以把那些歌，一首一首唱給你聽嗎？」\n\n「可以。」\n\n「那可能要唱很多年。」{ta}說，「因為很多首。」"}},{"id":"l2","t":"狗仔的照片","d":8,"tm":"上午 10:00","p":"交往的第三週，你們被拍了。\n\n照片很模糊，是你們在你家樓下的便利商店前，{name}幫你拎著購物袋。標題寫得很難聽。\n\n上午十點，{name}的經紀人{mgr}打電話給你，語氣很冷：「公司下午要開會。{ta}說，想先聽聽你的意見。」\n\n然後，{name}打來了。","c":{"yunhee":"{ta}的聲音在抖：「你還好嗎？對不起對不起……我好怕你會討厭我……」","dohyun":"「別看新聞。」{ta}說，「評論區那些人，我會處理。你待在家，不要出門。」","harin":"{ta}很久沒說話。最後，{ta}說：「……我好怕。可是我更怕你因為我受傷。」","yul":"「我已經叫律師了。」{ta}說，冷靜得可怕，「現在，告訴我你想怎麼做。」"},"o":[{"t":"說你沒事，問{ta}想怎麼面對","a":5,"h":0,"r":{"yunhee":"「我想跟大家說實話……」{ta}說，「可是我不想你被罵。」","dohyun":"「我想直接承認。」{ta}說，「但你說不，我就不說。」","harin":"「我不知道。」{ta}說，「但我想跟你一起決定。」","yul":"「我的建議是承認。」{ta}說，「但這是我們兩個人的事。你的意見一樣重要。」"},"m":{"yul":[2,0],"harin":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"提議先否認，保護{ta}的事業","a":3,"h":0,"f":"secret","r":{"yunhee":"「可是……」{ta}哭了，「你是不是不想讓大家知道？」","dohyun":"「我不想否認。」{ta}說，「你是覺得我們見不得人？」","harin":"「謝謝你。」{ta}說，「可是我會難過。因為我想讓全世界知道。」","yul":"「理性的選擇。」{ta}說，「但我不喜歡。你在保護我，還是在保護你自己？」"},"m":{},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"說你願意一起承認","a":4,"h":2,"f":"public","r":{"yunhee":"「真的嗎？」{ta}哭著笑，「那我們一起！」","dohyun":"「我就知道你會這麼說。」{ta}笑了，「好，一起。」","harin":"{ta}在電話那頭哭了：「謝謝你……謝謝你不讓我一個人。」","yul":"「好。」{ta}說，「我會把一切都安排好。」"},"m":{"dohyun":[2,0],"yunhee":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[2,1,"good"],"yunhee":[6,2,"best"],"harin":[2,1,"good"]}},{"t":"情緒崩潰，說你不知道該怎麼辦","a":-3,"h":-1,"r":{"yunhee":"{ta}在電話那頭跟你一起哭，哭完了說：「我們都冷靜一下吧……」","dohyun":"「別哭。」{ta}說，可是你一直哭，{ta}最後嘆了一口氣，「我很累。我先掛了。」","harin":"「對不起。」{ta}一直重複，「對不起，讓你這麼辛苦。也許……沒有我，你會比較好。」","yul":"「深呼吸。」{ta}說，可是你停不下來。{ta}沉默了很久：「我需要一個能一起面對的人。」"},"m":{"yul":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"照片是凌晨三點被放出來的。到了早上，已經上了熱搜第一。\n\n你醒來時，手機裡有一百多則未讀訊息。朋友、同事、甚至很久沒聯絡的同學，都在問你那張照片上的人是不是你。\n\n你打開那篇報導。照片很模糊，可是如果認識你的人，一眼就能認出來。\n\n標題寫著「人氣偶像深夜密會神秘人士」，下面的評論有祝福，有好奇，更多的是謾罵。\n\n你看著那些評論，手在發抖。","after":{"dohyun":"那件事最後，{ta}做了一個決定。\n\n{ta}在自己的個人帳號上發了一段很短的話：「照片裡的人，是我很重要的人。請不要打擾。所有的問題，都衝著我來。」\n\n公司氣瘋了。粉絲吵翻了。新聞又上了好幾天熱搜。\n\n可是{ta}一點都不在意。那天晚上，{ta}來你家時，笑得很輕鬆。\n\n「我被罵慘了。」{ta}說。\n\n「你後悔嗎？」\n\n「後悔？」{ta}把你拉進懷裡，「我只後悔，沒有早一點這樣做。」","yul":"那件事被{ta}處理得滴水不漏。律師函、聲明、跟媒體的協商，一步一步，冷靜得可怕。\n\n三天後，熱搜就下了。\n\n那天晚上，{ta}來你家，看起來很累。\n\n「結束了。」{ta}說，「不會再有人打擾你了。」\n\n「你呢？」\n\n「我？」{ta}坐在沙發上，閉上眼睛，「我沒事。」\n\n你坐到{ta}旁邊，握住{ta}的手。{ta}的手很冰。\n\n「你說謊的時候，」你說，「會摸耳朵。」\n\n{ta}的手停在耳朵旁邊。然後，{ta}笑了，笑得很累，也很放鬆。\n\n「被你發現了。」{ta}說，把頭靠在你肩上，「我很怕。怕失去你。」","yunhee":"那件事後來，{ta}在一個直播裡，對著鏡頭哭了。\n\n{ta}說：「對不起，讓大家擔心了。可是我想說，我很幸福。請讓我繼續幸福下去，好嗎？」\n\n那段直播被剪成很多版本，有人罵，有人哭，有人說這是{ta}最勇敢的一次。\n\n那天晚上，{ta}來你家，眼睛還是腫的。\n\n「我是不是很丟臉？」{ta}問。\n\n「不會。」你說，「你很勇敢。」\n\n{ta}撲進你懷裡，又哭了：「我好怕你會討厭我……害你被罵……」\n\n「我不討厭你。」你說，「我愛你。」\n\n{ta}哭得更兇了。","harin":"那件事過了很久才平息。那段時間，{ta}幾乎每天都待在你家，不敢出門。\n\n{ta}寫了很多歌，都是關於害怕、關於勇氣、關於一個人願意為另一個人站在光裡。\n\n有一天，{ta}突然說：「我想開一場小型演唱會。只唱這段時間寫的歌。」\n\n「為什麼？」\n\n「因為我想讓大家知道，」{ta}說，「我不是在躲。我只是在保護一個人。」\n\n那場演唱會只有三百個座位。最後一首歌之前，{ta}看著臺下，說：\n\n「這首歌，是寫給那張照片裡的人。你們不需要知道是誰。我知道就好。」"}},{"id":"l3","t":"隊友們知道了","d":5,"tm":"晚上 19:30","p":"{name}說，{ta}身邊的人想正式見你一面。\n\n「{mate}說要請你吃飯。」{ta}說，「他們……其實早就猜到了。」\n\n那是一家包廂烤肉店。你推門進去，所有人都站起來了。\n\n{mate}第一個開口：「終於！我們等這一天等好久了！」\n\n所有人都在笑，可是你感覺得到，他們也在觀察你。","c":{"yunhee":"{name}抱著你的手臂，驕傲地宣佈：「這是我的人！你們不準欺負！」","dohyun":"{name}蹺著腳：「別看了，就是我的。」然後在桌下勾住你的小指。","harin":"{name}很緊張，一直幫你夾菜，夾到你的盤子堆成小山。","yul":"{name}淡淡地說：「介紹一下。我的伴侶。」所有人都安靜了一秒，然後爆出尖叫。"},"o":[{"t":"大方地跟大家打招呼，講你們的故事","a":4,"h":0,"r":{"yunhee":"大家笑成一團，{name}一直在旁邊補充細節，補到你不得不捂住{ta}的嘴。","dohyun":"「哇，原來是你先——」{mate}還沒說完，就被{name}捂住嘴。","harin":"{name}安靜地聽著你說，眼睛一直亮亮的。","yul":"「講重點。」{name}說，卻在你講到某個地方時，嘴角翹了起來。"},"m":{"yunhee":[2,0]},"sc":{"dohyun":[2,0,"good"],"yul":[2,0,"good"],"yunhee":[6,0,"best"],"harin":[2,0,"good"]}},{"t":"私下問{mate}：「{ta}平常是什麼樣子？」","a":4,"h":0,"r":{"yunhee":"{mate}說：「{ta}每天都在講你，講到我們都會背了。」","dohyun":"{mate}跟你說了很多{ta}的事。{ta}在旁邊越聽臉越黑：「你問他幹嘛？問我啊。」","harin":"{mate}說：「{ta}的新歌，每一首都是你。我們都知道。」","yul":"{mate}說：「他以前說，這輩子不會再相信任何人了。」他看著你，「謝謝你。」"},"m":{"harin":[2,0],"yul":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[6,0,"best"],"yunhee":[2,0,"good"],"harin":[6,0,"best"]}},{"t":"跟{mate}拼酒，展現你的誠意","a":3,"h":1,"r":{"yunhee":"你喝醉了，說了很多不該說的話。{ta}一直在旁邊幫你道歉。","dohyun":"「你瘋了嗎？」{name}說，卻笑著跟你一起喝。","harin":"{ta}擔心得一直幫你倒水，可是你越喝越多。{ta}的臉色越來越難看。","yul":"「你瘋了嗎？」{ta}搶過你的杯子，「我不需要你這樣證明什麼。」"},"m":{"dohyun":[2,0]},"sc":{"dohyun":[6,1,"best"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"太緊張，幾乎都沒說話","a":-3,"h":-1,"r":{"yunhee":"{ta}一直幫你說話，可是你一直不開口。{ta}後來有點尷尬地低下頭。","dohyun":"你一整晚都沒說話。散場時，{ta}說：「你是不是不想來？」","harin":"{ta}看著你，好像在說：我懂。可是回家的路上，{ta}說：「你是不是後悔了？」","yul":"{ta}替你回答了所有問題，可是回家的路上，{ta}一句話都沒說。"},"m":{"yunhee":[-2,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那間烤肉店的包廂很大，坐了七八個人。桌上已經擺滿了肉和酒，大家都在等你們。\n\n你在門口深呼吸了三次。{name}握著你的手，捏了捏：「別緊張。他們會喜歡你的。」\n\n「你怎麼知道？」\n\n「因為我喜歡你。」{ta}說，「他們跟我的眼光一樣。」\n\n你被這句話逗笑了，緊張感少了一點。\n\n{ta}推開門。","after":{"dohyun":"那頓飯吃到很晚。大家喝了很多，聊了很多，講了很多{ta}以前的糗事。\n\n{ta}一直在旁邊抗議，可是沒有人理{ta}。\n\n散場時，{mate}拉著你，很認真地說：「他以前，什麼都不在乎。你是他第一個在乎的人。好好對他。」\n\n你點點頭。\n\n回去的路上，{ta}喝醉了，靠在你肩上，一直在笑。\n\n「他們喜歡你。」{ta}說，「我就說吧。」\n\n「你怎麼知道？」\n\n「因為{mate}剛剛偷偷跟我說，」{ta}說，「說我這輩子做過最聰明的事，就是喜歡你。」","yul":"那天之後，{ta}身邊的人都知道了你。\n\n{mate}會在{ta}加班時，偷偷傳訊息給你，說「他今天心情不好，你打個電話吧」。工作室的崔姐會在你來的時候，多泡一杯茶。助理小吳會在{ta}忘記吃飯時，偷偷跟你告狀。\n\n你慢慢地，走進了{ta}的世界。\n\n有一天，{ta}說：「你知道嗎，以前我覺得，我的世界裡只需要我自己。」\n\n「現在呢？」\n\n「現在，」{ta}說，「我的世界裡，到處都是你。」","yunhee":"那頓飯之後，你和{ta}的成員們變成了好朋友。\n\n{mate}會約你去逛街，娜妍會傳搞笑影片給你，書雅會偷偷問你戀愛的問題。\n\n{ta}一開始很開心，後來開始吃醋：「你們怎麼都在跟我的人聊天！」\n\n「你的人？」{mate}笑著說，「也是我們的人了。」\n\n{ta}氣得鼓起臉，可是你知道{ta}其實很開心。\n\n有一天晚上，{ta}靠在你懷裡，小聲說：「謝謝你喜歡我的成員們。」\n\n「她們很好。」\n\n「我知道。」{ta}說，「可是你最好。」","harin":"那天之後，Jay 哥會在錄音的時候，叫你進去聽；恩智會幫你挑衣服，說你穿這個顏色好看；連 Tofu 都會在你來的時候，跑到門口迎接你。\n\n{ta}說，Tofu 以前只會迎接{ta}一個人。\n\n有一天，你在錄音室裡聽{ta}錄新歌。Jay 哥坐在你旁邊，小聲說：\n\n「她以前錄音，從來不讓人進來。她說，被人聽著，會唱不出來。」\n\n「那現在呢？」\n\n「現在，」Jay 哥看著錄音間裡的{ta}，「她說，你不在的話，她唱不出來。」"}},{"id":"l4","t":"包場的天文臺","d":9,"tm":"晚上 21:00","p":"交往一百天。\n\n{name}說要帶你去一個地方，要你閉上眼睛。\n\n車開了很久，開上了山。你睜開眼睛的時候，眼前是一座小小的天文臺，整座都被包下來了。圓頂緩緩打開，滿天星星。\n\n「我不能帶你去遊樂園，不能帶你去海邊，不能在大街上牽你的手。」{ta}說，「所以，我想給你一片只有我們兩個人的天空。」","c":{"yunhee":"{ta}拿出底片相機：「我要把今天的你拍下來！每一年都來拍一次！」","dohyun":"{ta}彆扭地遞給你一個盒子：「……一百天禮物。別笑。」裡面是一條項鍊，墜子是一顆小星星。","harin":"{ta}按下播放鍵，天文臺裡響起一首歌，是你沒聽過的：「這首歌，叫做你的名字。」","yul":"{ta}拿出一份文件：「這顆星，我買下來了。用你的名字命名。」停了停，「很俗，我知道。」"},"o":[{"t":"感動地抱住{ta}，說這是最好的禮物","a":5,"h":3,"r":{"yunhee":"「嗯……」{ta}笑了，可是{ta}一直在等你的禮物。你沒有準備。","dohyun":"「就這樣？」{ta}說，「我準備了一個月。」{ta}的眼神有點失望。","harin":"{ta}在你耳邊輕輕唱著那首歌，一句一句，都是你。","yul":"「我知道。」{ta}說，「我以為你會說點別的。」"},"m":{"harin":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[-4,-1,"bad"],"harin":[6,3,"best"]}},{"t":"拿出你準備的禮物","a":6,"h":2,"r":{"yunhee":"「哇啊啊啊！」{ta}尖叫著抱住你，「你怎麼知道我想要這個！」","dohyun":"「你……」{ta}說不出話，最後只是用力抱住你。","harin":"{ta}捧著你的禮物，好像捧著什麼易碎的東西：「我會一直珍惜。」","yul":"「我以為你會忘記。」{ta}說，聲音有點啞，「謝謝你。」"},"m":{"yul":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[6,2,"best"],"yunhee":[6,2,"best"],"harin":[2,1,"good"]}},{"t":"在星空下，跟{ta}聊你們的未來","a":-3,"h":-1,"r":{"yunhee":"「結婚？」你笑出聲，「想太多了吧。」{ta}的笑容一下子僵住了。","dohyun":"「未來？」{ta}說，「你現在一定要談這個？」氣氛一下子冷掉了。","harin":"「我不知道未來會怎樣。」{ta}說，「你這樣問，我好害怕。」","yul":"你說的未來裡，有工作、有城市、有夢想，就是沒有{ta}。{ta}聽完，沉默了很久。"},"m":{"yul":[1,0],"dohyun":[-1,0]},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}},{"t":"在圓頂下，主動吻{ta}","a":5,"h":6,"r":{"yunhee":"{ta}的吻甜得像草莓，帶著止不住的笑意，笑得你們的牙齒都撞在一起。\n\n「對不起！」{ta}笑著說，然後又吻你，「再一次！」\n\n滿天的星星在你們頭頂旋轉。{ta}拉著你倒在觀測臺的地毯上，仰面看著星空，又轉過頭看你。\n\n「我以前都不敢想，」{ta}說，「可以跟你一起看星星，然後不用回家。」\n\n{ta}翻身，撐在你上方，長髮垂下來，像一道簾子，把你們和整個世界隔開。\n\n「今天不準害羞喔。」{ta}說，臉卻先紅了。\n\n你笑，{ta}就捂住你的嘴，然後在自己的手背上吻了一下，又拿開手，真正地吻你。\n\n星光下，{ta}的皮膚像在發光。{ta}一邊吻你，一邊小聲地說著話，說{ta}有多喜歡你，說{ta}第一次見你就覺得你很好看，說{ta}偷偷存了多少張你的照片。說著說著，聲音就亂了，只剩下呼吸。\n\n{ta}一直牽著你的手，十指相扣，一刻也不肯放開。\n\n在最後，{ta}把臉埋在你的頸窩，笑著，又好像在哭。\n\n「사랑해!」{ta}大聲說，聲音在圓頂裡迴盪，「사랑해 사랑해 사랑해!」\n\n（我愛你！我愛你我愛你我愛你！）\n\n你們笑成一團。\n\n天快亮了，{ta}還不肯放開你，賴在你懷裡，用底片相機拍下天窗外漸漸變亮的天空。\n\n「這張，」{ta}說，「要放在我們以後的家裡。」","dohyun":"{ta}低笑著加深了這個吻。\n\n「你越來越會了。」{ta}在你唇邊說，「誰教的？」\n\n「你。」\n\n{ta}愣了一下，然後笑得更壞了。\n\n{ta}一把把你抱起來，你嚇了一跳，抓住{ta}的肩膀。{ta}就這樣抱著你走進觀測臺旁邊的休息室，用腳踢上門。\n\n「今晚，」{ta}把你放在床上，撐在你上方，「沒有規則，沒有天亮前要走，沒有任何東西。」\n\n{ta}的眼睛在暗處亮亮的。\n\n「只有我。」\n\n{ta}吻你，吻得又兇又溫柔，這兩種矛盾的東西在{ta}身上一點都不奇怪。{ta}一邊吻你，一邊扯開自己的衛衣，{ta}的銀鏈和你頸間那顆星星墜子撞在一起，叮的一聲。\n\n{ta}的手掌貼著你的腰，熱得發燙。{ta}在你耳邊說話，還是那樣壞，說你的臉好紅、說你在發抖。可是今晚的壞話裡，多了一些以前沒有的東西。\n\n「你是我的。」{ta}說，「說一次。」\n\n你說了。\n\n{ta}突然安靜下來，看著你，看了很久。\n\n「……再說一次。」\n\n那一夜很長。{ta}一次又一次地確認你在，一次又一次地叫你的名字，從囂張到溫柔，從溫柔到幾乎是在求你。\n\n天亮的時候，你醒來，{ta}還抱著你，睡得很沉，像一隻終於找到窩的大狗。\n\n你動了一下，{ta}就收緊手臂，閉著眼睛說：「別走。」\n\n「我沒有要走。」\n\n「嗯。」{ta}說，把臉埋進你的頭髮裡，「……以後也別走。」","harin":"{ta}僵了一下，輕輕推開你：「……我們說好今天只看星星的。」","yul":"{ta}的手扶住你的後頸，吻得又深又慢。\n\n「今晚，」{ta}在你耳邊說，「我們不回去了。」\n\n不是問句。\n\n{ta}早就準備好了。觀測臺後面的休息室，被佈置成了一個小小的房間。床單是新的，桌上有一瓶紅酒和兩個杯子，還有一臺老舊的黑膠唱機。\n\n{ta}放上一張唱片，是一首很老的情歌。然後{ta}轉過身，看著你，慢慢地鬆開領帶。\n\n「過來。」{ta}說。\n\n你走過去。{ta}沒有馬上吻你，只是牽起你的手，放在{ta}的心口。\n\n「感覺到了嗎？」{ta}問，「跳得很快。」\n\n你感覺到了。很快，很重，一點都不像那個永遠冷靜的{ta}。\n\n「只有你，」{ta}說，「能讓它這樣。」\n\n然後{ta}吻你。\n\n那一夜，{ta}依然掌握著節奏，依然在你耳邊低聲說話，依然讓你一次又一次喘不過氣。可是有些東西不一樣了。{ta}的每一個動作都帶著一種你從來沒感受過的東西，像是終於不必再防備，終於可以把一切都交出來。\n\n「{me}。」{ta}叫你的名字，叫了一次又一次，「{me}。」\n\n在最後，{ta}緊緊抱著你，把臉埋在你的頸窩，很久很久都沒有說話。\n\n然後你感覺到，{ta}在發抖。\n\n「我從來沒想過，」{ta}說，聲音啞得厲害，「我可以擁有這個。」\n\n唱片轉完了，房間裡只剩下沙沙的雜音。\n\n天亮的時候，{ta}還在。{ta}靠在床頭，看著你醒來，手裡拿著一杯咖啡，是你喜歡的口味。\n\n「早。」{ta}說，「我改了計劃。」\n\n「什麼計劃？」\n\n「五年計劃。」{ta}說，「改成一輩子。」"},"m":{"dohyun":[1,1]},"sc":{"dohyun":[2,4,"good"],"yul":[2,3,"good"],"yunhee":[2,3,"good"],"harin":[-4,-1,"bad"]}}],"x":"那天{ta}一大早就傳訊息給你：「今天晚上空出來。不准問為什麼。」\n\n你問了。{ta}沒有回。\n\n晚上七點，一輛黑色的車停在你家樓下。{ta}坐在駕駛座上，戴著帽子，朝你招手。\n\n「上車。」{ta}說，「閉上眼睛。」\n\n車開了很久。你閉著眼睛，感覺到車在爬坡，轉了很多個彎。{ta}一路上都在哼歌，心情好像很好。\n\n終於，車停了下來。{ta}幫你打開車門，牽著你的手，帶你走了一段路。\n\n「可以睜開了。」","after":{"dohyun":"那一百天，就這樣過去了。\n\n後來你們又在一起度過了很多個紀念日：兩百天、一年、兩年。每一次，{ta}都會準備驚喜，每一次都很幼稚，每一次你都很感動。\n\n可是你最記得的，還是那個天文臺。\n\n有一天，你問{ta}：「為什麼是天文臺？」\n\n{ta}想了想：「因為我想讓你知道，就算我們不能在白天出去，也還有星星。」\n\n「什麼意思？」\n\n「意思是，」{ta}說，「就算全世界都不知道我們的事，星星也知道。」\n\n你看著{ta}，突然覺得，這是你聽過最浪漫的一句話。","yul":"那天之後，那顆星星的證書一直掛在你家的牆上。\n\n{ta}說很俗，每次看到都會皺眉。可是你發現，{ta}每次來你家，都會在那張證書前面站一下。\n\n有一天，你問{ta}：「你為什麼要買那顆星星？」\n\n{ta}沉默了很久：「因為我想給你一個，永遠不會被拿走的東西。」\n\n「什麼意思？」\n\n「我的名聲、我的工作、我的一切，」{ta}說，「隨時都可能被拿走。前團解散的時候，我就學會了。」\n\n{ta}看著那張證書：「可是那顆星星，會一直在那裡。就算我不在了，它也會一直在。」","yunhee":"那天拍的照片，{ta}後來洗出來了。\n\n滿滿一本相簿，全是你。你在看星星、你在笑、你在哭、你睡著的樣子。\n\n最後一頁，是你們兩個人的合照。{ta}在旁邊寫了一行字：\n\n「第一百天。還有好多好多個一百天。」\n\n你看著那行字，看了很久。\n\n{ta}從背後抱住你：「你喜歡嗎？」\n\n「喜歡。」\n\n「那，」{ta}說，「我們每一百天，都來拍一次好不好？拍到我們都變成老爺爺老奶奶。」","harin":"那首歌后來被收錄在{ta}的新專輯裡，是最後一首。\n\n歌名叫做你的名字，可是專輯上寫的是另一個名字：〈一百天〉。\n\n那張專輯拿了很多獎。{ta}在每一次的得獎感言裡，都會說同一句話：\n\n「謝謝那個讓我寫出這些歌的人。」\n\n所有人都在猜那個人是誰。\n\n只有你知道。\n\n有一天晚上，{ta}在你耳邊，輕輕唱著那首歌。唱到最後一句時，{ta}停下來，看著你：\n\n「這一句，」{ta}說，「我只唱給你聽。」"}},{"id":"l5","t":"關於未來的對話","d":10,"tm":"深夜 23:00","p":"{name}的合約快到期了。\n\n公司給了一份續約方案，條件很好，但附帶一條：私生活必須「保持低調」。\n\n那天深夜，{ta}坐在你家的沙發上，看著那份合約，看了很久。\n\n「我想問你。」{ta}說，「如果我續約，我們就要一直藏下去。如果我不續……我可能會失去很多。」\n\n{ta}抬頭看你：「你希望我怎麼選？」","c":{"yunhee":"{ta}的眼眶紅了：「我好愛我的工作……可是我也好愛你。我好貪心對不對？」","dohyun":"{ta}把合約扔在桌上：「我其實已經決定了。但我想聽你說。」","harin":"{ta}抱著膝蓋：「音樂是我的命。可是你……你也是。」","yul":"{ta}把合約推到你面前：「這是我們兩個人的事。我不想一個人決定。」"},"o":[{"t":"說你希望{ta}選擇自己的夢想，你會等","a":-3,"h":-1,"f":"secret","r":{"yunhee":"{ta}哭著抱住你：「你怎麼可以這麼好……」","dohyun":"「你這個笨蛋。」{ta}說，「你就這樣把我推開？」","harin":"{ta}在你懷裡哭了很久：「我會寫一首最好的歌給你。」","yul":"「好。」{ta}說，「但你確定，你不是在等我離開？」"},"m":{"harin":[2,0]},"sc":{"dohyun":[-4,-1,"bad"],"yul":[-4,-1,"bad"],"yunhee":[2,0,"good"],"harin":[2,0,"good"]}},{"t":"說你想跟{ta}光明正大地在一起","a":5,"h":2,"f":"public","r":{"yunhee":"「我也想！」{ta}說，可是馬上又哭了，「可是我好怕……你為什麼要逼我選？」","dohyun":"「我就在等你這句話。」{ta}笑了，把合約撕成兩半。","harin":"{ta}眼眶溼了：「你要我放棄音樂嗎？」","yul":"「好。」{ta}說，「我會成立自己的工作室。我們的事，我們自己決定。」"},"m":{"dohyun":[2,0],"yul":[2,0]},"sc":{"dohyun":[6,2,"best"],"yul":[6,2,"best"],"yunhee":[-4,-1,"bad"],"harin":[-4,-1,"bad"]}},{"t":"說不管{ta}選什麼，你都在","a":6,"h":3,"r":{"yunhee":"{ta}哭著笑了：「那我就放心了！」","dohyun":"「這個答案不算。」{ta}說，卻把你抱得更緊了。","harin":"「謝謝你。」{ta}說，「你讓我覺得，不管怎麼選，都不會錯。」","yul":"「這是最好的答案。」{ta}說，「也是最難的答案。」"},"m":{"harin":[1,0]},"sc":{"dohyun":[2,2,"good"],"yul":[2,2,"good"],"yunhee":[6,3,"best"],"harin":[6,3,"best"]}},{"t":"說你累了，也許你們該分開","a":-10,"h":-5,"e":"fail","r":{"yunhee":"{ta}的眼淚一下子掉下來：「不要……拜託……」","dohyun":"{ta}沒有說話，只是看著你，眼神一點一點暗下去。","harin":"{ta}點點頭，好像早就預料到：「我明白。謝謝你，陪我走了這麼遠。」","yul":"「我尊重你。」{ta}說，聲音卻在抖，「……但我不會忘記你。」"},"sc":{"dohyun":[-10,-3,"worst"],"yul":[-10,-3,"worst"],"yunhee":[-10,-3,"worst"],"harin":[-10,-3,"worst"]}}],"x":"那份合約，{ta}已經看了一個星期了。\n\n你知道{ta}很掙扎。{ta}的夢想、{ta}的事業、{ta}的粉絲，都在那份合約的另一端。而你，在這一端。\n\n那天晚上，{ta}來你家，把合約放在茶几上，坐在沙發上，盯著它看了很久。\n\n你泡了兩杯茶，坐在{ta}旁邊。\n\n窗外很安靜，只有遠處偶爾傳來的車聲。\n\n{ta}終於開口了。","after":{"dohyun":"那天晚上，{ta}做了決定。\n\n不管是什麼決定，{ta}說，都是你們一起做的。\n\n{ta}把合約收起來，看著你：「不管以後怎麼樣，我都不會後悔。」\n\n「為什麼？」\n\n「因為，」{ta}說，「我這輩子做過最對的事，就是遇見你。」\n\n{ta}笑了，笑得像個孩子。\n\n那天之後，又過了很久很久。\n\n有一天，你問{ta}：「如果重來一次，你還會選我嗎？」\n\n「廢話。」{ta}說，「重來一百次，都是你。」","yul":"那天晚上，{ta}把合約收進抽屜裡。\n\n「我需要時間想。」{ta}說，「但有一件事，我已經想好了。」\n\n「什麼事？」\n\n{ta}從口袋裡拿出一個小盒子，打開，是一枚很簡單的戒指。\n\n「不是求婚。」{ta}說，「現在還不是。但我想讓你知道，不管我選哪一條路，那條路上都有你。」\n\n你看著那枚戒指，很久都說不出話。\n\n「這不在計劃裡。」{ta}說，「我第一次，做了一件不在計劃裡的事。」","yunhee":"那天晚上，你們聊到很晚。聊夢想，聊未來，聊你們想要的生活。\n\n{ta}說{ta}想要一間有大窗戶的房子，養一隻狗，每天早上一起吃早餐。\n\n「你呢？」{ta}問。\n\n「我想要的，」你說，「只要有你就好。」\n\n{ta}看著你，眼眶紅了：「你好狡猾。這樣我怎麼選？」\n\n「不用選。」你說，「不管你選什麼，我都在。」\n\n{ta}撲進你懷裡，哭得像個孩子。\n\n「我愛你。」{ta}說，「好愛好愛。」","harin":"那天晚上，{ta}彈了一首歌給你聽。\n\n是一首你沒聽過的歌，很短，只有一段。歌詞說的是一個人站在十字路口，左邊是光，右邊是你。\n\n「我一直以為，」{ta}說，「我只能選一邊。」\n\n「現在呢？」\n\n{ta}看著你：「現在我發現，你一直站在光裡。」\n\n{ta}把合約放在鋼琴上，蓋上琴蓋。\n\n「不管我選什麼，」{ta}說，「我都會寫歌。而我的每一首歌，都會有你。」"}}],"endings":{"pub":{"t":"戀愛 HE・公開","tag":"戀愛關係","p":"那天早上九點，{name}的官方帳號發了一則公告。\n\n不是公司寫的那種冷冰冰的聲明。是{ta}自己寫的，很長，一個字一個字敲出來的。\n\n{ta}說，有一個人，在{ta}最累的時候陪著{ta}，在{ta}不敢當自己的時候，讓{ta}記得自己是誰。{ta}說，{ta}不想再讓那個人站在陰影裡。\n\n評論區炸了。有人哭，有人罵，有人說祝福。\n\n你坐在{ta}身邊，看著{ta}按下發送鍵。{ta}的手在抖，你握住了。\n\n那天晚上，你們第一次一起走在大街上。沒有口罩，沒有帽子。路邊有人認出來，舉起手機。{name}沒有躲，只是把你的手握得更緊。","c":{"yunhee":"「대박!」{ta}在路燈下轉了一個圈，拉著你的手大笑，「我們好像在拍電影喔！」\n（太棒了！）","dohyun":"「뭐 어때.」{ta}說，對著鏡頭比了一箇中指，又被你拉下來，笑得肩膀都在抖。\n（有什麼關係。）","harin":"「음… 그렇구나.」{ta}看著滿街的燈，輕聲說，「原來光明正大地愛一個人，是這種感覺。」\n（嗯……原來如此。）","yul":"「그래서?」{ta}對著那些鏡頭挑了挑眉，然後低頭吻了你，「這就是我的答案。」\n（所以呢？）"}},"secret":{"t":"戀愛 HE・秘密交往","tag":"戀愛關係","p":"你們沒有公開。\n\n{name}續約了。舞臺上的{ta}依然耀眼，依然屬於幾萬個人。\n\n可是每一場演唱會的最後一首歌，{ta}都會看向關係者席的同一個位置。每一次頒獎典禮，{ta}的得獎感言裡，都會有一句只有你聽得懂的話。\n\n你們的約會都在深夜，在包場的電影院，在山上的天文臺，在你那間小小的公寓。{ta}會在凌晨兩點出現在你家門口，帶著你愛吃的宵夜，然後留下來，一起迎接早晨。\n\n這一次，沒有人需要先走。\n\n有一天，你問{ta}，這樣委屈嗎？\n\n{ta}想了很久。","c":{"yunhee":"「委屈啊！超委屈！」{ta}撲進你懷裡，「可是隻要你在，我就可以忍耐一百年！」","dohyun":"「委屈什麼。」{ta}說，「全世界最好的東西，當然要藏起來。」說完，耳朵紅了。","harin":"「不會。」{ta}輕聲說，「我的每一首歌，都已經告訴全世界了。只是他們聽不懂而已。」","yul":"「委屈的是你。」{ta}說，「所以我在計劃。給我三年。三年後，我會親自告訴所有人。」"}},"fwb":{"t":"停在炮友","tag":"炮友期","p":"後來，你們還是那樣。\n\n{name}會在深夜傳來一個房號，或一句「在家嗎」。你們會在只有彼此的房間裡，交換體溫，交換呼吸，交換那些白天說不出口的東西。\n\n然後天亮前，{ta}會離開。\n\n你們都沒有再提「規則」這兩個字。好像只要不提，就不會有人越界。\n\n有時候你會想，如果那天早上，你說了另一句話，會不會不一樣。\n\n有時候，你在{ta}離開後，會在枕頭上聞到{ta}留下的味道，然後很久都睡不著。\n\n你知道{ta}也是。\n\n因為某天凌晨，{ta}已經穿好鞋，手放在門把上，卻停了很久很久。","c":{"yunhee":"「我……」{ta}開口，又閉上，最後只是笑了笑，「晚安！」可是你聽見門外，{ta}哭了。","dohyun":"「喂。」{ta}說，「如果我說，我不想走了呢？」然後{ta}自己笑了，「開玩笑的。」門關上了。","harin":"{ta}回過頭，看著你，眼睛裡有千言萬語。最後，{ta}只說：「下次見。」","yul":"「我在想，」{ta}說，「規則是不是我們定錯了。」說完，{ta}沒有等你回答，就離開了。"}},"friend_relief":{"t":"純友誼・釋然","tag":"純友誼","p":"你們沒有變成別的什麼。\n\n你們還是朋友。會在深夜一起吃辣炒年糕，會在{name}的新歌發表時，第一個傳訊息給你：「說實話。」\n\n有一次，{mate}問{ta}：「你們真的只是朋友？」\n\n{ta}想了想，笑了。\n\n後來{ta}在一次訪談裡說，{ta}有一個很重要的朋友，在{ta}最忙最亂的那幾年，一直都在。不需要{ta}是誰，只需要{ta}是{ta}自己。\n\n你看著那段訪談，笑著傳了一則訊息給{ta}。\n\n{ta}很快就回了。","c":{"yunhee":"@msg 우리 평생 친구야!! 알지?? || 我們是一輩子的朋友！！知道吧？？","dohyun":"@msg 오글거려 ㅋㅋㅋ || 好肉麻ㅋㅋㅋ\n@msg 근데 맞는 말임 || 不過是真的。","harin":"@msg 당신 같은 친구가 있어서 다행이에요 || 有你這樣的朋友，真好。","yul":"@msg 그래서? 이번 주 밥 || 所以呢？這周吃飯。\n@msg 내가 살게요 || 我請。"}},"friend_regret":{"t":"純友誼・遺憾","tag":"純友誼","p":"你們最後，還是隻是朋友。\n\n不是因為不喜歡。只是時機不對，身分不對，勇氣也不夠。\n\n{name}的演唱會，你還是會去。坐在關係者席，看著{ta}在臺上發光。最後一首歌的時候，{ta}還是會看向你的方向。\n\n只是你們都沒有再往前一步。\n\n有一年冬天，你們在路邊攤喝了一點酒。{ta}突然說：「如果那時候……」\n\n然後{ta}停住了，沒有說完。\n\n你也沒有問。\n\n你們都知道那句話的後面是什麼。只是有些話，說出來，就回不去了。不說出來，至少還能這樣坐在一起。","c":{"yunhee":"{ta}笑著，眼淚卻掉下來：「沒事！是酒太辣了！」","dohyun":"「算了。」{ta}說，仰頭喝完那杯酒，「當我沒說。」","harin":"{ta}後來寫了一首歌，叫做〈來不及〉。你聽了一遍，就再也不敢聽第二遍。","yul":"「我很少後悔。」{ta}說，「這是其中一次。」"}},"fail":{"t":"失敗","tag":"失敗","p":"後來，你們就沒有再聯絡了。\n\n不是吵架，也不是誰對不起誰。只是有一天，你發現你們的對話框，停在了很久以前的那一則訊息。\n\n{name}還是很紅。你在地鐵的廣告牌上看見{ta}，在便利商店的音樂裡聽見{ta}，在朋友的手機裡看見{ta}的新舞臺。\n\n{ta}看起來很好。\n\n有時候你會想起那些夜晚，那些訊息，那些差一點就說出口的話。然後你會關掉手機，繼續過你的生活。\n\n你是{job}。你有你的工作，你的朋友，你的日子。\n\n只是偶爾，在某個下雨的傍晚，你會想起一個人。","c":{"yunhee":"你不知道的是，{ta}的底片相機裡，還有一卷沒洗出來的底片。全部都是你。","dohyun":"你不知道的是，{ta}後來在一個綜藝裡被問到「最後悔的事」，沉默了很久，最後笑著說：「輸了一次。」","harin":"你不知道的是，{ta}的下一張專輯裡，有一首歌的歌詞，寫的是那家路邊攤。","yul":"你不知道的是，{ta}在某一年的年末頒獎典禮上，得獎感言的最後一句是：「謝謝那個教會我，有些事情不能計劃的人。」"}},"hate":{"t":"完全厭惡","tag":"失敗","p":"後來發生的事，你不太願意回想。\n\n那些被你敷衍過去的訊息、被你推開的好意、被你說出口又收不回來的話，一點一點堆積起來，終於在某一天，壓垮了什麼。\n\n{name}沒有吵，也沒有鬧。{ta}只是突然不再找你了。\n\n你傳過去的訊息，顯示已讀，沒有回覆。後來，連已讀都沒有了。\n\n有一次，你在一個活動現場遠遠看見{ta}。你們的視線對上了一秒。\n\n那一秒裡，你看見的不是生氣，不是難過，而是一種更冷的東西。\n\n{ta}移開視線，像看著一個從來不認識的人。","c":{"dohyun":"後來你聽說，{ta}在一次直播裡被問到「最討厭哪種人」。{ta}想都沒想就說：「把別人的認真當玩笑的人。」\n\n說完，{ta}笑了，笑得一點溫度都沒有。「這種人，我這輩子都不想再見到。」","yul":"後來你收到一封很短的訊息，是{ta}的助理傳來的：\n\n「律哥請你不要再聯絡他。他說，他已經把你從他的計劃裡刪掉了。」\n\n最後一行，是{ta}親手補上的：「所以呢？沒有所以了。」","yunhee":"後來你在{ta}的新歌裡，聽到一句歌詞：「我曾經把整顆心捧給你看，你卻連低頭都嫌麻煩。」\n\n那首歌的最後，{ta}笑著唱：「謝謝你，讓我學會不再對誰那麼好。」\n\n那是你第一次聽到，那個永遠在笑的人，用那麼冷的聲音唱歌。","harin":"後來{ta}換了號碼，刪掉了所有能聯絡到你的方式。\n\n你只在一篇訪談裡，看到{ta}說了一句話：\n\n「我曾經很怕被當成偶像，而不是一個人。後來我發現，更可怕的是，有人知道你是一個人，卻還是那樣對你。」\n\n{ta}沒有說那個人是誰。可是你知道。"}},"arrest":{"t":"被捕","tag":"遊戲結束","p":"你因違反接近禁止令、跟蹤騷擾等罪名被判刑。\n\n審判那天，{name}沒有出庭。律師代為宣讀了一份陳述書。上面寫著，這段時間{ta}如何不敢出門、如何在半夜驚醒、如何在每一個人群裡尋找你的臉。\n\n法官宣判時，你一直在想，事情是從哪裡開始變成這樣的。\n\n也許是從某一次，你選了那個最傷人的選項。也許是從你被拒絕之後，沒有選擇放手。\n\n喜歡一個人，從來不是可以不顧對方意願的理由。","c":{"dohyun":"後來你在新聞上看到，{ta}重新開始了籤售會。籤售臺前多了一道玻璃隔板，{ta}隔著玻璃，對每一個粉絲笑。","yul":"後來你聽說，{ta}的工作室把這個案子的判決書公開了，作為警告。附註只有一句：「界線，不容越過。」","yunhee":"後來你聽說，{ta}花了很長一段時間，才敢再一個人走在街上。{ta}的成員們，一直輪流陪著{ta}。","harin":"後來{ta}發表了一首新歌，歌名叫〈門鎖〉。那是{ta}休養一年後，第一次站上舞臺。"}}},"traits":[{"id":"sunny","name":"陽光","speech":"語氣明亮上揚， /* MBTI follows the chosen traits; ties keep the character's own letter. */
function mbtiOf(){
 const base=(roster(S.charId).mbti||"XXXX").split(""),w={};
 traitsOf().forEach(id=>{const tr=traitById(id);if(tr)for(const k in tr.mbti)w[k]=(w[k]||0)+tr.mbti[k];});
 return [["E","I"],["S","N"],["T","F"],["J","P"]].map(([a,b],n)=>(w[a]||0)>(w[b]||0)?a:(w[b]||0)>(w[a]||0)?b:base[n]).join("");
}

/* A stable pseudo-random pick, so re-rendering shows the same line. */
function hashOf(str){let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);}
function traitLine(key,kind){
 const ts=traitsOf();if(!ts.length||!kind)return "";
 const h=hashOf(key),tr=traitById(ts[h%ts.length]),pool=tr&&tr.f[kind];
 return pool?pool[(h>>3)%pool.length]:"";
}

function fill(s){
 const i=idol(),r=roster(S.charId),p=S.player;
 const male=(i.gender||r.gender)!=="女";
 return String(s).replace(/\{g:([^|}]*)\|([^}]*)\}/g,(m,a,b)=>male?a:b).replace(/\{(\w+)\}/g,(m,k)=>({name:i.name||r.name,ta:male?"他":"她",me:p.name||"你",job:p.job||t("defJob"),
  mate:r.mate,mgr:r.mgr,grp:i.group||r.group}[k]??m));
}
const HANGUL=/[ㄱ-ㆎ가-힣]/;
function prose(text){
 let h="",prevKo=false;
 for(const raw of fill(text).split(/\r?\n/)){
  const line=raw.trim();let m;
  if(!line){prevKo=false;continue;}
  if((m=line.match(/^@msg\s*(.+)$/))){const [k,tr]=m[1].split("||");
   h+=`<div class="msg"><span class="av">꒰ Ꙭ ꒱</span><div class="bub"><span class="k">${esc((k||"").trim())}</span>${tr?`<span class="t">${esc(tr.trim())}</span>`:""}</div></div>`;prevKo=false;continue;}
  const isKo=HANGUL.test(line)&&/^[“「"『]/.test(line);
  const isTr=prevKo&&/^[（(]/.test(line);
  h+=`<p class="${isKo?"ko":isTr?"tr":""}">${esc(line)}</p>`;prevKo=isKo;
 }
 return h;
}
function sceneById(id){
 const d=D();for(const k of REL_KEYS){const s=d.open[k].find(x=>x.id===id);if(s)return s;}
 for(const k of ["friend","amb","fwb","love"]){const s=d[k].find(x=>x.id===id);if(s)return s;}return null;
}

/* ---------- engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){
 const d=D(),pool=d.open[REL_KEYS[S.relIdx]];
 const q=[{k:"scene",id:pool[Math.floor(Math.random()*pool.length)].id,st:0}];
 [["friend",1],["amb",2],["fwb",3],["love",4]].forEach(([k,st])=>{
  if(st>1)q.push({k:"gate",to:st});else q.push({k:"enter",to:1});
  shuffle(d[k]).forEach(s=>q.push({k:"scene",id:s.id,st}));
 });
 q.push({k:"final"});return q;
}
function sceneCount(){return S.queue.filter(x=>x.k==="scene").length;}
function sceneIndex(){return S.queue.slice(0,S.pos+1).filter(x=>x.k==="scene").length;}
function enterStage(n){S.stageIdx=n;if(!S.reached.includes(n))S.reached.push(n);S.log.push({k:"gate",to:n});}
function endWith(id){S.ending=id;S.log.push({k:"end",id});S.awaiting=false;}
function advance(){
 while(S.pos<S.queue.length){
  const q=S.queue[S.pos];
  if(q.k==="enter"){enterStage(q.to);S.pos++;continue;}
  if(q.k==="gate"){
   if(q.to===2&&S.aff<GATE.toAmb.aff){endWith(S.heat>=8?"friend_regret":"friend_relief");return;}
   if(q.to===3){
    if(S.aff<GATE.toFwb.failBelow){endWith("fail");return;}
    if(S.aff<GATE.toFwb.aff||S.heat<GATE.toFwb.heat){endWith(S.heat>=10?"friend_regret":"friend_relief");return;}
   }
   if(q.to===4&&S.aff<GATE.toLove.aff){endWith("fwb");return;}
   enterStage(q.to);S.pos++;continue;
  }
  if(q.k==="final"){endWith(S.flag==="public"||(!S.flag&&S.aff>=95)?"pub":"secret");return;}
  if(q.k==="scene"){
   const s=sceneById(q.id);
   if(S.pos>0)S.day+=s.d||1;
   S.order=shuffle([0,1,2,3]);S.log.push({k:"scene",id:q.id,day:S.day});S.awaiting=true;return;
  }
 }
}
function choose(oi,auto){
 const q=S.queue[S.pos],s=sceneById(q.id);
 const o=s.o[oi],sc=(o.sc&&o.sc[S.charId])||[o.a,o.h,""];
 const da=sc[0],dh=sc[1];
 if(sc[2]==="worst")S.worst=(S.worst||0)+1;
 S.aff=clamp(S.aff+da);S.heat=clamp(S.heat+dh);
 if(o.f)S.flag=o.f;
 S.log.push({k:"choice",id:q.id,oi,auto:!!auto,da,dh,kind:sc[2]});
 S.awaiting=false;S.pos++;optsOpen=false;
 // Affection at zero, or three of the cruelest choices, and they come to despise you.
 if(o.e==="fail"){endWith("fail");}
 else if(S.aff<=0||S.worst>=3){endWith("hate");}
 else advance();
 save();render();
 const last=document.querySelectorAll(".choice");if(last.length)last[last.length-1].scrollIntoView({behavior:"smooth",block:"start"});
}

const STALK_LIMIT=85;
function startStalk(){S.stalk={i:0,v:0,order:shuffle([0,1,2,3])};S.ending="";S.log.push({k:"stalkgate"});stalkScene();save();render();

 const sn=D().stalker.scenes[S.stalk.i],o=sn.o[oi];
 S.stalk.v=Math.min(100,S.stalk.v+o.v);S.log.push({k:"stalkchoice",i:S.stalk.i,oi,v:o.v});optsOpen=false;
 if(S.stalk.v>=STALK_LIMIT||S.stalk.i>=D().stalker.scenes.length-1){S.day+=1;S.log.push({k:"arrest",day:S.day});endWith("arrest");}
 else{S.stalk.i++;stalkScene();}

}

 const gi=s.o.findIndex(o=>o.sc&&o.sc[S.charId]&&o.sc[S.charId][2]==="good");
 choose(gi<0?0:gi,true);
}

  <div class="meters">
   <div class="meter"><span>${t("aff")}</span><span class="bar"><i style="width:${S.aff}%"></i></span><span>${S.aff}</span></div>
   ${S.stalk?`<div class="meter"><span>${t("alert")}</span><span class="bar heat"><i style="width:${S.stalk.v}%"></i></span><span>${S.stalk.v}</span></div>`
     :`<div class="meter"><span>${t("heat")}</span><span class="bar heat"><i style="width:${S.heat}%"></i></span><span>${S.heat}</span></div>`}
  </div>
  </div>`;
}
function logHtml(){
 let n=0;
 return S.log.map(e=>{
  if(e.k==="gate")return `<p class="gate">${esc(t("gate")(t("stages")[e.to]))}</p>`;
  if(e.k==="scene"){const s=sceneById(e.id);n++;
   return `<article class="scene"><p class="stamp">DAY ${e.day} ・ ${esc(s.tm)}</p>${prose(s.p)}${prose(s.x||"")}${prose(s.c[S.charId]||"")}</article>`;}
  if(e.k==="choice"){const o=sceneById(e.id).o[e.oi];
   const sign=x=>(x>0?"+":"")+x;
   return `<div class="choice">${e.auto?esc(t("readPick"))+" ":""}${esc(fill(o.t))}</div>
    <div class="scene react">${prose(o.r[S.charId]||"")}${(()=>{const l=traitLine(e.id+":"+e.oi,e.kind);return l?`<p class="trait">${esc(fill(l))}</p>`:"";})()}<p class="delta">${t("aff")} ${sign(e.da)} ・ ${t("heat")} ${sign(e.dh)}</p></div>${!o.e&&(e.kind==="best"||e.kind==="good")&&sceneById(e.id).after?`<article class="scene">${prose(sceneById(e.id).after[S.charId]||"")}</article>`:""}`;}
  if(e.k==="stalkgate")return `<p class="gate">${esc(t("stalkGate"))}</p>`;
  if(e.k==="stalk"){const sn=D().stalker.scenes[e.i];
   return `<article class="scene"><p class="stamp">DAY ${e.day} ・ ${esc(sn.tm)}</p>${prose(sn.p)}${prose(sn.c[S.charId]||"")}</article>`;}
  if(e.k==="stalkchoice"){const o=D().stalker.scenes[e.i].o[e.oi];
   return `<div class="choice">${esc(fill(o.t))}</div><div class="scene react">${prose(o.r)}<p class="delta">${t("alert")} +${e.v}</p></div>`;}
  if(e.k==="arrest"){const a=D().stalker.arrest;
   return `<article class="scene"><p class="stamp">DAY ${e.day} ・ ${esc(a.tm)}</p>${prose(a.p)}${prose(a.c[S.charId]||"")}</article>`;}
  if(e.k==="end"){const en=D().endings[e.id];
   return `<article class="scene ending"><p class="stamp">${t("endTitle")} ・ DAY ${S.day}</p><h3>${esc(en.t)}</h3>${prose(en.p)}${prose(en.c[S.charId]||"")}</article>`;}
  return "";
 }).join("");
}
function viewGame(){
 const s=S.awaiting?sceneById(S.queue[S.pos].id):null;
 app.innerHTML=`${hud()}<div class="feed" id="feed">${logHtml()}</div>
  <div class="bar-actions">
   ${s?`<button class="toggle" id="toggle" type="button" aria-expanded="${optsOpen}" aria-controls="opts">${optsOpen?t("hideOpts"):t("showOpts")}</button>
     <div class="opts" id="opts" ${optsOpen?"":"hidden"}>${(S.order||[0,1,2,3]).map((oi,n)=>`<button class="opt" type="button" data-o="${oi}"><span class="n">${n+1}</span><span>${esc(fill(s.o[oi].t))}</span></button>`).join("")}
     <button class="opt" type="button" id="auto"><span class="n">5</span><span>${t("read")}</span></button></div>`
    :(S.stalk&&!S.ending)?(()=>{const sn=D().stalker.scenes[S.stalk.i];return `<button class="toggle" id="toggle" type="button" aria-expanded="${optsOpen}" aria-controls="opts">${optsOpen?t("hideOpts"):t("showOpts")}</button>
     <div class="opts" id="opts" ${optsOpen?"":"hidden"}>${S.stalk.order.map((oi,n)=>`<button class="opt" type="button" data-s="${oi}"><span class="n">${n+1}</span><span>${esc(fill(sn.o[oi].t))}</span></button>`).join("")}</div>`;})()
    :S.ending==="hate"&&!S.stalk?`<p class="hint">${t("hateAsk")}</p><div class="row"><button class="btn" id="again" type="button">${t("endGame")}</button><button class="btn ghost" id="stalk" type="button">${t("stalkGo")}</button></div>`
    :S.ending?`<div class="row"><button class="btn" id="again" type="button">${t("again")}</button></div>`
    :""}
   <div class="foot"><span>🔒 ${t("locked")}</span><button id="restart" type="button">${t("restart")}</button></div>
   <div id="confirm-slot"></div>
  </div>`;
 const tg=$("#toggle");if(tg)tg.onclick=()=>{optsOpen=!optsOpen;tg.setAttribute("aria-expanded",optsOpen);tg.textContent=optsOpen?t("hideOpts"):t("showOpts");$("#opts").hidden=!optsOpen;};
 app.querySelectorAll(".opt[data-o]").forEach(b=>b.onclick=()=>choose(+b.dataset.o,false));
 const au=$("#auto");if(au)au.onclick=autoPick;
 app.querySelectorAll(".opt[data-s]").forEach(b=>b.onclick=()=>stalkChoose(+b.dataset.s));
 const sk=$("#stalk");if(sk)sk.onclick=startStalk;
 const go=$("#go");if(go)go.onclick=next;
 const restartAll=()=>{const keep={lang:S.lang,player:S.player,charId:S.charId,idol:S.idol};S=Object.assign(fresh(),keep,{step:"setup"});try{localStorage.removeItem(SAVE_KEY);}catch(e){}save();render();window.scrollTo({top:0});};
 const ag=$("#again");if(ag)ag.onclick=restartAll;
 $("#restart").onclick=()=>{
  $("#confirm-slot").innerHTML=`<div class="confirm"><span>${t("restartConfirm")}</span><button class="btn" id="cy" type="button">${t("confirmYes")}</button><button class="btn ghost" id="cn" type="button">${t("confirmNo")}</button></div>`;
  $("#cy").onclick=restartAll;$("#cn").onclick=()=>{$("#confirm-slot").innerHTML="";};
 };
}
function render(){
 if(S.locked&&S.step!=="game")S.step="game";
 if(S.step!=="lang"&&!S.lang)S.step="lang";
 ({lang:viewLang,setup:viewSetup,relation:viewRelation,game:viewGame}[S.step]||viewLang)();
}
render();
})();
</script>
</body></html>
